jobs:
  unit:
    name: durable-runs — graph resume + contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read lets GITHUB_TOKEN pull the private GHCR postgres copy.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/junebug-junie/postgres:16  # private GHCR copy of postgres:16; Docker Hub and ECR Public both rate-limit shared runner IPs
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: admission-test
          POSTGRES_DB: admission_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (services/orion-durable-runs/requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-durable-runs/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/orion-durable-runs/tests/requirements-acceptance.txt
      - name: Pytest services/orion-durable-runs/tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_POSTGRES_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: |
          cd services/orion-durable-runs && python -m pytest tests -q -p no:cacheprovider
      - name: Curiosity compaction — sleep scheduling, real Postgres recovery, chronology replay
        env:
          PYTHONPATH: ${{ github.workspace }}
          CURIOSITY_COMPACTION_TEST_POSTGRES_URI: postgresql+psycopg://postgres:admission-test@127.0.0.1:5432/admission_test
        run: |
          python -m pytest -q -p no:cacheprovider --strict-markers \
            services/orion-dream/tests/test_curiosity_compaction.py \
            services/orion-dream/tests/test_curiosity_compaction_postgres.py \
            services/orion-dream/tests/test_dream_cycle_v2.py \
            services/orion-dream/evals/test_curiosity_compaction_eval.py
          python -m pytest -q -p no:cacheprovider services/orion-cortex-exec/tests/test_dream_cycle_prompt_render.py
      - name: Pytest orion/physiology/tests (body economy Organ 1 Body reducer)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest orion/physiology/tests -q -p no:cacheprovider
      - name: Pytest orion/orion_day/tests (Orion's Day gather, budget, contracts)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest orion/orion_day/tests -q -p no:cacheprovider
      - name: Orion's Day eval (fixture day -- prompt separation, grounding, budget)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python orion/orion_day/evals/run_orion_day_eval.py
      - name: Durable-run GPU pool hold fairness eval (home card + gpu2) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/hold_fairness.py
      - name: Curiosity binding-bid eval (body economy Patch D -- capacity queues at the pool, holds bounded)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python services/orion-durable-runs/evals/curiosity_binding_replay.py
          python -m pytest -q -p no:cacheprovider scripts/analysis/tests/test_body_economy_binding_replay.py
      - name: Reading binding-bid eval (attention patch 3 replay C, fixture -- reading's lanes and measured cost)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python services/orion-durable-runs/evals/reading_binding_replay.py
      - name: Outreach binding-bid eval (body economy Patch D for hub.outreach -- holds bounded, no answer never holds)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python services/orion-hub/evals/run_outreach_binding_replay.py
          python -m pytest -q -p no:cacheprovider scripts/analysis/tests/test_outreach_binding_replay.py
      - name: Cooling world act eval (ladder retirement PR 5 -- the market decides, only funded sheds, the scorer scores every episode)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python services/orion-durable-runs/evals/cooling_act_replay.py
      - name: Daily reminiscence tick replay (21 days across DST -- window, one run at a time, oldest week first, unfinished week returns, mutations must fail)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -P services/orion-durable-runs/evals/reminiscence_daily_replay.py
      - name: Felt-state binding arcs eval (onset/release anti-flap, no_reading never releases, one arc per constraint)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python services/orion-durable-runs/evals/body_binding_replay.py
      - name: Prime slow-charge eval (Orion Prime step 3 -- held by the charge, released by its own hunger)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python services/orion-durable-runs/evals/prime_charge_replay.py
      - name: Dream binding bid + Prime slow receptor (Orion Prime step 4 -- the sleep obeys its bid, never past its window or the overdue line)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q -p no:cacheprovider services/orion-dream/tests/test_physiology_bind.py \
            services/orion-dream/tests/test_physiology_shadow_bid.py services/orion-dream/evals/test_dream_binding_replay_eval.py
      - name: Dream arc replay (a third of the replay at most, one Temporal Self arc per kind per sleep, control pool matches)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q -p no:cacheprovider services/orion-dream/tests/test_replay_arc_candidates.py \
            services/orion-dream/evals/test_dream_arc_kind_mix_replay_eval.py
      - name: Consent gate (attention patch 3d -- the market refuses what it must, dream compaction asks it, nothing else changes)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python services/orion-durable-runs/evals/consent_gate_fixture.py
          python -m pytest -q -p no:cacheprovider services/orion-dream/tests/test_compaction_applier.py \
            services/orion-dream/tests/test_compaction_consent.py services/orion-dream/tests/test_rem_compaction.py
      - name: Deploy-order skew eval (old pool refuses holds, then upgrades) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/deploy_order_skew.py
      - name: Deploy-window listener wait eval (2026-10-31 readings unheard during a Hub redeploy) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/deploy_window_listener_wait.py
      - name: Listener wait mutation eval (every mutant must be killed) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/listener_wait_mutations.py
      - name: Temporal Self live replay (the live chronicle over the 10-09 fixture reproduces patch 2) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/temporal_self_live_replay.py --step-sec 600

  gateway:
    # Renamed in GPU pool stage 6.6: the gateway's /capacity broker and shared-capacity
    # lifecycle were deleted in stages 4.6/5.6; this job now runs the gateway suite (pool
    # dispatch, passthrough, transport).
    name: Gateway — GPU pool dispatch and transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway and test dependencies
        run: |
          python -m pip install -r services/orion-llm-gateway/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Gateway transport regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest services/orion-llm-gateway/tests -q -p no:cacheprovider
