services:
  llm-gateway:
    build:
      context: ../..
      dockerfile: services/orion-llm-gateway/Dockerfile
    container_name: ${PROJECT}-llm-gateway
    restart: unless-stopped
    networks:
      - app-net

    # Pull in the base .env (bus, model defaults, etc.)
    env_file:
      - .env

    environment:
      # Project-wide basics
      - PROJECT=${PROJECT}

      # Bus wiring (usually from root .env)
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}

      # Identity
      - SERVICE_NAME=${SERVICE_NAME_LLM_GATEWAY:-llm-gateway}
      - SERVICE_VERSION=${SERVICE_VERSION_LLM_GATEWAY:-0.1.0}

      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC}

      # LLM gateway channels
      - CHANNEL_LLM_INTAKE=${CHANNEL_LLM_INTAKE}
      - CHANNEL_LLM_REPLY_PREFIX=${CHANNEL_LLM_REPLY_PREFIX}
      - CHANNEL_EMBEDDING_GENERATE=${CHANNEL_EMBEDDING_GENERATE:-orion:embedding:generate}
      - CHANNEL_SPARK_INTROSPECT_CANDIDATE=${CHANNEL_SPARK_INTROSPECT_CANDIDATE:-orion:spark:introspect:candidate}
      - CHANNEL_VECTOR_LATENT_UPSERT=${CHANNEL_VECTOR_LATENT_UPSERT:-orion:vector:latent:upsert}
      - ORION_VECTOR_LATENT_COLLECTION=${ORION_VECTOR_LATENT_COLLECTION:-orion_latent_store}

      # No LLM backend URLs: every call is placed by orion-gpu-pool (config/gpu_pool.yaml).
      - ORION_LLM_OLLAMA_USE_OPENAI=${ORION_LLM_OLLAMA_USE_OPENAI:-false}
      - ORION_VECTOR_HOST_URL=${ORION_VECTOR_HOST_URL:-http://orion-athena-vector-host:8320}
      - LLM_GATEWAY_OPENAI_PASSTHROUGH_ENABLED=${LLM_GATEWAY_OPENAI_PASSTHROUGH_ENABLED:-true}
      - ORION_LLM_INCLUDE_EMBEDDINGS=${ORION_LLM_INCLUDE_EMBEDDINGS:-false}
      # GPU pool placement: routes -> class in config/gpu_pool.yaml (copied into the image).
      - LLM_ROUTE_DEFAULT=${LLM_ROUTE_DEFAULT:-quick}
      - GPU_POOL_CONFIG_PATH=${GPU_POOL_CONFIG_PATH:-/app/config/gpu_pool.yaml}
      - LLM_GATEWAY_POOL_WAIT_SEC=${LLM_GATEWAY_POOL_WAIT_SEC:-300}
      - LLM_GATEWAY_POOL_BACKGROUND_WAIT_SEC=${LLM_GATEWAY_POOL_BACKGROUND_WAIT_SEC:-900}
      - LLM_GATEWAY_EXECUTOR_WORKERS_PER_ROLE=${LLM_GATEWAY_EXECUTOR_WORKERS_PER_ROLE:-8}
      - LLM_GATEWAY_LEASE_VALIDATION_ENABLED=${LLM_GATEWAY_LEASE_VALIDATION_ENABLED:-false}
      - LLM_GATEWAY_LEASE_VALIDATION_URL=${LLM_GATEWAY_LEASE_VALIDATION_URL:-http://durable-runs:8121/leases/validate}
      - LLM_GATEWAY_LEASE_VALIDATION_TIMEOUT_SEC=${LLM_GATEWAY_LEASE_VALIDATION_TIMEOUT_SEC:-2}
      - LLM_GATEWAY_LEASE_CHECK_INTERVAL_SEC=${LLM_GATEWAY_LEASE_CHECK_INTERVAL_SEC:-5}
      - LLM_GATEWAY_HEALTH_PORT=${LLM_GATEWAY_HEALTH_PORT:-8210}
      - LLM_GATEWAY_ANTHROPIC_PASSTHROUGH_ENABLED=${LLM_GATEWAY_ANTHROPIC_PASSTHROUGH_ENABLED:-true}
      - LLM_GATEWAY_ANTHROPIC_PASSTHROUGH_TIMEOUT_SEC=${LLM_GATEWAY_ANTHROPIC_PASSTHROUGH_TIMEOUT_SEC:-900}
      - ATLAS_METACOG_PROFILE_NAME=${ATLAS_METACOG_PROFILE_NAME:-}
      - ATLAS_METACOG_CUDA_VISIBLE_DEVICES=${ATLAS_METACOG_CUDA_VISIBLE_DEVICES:-}
      - ATLAS_METACOG_HOST_PORT=${ATLAS_METACOG_HOST_PORT:-8012}

      # Timeouts
      - CONNECT_TIMEOUT_SEC=${CONNECT_TIMEOUT_SEC}
      - READ_TIMEOUT_SEC=${READ_TIMEOUT_SEC}
      - LLM_LOGPROB_SUMMARY_ENABLED=${LLM_LOGPROB_SUMMARY_ENABLED:-false}
      - LLM_LOGPROB_TOP_K_DEFAULT=${LLM_LOGPROB_TOP_K_DEFAULT:-5}
      - LLM_LOGPROB_LOW_MARGIN_THRESHOLD=${LLM_LOGPROB_LOW_MARGIN_THRESHOLD:-0.5}
      - LLM_LOGPROB_LOW_LOGPROB_THRESHOLD=${LLM_LOGPROB_LOW_LOGPROB_THRESHOLD:--2.0}
      - LLM_LOGPROB_UNSTABLE_SPAN_MIN_LEN=${LLM_LOGPROB_UNSTABLE_SPAN_MIN_LEN:-3}
      - LLM_LOGPROB_NATIVE_COMPLETION_ENABLED=${LLM_LOGPROB_NATIVE_COMPLETION_ENABLED:-false}
      - LLM_LOGPROB_NATIVE_COMPLETION_MAX_TOKENS=${LLM_LOGPROB_NATIVE_COMPLETION_MAX_TOKENS:-256}

      # ─────────────────────────────────────
      # Profiles config (new)
      # ─────────────────────────────────────
      # Path inside the container
      - LLM_DEFAULT_PROFILE_NAME=${LLM_DEFAULT_PROFILE_NAME:-llama3-7b-v100-1gpu}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH}
      - ORION_DEFAULT_LLM_MODEL=${ORION_DEFAULT_LLM_MODEL}
      - ORION_LLM_DEFAULT_BACKEND=${ORION_LLM_DEFAULT_BACKEND}
      - LLM_STRUCTURED_OUTPUT_METHOD=${LLM_STRUCTURED_OUTPUT_METHOD:-none}

    ports:
      - "${LLM_GATEWAY_HEALTH_PORT:-8210}:${LLM_GATEWAY_HEALTH_PORT:-8210}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-net:
    external: true
