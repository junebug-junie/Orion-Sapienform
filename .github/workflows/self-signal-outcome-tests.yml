name: self-signal-outcome-tests

# Deterministic gate for "what a body signal tends to lead to" (spec 2026-10-07 section E):
# the pure reducer (orion/attention/self_signal_outcomes.py), the equilibrium hourly rollup and
# its episode open-row evidence, the self-reading clause in orion-thought, the sql-writer write
# path, and the replay eval over stored history with an independent truth-to-rows recount.
# No DB, bus or LLM.

on:
  pull_request:
    paths:
      - "orion/attention/**"
      - "orion/schemas/self_signal_outcome.py"
      - "orion/schemas/self_reading.py"
      - "orion/metacog/self_signal_episode.py"
      - "orion/metacog/evidence_map.py"
      - "config/field/field_channel_glossary.v1.yaml"
      - "services/orion-equilibrium-service/app/**"
      - "services/orion-equilibrium-service/tests/test_self_signal_*"
      - "services/orion-equilibrium-service/evals/test_self_signal_outcome_*"
      - "services/orion-equilibrium-service/evals/fixtures/self_signal_*"
      - "services/orion-thought/app/self_readings_cue.py"
      - "services/orion-thought/tests/test_stance_self_readings.py"
      - "services/orion-thought/evals/*self_readings*"
      - "services/orion-sql-writer/app/**"
      - "services/orion-sql-writer/tests/test_self_signal_outcome_sql_shape.py"
      - "scripts/analysis/self_signal_outcome_truth.py"
      - "tests/test_self_signal_outcomes.py"
      - ".github/workflows/self-signal-outcome-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/attention/self_signal_outcomes.py"
      - "services/orion-equilibrium-service/app/self_signal_outcome_rollup.py"
      - ".github/workflows/self-signal-outcome-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Self-signal outcome association — reducer, rollup, clause, write path, replay eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-equilibrium-service/requirements.txt
          python -m pip install -r services/orion-thought/requirements.txt
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Pure reducer + self-reading clause
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            tests/test_self_signal_outcomes.py tests/test_attention_self_readings.py \
            orion/metacog/tests/test_evidence_map.py orion/metacog/tests/test_evidence_map_producer_contract.py
      - name: Equilibrium rollup + episode open row + replay eval
        working-directory: services/orion-equilibrium-service
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_self_signal_outcome_rollup.py tests/test_self_signal_episode_gate.py \
            evals/test_self_signal_outcome_replay_eval.py
      - name: orion-thought clause wiring + truth-to-rows
        working-directory: services/orion-thought
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_stance_self_readings.py evals/test_self_readings_truth_eval.py
      - name: sql-writer write path
        working-directory: services/orion-sql-writer
        run: PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_self_signal_outcome_sql_shape.py
