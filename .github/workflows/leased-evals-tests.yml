name: leased evals tests

# Leased evals (docs/superpowers/specs/2026-11-12-leased-evals-and-server-refusal-design.md): evals and
# operator probes call a model only under a GPU pool operator hold, through orion-llm-gateway. Gate
# tests only: nothing here talks to the pool, a model or the network.

on:
  pull_request:
    paths:
      - "orion/evals/leased_llm.py"
      - "orion/evals/tests/**"
      - "orion/harness/evals/**"
      - "orion/gpu_pool/client.py"
      - "orion/llm/resource_lease.py"
      - "orion/schemas/gpu_pool.py"
      - "config/gpu_pool.yaml"
      - "services/orion-llm-gateway/app/passthrough_proxy.py"
      - "services/orion-llamacpp-host/scripts/**"
      - "services/orion-llamacpp-host/evals/**"
      - "services/orion-llamacpp-host/tests/test_probe_*.py"
      - "services/orion-llamacpp-host/tests/test_*_leased.py"
      - "services/orion-cortex-exec/evals/eval_json_task_turn_end_after_brace.py"
      - "scripts/analysis/eval_curiosity_register_judge.py"
      - "scripts/analysis/reflection_register_sources.py"
      - "scripts/analysis/eval_reflection_register_share.py"
      - "scripts/analysis/judge_anchor_set.py"
      - "services/orion-hub/evals/run_self_question_door_replay.py"
      - ".github/workflows/leased-evals-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/evals/leased_llm.py"
      - "orion/evals/tests/**"
      - "orion/harness/evals/**"
      - "orion/gpu_pool/client.py"
      - "orion/llm/resource_lease.py"
      - "orion/schemas/gpu_pool.py"
      - "config/gpu_pool.yaml"
      - "services/orion-llm-gateway/app/passthrough_proxy.py"
      - "services/orion-llamacpp-host/scripts/**"
      - "services/orion-llamacpp-host/evals/**"
      - "services/orion-llamacpp-host/tests/test_probe_*.py"
      - "services/orion-llamacpp-host/tests/test_*_leased.py"
      - "services/orion-cortex-exec/evals/eval_json_task_turn_end_after_brace.py"
      - "scripts/analysis/eval_curiosity_register_judge.py"
      - "scripts/analysis/reflection_register_sources.py"
      - "scripts/analysis/eval_reflection_register_share.py"
      - "scripts/analysis/judge_anchor_set.py"
      - "services/orion-hub/evals/run_self_question_door_replay.py"
      - ".github/workflows/leased-evals-tests.yml"

jobs:
  leased-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r services/orion-hub/tests/requirements-reading.txt   # jq ships on the runner
      - name: Helper (operator hold, gateway-only model calls, worker reads, CLI)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider orion/evals/tests/test_leased_llm.py orion/evals/tests/test_lane_callers_3921_leased.py orion/evals/tests/test_reflection_register_judge_leased.py orion/harness/evals
      - name: Gateway names an operator call's holder
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install -r services/orion-llm-gateway/requirements.txt -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider services/orion-llm-gateway/tests/test_operator_holder_header.py
      - name: llama.cpp operator probes and evals are leased
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd services/orion-llamacpp-host && python -m pytest -q -p no:cacheprovider \
            tests/test_probe_slot_bleed.py tests/test_probe_structured_output.py \
            tests/test_qwen35_fast_eval_leased.py tests/test_operator_scripts_leased.py
