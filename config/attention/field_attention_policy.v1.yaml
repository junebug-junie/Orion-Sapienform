schema_version: attention_policy.v1
policy_id: field_attention_policy.v1

limits:
  max_targets_total: 12
  max_node_targets: 5
  max_capability_targets: 5
  max_system_targets: 3

thresholds:
  min_salience: 0.10
  high_salience: 0.70
  suppress_below: 0.03

# weights / node_channel_weights / capability_channel_weights removed
# 2026-07-30: these were the hand-picked linear-blend coefficients for the
# retired compute_salience() formula (orion/attention/field_attention/
# scoring.py). Killed, not left as dead config, per CLAUDE.md §0A's "kill
# means kill, no fallback to the thing being killed." Node attention is now
# Candidate A (precision-weighted prediction-error salience,
# orion/attention/field_attention/candidate_precision_weighted.py) for the
# six real prediction-error-native targets; capability attention has no
# real grounded theory yet and is retired pending one (select_capability_
# targets always returns []). See docs/superpowers/pr-reports/ for the
# full patch.

observation_modes:
  inspect_threshold: 0.75
  summarize_threshold: 0.45
  watch_threshold: 0.10
