name: body-atlas-tests

on:
  pull_request:
    paths:
      - "orion/body_atlas/**"
      - "config/body_atlas/**"
      - "config/physiology/families.yaml"
      - "config/physiology/contract.yaml"
      - "config/biometrics/node_catalog.yaml"
      - "config/vision_frame_router.yaml"
      - "orion/evals/model_replay/sandbox.py"
      - "services/orion-substrate-runtime/app/worker.py"
      - "orion/substrate/*_loop/constants.py"
      - "orion/schemas/*_projection.py"
      - ".github/workflows/body-atlas-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/body_atlas/**"
      - "config/body_atlas/**"
      - "config/physiology/families.yaml"
      - "config/physiology/contract.yaml"
      - "config/biometrics/node_catalog.yaml"
      - "config/vision_frame_router.yaml"
      - "orion/evals/model_replay/sandbox.py"
      - "services/orion-substrate-runtime/app/worker.py"
      - "orion/substrate/*_loop/constants.py"
      - "orion/schemas/*_projection.py"
      - ".github/workflows/body-atlas-tests.yml"

jobs:
  body-atlas:
    name: Body atlas — tests + organ structure + capacity roles + wire evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install "pydantic>=2,<3" pyyaml pytest
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q orion/body_atlas/tests
      - name: Organ structure eval (frozen bus graph + frozen whole bodies)
        run: python orion/body_atlas/evals/run_organ_structure_eval.py
      - name: Capacity roles eval (rules vs reviewed sets, held-out 10-29, mutation must fail)
        run: python orion/body_atlas/evals/run_capacity_roles_eval.py
      - name: Wire eval (HTTP calls + Redis keys vs hand-checked facts, v2 gap rules, mutations must fail)
        run: python orion/body_atlas/evals/run_wire_eval.py
