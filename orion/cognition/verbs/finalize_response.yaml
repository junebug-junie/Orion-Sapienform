name: finalize_response
label: Finalize Response
description: >
  Transform internal reasoning trace into the final user-facing artifact.
  Synthesize prior tool results and observations into a complete, concrete answer.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 90000

services:
  - LLMGatewayService

prompt_template: finalize_response_prompt.j2

steps:
  - name: finalize
    order: 0
    services: [LLMGatewayService]
    prompt_template: finalize_response_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
