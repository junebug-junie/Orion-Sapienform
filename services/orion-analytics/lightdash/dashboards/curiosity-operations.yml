tiles:
  - x: 0
    "y": 0
    h: 5
    w: 36
    tabUuid: null
    type: markdown
    properties:
      title: What this dashboard can prove
      content: |-
        Runs are observed from durable lifecycle events or persisted Curiosity
        journals. The ledger shows the newest persisted state, not a live
        process claim. Failed and resumed values are event counts; one run can
        contribute many before completing. Lifecycle rows are retained for 90
        days by default, so lifecycle measures are retained-window evidence,
        not all-time history; journal-only does not mean pre-durable.

        Time, steps, offered material, and graph counts are actual recorded
        usage/output. They are not quality scores. Configured daily caps and
        timeout ceilings are not yet persisted per run, so this dashboard does
        not invent historical budget-remaining numbers. Prompts, journals,
        findings, claims, hop notes, errors, correlation IDs, and raw graph or
        checkpoint payloads are deliberately excluded.
    tileSlug: curiosity-operations-scope
