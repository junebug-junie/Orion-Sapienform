schema_version: consolidation_policy.v1
policy_id: consolidation_policy.v1

window:
  lookback_minutes: 60
  min_support_count: 3
  max_frames_per_source: 500

motif_thresholds:
  min_support_score: 0.20
  min_confidence_score: 0.30
  dominant_motif_min_support: 0.50

# tracked_self_dimensions removed 2026-07-22, SelfStateV1 burn
# (docs/superpowers/specs/2026-07-22-self-state-phi-endo-origination-burn-
# spec.md): its only consumer (_build_field_attention_self_slice) is gone.

tracked_attention_targets:
  - node:athena
  - capability:orchestration
  - capability:graph
  - field:recent_perturbations

tracked_feedback_outcomes:
  - dry_run_only
  - prepared_only
  - completed
  - failed
  - blocked
  - absent
  - deferred
  - mixed

motif_rules:
  # loaded_but_reliable removed 2026-07-22, SelfStateV1 burn: its only input
  # (window.self_states) no longer exists.

  attention_saturated_execution:
    kind: attention_pattern
    label: attention_saturated_execution
    conditions:
      attention_target_any:
        - node:athena
        - capability:orchestration
      min_overall_salience: 0.70

  read_only_policy_loop:
    kind: proposal_policy_pattern
    label: read_only_policy_loop
    conditions:
      approved_read_only_min: 1

  dry_run_feedback_loop:
    kind: dispatch_feedback_pattern
    label: dry_run_feedback_loop
    conditions:
      outcome_status: dry_run_only

  blocked_review_loop:
    kind: dispatch_feedback_pattern
    label: blocked_review_loop
    conditions:
      blocked_or_review_min: 1

  stable_after_dry_run:
    kind: stability_pattern
    label: stable_after_dry_run
    conditions:
      outcome_status: dry_run_only
      # self_state_delta -> field_delta 2026-07-22, SelfStateV1 burn --
      # feedback observations are field-native now.
      field_delta:
        allowed:
          - unchanged

  # transport_contract_drift_loop and transport_healthy_idle DELETED
  # 2026-09-25 (chore/transport-lattice-semantics; audit:
  # docs/superpowers/specs/2026-09-22-substrate-lattice-audit.md, L11).
  #
  # Both read `dominant_channels` off the capability:transport attention
  # target. Capability targets are novelty-scored (orion/attention/
  # field_attention/selectors.py) and ALWAYS carry dominant_channels={}:
  # capability:transport was a dominant target in 2,883 of 54,401 attention
  # frames over 48h, every one with an empty dict. So:
  #   - transport_contract_drift_loop could never fire at any threshold (its
  #     prefilter needs contract_pressure >= 0.05 in that dict). Its real
  #     input, capability:transport contract_pressure (catalog drift), read
  #     max 0.0216 over 72h against the 0.70 bar, and its producer is being
  #     redefined upstream (fix/bus-observer-scope). Never fired in 30 days.
  #   - transport_healthy_idle read the missing keys as 0.0 and so called
  #     transport "healthy idle" every time it was attended at all -- absence
  #     reported as calm. It fired once (2026-09-25 04:00 window) and wrote a
  #     `transport_stable` expectation backed by nothing.
  # Not recalibrated: a threshold on a key that is never present is not a
  # threshold, and neither motif's expectation has a behavioral consumer
  # (substrate_expectations is write-and-display only). Not re-keyed onto
  # pressure_score: "calm" there has no anchor better than a percentile, and
  # a motif nothing reads is not worth a new constant.

tensor:
  enabled: true
  max_coordinates: 200

tensor_axes:
  # field_attention_self removed 2026-07-22, SelfStateV1 burn: its only input
  # (window.self_states) no longer exists.
  policy_dispatch_feedback:
    - proposal_kind
    - policy_decision
    - dispatch_status
    - feedback_outcome
  motif_condition_outcome:
    - motif
    - self_condition
    - outcome_status
