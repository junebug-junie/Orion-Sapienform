services:
  diffusion-host:
    build:
      context: ../..
      dockerfile: services/orion-diffusion-host/Dockerfile
    container_name: ${PROJECT}-diffusion-host
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_NAME=${NODE_NAME:-circe}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}

      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR}
      - HF_HOME=${HF_HOME}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE}

      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}

      # `:-default` fallbacks matching settings.py's Python defaults --
      # review finding: pydantic-settings raises ValidationError (not a
      # silent fallback) on an int/float field fed a present-but-empty
      # string, which is what compose writes if a required key is ever
      # missing from `.env` (e.g. sync_local_env_from_example.py skipped on
      # a fresh worktree/host -- a documented recurring failure mode in
      # this repo). Same pattern NODE_NAME/HEARTBEAT_INTERVAL_SEC already
      # use above.
      - DIFFUSION_MODEL_ID=${DIFFUSION_MODEL_ID:-YuCollection/FLUX.1-schnell-Diffusers}
      - DIFFUSION_DEVICE=${DIFFUSION_DEVICE:-cuda:0}
      - DIFFUSION_DTYPE=${DIFFUSION_DTYPE:-fp16}
      - DIFFUSION_ENABLE_MODEL_CPU_OFFLOAD=${DIFFUSION_ENABLE_MODEL_CPU_OFFLOAD:-true}
      - DIFFUSION_NUM_INFERENCE_STEPS=${DIFFUSION_NUM_INFERENCE_STEPS:-4}
      - DIFFUSION_GUIDANCE_SCALE=${DIFFUSION_GUIDANCE_SCALE:-0.0}
      - DIFFUSION_MAX_SEQUENCE_LENGTH=${DIFFUSION_MAX_SEQUENCE_LENGTH:-256}
      - DIFFUSION_DEFAULT_WIDTH=${DIFFUSION_DEFAULT_WIDTH:-1024}
      - DIFFUSION_DEFAULT_HEIGHT=${DIFFUSION_DEFAULT_HEIGHT:-1024}
      - DIFFUSION_MAX_PROMPT_CHARS=${DIFFUSION_MAX_PROMPT_CHARS:-2000}

    volumes:
      # Real weight download lands here -- FLUX.1-schnell's full
      # diffusers-format weights (transformer + T5-XXL encoder + VAE +
      # CLIP) are tens of GB, not the "several GB" sdxl-turbo needed --
      # this mount stopped being a bare path convention once a real model
      # load was first wired in.
      - /mnt/storage-warm/models/diffusion:/mnt/storage-warm/models/diffusion

    # GPU reservation, Circe agent-lane assignment (2026-08-20).
    # CUDA_VISIBLE_DEVICES above scopes the container to one physical
    # device; this patch is the first one that actually loads a model onto
    # it. See README.md "Node/port/GPU assignment".
    gpus: all

    ports:
      - "${HOST_PORT}:6700"

    networks:
      - app-net

networks:
  app-net:
    external: true
