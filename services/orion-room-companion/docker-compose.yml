services:
  room-companion:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-room-companion/Dockerfile
    container_name: ${PROJECT}-room-companion
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NODE_NAME=${NODE_NAME}
      - INSTANCE_ID=${INSTANCE_ID}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC}

      - ROOM_COMPANION_NODE_NAME=${ROOM_COMPANION_NODE_NAME}
      - CHANNEL_ROOM_CLAUDE_REQUEST=${CHANNEL_ROOM_CLAUDE_REQUEST:-orion:room:claude:request}
      - CHANNEL_ROOM_CLAUDE_UTTERANCE=${CHANNEL_ROOM_CLAUDE_UTTERANCE:-orion:room:claude:utterance}

      # Authenticate `claude -p` as the operator's own Claude subscription --
      # never a separate ANTHROPIC_API_KEY billing path. Same pattern, for the
      # same reasons, as the self-study enrichment service (deleted 2026-10-30; its
      # README is in git history) "Credential isolation (safety requirement)" and this one's
      # README for why the credential lives here and NOT in orion-hub.
      #
      # These two lines and the volumes: entry below all interpolate the same
      # ROOM_COMPANION_CLAUDE_CONFIG_DIR var with the same /root/.claude
      # fallback -- normally identical by construction, but the fallback is a
      # literal in three places, not a shared reference. Edit only one and
      # they diverge whenever the env var itself is unset: the session store
      # (see volumes: below) lands somewhere `claude` isn't pointed at, and
      # nothing errors -- it just silently fails to persist across a rebuild.
      # test_compose_claude_config_dir_interpolations_match asserts they stay
      # identical.
      - CLAUDE_CONFIG_DIR=${ROOM_COMPANION_CLAUDE_CONFIG_DIR:-/root/.claude}
      - ROOM_COMPANION_CLAUDE_CONFIG_DIR=${ROOM_COMPANION_CLAUDE_CONFIG_DIR:-/root/.claude}
      # Long-lived OAuth token from `claude setup-token` (see .env_example).
      # Deliberately NOT named CLAUDE_CODE_OAUTH_TOKEN here -- app/main.py's
      # build_subprocess_env() reads this ROOM_COMPANION_-prefixed name from
      # Settings and injects it under its real name only into the `claude`
      # subprocess's own env, so the literal CLAUDE_CODE_OAUTH_TOKEN name
      # never sits in this container's own os.environ at all. `:?` makes a
      # missing token fail loudly instead of silently falling through to no
      # credential.
      - ROOM_COMPANION_CLAUDE_OAUTH_TOKEN=${ROOM_COMPANION_CLAUDE_OAUTH_TOKEN:?ROOM_COMPANION_CLAUDE_OAUTH_TOKEN must be set -- see .env_example}
      - ROOM_COMPANION_CLAUDE_BIN=${ROOM_COMPANION_CLAUDE_BIN:-claude}
      - ROOM_COMPANION_MODEL=${ROOM_COMPANION_MODEL:-claude-sonnet-5}
      - ROOM_COMPANION_EFFORT=${ROOM_COMPANION_EFFORT:-medium}
      - ROOM_COMPANION_TIMEOUT_SEC=${ROOM_COMPANION_TIMEOUT_SEC:-180}
      - ROOM_COMPANION_SETTING_SOURCES=${ROOM_COMPANION_SETTING_SOURCES:-user}
      - ROOM_COMPANION_WORKSPACE=${ROOM_COMPANION_WORKSPACE:-/data/workspace}

      # Orion's tools (Patch 1b): one MCP server per room turn; no new mount. See .env_example.
      - ROOM_COMPANION_TOOLS_ENABLED=${ROOM_COMPANION_TOOLS_ENABLED:-true}
      - ROOM_COMPANION_TOOLS_STATE_DIR=${ROOM_COMPANION_TOOLS_STATE_DIR:-/data/state/claude_tools}
      - ROOM_COMPANION_TOOLS_PYTHON=${ROOM_COMPANION_TOOLS_PYTHON:-/usr/local/bin/python}
      - ROOM_COMPANION_TOOLS_PYTHONPATH=${ROOM_COMPANION_TOOLS_PYTHONPATH:-/app}
      - ROOM_COMPANION_TOOLS_MCP_TIMEOUT_MS=${ROOM_COMPANION_TOOLS_MCP_TIMEOUT_MS:-70000}

      - ROOM_COMPANION_PARTICIPANT_ID=${ROOM_COMPANION_PARTICIPANT_ID:-claude}
      - ROOM_COMPANION_PARTICIPANT_NAME=${ROOM_COMPANION_PARTICIPANT_NAME:-Claude}
      - ROOM_COMPANION_SESSION_STATE_PATH=${ROOM_COMPANION_SESSION_STATE_PATH:-/data/state/room_companion_sessions.json}
      # Consult rooms (orion.consult.core): Claude reads the code before Juniper is asked.
      - ROOM_COMPANION_CONSULT_MODEL=${ROOM_COMPANION_CONSULT_MODEL:-claude-sonnet-5-5}
      - ROOM_COMPANION_CONSULT_EFFORT=${ROOM_COMPANION_CONSULT_EFFORT:-high}
      - ROOM_COMPANION_CONSULT_TIMEOUT_SEC=${ROOM_COMPANION_CONSULT_TIMEOUT_SEC:-900}
      - ROOM_COMPANION_CONSULT_TOOLS=${ROOM_COMPANION_CONSULT_TOOLS:-Read,Grep,Glob}
      - ROOM_COMPANION_CONSULT_REPO=${ROOM_COMPANION_CONSULT_REPO:-/consult-src/current}
    volumes:
      # Claude Code's own session store (CLAUDE_CONFIG_DIR) on a named volume.
      # No credential file lives here any more (see .env_example and
      # app/settings.py: ROOM_COMPANION_CLAUDE_OAUTH_TOKEN, 2026-08-18)  --
      # only session/project bookkeeping. Without this volume the room->uuid
      # map survived a rebuild on /data while every session it pointed at
      # died with the container layer, so the first turn in each room after
      # any `up -d --build` burned a doomed --resume.
      - room_companion_claude:${ROOM_COMPANION_CLAUDE_CONFIG_DIR:-/root/.claude}
      # Writable volume for the room->session map and the neutral workspace.
      - room_companion_data:/data
      # Consult rooms only (2026-11-11): a `git archive` export of the deployed
      # commit (scripts/export_consult_source.py, refreshed by the post-pull
      # rebuild), READ-ONLY. Tracked files only: no .git (whose remote URL can
      # carry a credential), no .env, nothing Orion wrote. The primary checkout
      # and Orion's FCC sandbox are never mounted here.
      - ${ORION_CONSULT_SOURCE_DIR:-/mnt/scripts/orion-consult-src}:/consult-src:ro
    # DELIBERATELY ABSENT, and a review should treat any of these appearing
    # here as a regression -- this container exists to be the one place the
    # Claude credential lives, so it must not also be a place worth breaking
    # into: no primary-checkout or FCC-sandbox mount (.env secrets, a credentialed .git remote), no
    # ${HOME}/.ssh, no ${HOME}/.config/gh, no /var/run/docker.sock, no
    # network_mode: host. orion-hub has all of those, which is exactly why
    # the credential is not there.

networks:
  app-net:
    name: ${NET}
    external: true

volumes:
  room_companion_data:
    name: ${PROJECT}-room-companion-data
  room_companion_claude:
    name: ${PROJECT}-room-companion-claude
