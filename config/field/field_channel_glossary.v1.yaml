        - "orion.attention.self_readings:render_self_readings"

  - channel: pressure
    level: [capability]
    category: synthesized_rollup
    meaning: "Overall load/pressure for a given capability (llm_inference, orchestration, storage, graph, memory, transport, vision). Absent (key and provenance dropped) on a tick when no edge source measured it, or when no edge feeds it at all (capability:transport since 2026-11), never written as a calm 0.0."
    self_state_dimension: resource_pressure

  - channel: confidence
    level: [capability]
    category: synthesized_rollup
    meaning: "How confident the system is that a given capability is currently reliable/available. Derived as 1 - 0.5 * pressure unless an edge writes it directly; absent when pressure is unmeasured (never a fabricated 1.0)."

  - channel: available_capacity
    level: [capability]
    category: synthesized_rollup
    meaning: "How much spare operating capacity a capability has right now. Derived as 1 - pressure unless an edge writes it directly; absent when pressure is unmeasured (never a fabricated 1.0)."

  - channel: execution_pressure
    level: [capability]
    category: task_execution
    meaning: "Capability-level execution-load pressure."
    self_state_dimension: execution_pressure

  - channel: reasoning_pressure
    level: [capability]
    category: task_execution
    meaning: "Capability-level reasoning-load pressure."
    self_state_dimension: reasoning_pressure

  - channel: reliability_pressure
    level: [capability]
    category: synthesized_rollup
    meaning: "Capability-level pressure representing risk to reliability (from execution friction, failures, RPC timeouts, storage write failures, inference failures, vision processing failures). Max over the sources that measured it this tick; where an edge feeds it, absent when none did (e.g. every input expired), never a calm 0.0. capability:transport has one source since 2026-10-07 (RPC timeouts; the bus observer's own failure channel was retired), so it is absent whenever the RPC delivery bridge stops reporting. Capabilities with no reliability edge (graph, memory) still carry reconcile's seeded 0.0, which is not a measurement."
    self_state_dimension: reliability_pressure

  # 2026-08-16 (docs/superpowers/specs/2026-08-16-tension-driven-mutating-
  # dispatch-design.md): NOT one of the 38 raw pre-merge channels above --
  # it is a derived, stateful scalar computed by orion.attention.tension's
  # DeviationGate/FieldTensionCompetition from admitted per-(node, channel)
  # deviations across ALL of them, written once per digestion tick by
  # services/orion-field-digester/app/digestion/tension.py onto
  # FieldStateV1.tension_deviation_pressure directly (not inside
  # node_vectors/capability_vectors). Included here anyway because Hub's
  # Field Channel Glossary panel is the only live-liveness observability
  # surface FieldStateV1 has, and this deserves the same "is it actually
  # producing real, varying signal" check the 38 raw channels get -- not a
  # claim that it IS one of them. `level: [field]` is a new value (the other
  # 38 entries are only ever `node`/`capability`/`node, capability`),
  # introduced here rather than reusing `capability` because this scalar is
  # not scoped to any single capability; it is one number for the whole tick.
  #
  # Deliberately NO self_state_dimension here, unlike execution_pressure/
  # resource_pressure/reliability_pressure above. That field means "this raw
  # channel routes through orion.field.pressure.CHANNEL_DIMENSION_MAP's
  # max()-merge into this dimension" -- tests/test_field_channel_glossary.py
  # ::test_self_state_dimension_matches_channel_dimension_map_exactly is a
  # fail-closed exact-equality gate on that claim. tension_deviation_pressure
  # does NOT go through that merge (it is written directly onto
  # `orion.field.pressure_dimensions`'s "deviation_pressure" PRESSURE_DIMENSIONS
  # entry by orion/field/pressure.py::field_pressures_with_provenance(), a
  # different code path -- see that function's own comment), so claiming a
  # CHANNEL_DIMENSION_MAP route here would be false and would break that
  # gate. It already IS the dimension value, not a channel feeding one --
  # the `meaning` text says so instead.
  #
  # Caveat added in review: "0.0 is a real reading, not an absence" is only
  # true for ticks the producer actually ran on. `tension_deviation_pressure`
  # is a plain `float = 0.0` schema default (orion/schemas/field_state.py),
  # so any substrate_field_state row persisted BEFORE
  # services/orion-field-digester/app/digestion/tension.py started running
  # also reads 0.0 -- indistinguishable in storage from a genuine "nothing
  # admitted" tick. A window straddling that deploy boundary will read
  # artificially flat/dead, exactly the decayed-to-zero-vs-genuinely-calm
  # ambiguity CLAUDE.md 0A's metric gate warns about, and this glossary's
  # live classify_channel_series() cannot tell the two apart from the stored
  # value alone. Not fixed here (would need a producer-added marker field);
  # disclosed so a reader checking this panel soon after deploy does not
  # over-read an early "dead"/"quiet" verdict.
  - channel: tension_deviation_pressure
    level: [field]
    category: synthesized_rollup
    meaning: "DERIVED (not a raw pre-merge channel): this IS the PRESSURE_DIMENSIONS 'deviation_pressure' value itself, not a channel that feeds it. This tick's admitted field-deviation tension, in [0, 1]. 0.0 is the expected reading once the producer has been running a while ('nothing admitted' is a real, common state) -- but a row from before the producer existed also reads 0.0 (schema default), indistinguishable in storage. Read verdicts from a window entirely after deploy."
