services:
  durable-runs:
    build:
      context: ../..
      dockerfile: services/orion-durable-runs/Dockerfile
    container_name: ${PROJECT}-durable-runs
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${DURABLE_RUNS_PORT:-8124}:8121"
    environment:
      - DURABLE_RUNS_ELASTIC_ENABLED=${DURABLE_RUNS_ELASTIC_ENABLED:-false}
      - DURABLE_RUNS_ELASTIC_SHADOW=${DURABLE_RUNS_ELASTIC_SHADOW:-true}
      - DURABLE_RUNS_ELASTIC_ASSIGNMENTS=${DURABLE_RUNS_ELASTIC_ASSIGNMENTS:-false}
      - DURABLE_RUNS_ELASTIC_RESTORATION=${DURABLE_RUNS_ELASTIC_RESTORATION:-false}
      - DURABLE_RUNS_ELASTIC_CONTROLLER_URL=${DURABLE_RUNS_ELASTIC_CONTROLLER_URL:-http://100.112.254.99:8090}
      - DURABLE_RUNS_ELASTIC_BACKEND=${DURABLE_RUNS_ELASTIC_BACKEND:-http://100.112.254.99:8016}
      - DURABLE_RUNS_ELASTIC_DRAIN_BUDGET_SEC=${DURABLE_RUNS_ELASTIC_DRAIN_BUDGET_SEC:-300}
      - DURABLE_RUNS_ELASTIC_TRANSITION_BUDGET_SEC=${DURABLE_RUNS_ELASTIC_TRANSITION_BUDGET_SEC:-60}
      - DURABLE_RUNS_ELASTIC_COLD_BUDGET_SEC=${DURABLE_RUNS_ELASTIC_COLD_BUDGET_SEC:-600}
      - DURABLE_RUNS_ELASTIC_IDLE_GRACE_SEC=${DURABLE_RUNS_ELASTIC_IDLE_GRACE_SEC:-300}
      - DURABLE_RUNS_ELASTIC_MIN_RESIDENCY_SEC=${DURABLE_RUNS_ELASTIC_MIN_RESIDENCY_SEC:-600}
      - DURABLE_RUNS_ELASTIC_MAX_BORROW_SEC=${DURABLE_RUNS_ELASTIC_MAX_BORROW_SEC:-3600}
      - DURABLE_RUNS_ELASTIC_CABINET_URL=${DURABLE_RUNS_ELASTIC_CABINET_URL:-http://100.92.216.81:8080/api/cabinet/sensors/latest}
      - DURABLE_RUNS_ELASTIC_THERMAL_ENABLED=${DURABLE_RUNS_ELASTIC_THERMAL_ENABLED:-false}
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-durable-runs}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - POSTGRES_URI=${POSTGRES_URI}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DURABLE_RUNS_ENABLED=${DURABLE_RUNS_ENABLED:-true}
      - DURABLE_RUNS_RESUME_ON_BOOT=${DURABLE_RUNS_RESUME_ON_BOOT:-true}
      - DURABLE_RUNS_RESUME_SWEEP_SEC=${DURABLE_RUNS_RESUME_SWEEP_SEC:-120.0}
      - DURABLE_RUNS_MAX_AGE_HOURS=${DURABLE_RUNS_MAX_AGE_HOURS:-24.0}
      - DURABLE_RUNS_TURN_RPC_TIMEOUT_SEC=${DURABLE_RUNS_TURN_RPC_TIMEOUT_SEC:-8940.0}
      - DURABLE_RUNS_GRAPH_HOST=${DURABLE_RUNS_GRAPH_HOST:-}
      - DURABLE_RUNS_GRAPH_PORT=${DURABLE_RUNS_GRAPH_PORT:-6379}
      - DURABLE_RUNS_GRAPH_OWN=${DURABLE_RUNS_GRAPH_OWN:-orion_worldview}

      - DURABLE_RUNS_ADMISSION_ENABLED=${DURABLE_RUNS_ADMISSION_ENABLED:-false}
      - DURABLE_RUNS_CAPACITY_ENABLED=${DURABLE_RUNS_CAPACITY_ENABLED:-false}
      - DURABLE_RUNS_ADMISSION_SHADOW=${DURABLE_RUNS_ADMISSION_SHADOW:-false}
      - DURABLE_RUNS_ADMISSION_TICK_SEC=${DURABLE_RUNS_ADMISSION_TICK_SEC:-5.0}
      - DURABLE_RUNS_LEASE_SECONDS=${DURABLE_RUNS_LEASE_SECONDS:-90.0}
      - DURABLE_RUNS_LEASE_HEARTBEAT_SEC=${DURABLE_RUNS_LEASE_HEARTBEAT_SEC:-15.0}
      - DURABLE_RUNS_WIDENING_ENABLED=${DURABLE_RUNS_WIDENING_ENABLED:-false}
      - DURABLE_RUNS_WIDENING_AFTER_SEC=${DURABLE_RUNS_WIDENING_AFTER_SEC:-1200.0}
      - DURABLE_RUNS_WIDENING_HYSTERESIS_SEC=${DURABLE_RUNS_WIDENING_HYSTERESIS_SEC:-120.0}
      - DURABLE_RUNS_LANE_POLICY_JSON=${DURABLE_RUNS_LANE_POLICY_JSON:-}
      - DURABLE_RUNS_GATEWAY_URL=${DURABLE_RUNS_GATEWAY_URL:-http://llm-gateway:8210}
      - DURABLE_RUNS_RETRY_MAX_ATTEMPTS=${DURABLE_RUNS_RETRY_MAX_ATTEMPTS:-3}
      - DURABLE_RUNS_RETRY_BASE_SEC=${DURABLE_RUNS_RETRY_BASE_SEC:-30.0}
      - DURABLE_RUNS_RETRY_MAX_SEC=${DURABLE_RUNS_RETRY_MAX_SEC:-300.0}

networks:
  app-net:
    external: true
