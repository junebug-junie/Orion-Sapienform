# Workflow: sql-writer grammar persistence + consumer resilience regression tests.
#
# Unit tests run on every PR/push touching grammar or sql-writer paths.
# Integration tests run against Postgres on GitHub Actions (same gate as main deploy).

name: orion-sql-writer-tests

on:
  pull_request:
    paths:
      - "orion/bus/channels.yaml"
      - "orion/core/bus/**"
      - "orion/grammar/**"
      - "orion/schemas/**"
      - "orion/substrate/**"
      - "orion/autonomy/prediction.py"
      - "tests/test_act_ledger_contract.py"
      - "orion/vision/**"
      - "config/vision_zones.yaml"
      - "config/vision_topology.yaml"
      - "services/orion-sql-db/**"
      - "services/orion-sql-writer/**"
      - "orion/situational/street_material.py"
      - "services/orion-substrate-runtime/**"
      - "tests/test_sql_writer_*.py"
      - "tests/test_transport_*.py"
      - "tests/test_storage_write_*.py"
      - "tests/fixtures/transport_*"
      - ".github/workflows/orion-sql-writer-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/bus/channels.yaml"
      - "orion/core/bus/**"
      - "orion/grammar/**"
      - "orion/schemas/**"
      - "orion/substrate/**"
      - "orion/autonomy/prediction.py"
      - "tests/test_act_ledger_contract.py"
      - "orion/vision/**"
      - "config/vision_zones.yaml"
      - "config/vision_topology.yaml"
      - "services/orion-sql-db/**"
      - "services/orion-sql-writer/**"
      - "orion/situational/street_material.py"
      - "services/orion-substrate-runtime/**"
      - "tests/test_sql_writer_*.py"
      - "tests/test_transport_*.py"
      - "tests/test_storage_write_*.py"
      - "tests/fixtures/transport_*"
      - ".github/workflows/orion-sql-writer-tests.yml"

jobs:
  sql-writer-unit:
    name: SQL writer — unit + SQL shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio
      - name: Run transport reducer unit tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_transport_split_window_no_fake_health.py \
            tests/test_transport_substrate_reducer.py \
            tests/test_transport_substrate_pipeline.py \
            tests/test_transport_rpc_timeout_not_a_bus.py \
            tests/test_energy_bus_catalog.py \
            tests/test_storage_write_substrate_reducer.py
      - name: Run sql-writer unit tests
        run: |
          PYTHONPATH=.:services/orion-sql-writer python -m pytest -q \
            orion/grammar/tests/test_ledger.py \
            orion/core/bus/tests/test_hunter_intake_log_quiet.py \
            services/orion-sql-writer/tests/test_consumer_resilience.py \
            services/orion-sql-writer/tests/test_route_map_completeness.py \
            services/orion-sql-writer/tests/test_world_pulse_routing.py \
            services/orion-sql-writer/tests/test_grammar_event_routing.py \
            services/orion-sql-writer/tests/test_grammar_ledger_sql_shape.py \
            services/orion-sql-writer/tests/test_juniper_multimodal_affect_sql_shape.py \
            services/orion-sql-writer/tests/test_vision_walkway_persist.py \
            services/orion-sql-writer/tests/test_vision_individuals.py \
            services/orion-sql-writer/tests/test_vision_split.py \
            services/orion-sql-writer/tests/test_vision_body_match.py \
            services/orion-sql-writer/tests/test_vision_reanchor.py \
            services/orion-sql-writer/tests/test_vision_osnet_shadow.py \
            services/orion-sql-writer/tests/test_vision_walkway_faces_stationary.py \
            services/orion-sql-writer/tests/test_vision_rollup.py \
            orion/vision/tests \
            services/orion-sql-writer/tests/test_vision_rhythm.py \
            services/orion-sql-writer/tests/test_vision_walkway_zones_thumbs_cursor.py \
            services/orion-sql-writer/tests/test_vision_expect_refresh.py \
            services/orion-sql-writer/tests/test_vision_handoff.py \
            services/orion-sql-writer/evals/test_vision_handoff_replay_eval.py \
            tests/test_street_event_bus_catalog.py \
            services/orion-sql-writer/tests/test_vision_event_sql_shape.py \
            services/orion-sql-writer/tests/test_energy_sql_shape.py \
            services/orion-sql-writer/tests/test_physiology_state_sql_shape.py \
            services/orion-sql-writer/evals/test_walkway_reducers_eval.py \
            services/orion-sql-writer/tests/test_write_health.py \
            services/orion-sql-writer/evals/test_storage_write_replay_eval.py \
            services/orion-sql-writer/tests/test_act_ledger_wiring.py \
            services/orion-sql-writer/evals/test_act_ledger_calibration_eval.py \
            tests/test_act_ledger_contract.py

  sql-writer-integration:
    name: SQL writer — Postgres grammar integration
    runs-on: ubuntu-latest
    # packages: read lets GITHUB_TOKEN pull the private GHCR postgres copy.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/junebug-junie/postgres:16  # private GHCR copy of postgres:16; Docker Hub and ECR Public both rate-limit shared runner IPs
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conjourney
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/conjourney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio
      - name: Run grammar Postgres integration tests
        run: |
          PYTHONPATH=.:services/orion-sql-writer:services/orion-sql-writer/tests python -m pytest -q -m integration \
            services/orion-sql-writer/tests/test_grammar_ledger_integration.py
          PYTHONPATH=.:services/orion-substrate-runtime:services/orion-sql-writer/tests python -m pytest -q -m integration \
            services/orion-substrate-runtime/tests/test_grammar_consumer_integration.py
      # Act ledger (rung 2): persist, close by act_id, grade into L10, horizon resolver.
      # Creates its own throwaway schema; must not skip.
      - name: Run act ledger Postgres integration tests (must not skip)
        env:
          ORION_SQL_WRITER_TEST_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/conjourney
        run: |
          set -o pipefail
          PYTHONPATH=.:services/orion-sql-writer:services/orion-sql-writer/tests python -m pytest -q -rs -m integration \
            services/orion-sql-writer/tests/test_act_ledger_integration.py \
            services/orion-sql-writer/tests/test_act_workspace_binding_integration.py | tee /tmp/act_ledger.log
          if grep -q "SKIPPED" /tmp/act_ledger.log; then echo "act ledger integration tests skipped"; exit 1; fi
      # Visual confirmation asks against real Postgres: opener, answers, typed names, picture
      # verdicts, migration backfill. The tests TRUNCATE the walkway tables; this database is throwaway.
      - name: Run visual confirmation asks Postgres tests (must not skip)
        env:
          ORION_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/conjourney
        run: |
          set -o pipefail
          python - <<'PY'
          import pathlib, psycopg2
          conn = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/conjourney")
          conn.autocommit = True
          for f in ("walkway_camera_v1", "walkway_privacy_v2", "vision_confirm_asks_v1", "vision_ask_names_v1"):
              conn.cursor().execute(pathlib.Path(f"services/orion-sql-db/manual_migration_{f}.sql").read_text())
          # CREATE INDEX CONCURRENTLY cannot run inside the implicit transaction of a
          # multi-statement string: one statement at a time, as psql does.
          import re
          conn.cursor().execute(pathlib.Path("services/orion-sql-db/manual_migration_vision_osnet_shadow_v1.sql").read_text())
          for f in ("vision_split_v1", "vision_reanchor_v1", "vision_motion_story_v1",
                    "vision_motion_story_strip_v2", "vision_motion_story_edges_v1",
                    "vision_person_album_v1", "vision_scene_inventory", "vision_handoff_v1"):
              body = re.sub(r"--[^\n]*", "", pathlib.Path(f"services/orion-sql-db/manual_migration_{f}.sql").read_text())
              for stmt in body.split(";"):
                  if stmt.strip():
                      conn.cursor().execute(stmt)
          PY
          PYTHONPATH=.:services/orion-sql-writer python -m pytest -q -rs -p no:cacheprovider \
            services/orion-sql-writer/tests/test_vision_confirm_asks.py \
            services/orion-sql-writer/tests/test_vision_split.py \
            services/orion-sql-writer/tests/test_vision_osnet_shadow.py \
            services/orion-sql-writer/tests/test_vision_body_match.py \
            services/orion-sql-writer/tests/test_vision_reanchor.py \
            services/orion-sql-writer/tests/test_vision_motion.py \
            services/orion-sql-writer/tests/test_vision_caption_motion.py \
            services/orion-sql-writer/tests/test_vision_caption_motion_pg.py \
            services/orion-sql-writer/tests/test_vision_story_strip.py \
            services/orion-sql-writer/tests/test_vision_rollup.py \
            services/orion-sql-writer/tests/test_vision_handoff_pg.py | tee vision_pg.out
          if grep -q "SKIPPED" vision_pg.out; then
            echo "visual confirmation Postgres tests skipped -- ORION_TEST_PG_URI wiring is broken" >&2
            exit 1
          fi
      # Orion energy hourly rollup: integrates per-node and cabinet-cooling watts into kWh.
      # The test drops and recreates the raw watt tables with only the columns it reads, so it
      # gets its own database: no other step ever sees those narrowed tables.
      - name: Run Orion energy rollup Postgres tests (must not skip)
        env:
          ORION_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/energy_rollup_test
        run: |
          set -o pipefail
          python - <<'PY'
          import psycopg2
          conn = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/conjourney")
          conn.autocommit = True
          conn.cursor().execute("CREATE DATABASE energy_rollup_test")
          PY
          PYTHONPATH=.:services/orion-sql-writer python -m pytest -q -rs \
            services/orion-sql-writer/tests/test_orion_energy_rollup_pg.py | tee energy_rollup_pg.out
          if grep -q "SKIPPED" energy_rollup_pg.out; then
            echo "Orion energy rollup Postgres tests skipped -- ORION_TEST_PG_URI wiring is broken" >&2
            exit 1
          fi
