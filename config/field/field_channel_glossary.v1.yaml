    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: self_monitoring
    meaning: "How much more execution pressure changed this batch than it usually does: z-score of the mean change in 4 execution pressure hints versus its own running average, negatives clipped, 3 sigma = 1.0."
