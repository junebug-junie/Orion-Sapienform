name: summarize_context
label: Summarize Context
description: >
  Summarize recent inputs, memory pulls, and conversation into a structured digest.

category: Transform
priority: medium

interruptible: true
can_interrupt_others: false

requires_gpu: true
requires_memory: true

timeout_ms: 3500
max_recursion_depth: 1

services:
  - LLMGatewayService

prompt_template: summarize_context_prompt.j2

plan:
  - name: compose_summarization_prompt
    description: Construct a structured summarization prompt.
    order: 0
    prompt_template: summarize_context_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: LLMGatewayService
    description: Generate a structured context summary via LLM.
    order: 1
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
