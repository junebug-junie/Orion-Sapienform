# GPU pool — the only place that says which roles live on which cards and who may borrow what.
# Spec: docs/superpowers/specs/2026-09-24-gpu-pool-design.md
#
# NO MODEL NAMES HERE. Which model fills a role is discovered live: each llama.cpp worker
# announces its config/llm_profiles.yaml profile on orion:llm:worker:announce, and the pool
# confirms it against the server's own /props. Swap a model file -> no edit here.
#
# Adding a card: add it under cards, then add or extend the roles that live on it.
# Adding a service: add a role (kind: service needs slots + vram_gb) and a class that uses it
# (no class when callers reach it directly and the pool only lists and probes it, e.g. kev).
version: 1
host: {name: circe, address: 100.112.254.99}
# Other GPU nodes. A card on one says `host: <name>`; every other card is on `host` above. The pool
# reaches a role at its card's node address + the role's port. A card's `index` is per node.
hosts:
  hecate: {address: 100.87.202.68}

defaults:
  clawback_grace_sec: 60        # a recalled borrower finishes its current request, capped here
  request_lease_ttl_sec: 30     # heartbeat window, one-inference leases
  hold_lease_ttl_sec: 90        # heartbeat window, held leases (durable runs, operator)
  swap_cooldown_sec: 600        # after a load fails (residents restored) or is refused/unanswered, don't retry for this long
  swap_after_wait_sec: 30       # a lease must wait this long before it justifies loading a swap seat (per-seat: swap.after_wait_sec)
  swap_idle_unload_sec: 300     # an idle swap seat is unloaded and residents restored after this
  backlog_max_age_sec: 86400    # backlogged work older than this is dead-lettered
  retry: {max_attempts: 3, base_sec: 5, max_sec: 300}
  # Stage 4.3 (docs/superpowers/specs/2026-09-25-gpu-pool-stage4-durable-runs-and-actuation.md)
  hold_clawback_grace_sec: 600  # a recalled hold (durable run) finishes its current graph node within this, then is aborted + re-queued
  # H5 (2026-11-04): a swap seat drained only for BACKGROUND owner work (every diffusion job) gives a running
  # hold this long instead, so a ~1 min image no longer kills a 10-60 min reading/curiosity turn (81 killed
  # 10-28..11-04). Images wait up to this for the running node (inside the 2.5 h Juniper allowed 2026-09-29).
  # Default 3600 lives in orion/gpu_pool/config.py (Defaults.background_drain_grace_sec), NOT here yet:
  # Defaults is extra=forbid and circe's lane controller parses this file, so a new key here breaks any
  # reader still on older code. Add `background_drain_grace_sec: <sec>` here once every reader is deployed.
  # Rollback today is a code change (set that default to 600); once every reader of this file is deployed
  # with the field, setting the key here equal to hold_clawback_grace_sec also rolls it back.
  swap_min_residency_sec: 600   # after a seat unloads, its evicted residents stay this long (swap_requested reason=min_residency)
  actuate_ack_sec: 10           # the actuator must answer "accepted" within this, else swap_failed reason=actuator_unreachable
  # Urgent (docs/superpowers/specs/2026-09-28-urgent-curiosity-and-hardware-watch-design.md)
  urgent_preempt_grace_sec: 5   # a hold paused for urgent work gets this long, then is aborted + re-queued in place
  urgent_max_concurrent: 3      # active urgent leases at once; 0 = urgent behaves like background (rollback)

# Host actuators the pool sends GpuActuateV1 to, by name (stage 4). circe's is
# orion-gpu-lane-controller; it acts only on the `launch` blocks below that name it.
actuators:
  circe: {host: circe}

# perception (2026-10-23, body-economy design Patch A0): Orion's senses. Below Juniper's turn, above
# Orion's own work, and never shed by heat -- orion/gpu_pool/shed.py can only block starved/system/background.
# starved (2026-11-03): Orion's own work whose last try lost its whole seat wait to the queue (today only
# Orion Prime's prime_starved route). Ahead of other system work, behind Juniper and the senses, and shed
# by the heat reflex exactly like system.
priorities: [urgent, interactive, perception, starved, system, background]   # highest first

# index = the card's CUDA / nvidia-smi device number on circe (CUDA_DEVICE_ORDER=PCI_BUS_ID). Hub's
# biometrics GPU labels join nvidia-smi on it (stage 5.5). gpu0/1/3 verified live 2026-09-29 against
# circe's running containers (atlas chat/agent/metacog+fast CUDA_VISIBLE_DEVICES_OVERRIDE=0/1/3); those
# roles have no launch block, so CI cannot check them against compose -- re-verify if a card moves.
cards:
  gpu0: {vram_gb: 32, lendable: true, index: 0}   # chat's card; others only while Juniper has it lent
  gpu1: {vram_gb: 32, index: 1}
  gpu2: {vram_gb: 32, index: 2}         # PG500-216 (a V100); the actuator sets the launch roles' device from it
  gpu3: {vram_gb: 32, index: 3}
  # hecate's one V100-SXM2-32GB (2026-10-08). No actuator on hecate: agent-deep is a fixed resident,
  # and lending is a pool flag, not a docker action. Lendable like gpu0: agent/metacog/fast borrow it
  # only while Juniper has it lent (Hub GPU pool panel: "Lend hecate-gpu0").
  hecate-gpu0: {vram_gb: 32, lendable: true, index: 0, host: hecate}

roles:
  # chat runs Strata (Qwen3.8-Flash-Next, 2026-10-30): llama.cpp's /props shape, no /completion endpoint.
  # Rollback with the llama.cpp server: drop `backend: strata` (services/orion-llamacpp-host README).
  chat:       {kind: llm, backend: strata, cards: [gpu0], owner: chat, port: 8011}
  # memory_distill co-owns gpu1 (2026-10-20): it is its only role, and its route is system "ahead of
  # curiosity's background holds". As a borrower, rule 5 gave every queued agent lease (background
  # included) gpu1 first and recalled a running distill hold owner_waiting (10-18 11:39), so two
  # system distill holds waited 10+ h behind background reading holds (10-20). As an owner, queue
  # order (priority, then age) decides. Rollback: owner: agent.
  # agent runs Strata like chat (2026-10-31), at 131072 like agent-gpu2. Rollback: drop `backend: strata`.
  # judge co-owns gpu1 (2026-11-12) for the same reason as memory_distill: as a borrower, rule 5
  # would hold every judge call behind any queued agent lease (curiosity holds queue there all day).
  agent:      {kind: llm, backend: strata, cards: [gpu1], owner: [agent, memory_distill, judge], port: 8015}
  agent-gpu2: {kind: llm, cards: [gpu2], owner: agent, port: 8016,   # diffusion reclaims gpu2 via evicts
               # How long gpu2 may stay borrowed from diffusion once the pool loaded it (was
               # DURABLE_RUNS_ELASTIC_MAX_BORROW_SEC): then holds are recalled and the seat unloads.
               # 9000 s (~2.5 h), Juniper 2026-09-29 (stage 5 spec, "Juniper's answers" 1): curiosity and
               # self-sense holds may land here; image generation may wait up to ~2.5 h for gpu2.
               max_hold_sec: 9000,
               # Stage 7.3 (docs/superpowers/specs/2026-09-30-gpu-pool-stage7-concurrency.md, D1): two
               # durable runs at once, one per Bonsai slot (2 x 131072). Each run still holds one slot;
               # one-off agent calls share the runs' gaps (H3, pinned to one run each). The scheduler
               # clamps this to the slots discovery reads from /props, so the Q4 rollback profile (1
               # slot) runs one hold even before this line is reverted. Rollback: delete this line.
               # reserve_one_off_slots stays 0 (the default): see the stage 7.3 PR report for the data.
               max_holds: 2,
               # The controller runs this `launch` block and diffusion's through its generic executor
               # (stage 5.3 cutover; 5.6 deleted the load/unload bridge verbs and the controller's bridge).
               # after_wait_sec keeps today's 1200s elastic trigger. guards: thermal only -- visual_baseline was
               # deleted in stage 5.4 (a reverie-visual diffusion hold reclaims gpu2 through the queue).
               # standby: warm (Juniper 2026-10-14, "gpu2 should not sit idle while agent work exists"):
               # loaded whenever diffusion has been quiet for standby_after_idle_sec, never unloaded
               # for idleness or on the max_hold_sec clock; a diffusion lease still drains and unloads
               # it as before. A failed warm load waits standby_retry_after_fail_sec. Rollback:
               # standby: off. Not in the launch digest (pool and controller need no lockstep), but the
               # controller parses this file: circe's controller must run this parser before circe pulls.
               swap: {evicts: [diffusion], after_wait_sec: 1200, guards: [thermal],
                      standby: warm, standby_after_idle_sec: 900, standby_retry_after_fail_sec: 3600},
               launch: {actuator: circe, compose: services/orion-llamacpp-host/docker-compose.atlas-workers.yml,
                        env_file: services/orion-llamacpp-host/.env, service: atlas-agent-burst,
                        compose_profile: agent-burst,
                        # Compose interpolation variables the actuator sets: the card index, and the
                        # profile the pool sends. The pool sends the FIRST entry of `profiles` on every
                        # load (choosing by vision/ctx/VRAM is not built).
                        # Stage 7.2 (docs/superpowers/specs/2026-09-30-gpu-pool-stage7-concurrency.md):
                        # Ternary-Bonsai-2-27B, 2 slots x 131072 (discovery reads slots/ctx from /props).
                        # The second entry, the Q4 27B this seat served through stage 6, is the rollback:
                        # swap the two entries. The atlas-agent-burst image carries both binaries
                        # (Dockerfile.prism), so rollback needs no image change. Either edit changes this
                        # role's launch digest: pool (athena) and controller checkout (circe) move together.
                        # Swapping them also needs max_holds above back to 1 (check_gpu_pool_config).
                        cuda_env: ATLAS_AGENT_BURST_CUDA_VISIBLE_DEVICES,
                        profile_var: ATLAS_AGENT_BURST_PROFILE_NAME,
                        profiles: [ternary-bonsai2-27b-pq2-v100-32gb-circe-agent,
                                   qwen3.8-27b-udq4kxl-v100-32gb-circe-agent-flex],
                        ready: /health, timeout_sec: 900}}
  # hecate: services/orion-vllm-host/docker-compose.hecate.yml; the single-card
  # Qwen validation profile is selected by that service's VLLM_PROFILE_NAME.
  agent-deep: {kind: llm, backend: vllm, cards: [hecate-gpu0], owner: agent-deep, port: 8021}
  fast:       {kind: llm, cards: [gpu3], owner: [fast, metacog], port: 8013}
  # Kev (services/orion-kev), System One appraisal for orion-substrate-runtime, moved off athena's
  # T10 2026-10-15. Substrate calls it directly, not through the gateway, so no class or route names
  # it and the pool never schedules on it: this entry lists the tenant on gpu3 (measured 3.9GB live)
  # and probes it. check_vram only sums service footprints, so it does NOT add fast's dynamic KV cache.
  # Kev has no /health; /docs is what its compose healthcheck uses too.
  kev:        {kind: service, cards: [gpu3], owner: [], port: 8009, slots: 1, vram_gb: 4, health: /docs}
  world:      {kind: service, cards: [gpu2], owner: world, port: 6613, slots: 2, vram_gb: 1,
               # Never compute at the same time as diffusion (symmetric; the scheduler reports
               # queued reason=serialized:<role>). Keeps the old /capacity permit's mutex: two
               # "CUDA-capable device busy" failures on 2026-09-24, cause UNVERIFIED (stage 5 Decision 1).
               serialize_with: [diffusion]}
  diffusion:  {kind: service, cards: [gpu2], owner: diffusion, port: 8014, slots: 1, vram_gb: 24,
               launch: {actuator: circe, compose: services/orion-diffusion-host/docker-compose.yml,
                        env_file: services/orion-diffusion-host/.env, service: diffusion-host,
                        cuda_env: CUDA_VISIBLE_DEVICES,
                        drain: {set: /v1/lifecycle/drain, status: /v1/lifecycle/status},
                        ready: /ready, timeout_sec: 600}}
  # Deferred (stage 5 Decision 3): no launch block, so the pool marks it
  # not_actuatable. Making it real = launch blocks here and on every role it evicts.
  experiment: {kind: llm, cards: [gpu0, gpu1, gpu2, gpu3], owner: experiment, port: 8099,
               operator_only: true, max_hold_sec: 14400,
               swap: {evicts: all}}

classes:   # roles that may serve a class, in preference order; nothing big spills down to gpu3
  chat:       {roles: [chat], on_unavailable: wait}
  # agent-deep (hecate) sits ahead of chat: both are lent cards, and hecate's has no human waiting on it.
  agent:      {roles: [agent, agent-gpu2, agent-deep, chat], on_unavailable: backlog}
  agent-deep: {roles: [agent-deep], on_unavailable: backlog}
  metacog:    {roles: [fast, agent, agent-gpu2, agent-deep, chat], on_unavailable: backlog}
  fast:       {roles: [fast, agent, agent-gpu2, agent-deep, chat], on_unavailable: wait}
  world:      {roles: [world], on_unavailable: wait}   # a world prediction replayed hours later is useless
  diffusion:  {roles: [diffusion], on_unavailable: backlog}
  experiment: {roles: [experiment], on_unavailable: fail}
  # Memory episode distiller (2026-10-02, Juniper's choice): gpu1 ONLY -- the 27B until 2026-10-31,
  # Qwen3.8-Flash-Next on Strata since (Juniper: "move distil over too"). Never the gpu2
  # seat (a different model may load there) and never the lent chat card. Backlog, not wait: a
  # distill run waits for the hold under durable-runs admission anyway.
  memory_distill: {roles: [agent], on_unavailable: backlog}
  # The finalize 5b judge (harness_finalize_reflect) of a durable run whose hold is on a role this
  # list does not name (2026-11-12; orion/harness/finalize.py FINALIZE_JUDGE_HOLD_ROLES must equal
  # this list -- orion/harness/tests/test_finalize_judge_placement.py). Under a hold every call runs
  # on the hold's role, so 22 of 90 judge calls (11-11..12) ran on whatever model the gpu2 seat had
  # loaded; replay showed that seat's judge, thinking off, caught 2 of 5 false claims (5 of 5 with
  # thinking on, which cannot be used: 8000 tokens and no verdict). gpu1, then chat's card only while
  # Juniper lends it (rule 9), never the gpu2 seat or hecate. Wait, not backlog: nobody resumes a
  # judge call later. Rollback: delete this class, its route and the owner entry on `agent`.
  judge:          {roles: [agent, chat], on_unavailable: wait}
  # Operator work (evals, benches, probes Juniper or an agent starts by hand; 2026-11-12, design
  # docs/superpowers/specs/2026-11-12-leased-evals-and-server-refusal-design.md, Phase 1). Not Orion's
  # own acts: no role names these classes as owner, so they are borrowers everywhere -- an owner that
  # waits recalls them (rule 5) and chat's card / hecate take them only while Juniper has lent the card
  # (rule 9). Their routes are `background` (shed by the heat reflex with Orion's background work) and
  # they sort after every other background lease (orion/gpu_pool/value_order.py OPERATOR_CLASS_PREFIX,
  # GPU_POOL_OPERATOR_LAST). They never bid (scripts/check_verb_physiology.py refuses an operator* lane)
  # and the body economy reads their load as sponsored, not Orion's (PHYSIOLOGY_OPERATOR_LOAD_SPONSORED).
  # Callers: orion/evals/leased_llm.py only. Wait, not backlog: an eval nobody resumes later.
  # `operator`: any big lane. The pinned ones replay one specific lane.
  operator:            {roles: [agent-gpu2, agent, agent-deep, chat], on_unavailable: wait}
  operator_chat:       {roles: [chat], on_unavailable: wait}
  operator_agent:      {roles: [agent], on_unavailable: wait}
  operator_agent_gpu2: {roles: [agent-gpu2], on_unavailable: wait}
  operator_agent_deep: {roles: [agent-deep], on_unavailable: wait}
  operator_metacog:    {roles: [fast], on_unavailable: wait}  # same physical worker; separate eval policy
  operator_fast:       {roles: [fast], on_unavailable: wait}

routes:    # what llm-gateway callers say -> class (+ priority). Every gateway route must be listed:
           # the gateway refuses a route that is not here rather than guess a GPU.
           # Always long form with an explicit priority (orion/gpu_pool/tests/test_route_priorities_explicit.py):
           # the shorthand `name: class` silently meant `system`, i.e. shed under heat (2026-10-06 C6).
  chat: {class: chat, priority: interactive}
  harness: {class: chat, priority: interactive}
  agent: {class: agent, priority: system}
  metacog: {class: metacog, priority: system}
  metacog_background: {class: metacog, priority: background}
  quick: {class: fast, priority: system}
  quick_background: {class: fast, priority: background}
  # Calls on a human's critical path (spec 2026-10-06-thermal-controller-redesign D4): same class
  # as metacog, but interactive, so a heat shed never holds a live Hub turn (orion-mind on a Hub
  # turn, MIND_TURN_MODEL_ROUTE). metacog stays system: it also carries background callers.
  # Also Hub's Zelda co-play planner (2026-10-24, retro_planner.COPLAY_ROUTE): Link stands still on
  # screen while Juniper watches each decision; ~30 reply tokens per call. Solo leisure stays on
  # metacog_background (nobody waiting, shed under heat).
  # agent_turn (spec D4, Q4) is NOT added: no live-turn caller sends agent today (Hub Agent mode
  # runs through the FCC harness). Add it with the caller that uses it, not before.
  metacog_turn: {class: metacog, priority: interactive}
  # quick_turn (2026-10-23): the pre-turn repair-pressure probe (cortex-exec
  # REPAIR_PRESSURE_PROBE_ROUTE), awaited by every Hub turn before the stance runs. On `quick`
  # (system) the 34 C reflex refused it on 19/19 Juniper turns 10-20..21, and the turn went on
  # with no repair reading. Same fast class, interactive, so heat never sheds it.
  quick_turn: {class: fast, priority: interactive}
  # quick_embodied (2026-10-23): Orion's own speech in AI Town (orion-embodiment
  # EMBODIMENT_SPEECH_QUICK_LLM_ROUTE, through cortex-exec chat_quick). On quick_background it
  # waited in the fast queue behind system work (orion-topic-foundry) and the embodiment worker's
  # 45 s RPC gave up on every reply 10-23, while the lane itself answered in 2.2 s. Someone is
  # standing there waiting for an answer, so it is a live turn: interactive, never shed by heat.
  quick_embodied: {class: fast, priority: interactive}
  # Orion's sight (2026-10-23, docs/superpowers/specs/2026-10-23-organism-body-economy-design.md, A0):
  # vision-council's scene reads. On metacog_background the 34 C reflex refused it 25,430 times in the
  # 7 days to 10-23 -- Orion stopped interpreting what it saw whenever the cabinet ran hot. perception
  # is never shed by heat and ranks below Juniper's turn. Load: ~33 GPU-h/week (p90 1,679 slot-s/hour);
  # the pool alerts past GPU_POOL_PERCEPTION_ALERT_HELD_SEC_PER_HOUR.
  metacog_perception: {class: metacog, priority: perception}
  # The old "burst" lanes: agent work on a borrowed card. The pool now decides which card
  # (agent -> gpu2 seat when loaded -> gpu0 when lent), so both are just agent work.
  agent-burst: {class: agent, priority: system}
  chat-burst: {class: agent, priority: system}
  # Memory episode distiller (2026-10-02): durable-runs holds gpu1 (Strata since 2026-10-31) at system priority
  # (ahead of curiosity's background holds) and calls the gateway on this route.
  memory_distill: {class: memory_distill, priority: system}
  # The finalize 5b judge off a hold (classes.judge above). system, the priority the judge's hold child
  # named before (route `agent`): ahead of background holds (it may use their gaps, H3), behind
  # Juniper's turn and the senses. Shed by the heat reflex like any one-shot system call.
  judge: {class: judge, priority: system}
  # hecate's 27B (2026-10-08): its own card, always this route's; others borrow it only while lent.
  agent-deep: {class: agent-deep, priority: system}
  # Orion Prime's between-conversations thinking (2026-10-30, docs/superpowers/specs/2026-10-29-orion-
  # prime-design.md section 7.1, Juniper: circe chat lane 0 by default). Same worker as `chat` (warm, no
  # cold start). `system` since 2026-11-03: at `background` it queued behind every system call on the
  # chat class (the harness held the role ~16 h of 4 days) and 74 of 254 thoughts lost their whole 60 s
  # to the queue. Juniper's turn (interactive) still goes first; the heat reflex still sheds it.
  # prime_starved: the same call one level up (`starved`), used only when Prime's previous try got no
  # seat at all (orion/mindloop/runtime.py, Prime's loop). Both system-only (orion/llm/routes.py).
  prime: {class: chat, priority: system}
  prime_starved: {class: chat, priority: starved}
  # Orion's consent to a Claude tool call (2026-11-13, docs/superpowers/specs/2026-11-12-claude-hub-
  # tools-orion-consent-design.md section 3): one short call (frame <= 4,000 chars, 200 tokens) on the
  # same warm worker as Prime. Interactive because Juniper is waiting on Claude's reply. Never the fast
  # or metacog lanes. System-only (orion/llm/routes.py).
  prime_consent: {class: chat, priority: interactive}
  # Operator work (classes.operator* above): one route per class, always `background`. Named in the
  # `model` field of a gateway call that carries the eval's operator hold (X-Orion-Gpu-Lease).
  operator: {class: operator, priority: background}
  operator_chat: {class: operator_chat, priority: background}
  operator_agent: {class: operator_agent, priority: background}
  operator_agent_gpu2: {class: operator_agent_gpu2, priority: background}
  operator_agent_deep: {class: operator_agent_deep, priority: background}
  operator_metacog: {class: operator_metacog, priority: background}
  operator_fast: {class: operator_fast, priority: background}

hold_routes:   # durable-run holds on non-LLM roles; durable-runs reads these, the gateway never does
  # reverie.visual's generate step (docs/superpowers/specs/2026-09-28-visual-reverie-durable-graph-design.md).
  # The hold IS the grant (stage 5.4): orion-thought validates the hold ref before generating and
  # takes no second gate; world.serialize_with keeps world-model off gpu2 while it is held.
  # priority is informational: ResourceRequirementV1.priority (always background) wins for holds.
  diffusion: {class: diffusion, priority: background}
