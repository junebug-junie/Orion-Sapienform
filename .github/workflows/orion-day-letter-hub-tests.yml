name: orion-day letter (hub) tests

on:
  pull_request:
    paths:
      - "orion/orion_day/**"
      - "orion/schemas/orion_day.py"
      - "orion/schemas/notify.py"
      - "orion/curiosity/kickoff_prompt.py"
      - "services/orion-hub/scripts/orion_day_*.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "services/orion-hub/scripts/main.py"
      - "services/orion-hub/app/settings.py"
      - "services/orion-hub/.env_example"
      - "services/orion-hub/templates/orion_day_letter.html.j2"
      - "services/orion-hub/tests/test_orion_day_letter.py"
      - "services/orion-hub/tests/test_orion_day_introspect_listener.py"
      - "services/orion-hub/tests/test_orion_day_correction_listener.py"
      - "orion/curiosity/worldview.py"
      - "orion/curiosity/value.py"
      - "services/orion-hub/scripts/curiosity_offer_decisions.py"
      - "services/orion-sql-db/manual_migration_orion_day_correction_v1.sql"
      - "services/orion-hub/scripts/curiosity_introspect_listener.py"
      - "services/orion-hub/scripts/node_history_introspect_listener.py"
      - "services/orion-hub/tests/test_node_history_introspect_listener.py"
      - "orion/introspect/**"
      - "orion/schemas/introspect.py"
      - "services/orion-hub/evals/*orion_day*"
      - "services/orion-hub/requirements.txt"
      - ".github/workflows/orion-day-letter-hub-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/orion_day/**"
      - "services/orion-hub/scripts/orion_day_*.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "orion/curiosity/kickoff_prompt.py"
      - "orion/introspect/**"
      - "orion/schemas/introspect.py"
      - "services/orion-sql-db/manual_migration_orion_day_correction_v1.sql"
      - "services/orion-hub/templates/orion_day_letter.html.j2"

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r services/orion-hub/tests/requirements-reading.txt \
            "markdown-it-py>=3.0,<5" "Pillow>=10.4,<13" "httpx>=0.27,<1"
      - name: Scheduler, render, carry-forward
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q services/orion-hub/tests/test_orion_day_letter.py \
            services/orion-hub/tests/test_curiosity_dream_hypotheses.py \
            services/orion-hub/tests/test_orion_day_introspect_listener.py \
            services/orion-hub/tests/test_orion_day_correction_listener.py \
            services/orion-hub/tests/test_node_history_introspect_listener.py
      - name: Corrections (offer once, kickoff section, outcome, next letter)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider orion/orion_day/tests/test_corrections.py
      - name: Email full-text eval (fixture day)
        run: python services/orion-hub/evals/run_orion_day_email_eval.py
      - name: Reread eval (orion_day tool, fixture letter, 10 planted references)
        run: python services/orion-hub/evals/run_orion_day_reread_eval.py
      - name: Correction eval (record, offer once, re-test stamped, untouched prior absent)
        run: python services/orion-hub/evals/run_orion_day_correction_eval.py
