# Memory Stage 2 PR D: the voice renderer and the PCR retrieval-intent fix.
# - orion/memory/voice_render.py: source monitoring (a reverie is never
#   rendered as something Juniper said; juniper_said needs a verified quote).
# - orion/memory/retrieval_intent.py: open_loop no longer wins on every turn;
#   intents come from model judgments, not word lists.
# - their two live callers in orion-cortex-exec (PCR phase 3, reverie glimpse).
# No DB, bus or LLM. The episode report's Postgres-backed test runs in
# orion-memory-episode-tests.yml.

name: memory-voice-intent-tests

on:
  pull_request:
    paths:
      - "orion/memory/voice_render.py"
      - "orion/memory/retrieval_intent.py"
      - "orion/memory/tests/**"
      - "tests/test_retrieval_intent.py"
      - "services/orion-cortex-exec/app/pcr_chat_memory.py"
      - "services/orion-cortex-exec/app/chat_stance.py"
      - "services/orion-cortex-exec/tests/test_pcr_chat_memory.py"
      - "services/orion-cortex-exec/tests/test_chat_stance_reverie_glimpse_projection.py"
      - ".github/workflows/memory-voice-intent-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/memory/voice_render.py"
      - "orion/memory/retrieval_intent.py"
      - "orion/memory/tests/**"
      - "tests/test_retrieval_intent.py"
      - "services/orion-cortex-exec/app/pcr_chat_memory.py"
      - "services/orion-cortex-exec/app/chat_stance.py"
      - ".github/workflows/memory-voice-intent-tests.yml"

jobs:
  unit:
    name: Voice renderer, retrieval intent, cortex callers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "pydantic>=2.7,<3" "pydantic-settings==2.3.4" \
            "fastapi==0.111.0" "httpx==0.27.0" "SQLAlchemy==2.0.43" "asyncpg==0.29.0" \
            "python-dotenv==1.0.1" "requests==2.32.5" "loguru>=0.7" "pyaml==25.7.0"
      - name: Renderer source-monitoring matrix and intent rules
        run: PYTHONPATH=. python -m pytest -q -p no:cacheprovider orion/memory/tests tests/test_retrieval_intent.py
      - name: orion-cortex-exec callers (PCR phase 3 profile, reverie glimpse)
        working-directory: services/orion-cortex-exec
        run: python -m pytest -q -p no:cacheprovider tests/test_pcr_chat_memory.py tests/test_chat_stance_reverie_glimpse_projection.py
