services:
  harness-governor:
    build:
      context: ../..
      dockerfile: services/orion-harness-governor/Dockerfile
      # Host-local cache for the LadybugDB FTS extension (see
      # scripts/seed_lbdb_fts_extension_cache.sh) -- the Dockerfile COPYs
      # from this named context instead of downloading it at build time.
      additional_contexts:
        - lbdb_ext=${HARNESS_LBDB_EXT_CACHE_DIR:-/mnt/telemetry/duckdb-extensions/staging}
      # Must match scripts/seed_lbdb_fts_extension_cache.sh's own
      # LBDB_EXT_VERSION/LBDB_EXT_PLATFORM (same env var names, read the same
      # way) so a version bump only needs the env var changed once.
      args:
        LBDB_EXT_VERSION: ${LBDB_EXT_VERSION:-0.18.1}
        LBDB_EXT_PLATFORM: ${LBDB_EXT_PLATFORM:-linux_amd64}
    container_name: ${PROJECT}-harness-governor
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HARNESS_REPO_MOUNT:-/mnt/scripts/Orion-Sapienform}:/repo:ro
      - ${HARNESS_REPO_MOUNT:-/mnt/scripts/Orion-Sapienform}:/mnt/scripts/Orion-Sapienform:ro
      - ${HOME}/.fcc:/root/.fcc
      - ${HOME}/.claude.json:/root/.claude.json:ro
      - ${HARNESS_FCC_CLAUDE_BIN_HOST:-${HOME}/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${HARNESS_FCC_GH_BIN_HOST:-${HOME}/.local/bin/gh}:/usr/local/bin/gh:ro
      # GitNexus global registry (~/.gitnexus/registry.json) — index is built on
      # the host; MCP inside the container discovers it via this read-only mount.
      # The per-repo .gitnexus/ index arrives through the repo mount above.
      # Run `mkdir -p ~/.gitnexus` before first `up`: docker creates a missing
      # bind source as root, which then breaks host-side `gitnexus analyze`.
      - ${HOME}/.gitnexus:/root/.gitnexus:ro
      # Context Mode working data — operational, project-scoped, NOT an Orion
      # memory store; never exposed through Hub convenience APIs.
      - harness-context-mode:${HARNESS_FCC_CONTEXT_MODE_DIR:-/var/lib/orion/context-mode}
      # Harness-scoped Claude state (hook mode). Plugin installs persist here:
      #   claude plugin marketplace add mksglu/context-mode
      #   claude plugin install context-mode@context-mode
      # This is NEVER the operator's own ~/.claude; ~/.claude.json stays a
      # separate read-only mount above.
      - harness-claude-config:/root/.claude
      # GitHub CLI credentials — read-only, for GITHUB_PAT injection into FCC subprocess.
      - ${HOME}/.config/gh:/root/.config/gh:ro
      # Orion's disposable FCC sandbox checkout (see orion/fcc/sandbox_sync.py and
      # services/orion-hub/docker-compose.yml's identical mount). Same host directory
      # as orion-hub's sandbox mount -- one clone, refreshed once per browser session
      # by orion-hub's WS connect handler, read/written here by this container's
      # per-turn `claude -p` spawns (fcc_motor.py). Not a worktree: standalone git
      # clone, no shared .git object store with the primary checkout at
      # /mnt/scripts/Orion-Sapienform. The only path back to the real repo is git
      # push to a non-main branch, gated by GitHub branch protection.
      - ${HARNESS_ORION_FCC_SANDBOX_HOST:-/mnt/orion-fcc}:/mnt/orion-fcc
      # `git push` to the SSH remote (git@github.com:...) needs the operator's
      # existing host SSH key/known_hosts -- read-only, same identity this host's
      # own git operations already use, nothing stored in this repo.
      # NOT ${HOME}/.gitconfig -- a read-only bind mount there fully replaces the
      # file, which shadows this image's own baked-in safe.directory config below
      # (line ~24-25) and can't be written to at runtime either (confirmed live:
      # "could not write config file /root/.gitconfig: Device or resource busy").
      - ${HOME}/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-orion-harness-governor}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME}
      - HARNESS_GOVERNOR_PORT=${HARNESS_GOVERNOR_PORT:-7156}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_HARNESS_GOVERNOR_ENABLED=${ORION_HARNESS_GOVERNOR_ENABLED:-true}
      - CHANNEL_HARNESS_RUN_REQUEST=${CHANNEL_HARNESS_RUN_REQUEST:-orion:harness:run:request}
      - CHANNEL_HARNESS_RUN_ARTIFACT=${CHANNEL_HARNESS_RUN_ARTIFACT:-orion:harness:run:artifact}
      - CHANNEL_HARNESS_RESULT_PREFIX=${CHANNEL_HARNESS_RESULT_PREFIX:-orion:harness:run:result:}
      - CHANNEL_HARNESS_RUN_STEP=${CHANNEL_HARNESS_RUN_STEP:-orion:harness:run:step}
      - CHANNEL_HARNESS_RUN_CANCEL=${CHANNEL_HARNESS_RUN_CANCEL:-orion:harness:run:cancel}
      - CHANNEL_GRAMMAR_EVENT=${CHANNEL_GRAMMAR_EVENT:-orion:grammar:event}
      - CHANNEL_CORTEX_EXEC_REQUEST=${CHANNEL_CORTEX_EXEC_REQUEST:-orion:cortex:exec:request:background}
      - CHANNEL_CORTEX_EXEC_RESULT_PREFIX=${CHANNEL_CORTEX_EXEC_RESULT_PREFIX:-orion:exec:result}
      - CHANNEL_FINALIZE_APPRAISAL_REQUEST=${CHANNEL_FINALIZE_APPRAISAL_REQUEST:-orion:substrate:finalize_appraisal:request}
      - CHANNEL_FINALIZE_APPRAISAL_RESULT_PREFIX=${CHANNEL_FINALIZE_APPRAISAL_RESULT_PREFIX:-orion:substrate:finalize_appraisal:result:}
      - CHANNEL_POST_TURN_CLOSURE=${CHANNEL_POST_TURN_CLOSURE:-orion:substrate:post_turn_closure}
      - HARNESS_LLM_GATEWAY_URL=${HARNESS_LLM_GATEWAY_URL:-http://llm-gateway:8210}
      - HARNESS_FCC_TIMEOUT_SEC=${HARNESS_FCC_TIMEOUT_SEC:-2400}
      - HARNESS_FCC_STREAM_STALL_TIMEOUT_SEC=${HARNESS_FCC_STREAM_STALL_TIMEOUT_SEC:-180}
      - FINALIZE_REFLECT_TIMEOUT_SEC=${FINALIZE_REFLECT_TIMEOUT_SEC:-180}
      - VOICE_FINALIZE_TIMEOUT_SEC=${VOICE_FINALIZE_TIMEOUT_SEC:-300}
      - SUBSTRATE_FINALIZE_TIMEOUT_SEC=${SUBSTRATE_FINALIZE_TIMEOUT_SEC:-5}
      - FINALIZE_QUICK_GATE_EPSILON=${FINALIZE_QUICK_GATE_EPSILON:-0.08}
      - HARNESS_FCC_ENV_PATH=/root/.fcc/.env
      - HARNESS_FCC_SERVER_URL=${HARNESS_FCC_SERVER_URL:-http://host.docker.internal:8082}
      - HARNESS_FCC_AUTH_TOKEN=${HARNESS_FCC_AUTH_TOKEN:-}
      - HARNESS_FCC_WORKSPACE=${HARNESS_FCC_WORKSPACE:-/mnt/orion-fcc/repo}
      - HARNESS_FCC_CLAUDE_BIN=${HARNESS_FCC_CLAUDE_BIN:-claude}
      - HARNESS_FCC_MCP_ENABLED=${HARNESS_FCC_MCP_ENABLED:-false}
      - HARNESS_FCC_SKIP_PERMISSIONS=${HARNESS_FCC_SKIP_PERMISSIONS:-true}
      - HARNESS_FCC_MAX_CONTEXT_TOKENS=${HARNESS_FCC_MAX_CONTEXT_TOKENS:-65536}
      - HARNESS_FCC_FILE_READ_MAX_TOKENS=${HARNESS_FCC_FILE_READ_MAX_TOKENS:-8192}
      - HARNESS_FCC_AUTOCOMPACT_PCT_OVERRIDE=${HARNESS_FCC_AUTOCOMPACT_PCT_OVERRIDE:-70}
      - HARNESS_FCC_CONTEXT_PRESSURE_PCT=${HARNESS_FCC_CONTEXT_PRESSURE_PCT:-70}
      - ORION_FCC_MCP_TOOL_RESULT_MAX_CHARS=${ORION_FCC_MCP_TOOL_RESULT_MAX_CHARS:-12000}
      - HARNESS_AITOWN_ENABLED=${HARNESS_AITOWN_ENABLED:-false}
      - HARNESS_FCC_GITNEXUS_ENABLED=${HARNESS_FCC_GITNEXUS_ENABLED:-false}
      - HARNESS_FCC_CONTEXT_MODE_ENABLED=${HARNESS_FCC_CONTEXT_MODE_ENABLED:-false}
      - HARNESS_FCC_CONTEXT_MODE_DIR=${HARNESS_FCC_CONTEXT_MODE_DIR:-/var/lib/orion/context-mode}
      - HARNESS_FCC_CONTEXT_MODE_HOOKS_ENABLED=${HARNESS_FCC_CONTEXT_MODE_HOOKS_ENABLED:-false}
    networks:
      - app-net
    ports:
      - "${HARNESS_GOVERNOR_PORT:-7156}:7156"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7156/health"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-net:
    external: true

volumes:
  harness-context-mode:
  harness-claude-config:
