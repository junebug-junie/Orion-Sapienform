schema_version: substrate_policy.v1
policy_id: substrate_policy.v1

autonomy:
  default_tier: observe_only
  max_tier_without_operator: read_only
  allow_execution_without_operator: false

thresholds:
  approve_read_only_max_risk: 0.15
  defer_above_risk: 0.60
  reject_above_risk: 0.85
  require_review_above_risk: 0.20
  require_review_below_reversibility: 0.50
  require_review_below_confidence: 0.50

proposal_kind_rules:
  observe:
    allowed_scope: inspect_only
    default_decision: approved_read_only
    max_autonomy_tier: read_only

  inspect:
    allowed_scope: inspect_only
    default_decision: approved_read_only
    max_autonomy_tier: read_only

  summarize:
    allowed_scope: summarize_only
    default_decision: approved_read_only
    max_autonomy_tier: read_only

  # 2026-08-12: the first MUTATING kind. Without a rule here `kind_rule()`
  # returns None and the evaluator defaults to `deferred`, so this had to exist
  # for the route to be reachable at all -- found by a gating test, not by
  # reading the config.
  #
  # This first shipped as `default_decision: approved_read_only`, with a comment
  # here explaining that the name "is about which DISPATCH LANE the decision
  # takes, not a claim that the action reads nothing." That comment was a
  # documented lie: the persisted decision record for deleting ~142 GB said
  # `approved_read_only` with reason `read_only_low_risk`, and
  # orion/consolidation/motif.py counts exactly that value to detect a
  # "read_only_policy_loop". A note explaining that a stored value is false does
  # not make it true. `approved_maintenance` is now its own decision literal.
  #
  # `mutating: true` is what stops orion/policy/rules.py's
  # is_read_only_candidate() from classifying this kind by its `proposed_effect`
  # (`preserve_stability`, which IS in read_only_effects below).
  #
  # What keeps the action from firing is unchanged and lives elsewhere:
  # mode.allow_mutating_dispatch, the maintenance_bounded scope gate in
  # orion/execution_dispatch/builder.py, and the skill's own measured
  # disk/reclaimable check.
  maintain:
    allowed_scope: maintenance_bounded
    default_decision: approved_maintenance
    max_autonomy_tier: maintenance_bounded
    mutating: true
    # 2026-08-12, Juniper's explicit direction after measuring the live
    # behaviour: confidence_score on this kind swings 0.416-0.999 tick to
    # tick on the same host state (25 real prune proposals over 3h), so the
    # 0.50 review threshold was flipping the same action between
    # auto-approved and human-review at random -- a coin flip, not a safety
    # judgement. Every other review trigger still applies to this kind.
    # Safety here comes from reversibility 1.0, risk 0.12, and the skill's
    # own measured disk >= 75% AND >= 40 GB re-check against the real host.
    confidence_gates_review: false

  stabilize:
    allowed_scope: prepare_only
    default_decision: requires_operator_review
    max_autonomy_tier: operator_review

  defer:
    allowed_scope: none
    default_decision: deferred
    max_autonomy_tier: observe_only

  request_policy_review:
    allowed_scope: operator_review_required
    default_decision: requires_operator_review
    max_autonomy_tier: operator_review

  prepare_action:
    allowed_scope: prepare_only
    default_decision: requires_operator_review
    max_autonomy_tier: operator_review

hard_blocks:
  - cortex_exec_direct_call
  - external_side_effect
  - settings_mutation
  - file_write
  - network_call
  - operator_notification
  - service_restart
  - restart_bus
  - purge_stream
  - replay_stream
  - stream_replay
  - stream_purge
  - change_catalog
  - change_bus_config
  - catalog_write
  - destructive_action

read_only_effects:
  - increase_observability
  - preserve_stability
  - increase_coherence
  - no_effect
