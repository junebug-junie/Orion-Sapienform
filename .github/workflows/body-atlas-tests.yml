name: body-atlas-tests

on:
  pull_request:
    paths:
      - "orion/body_atlas/**"
      - ".github/workflows/body-atlas-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/body_atlas/**"
      - ".github/workflows/body-atlas-tests.yml"

jobs:
  body-atlas:
    name: Body atlas — tests + organ structure eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install "pydantic>=2,<3" pyyaml pytest
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q orion/body_atlas/tests
      - name: Organ structure eval (frozen real bus graph)
        run: python orion/body_atlas/evals/run_organ_structure_eval.py
