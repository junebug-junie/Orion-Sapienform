description: "Analyze an image and persist events to memory (Host -> Window -> Council -> Scribe)."
name: perceive_vision_memory
steps:
  - step: call_host
    service: vision.host
    method: request
    payload:
      task_type: retina_fast
      request: "{{ input }}"
    result_key: host_result

  - step: call_window
    service: vision.window
    method: request
    payload:
      artifact: "{{ host_result.artifact }}"
    result_key: window_result

  - step: call_council
    service: vision.council
    method: request
    payload:
      window: "{{ window_result.window }}"
    result_key: council_result

  - step: call_scribe
    service: vision.scribe
    method: request
    payload:
      events: "{{ council_result.events }}"
    result_key: scribe_result

output_template: "perceive_vision_memory.j2"

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: autonomic
  lanes: []
  deferrable_window_s: 0
