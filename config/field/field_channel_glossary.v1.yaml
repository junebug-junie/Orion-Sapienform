# Structured index of FieldStateV1's 38 raw digester channels (originally 35 --
# 29 NODE_CHANNELS + 8 CAPABILITY_CHANNELS in services/orion-field-digester/
# app/tensor/channels.py, overlapping on stream_backlog_pressure/
# contract_pressure -- plus power_pressure/disk_capacity_pressure/
# fan_pressure added 2026-07-25, this header not updated at the time; fixed
# 2026-08-16 while touching this file for an unrelated addition below). 29 =
# 23 original + 5 FCC-motor channels added 2026-07-23 (harness_step_load,
# tool_failure_streak_pressure, avg_step_chars_pressure, compliance_deficit,
# turn_incompletion) + 1 FCC-motor channel added 2026-07-24
# (context_gathering_ratio; reasoning_load also gained a real motor-side
# magnitude the same day but is not a new channel). transport_pressure/bus_health
# renamed to stream_backlog_pressure/stream_backlog_health 2026-07-24 for scope
# honesty (see each channel's own entry below) -- total channel count unchanged,
# same two channels under new names.
#
# 2026-08-16: one additional entry, tension_deviation_pressure, is NOT one of
# the 38 raw channels above -- it is a derived scalar. See its own entry's
# comment for why it is listed here anyway.
#
# NOTE: this header's running count (39, as of 2026-08-16) was already stale
# before this comment -- tests/test_field_channel_glossary.py's own
# entry-count test puts the pre-2026-09-03 baseline at 48 (7 cabinet sensor
# channels added 2026-08-23, 2 cabinet ambient audio channels added
# 2026-08-24, neither reflected up here). Not fixed in this patch -- flagged
# so the next person doesn't recompute from this paragraph. Real baseline:
# 48 entries, plus 1 node-qualified prediction_error entry added
# 2026-09-03 (version 2, see below) -- 49 entries total in this file.
#
# 2026-09-25: stream_backlog_pressure, stream_backlog_health and
# delivery_confidence retired with no successor (fix/bus-observer-scope,
# docs/superpowers/specs/2026-09-25-bus-observer-stream-depth-retirement.md):
# 48 entries / 47 distinct channels after removal. contract_pressure is now the
# only node+capability overlap. (2026-10-07: no longer -- node-level
# contract_pressure retired and the capability-level one renamed to
# catalog_drift_pressure, which is now the only node+capability overlap.)
#
# This is the machine-readable companion to
# services/orion-field-digester/README.md's "Field channel glossary" section,
# which stays the prose reference (full mechanism detail, live-data
# investigation history). This file is the single structured source both
# that doc and Hub's Field Channel Glossary panel
# (services/orion-hub/scripts/field_channel_glossary_routes.py) read from, so
# the two can't independently drift the way the README's own frozen verdicts
# already have.
#
# Deliberately does NOT include a "verdict" field: liveness verdicts are
# computed LIVE from substrate_field_state by
# orion.field.channel_glossary.classify_channel_series(), not
# hand-maintained here -- a static verdict column is exactly what already
# went stale once (see the README's "Decay vs. injection-interval mismatch"
# section).
#
# 2026-09-03 (version 2): entries may optionally carry a `node:` key to
# disambiguate a channel name that means different things on different
# node:substrate.* domains (prediction_error being the motivating case --
# see its node-qualified entry below). A node-qualified entry is looked up
# first; absent one, resolution falls back to the bare channel entry, so
# every existing bare-entry consumer is unaffected. Entries also gained an
# optional `trend_source` field naming where a caller finds this node's real
# history, not just its latest value.
version: 2

categories:
  physical_substrate: "Physical substrate / embodiment -- pure hardware sensor readings, nothing cognitive."
  task_execution: "Task-execution domain -- what Orion is actively doing computationally right now and how well it's going."
  social_conversational: "Social / conversational domain -- the texture of the current chat interaction."
  infra_transport: "Infrastructure / transport workload -- the bus's own workload/health as infrastructure, not a compute resource."
  sensor_trust_liveness: "Sensor trust / liveness -- whether a source's other readings can be trusted right now, not what it's doing."
  synthesized_rollup: "Synthesized / aggregate rollups -- capability-level composites blending multiple node-level signals."
  self_monitoring: "Self-monitoring / introspection -- whether Orion's own internal model is consistent or accurate."

channels:
  - channel: availability
    level: [node]
    category: sensor_trust_liveness
    meaning: "How available/reachable a compute node currently is."

  - channel: staleness
    level: [node]
    category: sensor_trust_liveness
    meaning: "Whether a node's most recent biometrics sample is too old to trust."
    self_state_dimension: continuity_pressure

  - channel: cpu_pressure
    level: [node]
    category: physical_substrate
    meaning: "How loaded a node's CPU currently is."
    evidence_dimension: resource_pressure

  - channel: memory_pressure
    level: [node]
    category: physical_substrate
    meaning: "Node RAM pressure."
    evidence_dimension: resource_pressure

  - channel: gpu_pressure
    level: [node]
    category: physical_substrate
    meaning: "How loaded a node's GPU currently is."
    evidence_dimension: resource_pressure

  - channel: thermal_pressure
    level: [node]
    category: physical_substrate
    meaning: "Node thermal/temperature pressure."

  - channel: disk_pressure
    level: [node]
    category: physical_substrate
    meaning: "Node disk I/O pressure."
    evidence_dimension: resource_pressure

  - channel: power_pressure
    level: [node]
    category: physical_substrate
    meaning: "Node power-draw pressure. Real chassis-wide wattage (iLO/BMC RedFish) when that node has BMC credentials configured; falls back to a GPU-power-only estimate otherwise. 0.0 on a node with neither."
    evidence_dimension: resource_pressure

  - channel: disk_capacity_pressure
    level: [node]
    category: physical_substrate
    meaning: "How full a node's monitored filesystems are (percent used, max across configured mounts). Distinct from disk_pressure, which measures I/O throughput, not capacity."
    evidence_dimension: resource_pressure

  - channel: fan_pressure
    level: [node]
    category: physical_substrate
    meaning: "Node BMC fan speed (percent of max, max across fans). A response to thermal load, not an independent hazard on its own -- 0.0 on a node without iLO/BMC credentials configured."
    evidence_dimension: resource_pressure

  - channel: stability
    level: [node]
    category: physical_substrate
    meaning: "How STEADY a node's recent overall strain has been (low volatility/spike-rate), not how loaded it is right now. Opposite polarity from every other physical_substrate channel above -- higher = calmer. See orion.field.pressure.HIGHER_IS_BETTER_CHANNELS."
    evidence_dimension: coherence

  - channel: cabinet_climate_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet climate sensor activity (BME680 temperature/humidity/pressure band deviation). Distinct from node thermal_pressure -- measures the enclosure ambient, not CPU/GPU die heat."

  - channel: cabinet_particulate_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet particulate/air-quality sensor activity (PMS5003 band deviation)."

  - channel: cabinet_em_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet electromagnetic activity (AD8313 RF power band deviation)."

  - channel: cabinet_uv_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet UV sensor activity (GUVA-S12SD band deviation)."

  - channel: cabinet_vibration_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet vibration activity (MPU6050 accel deviation from 1g rest)."

  - channel: cabinet_proximity_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet proximity/presence sensor activity (VL53L0X band deviation)."

  - channel: cabinet_sensor_staleness
    level: [node]
    category: sensor_trust_liveness
    meaning: "Whether Athena's cabinet Arduino sensor bundle is too stale to trust. When elevated, cabinet activity channels are withheld upstream -- this channel carries the liveness signal instead."

  - channel: cabinet_ambient_audio_activity
    level: [node]
    category: physical_substrate
    meaning: "Athena cabinet ambient microphone activity (CMTECK USB RMS band deviation). Levels-only -- not speech content. Distinct from fan_pressure and thermal_pressure."

  - channel: cabinet_ambient_audio_staleness
    level: [node]
    category: sensor_trust_liveness
    meaning: "Whether Athena's ambient microphone snapshot is too stale to trust. When elevated, cabinet_ambient_audio_activity is withheld upstream -- this channel carries the liveness signal instead."

  - channel: expected_offline_suppression
    level: [node]
    category: sensor_trust_liveness
    meaning: "Signals a node is expected to be offline, so its absence shouldn't be read as a failure."

  - channel: cortex_exec_step_load
    level: [node]
    category: task_execution
    meaning: "Renamed from execution_load 2026-07-24 for scope honesty (the sibling of
      harness_step_load, cortex-exec-scoped instead of harness-governor-scoped) and
      lane-gated to exclude the harness_motor lane (whose cortex_exec_started_step_count
      is structurally always 0, since that counter only increments for
      orion-cortex-exec-sourced exec_step_started events) -- previously that always-0
      harness_motor-lane reading stomped the real cortex-exec-lane value via
      mode=\"replace\" on the shared node key. cortex-exec-only proxy for how much active
      execution work (agent runs, tool calls) is in flight on a node."
    evidence_dimension: execution_pressure

  - channel: execution_friction
    level: [node]
    category: task_execution
    meaning: "How much resistance (retries/backoff) execution is encountering on a node. Failed
      steps over started steps; deliberate GPU-pool sheds (gpu_pool_unavailable:shed:*) are
      excluded from the failed count since 2026-10-20."
    evidence_dimension: reliability_pressure

  - channel: reasoning_load
    level: [node]
    category: task_execution
    meaning: "How much active LLM-reasoning work a node is doing. Real magnitude
      since 2026-07-24: cortex-exec-sourced runs use reasoning_char_count (chars);
      harness-motor-sourced runs use reasoning_output_tokens (real provider-computed
      tokens from the FCC CLI's own result-event usage object, confirmed live). Falls
      back to a 0.35/0.05 presence-only flag only when neither magnitude is set."
    evidence_dimension: reasoning_pressure

  - channel: failure_pressure
    level: [node]
    category: task_execution
    meaning: "Recent execution failure rate/severity on a node. A step the GPU pool shed on
      purpose (gpu_pool_unavailable:shed:*, e.g. cabinet_hot) is not a failure and does not
      raise it (since 2026-10-20); pool deadline/outage refusals and every other error still do."
    evidence_dimension: reliability_pressure

  - channel: egress_confidence_deficit
    level: [node]
    category: task_execution
    meaning: "1 - confidence that an execution's output actually reached its destination."
    self_state_dimension: introspection_pressure

  - channel: harness_step_load
    level: [node]
    category: task_execution
    meaning: "FCC-motor-only step-load proxy for one unified Hub turn, split out of cortex_exec_step_load (renamed from execution_load 2026-07-24; blended cortex-exec + harness-governor step counts and hard-capped at 8 before the 2026-07-23 fix) -- a compute/thermal/power cost proxy for how much processing one turn actually cost on the expensive GPU node running the motor."

  - channel: tool_failure_streak_pressure
    level: [node]
    category: task_execution
    meaning: "Is the FCC motor stuck repeating the same tool failure (e.g. a denied permission) instead of adapting, for one turn."

  - channel: avg_step_chars_pressure
    level: [node]
    category: task_execution
    meaning: "Per-step verbosity of the FCC motor's tool output for one turn."

  - channel: compliance_deficit
    level: [node]
    category: task_execution
    meaning: "Did the FCC motor actually produce a compliant, delivered turn -- HarnessRunV1.compliance_verdict rank (completed/partial/failed/refused), distinct from failure_pressure since a turn can resolve partial with zero individual tool-step failures."

  - channel: turn_incompletion
    level: [node]
    category: task_execution
    meaning: "Did Hub fail to get a usable result back from the harness-governor RPC for this turn at all -- the one unified-turn failure mode where no governor-side grammar event exists. A distinct, worse severity than compliance_deficit's worst rank."

  - channel: context_gathering_ratio
    level: [node]
    category: task_execution
    meaning: "What fraction of one FCC-motor turn's classified tool calls were
      read-only research/context tools (Read, Grep, WebSearch, mcp__gitnexus__*,
      mcp__firecrawl__*, ...) vs action/mutation tools (Bash, Edit, Write, other MCP
      tools) -- composition, not volume (harness_step_load already covers volume). A
      fixed, deterministic tool-name allowlist, not a taxonomy: an unmatched tool
      name increments neither bucket, so 0.0 can mean either all-execution or
      zero-classified-calls."

  - channel: repair_pressure
    level: [node]
    category: social_conversational
    meaning: "How much conversational \"repair\" (corrections, re-explaining) is happening in chat."
    self_state_dimension: social_pressure

  - channel: conversation_load
    level: [node]
    category: social_conversational
    meaning: "How much active conversational load (turn volume/complexity) is occurring."
    self_state_dimension: social_pressure

  # 2026-10-07: node-level contract_pressure retired (the bus observer's
  # two-stream schema sample; 0.0 on 123,412 of 123,412 ticks). The
  # capability-level channel that kept that name was catalog drift all along
  # (node:athena catalog_drift_pressure x 0.85 -> capability:transport) and
  # was renamed to catalog_drift_pressure the same day (decision D3,
  # docs/superpowers/specs/2026-10-07-transport-lattice-names-and-contract.md).
  # The rename does not change any value: collect_field_channel_pressures()
  # max()-merges both levels by name and the node reading always wins.
  - channel: catalog_drift_pressure
    level: [node, capability]
    category: infra_transport
    meaning: "Share of bus channels seen live that are missing from the declared catalog (orion/bus/channels.yaml): the bus observer's census, undeclared_active_count / catalog_size, on node:athena (falls back to the observer's own configured-stream check when the census did not run). capability:transport carries 0.85 x the node:athena reading (it was named contract_pressure until 2026-10-07). Not a payload/schema check: OrionBusAsync.publish() validates every payload before sending."

  # observer_failure_pressure retired 2026-10-07 (#2534 decision 4): 0.0 on
  # 123,099 of 123,099 ticks; see services/orion-field-digester/app/tensor/
  # channels.py::RETIRED_NODE_CHANNELS.

  - channel: inference_failure_pressure
    level: [node]
    category: task_execution
    meaning: "Share of the calls the LLM gateway sent to this node's model backends that came back without an answer (timeout, refused connection, HTTP error), over the node's last 10 minutes of gateway windows: failures / max(calls, 10), counted only once 2+ failures are in that span (the RPC delivery bridge's rule), and the worse of the whole node and its worst single worker lane (2026-09-29; before that it was one 60 s window with no floor, so one timeout on a quiet minute read 1.0). Reported by the gateway itself; absent when the node got no calls in the span."

  - channel: write_failure_pressure
    level: [node]
    category: infra_transport
    meaning: "Storage writes that did not land, on node:substrate.storage_write: orion-sql-writer's own count of incoming writes that did not reach their Postgres table (schema/validation reject, constraint violation, serialization error, database unavailable or timed out, grammar queue shed), as the worst table family's failed / max(attempted, 10) over the last 10 minutes of writer windows, counted only once a family has 2+ failures. Idempotent duplicates are not failures; unrouted kinds are not counted. 0.0 means every counted write in the span landed; dropped (unmeasured) when no writer window has been reduced for 180 s."

  - channel: rpc_timeout_pressure
    level: [node]
    category: infra_transport
    meaning: "Caller-side 'asked and got no answer in time' on node:substrate.rpc_delivery: the worst bus request channel's share of rpc_request() calls that hit the caller's own deadline over the last 10 minutes, timeouts / max(calls, 10), counted only once a channel has 2+ timeouts in the window, summed across every service's rpc-health snapshots. A deadline fires on a lost message and on a slow callee alike; on live data it is mostly slow LLM or cortex work. 0.0 means every counted call was answered in time; dropped (unmeasured) when no reading has arrived for 120 s."

  - channel: vision_frame_staleness
    level: [node]
    category: sensor_trust_liveness
    meaning: "Can Orion see at all, on node:substrate.vision_organ: staleness of the freshest camera stream the vision frame router reports (0.0 while any camera's newest frame is under 15 s old, ramping to 1.0 at 60 s). A configured camera that has sent nothing since the router started is aged from that start, never read as calm. 1.0 when no camera delivers or the router stops reporting for 180 s (written on a clock). Per-camera status lives on the vision organ projection. Dropped (unmeasured) when no reading has arrived for 300 s."
    # Semantics (2026-10-10): the vision_organ node's health signal
    # (successor of the retired node:substrate.vision prediction_error,
    # services/orion-field-digester/app/tensor/channels.py RETIRED_PSEUDO_NODES).
    # orion/substrate/prediction_error.py:948-990 (grace 15 s, saturation
    # 60 s); expiry 300 s in services/orion-field-digester/app/digestion/decay.py.
    semantics:
      value_kind: level
      rest: "0.0 = at least one camera delivered a frame in the last 15 s."
      # rest_range live 2026-10-13: 41048 rows (24h to 2026-10-13, substrate_field_state node_vectors), 100% exact 0.0, max 0.0 (7d: 0 non-zero since the channel appeared 2026-10-10); the pinned-at-1.0 failure is outside
      rest_range: [0.0, 0.0]
      sparsity: per_tick
      absent_means: "dropped (unmeasured) after 300 s without a reading; 1.0 (not absent) when the router itself is silent for 180 s."

  - channel: vision_processing_failure_pressure
    level: [node]
    category: task_execution
    meaning: "Share of the frames the vision frame router handed to the vision host over the last 10 minutes that came back without a usable answer (timeout, invalid reply, ok=false), failures / max(attempts, 10), counted once 2+ failures are in the span; the worse of the pooled share and the worst single camera's. Absent when nothing was dispatched; dropped (unmeasured) when no reading has arrived for 300 s."
    # Semantics (2026-10-10): failures / max(attempts, 10), counted once 2+
    # failures fall in the 10-minute span (orion/substrate/vision_organ_loop/
    # reducer.py); expiry 300 s (field-digester digestion/decay.py).
    semantics:
      value_kind: level
      rest: "0.0 = every frame dispatched in the last 10 minutes came back usable, or fewer than 2 failed."
      # rest_range live 2026-10-13: 41048 rows (24h to 2026-10-13, substrate_field_state node_vectors), 100% exact 0.0, max 0.0 (7d: never non-zero since 2026-10-10)
      rest_range: [0.0, 0.0]
      sparsity: event_gated
      absent_means: "absent when nothing was dispatched; dropped (unmeasured) after 300 s without a reading."

  - channel: field_coherence_warning
    level: [node]
    category: self_monitoring
    meaning: "Per-node incoherence score -- fires when two reducers that should agree about a node's state disagree."

  - channel: prediction_error
    level: [node]
    category: self_monitoring
    meaning: "How much a recent prediction (from the prediction/surprise subsystem) missed reality."

  # The first node-qualified prediction_error entry (node:substrate.bus_synaptic,
  # added 2026-09-03, version 2) was removed 2026-11 with the node itself (PE
  # suite rebuild step 5: a lull-ending detector, not a forecast). A qualified
  # entry is looked up first by (node, channel); absent one, callers fall back
  # to the bare channel entry above.

  # ---------------------------------------------------------------------
  # Node-qualified prediction_error entries, added 2026-10-10 (spec
  # docs/superpowers/specs/2026-10-07-orion-self-calibration-design.md,
  # section B). Each records WHY the node reads what it reads: a sweep on
  # 2026-10-07 called seven of these "dead" because 70-97% of their history
  # is exact zeros, which is their design. Every claim below was checked
  # against producer code (cited per entry) and against
  # substrate_node_prediction_error_history over the 3 days to 2026-10-10.
  #
  # `producer:` is orion-substrate-runtime, which computes every one of
  # these (orion-field-digester only ingests the receipt).
  #
  # One of these never reaches FieldStateV1 node_vectors at all
  # (cabinet): it lives only on the FalkorDB substrate
  # node (`metadata.prediction_error`) and in
  # substrate_node_prediction_error_history. Its trend_source says so.
  #
  # There is deliberately NO node:substrate.vision_organ prediction_error
  # entry: that node carries vision_frame_staleness and
  # vision_processing_failure_pressure only
  # (orion/substrate/vision_organ_loop/reducer.py); see those entries.
  # ---------------------------------------------------------------------

  # node:substrate.harness_closure RETIRED 2026-11-11 (retire step 3,
  # docs/superpowers/specs/2026-11-08-prediction-error-suite-rebuild-design.md):
  # it was a fixed 0.65, never a measured size, and led 130 of 1,575 invoked
  # curiosity runs in the 7 days before. Producer removed; no entry, so every
  # glossary-gated reader treats a lingering node or history row as "not a
  # measurement". Successor: a turn-level self-bet (draft-time confidence
  # scored against the reflection verdict), not a substrate node.

  # orion/autonomy/cabinet_heat.py:176 cabinet_warming_error(): only when
  # the thermal state is 'elevated' (not 'hot', not 'unknown') AND the rise
  # over 900 s (:77) is >= 0.5 C (:76) -> clamp01(rise / 1.0 C); else 0.0.
  # Written by worker.py::_cabinet_heat_tick (:1417) every 30 s, FalkorDB
  # node only. Live: 97% exact zeros, max 1.0.
  - node: "node:substrate.cabinet"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: physical_substrate
    meaning: "ALARM, not a prediction error (PE suite rebuild 2026-11-13; orion.substrate.prediction_error_freshness.ALARM_NODE_IDS): cabinet is warming -- fires only while the cabinet thermal state is 'elevated' (never while 'hot') and the temperature rose at least 0.5 C in the last 15 minutes; value is rise/1.0 C, so 0.5-1.0 when it fires. FalkorDB node only; not in FieldStateV1 node_vectors."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:substrate.cabinet'"
    consumers:
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: trigger
      rest: "0.0 = not elevated, or elevated but not rising >= 0.5 C in 15 min. Mostly zero by design (97% live)."
      # rest_range live 2026-10-13: 1975 rows (substrate_node_prediction_error_history), 100% exact 0.0 over 24h; 98.4% over 7d, max 1.0
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "when the thermal reading is 'unknown' (older than the 300 s grace) the tick writes nothing and the node keeps its last value (worker.py:1434)."
      prompt_sites:
        - "orion.attention.self_readings:render_self_readings"

  # orion/substrate/street_attention.py street_gate() + held_reading(): the
  # salience (StreetEventV1.salience, producer-computed who x what x surprise)
  # of the strongest street event that passed the gate within
  # SUBSTRATE_STREET_ATTENTION_HOLD_SEC (90 s), else 0.0. Written by
  # services/orion-substrate-runtime/app/worker.py _street_attention_tick every
  # 30 s and on every gate pass. FalkorDB node only; the field digester's
  # staleness decay never touches it (not a FieldStateV1 node vector).
  - node: "node:substrate.street"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: self_monitoring
    meaning: "ALARM, not a prediction error (PE suite rebuild 2026-11-13; orion.substrate.prediction_error_freshness.ALARM_NODE_IDS): a street event passed the attention gate -- a doorbell ring (always), or a graded cross-camera handoff with p < 0.05 from a camera that is up, under the hourly cap. Value is the event's salience (ring 1.0), held 90 s, then 0.0. The outside world, not Orion's body."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:substrate.street'"
    consumers:
      - "orion.substrate.attention_broadcast:world_first_signals"
    semantics:
      value_kind: trigger
      rest: "0.0 = the street listener is up, a street camera delivered a frame recently, and no event passed the gate in the last 90 s. Written as a real 0.0 every tick, never decayed to it."
      # rest_range: no live data yet (2026-10-20, consumer ships before rings
      # reach the bus, PR #2816). By construction: 0.0 except <= 4 x 90 s per hour.
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "written every tick while measurable; the tick writes nothing while the street listener is not subscribed or no street camera (walkway, doorbell) delivered a frame within 600 s, so the reading ages and attention reads it absent after 180 s."
  # orion/regulation/strain_news.py strain_news(): 1.0 on a strain news event
  # (onset / escalation / reminder) derived from Redis orion:regulation:latest
  # (orion/regulation/arousal.py classify_arousal), budgeted <= 8 per local day,
  # >= 30 min apart. Written by worker.py::_strain_attention_tick every 30 s
  # (0.0 when no event, nothing while the regulation reading is unknown).
  # FalkorDB node only. Spec docs/superpowers/specs/2026-10-20-strain-loop-design.md.
  - node: "node:substrate.strain"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: physical_substrate
    meaning: "NEWS, not a prediction error (PE suite rebuild 2026-11-13; orion.substrate.prediction_error_freshness.ALARM_NODE_IDS): strain news -- fires 1.0 when Orion's regulation turns strained (onset), when a new strain cause joins the episode or the cabinet crosses critical 34 C (escalation), and as reminders at 30 min, 1 h, 2 h, 4 h, 8 h, then every 8 h while it lasts; at most 8 per local day, 30 min apart. The strain level itself never competes. FalkorDB node only; not in FieldStateV1 node_vectors."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:substrate.strain'"
    consumers:
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: trigger
      rest: "0.0 = no strain news this tick (not strained, or strained with no event due). The strain level is not the value: a 54 h strain reads 0.0 between its news events."
      # rest_range: by construction (strain_news budget <= 8 events/day of ~2880 ticks, so
      # >= 99.7% exact 0.0). New node 2026-10-20: no live rows yet; replay
      # scripts/analysis/replay_strain_news.py over 10-13..10-20 history.
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "only written as 1.0 at a strain news event, then carried unwritten for attention's 300 s orienting window; every other tick with a known regulation reading writes 0.0. An unknown, stale or missing regulation reading writes nothing and the node keeps its last value."
      prompt_sites:
        - "orion.attention.self_readings:render_self_readings"

  # Forecast surprise (2026-11-11, PE suite rebuild spec build item 3,
  # docs/superpowers/specs/2026-11-08-prediction-error-suite-rebuild-design.md).
  # orion-prediction scores each office.temp_c forecast and publishes the gated
  # outcome as prediction.surprise.v1 (services/orion-prediction/app/surprise.py
  # event_gate: champion, issued by a non-baseline model, adaptive range, real
  # actual). services/orion-substrate-runtime/app/worker.py
  # _process_prediction_surprise folds it with orion/substrate/prediction_surprise.py:
  # summed excess over the last 30 min of independent origins, divided by its
  # calm spread (theory: Var = 2 - 2P(1 + ln 1/P) - (1-P)^2, P = 0.05), stored
  # as clip(z / 3, 0, 1). FalkorDB node only; not a FieldStateV1 node vector, so
  # the field digester's decay/expiry never touches it.
  - node: "node:prediction.room"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: physical_substrate
    meaning: "How much the office's temperature is surprising Orion's own forecast: the last 30 minutes of scored 5- and 15-minute forecast outcomes (office.temp_c), each as excess surprise (-ln p minus its calm point 0.95), summed and divided by the calm spread (a z-score), 3 sigma = 1.0. 0 = the temperature did what the forecast expected."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:prediction.room'"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: surprise_excess
      rest: "0.0 = the forecast's misses are no bigger than a calibrated forecaster's (z <= 0). Reachable by theory (calm z ~ N(0, 1): exact 0 half the time) and live: 56-58% exact 0.0 in a replay of 72 h of real outcomes (2026-11-11, evals/run_surprise_node_replay_eval.py)."
      # rest_range: calm z within +-1.65 sigma -> stored value in [0, 0.55]. Live replay
      # 2026-11-11 (72 h, calm-check-passing day, one outcome per target bucket): room p50 0.0
      # p90 0.516, body p50 0.0 p90 0.520; consecutive 5-min misses correlate ~0.12, so the live
      # z sd is 1.0-1.2 and 0.55 is crossed on 8-10 % of writes, not 5 %.
      rest_range: [0.0, 0.55]
      sparsity: per_tick
      absent_means: "written once per gated forecast outcome (about every 5 min). Nothing is written when no outcome passes the gate (prediction service down, PREDICTION_SURPRISE_EVENTS_ENABLED or SUBSTRATE_PREDICTION_SURPRISE_NODES_ENABLED off, range not adaptive, issued by a baseline, missing bucket): the node keeps its last value (current for up to 1800 s, longer than its 30 min window), then every reader treats it as stale, never as calm."
      prompt_sites:
        - "orion.attention.self_readings:render_self_readings"

