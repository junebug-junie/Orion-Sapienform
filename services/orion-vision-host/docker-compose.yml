services:
  vision-host:
    build:
      context: ../..
      dockerfile: services/orion-vision-host/Dockerfile
    container_name: ${PROJECT}-vision-host
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Literal, not ${CUDA_DEVICE_ORDER}-interpolated: this must win over any
      # stray CUDA_DEVICE_ORDER a future .env adds, since compose `environment:`
      # entries take precedence over both `env_file:` and the Dockerfile's own
      # ENV default. See the Dockerfile's own comment on this line for why it
      # matters -- CUDA_VISIBLE_DEVICES=<nvidia-smi index> is meaningless
      # without it on a multi-GPU host.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID

      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_NAME=${NODE_NAME:-athena}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}

      - CHANNEL_VISIONHOST_INTAKE=${CHANNEL_VISIONHOST_INTAKE}
      - CHANNEL_VISIONHOST_REPLY_PREFIX=${CHANNEL_VISIONHOST_REPLY_PREFIX}
      - CHANNEL_VISIONHOST_PUB=${CHANNEL_VISIONHOST_PUB}

      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR}
      - HF_HOME=${HF_HOME}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE}

      - VISION_PROFILES_PATH=${VISION_PROFILES_PATH}
      - VISION_ENABLED_PROFILES=${VISION_ENABLED_PROFILES}

      - VISION_VLM_MODEL_ID=${VISION_VLM_MODEL_ID}
      - VISION_VLM_MAX_TOKENS=${VISION_VLM_MAX_TOKENS}
      - VISION_VLM_TEMPERATURE=${VISION_VLM_TEMPERATURE}

      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}
      - VISION_DEVICE_STRATEGY=${VISION_DEVICE_STRATEGY}
      - VISION_DEFAULT_DEVICE=${VISION_DEFAULT_DEVICE}
      - VISION_DEVICES=${VISION_DEVICES}
      - VISION_PICK_GPU_METRIC=${VISION_PICK_GPU_METRIC}

      - VISION_DTYPE=${VISION_DTYPE}
      - VISION_TIMEOUT_S=${VISION_TIMEOUT_S}

      - VISION_MAX_INFLIGHT=${VISION_MAX_INFLIGHT}
      - VISION_MAX_INFLIGHT_PER_GPU=${VISION_MAX_INFLIGHT_PER_GPU}
      - VISION_QUEUE_WHEN_BUSY=${VISION_QUEUE_WHEN_BUSY}
      - VISION_MAX_QUEUE=${VISION_MAX_QUEUE}

      - VISION_VRAM_RESERVE_MB=${VISION_VRAM_RESERVE_MB}
      - VISION_VRAM_SOFT_FLOOR_MB=${VISION_VRAM_SOFT_FLOOR_MB}
      - VISION_VRAM_HARD_FLOOR_MB=${VISION_VRAM_HARD_FLOOR_MB}

      - TORCH_CUDA_ALLOC_CONF=${TORCH_CUDA_ALLOC_CONF}

      - VISION_PERCEPT_STORE_URL=${VISION_PERCEPT_STORE_URL:-}
      - VISION_PERCEPT_STORE_TOKEN=${VISION_PERCEPT_STORE_TOKEN:-}
      - VISION_PERCEPT_TIMEOUT_SEC=${VISION_PERCEPT_TIMEOUT_SEC:-10.0}

      - VISION_LIVENESS_ALERT_ENABLED=${VISION_LIVENESS_ALERT_ENABLED:-true}
      - VISION_LIVENESS_WINDOW_SEC=${VISION_LIVENESS_WINDOW_SEC:-300}
      - VISION_LIVENESS_MIN_SAMPLES=${VISION_LIVENESS_MIN_SAMPLES:-10}
      - VISION_LIVENESS_ARM_FAIL_RATE=${VISION_LIVENESS_ARM_FAIL_RATE:-0.8}
      - VISION_LIVENESS_CLEAR_FAIL_RATE=${VISION_LIVENESS_CLEAR_FAIL_RATE:-0.2}
      - VISION_LIVENESS_SUSTAIN_SEC=${VISION_LIVENESS_SUSTAIN_SEC:-180}
      - VISION_LIVENESS_COOLDOWN_SEC=${VISION_LIVENESS_COOLDOWN_SEC:-3600}
      - VISION_LIVENESS_STATE_PATH=${VISION_LIVENESS_STATE_PATH:-}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN}

      - IDENTITY_GALLERY_DIR=${IDENTITY_GALLERY_DIR:-/mnt/telemetry/orion-vision-host/identity_gallery}
      - IDENTITY_ENROLLED_SUBJECT=${IDENTITY_ENROLLED_SUBJECT:-juniper}

    volumes:
      - /mnt/telemetry/orion-vision-host:/mnt/telemetry/orion-vision-host
      - /mnt/telemetry/models/vision:/mnt/telemetry/models/vision
      - /mnt/telemetry/models/hf:/mnt/telemetry/models/hf
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames:ro

    ports:
      - "${HOST_PORT}:6600"

    gpus: all

    networks:
      - app-net

networks:
  app-net:
    external: true
