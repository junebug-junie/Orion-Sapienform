services:
  durable-runs:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-durable-runs/Dockerfile
    container_name: ${PROJECT}-durable-runs
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${DURABLE_RUNS_PORT:-8124}:8121"
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-durable-runs}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - RPC_HEALTH_PUBLISH_ENABLED=${RPC_HEALTH_PUBLISH_ENABLED:-true}
      - RPC_HEALTH_PUBLISH_INTERVAL_SEC=${RPC_HEALTH_PUBLISH_INTERVAL_SEC:-30}
      - RPC_HEALTH_CHANNEL_LATENCY_ENABLED=${RPC_HEALTH_CHANNEL_LATENCY_ENABLED:-true}
      - POSTGRES_URI=${POSTGRES_URI}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DURABLE_RUNS_ENABLED=${DURABLE_RUNS_ENABLED:-true}
      - DURABLE_RUNS_RESUME_ON_BOOT=${DURABLE_RUNS_RESUME_ON_BOOT:-true}
      - DURABLE_RUNS_RESUME_SWEEP_SEC=${DURABLE_RUNS_RESUME_SWEEP_SEC:-120.0}
      - DURABLE_RUNS_MAX_AGE_HOURS=${DURABLE_RUNS_MAX_AGE_HOURS:-24.0}
      - DURABLE_RUNS_TURN_RPC_TIMEOUT_SEC=${DURABLE_RUNS_TURN_RPC_TIMEOUT_SEC:-8940.0}
      - DURABLE_RUNS_GRAPH_HOST=${DURABLE_RUNS_GRAPH_HOST:-}
      - DURABLE_RUNS_GRAPH_PORT=${DURABLE_RUNS_GRAPH_PORT:-6379}
      - DURABLE_RUNS_GRAPH_OWN=${DURABLE_RUNS_GRAPH_OWN:-orion_worldview}

      - DURABLE_RUNS_ADMISSION_ENABLED=${DURABLE_RUNS_ADMISSION_ENABLED:-false}
      - DURABLE_RUNS_ADMISSION_TICK_SEC=${DURABLE_RUNS_ADMISSION_TICK_SEC:-5.0}
      - DURABLE_RUNS_LEASE_HEARTBEAT_SEC=${DURABLE_RUNS_LEASE_HEARTBEAT_SEC:-15.0}
      - DURABLE_RUNS_HOLD_STATUS_POLL_SEC=${DURABLE_RUNS_HOLD_STATUS_POLL_SEC:-60.0}
      - DURABLE_RUNS_OUTREACH_HOLD_MAX_SEC=${DURABLE_RUNS_OUTREACH_HOLD_MAX_SEC:-1800.0}
      - DURABLE_RUNS_POOL_RETRY_BASE_SEC=${DURABLE_RUNS_POOL_RETRY_BASE_SEC:-15.0}
      - DURABLE_RUNS_POOL_RETRY_MAX_SEC=${DURABLE_RUNS_POOL_RETRY_MAX_SEC:-300.0}
      - DURABLE_RUNS_RETRY_MAX_ATTEMPTS=${DURABLE_RUNS_RETRY_MAX_ATTEMPTS:-3}
      - DURABLE_RUNS_HOLD_MAX_TAKEBACKS=${DURABLE_RUNS_HOLD_MAX_TAKEBACKS:-12}
      - DURABLE_RUNS_RETRY_BASE_SEC=${DURABLE_RUNS_RETRY_BASE_SEC:-30.0}
      - DURABLE_RUNS_RETRY_MAX_SEC=${DURABLE_RUNS_RETRY_MAX_SEC:-300.0}
      - DURABLE_RUNS_RESUME_MAX_FAILURES=${DURABLE_RUNS_RESUME_MAX_FAILURES:-10}
      - DURABLE_RUNS_RESUME_MIN_FAILURE_SPAN_SEC=${DURABLE_RUNS_RESUME_MIN_FAILURE_SPAN_SEC:-600}
      - CORTEX_REQUEST_CHANNEL=${CORTEX_REQUEST_CHANNEL:-orion:cortex:request}
      - DURABLE_RUNS_REFLECT_LLM_CALL_TIMEOUT_SEC=${DURABLE_RUNS_REFLECT_LLM_CALL_TIMEOUT_SEC:-1500.0}
      - DURABLE_RUNS_REVERIE_VISUAL_STEP_TIMEOUT_SEC=${DURABLE_RUNS_REVERIE_VISUAL_STEP_TIMEOUT_SEC:-600.0}
      - DREAM_CARRY_FINISH_GRACE_SEC=${DREAM_CARRY_FINISH_GRACE_SEC:-1800}
      - DREAM_CARRY_CHILD_MAX_ATTEMPTS=${DREAM_CARRY_CHILD_MAX_ATTEMPTS:-3}
      - DREAM_CARRY_CHILD_MIN_WINDOW_SEC=${DREAM_CARRY_CHILD_MIN_WINDOW_SEC:-900}
      - DREAM_CARRY_CHILD_WINDOW_SEC=${DREAM_CARRY_CHILD_WINDOW_SEC:-2400}
      - DREAM_CARRY_CHILD_RETRY_GAP_SEC=${DREAM_CARRY_CHILD_RETRY_GAP_SEC:-900}
      - MEMORY_EPISODE_WRITER_ENABLED=${MEMORY_EPISODE_WRITER_ENABLED:-true}
      - CHANNEL_MEMORY_EPISODE_CLOSED=${CHANNEL_MEMORY_EPISODE_CLOSED:-orion:memory:episode:closed}
      - MEMORY_EPISODE_DISTILL_ROUTE=${MEMORY_EPISODE_DISTILL_ROUTE:-memory_distill}
      - MEMORY_EPISODE_DISTILL_TIMEOUT_SEC=${MEMORY_EPISODE_DISTILL_TIMEOUT_SEC:-600.0}
      - MEMORY_EPISODE_DISTILL_MAX_TOKENS=${MEMORY_EPISODE_DISTILL_MAX_TOKENS:-4096}
      - MEMORY_EPISODE_DISTILL_DEADLINE_HOURS=${MEMORY_EPISODE_DISTILL_DEADLINE_HOURS:-20.0}
      - CHANNEL_LLM_INTAKE=${CHANNEL_LLM_INTAKE:-orion:exec:request:LLMGatewayService}
      - MEMORY_EPISODE_RECONCILE_INTERVAL_SEC=${MEMORY_EPISODE_RECONCILE_INTERVAL_SEC:-900.0}
      - MEMORY_EPISODE_DISTILL_MAX_ATTEMPTS=${MEMORY_EPISODE_DISTILL_MAX_ATTEMPTS:-3}
      - MEMORY_REFERENTS_ENABLED=${MEMORY_REFERENTS_ENABLED:-true}
      - MEMORY_ALIAS_GROUNDING_AUTO_ACCEPT=${MEMORY_ALIAS_GROUNDING_AUTO_ACCEPT:-true}
      - MEMORY_COOCCURRENCE_AUTO_ACCEPT=${MEMORY_COOCCURRENCE_AUTO_ACCEPT:-true}
      - SITUATION_GRAPH_ENABLED=${SITUATION_GRAPH_ENABLED:-true}
      - SITUATION_TICK_SEC=${SITUATION_TICK_SEC:-900.0}
      - SITUATION_DEFAULT_TTL_HOURS=${SITUATION_DEFAULT_TTL_HOURS:-48.0}
      - SITUATION_PRIME_TIMEOUT_SEC=${SITUATION_PRIME_TIMEOUT_SEC:-0.4}
      - SITUATION_RETENTION_DAYS=${SITUATION_RETENTION_DAYS:-2}
      - SITUATION_REDIS_TTL_SEC=${SITUATION_REDIS_TTL_SEC:-604800}
      - CHANNEL_CHAT_HISTORY_TURN=${CHANNEL_CHAT_HISTORY_TURN:-orion:chat:history:turn}
      - SITUATION_SIGHTING_HOLD_HOURS=${SITUATION_SIGHTING_HOLD_HOURS:-2.0}
      - CHANNEL_IDENTITY_SIGHTING=${CHANNEL_IDENTITY_SIGHTING:-orion:vision:identity:sighting}
      - TEMPORAL_SELF_ENABLED=${TEMPORAL_SELF_ENABLED:-true}
      - TEMPORAL_SELF_TICK_SEC=${TEMPORAL_SELF_TICK_SEC:-120.0}
      - TEMPORAL_SELF_RETENTION_DAYS=${TEMPORAL_SELF_RETENTION_DAYS:-2}
      - ORION_SITUATION_TIMEZONE=${ORION_SITUATION_TIMEZONE:-America/Denver}
      - ORION_REGULATION_AROUSAL_ENABLED=${ORION_REGULATION_AROUSAL_ENABLED:-true}
      - DREAM_IDLE_MINUTES=${DREAM_IDLE_MINUTES:-45}
      - ORION_REGULATION_STRAINED_GPU_QUEUE_MIN=${ORION_REGULATION_STRAINED_GPU_QUEUE_MIN:-2}
      - ORION_REGULATION_STRAINED_GPU_QUEUE_SEC=${ORION_REGULATION_STRAINED_GPU_QUEUE_SEC:-300.0}
      - ORION_REGULATION_STRAINED_CLEAR_SEC=${ORION_REGULATION_STRAINED_CLEAR_SEC:-600.0}
      - ORION_REGULATION_REDIS_TTL_SEC=${ORION_REGULATION_REDIS_TTL_SEC:-360}

networks:
  app-net:
    external: true
