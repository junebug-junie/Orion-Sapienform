name: Attend-to-act loop (shed_background_gpu, the cooling world act)
on:
  pull_request:
    paths:
      - 'orion/autonomy/cabinet_heat.py'
      - 'orion/autonomy/self_shed.py'
      - 'orion/autonomy/shed_act.py'
      - 'orion/autonomy/shed_settlement.py'
      - 'orion/physiology/event_wants.py'
      - 'orion/physiology/binding.py'
      - 'config/physiology/families.yaml'
      - 'orion/autonomy/world_episodes.py'
      - 'orion/autonomy/attend_act_loop.py'
      - 'orion/autonomy/agency_episode*.py'
      - 'orion/autonomy/evals/run_attend_act_loop_eval.py'
      - 'orion/autonomy/evals/fixtures/attend_act_loop_chain.json'
      - 'orion/hardware_watch/rules.py'
      - 'orion/autonomy/world_settlement.py'
      - 'orion/autonomy/world_settlement_store.py'
      - 'services/orion-sql-writer/app/world_settlement_loop.py'
      - 'services/orion-sql-writer/tests/test_world_settlement_pass.py'
      - 'orion/schemas/action_prediction.py'
      - 'orion/schemas/attention_salience.py'
      - 'services/orion-substrate-runtime/app/worker.py'
      - 'services/orion-substrate-runtime/tests/test_cabinet_heat_tick.py'
      - 'scripts/analysis/replay_attention_eligibility.py'
      - 'tests/test_cooling_act_rules.py'
      - 'tests/test_world_settlement_scoring.py'
      - 'tests/test_field_pressure_dimensions.py'
      - 'orion/field/pressure_dimensions.py'
      - '.github/workflows/attend-act-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-latest
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio psycopg2-binary
      # 2026-11-05 (ladder retirement PR 5): the act's trigger is the want market (orion-durable-runs
      # app/cooling_act.py, tested in orion-durable-runs-tests.yml). Here: the pure rules and the scorer.
      - name: Signal, eligibility, the event want, binding rule, admission, draw, settle-time scoring
        run: >-
          python -m pytest -q tests/test_cooling_act_rules.py tests/test_world_settlement_scoring.py
          tests/test_field_pressure_dimensions.py
      # One process per service: each service's tests import a top-level `app` package.
      - name: sql-writer (settle-time world scoring pass; moved from the retired feedback runtime 2026-11-04)
        run: |
          pip install -r services/orion-sql-writer/requirements.txt
          cd services/orion-sql-writer && PYTHONPATH=../..:. python -m pytest -q tests/test_world_settlement_pass.py
      - name: Agency episode audit (attention_winner + loop_outcome links)
        run: python -m pytest -q orion/autonomy/tests/test_agency_episode.py orion/autonomy/tests/test_agency_episode_reader.py orion/autonomy/tests/test_agency_episode_world_links.py
      - name: Attend-act loop eval (fixture mode)
        run: python orion/autonomy/evals/run_attend_act_loop_eval.py
      - name: Agency episode eval (unchanged report shape)
        run: python orion/autonomy/evals/run_agency_episode_eval.py
