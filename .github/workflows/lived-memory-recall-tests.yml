# Memory recall step 1 (issue #3533) and the mesh-edge leak check (issue #3409). Step 2 (issue
# #3534): query rewrite and link-following; the degraded exact-word fallback (issue #3573).
# Step 3 (issue #3535): `orion.dig know` endpoint; per-call lived status + trace (issue #3628).
# Short-message gate (issue #3613): known entities and the short-message rewrite.
# Lived-memory recall: exact-word + meaning candidates, live gating, local rerank, the bar, ranking,
# render, the worker seam, and the committed fixture replay eval. Mesh edge: the shared guard (verbatim
# + 8-word shingle, issue #3554), the FCC gh PreToolUse hook, Hub's PR commenter, outbound email, and
# Claude consult prompts (issue #3541). No DB, bus or model (fakes only).

name: lived-memory-recall-tests

on:
  pull_request:
    paths:
      - "orion/memory/lived_memory.py"
      - "orion/memory/mesh_edge.py"
      - "orion/memory/tests/test_mesh_edge.py"
      - "orion/memory/vector_collection_policy.py"
      - "orion/fcc/mesh_edge_hook.py"
      - "orion/fcc/tests/test_mesh_edge_hook.py"
      - "orion/harness/fcc_motor.py"
      - "orion/harness/tests/test_fcc_motor_repeat_failure_breaker.py"
      - "orion/notify/transport.py"
      - "orion/introspect/semantic_index.py"
      - "services/orion-recall/app/lived_memory.py"
      - "services/orion-recall/app/lived_rewrite.py"
      - "services/orion-recall/app/lived_links.py"
      - "services/orion-recall/app/lived_entities.py"
      - "services/orion-recall/app/worker.py"
      - "services/orion-recall/app/main.py"
      - "services/orion-recall/app/settings.py"
      - "services/orion-recall/tests/test_lived_memory.py"
      - "services/orion-recall/tests/test_lived_memory_step2.py"
      - "services/orion-recall/tests/test_lived_know_and_status.py"
      - "services/orion-recall/tests/test_recall_telemetry_persist.py"
      - "services/orion-recall/tests/test_lived_short_gate.py"
      - "services/orion-recall/app/http_models.py"
      - "services/orion-recall/sql/recall_telemetry.sql"
      - "services/orion-recall/evals/**"
      - "services/orion-cortex-exec/app/pcr_chat_memory.py"
      - "services/orion-cortex-exec/app/settings.py"
      - "orion/memory/recall_skip_gate.py"
      - "orion/memory/retrieval_intent.py"
      - "services/orion-vector-host/app/**"
      - "services/orion-vector-host/tests/**"
      - "services/orion-hub/scripts/session_roundup_loop.py"
      - "services/orion-hub/scripts/consult_loop.py"
      - "services/orion-hub/tests/test_consult_loop.py"
      - "orion/memory/evals/**"
      - "services/orion-notify/tests/test_email_mesh_edge.py"
      - ".github/workflows/lived-memory-recall-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/memory/lived_memory.py"
      - "orion/memory/mesh_edge.py"
      - "orion/fcc/mesh_edge_hook.py"
      - "orion/harness/fcc_motor.py"
      - "orion/harness/tests/test_fcc_motor_repeat_failure_breaker.py"
      - "orion/notify/transport.py"
      - "services/orion-recall/app/**"
      - "services/orion-recall/evals/**"
      - "services/orion-cortex-exec/app/pcr_chat_memory.py"
      - "services/orion-cortex-exec/app/settings.py"
      - "orion/memory/recall_skip_gate.py"
      - "orion/memory/retrieval_intent.py"
      - "services/orion-vector-host/app/**"
      - "services/orion-hub/scripts/session_roundup_loop.py"
      - "services/orion-hub/scripts/consult_loop.py"
      - "orion/memory/evals/**"
      - ".github/workflows/lived-memory-recall-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-recall/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install "pydantic-settings>=2.2" "fastapi>=0.110" "loguru>=0.7"
      - name: Mesh-edge guard, FCC gh hook, outbound email
        run: |
          python -m pytest -q -p no:cacheprovider orion/memory/tests/test_mesh_edge.py \
            orion/fcc/tests/test_mesh_edge_hook.py services/orion-notify/tests/test_email_mesh_edge.py \
            tests/test_vector_collection_policy.py
      - name: FCC turn argv (mesh-edge hook always installed)
        run: |
          python -m pytest -q -p no:cacheprovider orion/harness/tests/test_task_anchor.py \
            orion/harness/tests/test_session_resume.py orion/harness/tests/test_focus_anchor.py \
            orion/harness/tests/test_fcc_reading_undeclared_tool.py \
            orion/harness/tests/test_fcc_motor_repeat_failure_breaker.py
      - name: Lived-memory recall + fixture replay eval
        working-directory: services/orion-recall
        run: |
          PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_lived_memory.py tests/test_lived_memory_step2.py evals/test_lived_memory_replay_eval.py \
            tests/test_lived_know_and_status.py tests/test_recall_telemetry_persist.py \
            tests/test_lived_short_gate.py evals/test_dig_know_bank_eval.py
      - name: Memory scoreboard fixture eval (issue #3536)
        working-directory: services/orion-recall
        run: |
          PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            evals/test_memory_scoreboard.py
      - name: Hub PR commenter refuses guarded text
        working-directory: services/orion-hub
        run: |
          PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_session_roundup_loop.py -k commenter
      - name: Consult prompts pass the mesh edge before Claude (redact, hold when the guard is down)
        working-directory: services/orion-hub
        run: |
          PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_consult_loop.py
      - name: Shingle threshold eval (made-up paraphrase set)
        run: python orion/memory/evals/run_mesh_edge_shingle_eval.py
