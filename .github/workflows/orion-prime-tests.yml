name: orion-prime-tests

# Orion Prime 2A (docs/superpowers/specs/2026-10-29-orion-prime-design.md): the resident loop in
# orion-mind (app/prime_loop.py) and its pure logic (orion/prime/): the tick, the thought's answer,
# Prime's acts, how a question settles, the narrator readout's arithmetic, and the frame eval on live
# inputs captured 2026-10-30. Fake bus, model and market; no DB, Redis or LLM.

on:
  pull_request:
    paths:
      - "orion/prime/**"
      - "orion/refs.py"
      - "orion/dig/tests/test_refs_contract.py"
      - "orion/curiosity/focus.py"
      - "orion/curiosity/run_story.py"
      - "orion/grammar/acts.py"
      - "orion/physiology/client.py"
      - "orion/physiology/prime_charge.py"
      - "orion/physiology/families.py"
      - "config/physiology/families.yaml"
      - "orion/schemas/introspect.py"
      - "orion/schemas/physiology_want.py"
      - "services/orion-mind/**"
      - ".github/workflows/orion-prime-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/prime/**"
      - "orion/refs.py"
      - "orion/dig/tests/test_refs_contract.py"
      - "orion/curiosity/focus.py"
      - "orion/curiosity/run_story.py"
      - "orion/grammar/acts.py"
      - "orion/physiology/client.py"
      - "orion/physiology/prime_charge.py"
      - "orion/physiology/families.py"
      - "config/physiology/families.yaml"
      - "orion/schemas/introspect.py"
      - "orion/schemas/physiology_want.py"
      - "services/orion-mind/**"
      - ".github/workflows/orion-prime-tests.yml"

permissions:
  contents: read

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-mind/requirements.txt
          python -m pip install -r requirements-dev.txt
          # starlette's TestClient (orion-mind's HTTP contract tests) needs httpx.
          python -m pip install httpx
      - name: Prime pure logic + readout arithmetic
        run: PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider orion/prime
      - name: References contract (every kind has a resolver, a dig command and a test)
        run: PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider orion/dig/tests/test_refs_contract.py
      - name: Frame eval on live inputs (grounded, bounded, honest gaps, settles)
        run: PYTHONPATH=${{ github.workspace }} python orion/prime/evals/run_prime_frame_eval.py
      - name: orion-mind (resident loop + every existing Mind test)
        working-directory: services/orion-mind
        run: PYTHONPATH=${{ github.workspace }}/services/orion-mind:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests
