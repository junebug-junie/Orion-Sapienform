name: write_guide
label: Write Guide
description: >
  Produce a step-by-step guide with concrete instructions. Include specifics:
  commands, env vars, config snippets, and troubleshooting. No filler or meta-planning.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 90000

services:
  - LLMGatewayService

prompt_template: write_guide_prompt.j2

steps:
  - name: write_guide
    order: 0
    services: [LLMGatewayService]
    prompt_template: write_guide_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
