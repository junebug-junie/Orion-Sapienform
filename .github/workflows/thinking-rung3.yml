name: Thinking rung 3 (bind the winner)
# 2026-11-07 (ladder retirement PR 6): the motor allocator, the act-backed dispatch candidates, the
# reading pull and the dispatch runtime retired with the proposal, policy and dispatch rungs
# (docs/superpowers/specs/2026-11-04-retire-proposal-policy-dispatch-rungs.md). What remains of
# rung 3 is the binding fix in the attention broadcast and the one binding rule (self_shed) the act
# ledger and the cooling act still use.
on:
  pull_request:
    paths:
      - 'orion/autonomy/self_shed.py'
      - 'orion/substrate/attention_broadcast.py'
      - 'orion/substrate/attention/policy.py'
      - 'orion/schemas/attention_frame.py'
      - 'tests/test_rung3_*.py'
      - '.github/workflows/thinking-rung3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rung3:
    runs-on: ubuntu-latest
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio psycopg2-binary asyncpg sqlalchemy
      - name: Binding fix (an eligible world-first winner is never dropped to "none")
        run: python -m pytest -q tests/test_rung3_world_first_action_floor.py
