schema_version: transport_lattice_policy.v1

lane_id: transport

# Single source of truth for the transport lane's per-channel thresholds.
# Live readers (2026-09-25):
#   - services/orion-hub/scripts/substrate_lattice_routes.py -- gate overlay,
#     lattice-values panel, threshold simulator, draft-policy-patch diff.
#   - services/orion-mind/app/recall_signal_resolver.py -- bus_synaptic_pressure
#     watch_at/summarize_at/propose_at rungs for the recall evidence line.
# `dimension` is a display label only. A former `dimension_weights` block and
# the hub's hand-copied `_TRANSPORT_CHANNELS` mirror of it were deleted
# 2026-09-25: no process read the weights, and the mirror was still keyed on
# the retired stream_backlog_pressure channel. Per-channel `required_windows`
# and a `healthy_idle` block were deleted in the same pass for the same reason
# (never read). See docs/superpowers/specs/2026-09-22-substrate-lattice-audit.md.
channels:
  # Renamed from stream_backlog_pressure 2026-07-27 (PRs #1391-#1396): that
  # channel was fed by a narrow 2-Redis-Stream "world_pulse" census, not real
  # bus traffic, already retired. bus_synaptic_pressure is capability:transport's
  # real, mesh-wide successor (config/field/orion_field_topology.v1.yaml).
  # Thresholds carried over unchanged from the old channel -- Juniper's explicit
  # call: the old gate effectively never fired (frozen near-zero for its whole
  # life, plus a separate dict-nesting bug in substrate_lattice_routes.py that
  # meant it read a nonexistent key regardless), so there's no real prior
  # behavior to preserve continuity with. bus_synaptic's real distribution
  # saturates at 1.0 for ~14% of ticks (6h live sample, 2026-07-27) -- these
  # thresholds will make this gate active far more often than the old one ever
  # was; that is treated as the honest signal the old gate never gave, not a
  # miscalibration to chase.
  bus_synaptic_pressure:
    dimension: delivery_integrity
    watch_at: 0.25
    summarize_at: 0.50
    propose_at: 0.75
    action_ceiling: read_only

  contract_pressure:
    dimension: contract_integrity
    watch_at: 0.50
    summarize_at: 0.75
    propose_at: null
    action_ceiling: summarize

  catalog_drift_pressure:
    dimension: topology_integrity
    watch_at: 0.50
    summarize_at: null
    propose_at: null
    action_ceiling: watch

  observer_failure_pressure:
    dimension: observability_integrity
    watch_at: 0.25
    summarize_at: 0.50
    propose_at: null
    action_ceiling: summarize
