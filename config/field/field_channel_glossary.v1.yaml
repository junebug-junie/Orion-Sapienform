  # orion/substrate/prediction_error.py:1354 -- stage 1: 1 - cos(embedding,
  # stream EWMA) (:1451); stage 2: z of that vs its own EWMA, negatives
  # clipped (:290), score = min(1, z/3) (:1478). 2026-10-21: the 30 s tick
  # publishes the latest scored frame not yet published
  # (worker.py _take_perception_score; not the window peak -- that failed the
  # metric gate, see the PR record), and a missing input (stale, warming, no
  # new scored frame) writes a 0.0 placeholder marked
  # prediction_error_missing_reason that never reaches
  # substrate_node_prediction_error_history.
  - node: "node:substrate.perception"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: self_monitoring
    meaning: "How surprising the room camera's latest frame is versus that stream's own recent normal: embedding distance from its running average, z-scored against its own history, negatives clipped, 3 sigma = 1.0. One reading per tick (~30 s), from a frame that arrived since the previous reading."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:substrate.perception'"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
    semantics:
      value_kind: level
      rest: "0.0 = the frame is at or below this stream's usual surprise. Reachable: 61% of live readings 2026-10-14..21 were exact 0.0 (replay of stored per-frame baselines). A 0.0 placeholder written while the input is missing (embeddings stale, baseline warming, or no scored frame in the window) carries prediction_error_missing_reason on the node and is NOT a reading: it is never recorded in the history and the self-model omits it."
      # rest_range live 2026-10-13: 61.4% exact 0.0, p50 0.0, p95 0.357, max 1.0 over 41048 rows (24h to 2026-10-13, substrate_field_state node_vectors)
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "per-tick writer: the graph node and receipt get a 0.0 placeholder every tick while the input is missing, marked prediction_error_missing_reason; substrate_node_prediction_error_history gets no row then (a gap = missing, not calm). Nothing written until 15 s after process start before the first embedding arrives."

  # 2026-10-15: same formula as node:substrate.perception above
  # (orion/substrate/prediction_error.py:1354), fed only by the streams in
  # SUBSTRATE_PERCEPTION_WALKWAY_STREAM_IDS (default: walkway, the outdoor
  # camera). services/orion-substrate-runtime/app/worker.py
  # _handle_perception_prediction_error_message routes the stream, and
  # _publish_perception_group writes it every tick: the latest scored frame
  # since the last tick, or a 0.0 placeholder marked prediction_error_missing_reason
  # while the input is missing (never recorded in the history).
  # Read by endogenous curiosity since 2026-10-15. Since 2026-10-21 a world
  # source in the world-first attention contests, eligible only at its own
  # p99+ band (orion/schemas/attention_candidate.py ATTENTION_MIN_BAND_BY_NODE_ID);
  # still fenced from the broadcast's salience signals.
  # 0 graph edges ON PURPOSE (2026-11-03, docs/superpowers/specs/2026-11-03-person-graph-sighting-refresh-design.md):
  # whole-frame surprise does not know who was in the frame (a car or a light change
  # raises it as much as a person). An outgoing edge would push its pressure and
  # activation into every named cluster / walkway day node on each surprising frame.
  # "Who was seen" reaches the graph through vision_individual.last_seen_at on the
  # cluster nodes instead (app/person_graph_loop.py _refresh_sightings). Do not "fix" the 0.
  - node: "node:substrate.perception_walkway"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: self_monitoring
    meaning: "How surprising the walkway (outdoor) camera's latest frame is versus that stream's own recent normal: embedding distance from its running average, z-scored against its own history, negatives clipped, 3 sigma = 1.0. One reading per tick (~30 s), from a frame that arrived since the previous reading. Kept apart from node:substrate.perception so the street does not overwrite the room cameras."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:substrate.perception_walkway'"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: level
      rest: "0.0 = the frame is at or below the walkway stream's usual surprise (63% of live readings 2026-10-15..21). A 0.0 placeholder written while the input is missing (embeddings stale, baseline warming, or no scored frame in the window) carries prediction_error_missing_reason on the node and is NOT a reading: it is never recorded in the history."
      # rest_range live 2026-10-15 (night only, first hour of data): 172 per-embedding scores 61.6% exact 0.0, p50 0.0, p90 0.146, p99 0.508, max 1.0; 18 tick writes 50% exact 0.0, max 0.249 (substrate-runtime log + substrate_node_prediction_error_history)
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "per-tick writer: the graph node and receipt get a 0.0 placeholder every tick while the input is missing, marked prediction_error_missing_reason (embedding_staleness 1.0 when stale); substrate_node_prediction_error_history gets no row then (a gap = missing, not calm). Nothing written until 15 s after process start."

  # orion/substrate/prediction_error.py:409-453
  # _score_and_update_ewma_prediction_error: :452 returns 0.0 with no z yet
  # (cold start); :453 min(1, max(0, z)/3). Execution input (:456): mean
  # |delta| of 4 pressure hints. Written only when a batch had events
  # (worker.py:3991). Live: 72% exact zeros.
