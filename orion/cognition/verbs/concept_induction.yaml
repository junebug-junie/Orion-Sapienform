name: concept_induction
label: Concept Induction
description: Consolidate recent Orion experience into concept profiles and clusters.
category: spark
version: "1.0"

timeout_ms: 120000

services:
  - LLMGatewayService

steps:
  - name: induce_concepts
    order: 0
    services: [LLMGatewayService]
    prompt_template: concept_induction_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 2
  family: concept_induction
  lanes: [fast]
  deferrable_window_s: 86400
