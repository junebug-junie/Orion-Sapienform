services:
  orion-vision-frame-router:
    build:
      context: ../..
      dockerfile: services/orion-vision-frame-router/Dockerfile
    container_name: orion-${PROJECT:-dev}-vision-frame-router
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - ROUTER_POLICY_PATH=/app/config/vision_frame_router.yaml
      - DRY_RUN=${DRY_RUN:-false}
      - ROUTER_EXPECTATION_STEERING_ENABLED=${ROUTER_EXPECTATION_STEERING_ENABLED:-true}
      - ROUTER_EXPECTATION_REFRESH_SEC=${ROUTER_EXPECTATION_REFRESH_SEC:-5.0}
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-vision-frame-router/app:/app/app
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/orion:/app/orion
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/config/vision_frame_router.yaml:/app/config/vision_frame_router.yaml:ro
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames:ro
    networks:
      - app-net

networks:
  app-net:
    external: true
