services:
  actions:
    build:
      context: ../..
      dockerfile: services/orion-actions/Dockerfile
    container_name: ${PROJECT}-actions
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Not app config -- Python interpreter behavior flags, not present in
      # .env_example and not read via app/settings.py's pydantic-settings Field
      # defaults, so they stay here rather than in env_file.
      #
      # NOTE: the ~90-line duplicate-of-.env_example `environment:` list that
      # used to sit here (one entry per key, e.g. `ORION_BUS_URL=${ORION_BUS_URL}`,
      # several with their own `${KEY:-default}` fallback) was removed --
      # env_file: [.env] above already passes every .env key through to the
      # container untouched, making that list pure duplication and a second,
      # competing place a default could drift from app/settings.py's Field
      # default. See docs/superpowers/pr-reports/ for the PR that removed it.
      # A dead entry in the deleted list is also worth knowing about: it
      # declared `LOG_LEVEL=DEBUG` AND (later in the same list) `LOG_LEVEL=${LOG_LEVEL}`
      # -- docker compose takes the last duplicate key, so the DEBUG override
      # was already inert before this cleanup; not reintroduced here.
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
    networks:
      - app-net
    ports:
      - "7160:7160"
    volumes:
      - ${ORION_DATA_ROOT:-/mnt/graphdb}/orion-actions/state:/data/orion-actions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7160/health"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-net:
    external: true
