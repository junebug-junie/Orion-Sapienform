name: orion-hardware-watch tests

on:
  pull_request:
    paths:
      - "services/orion-hardware-watch/**"
      - "orion/hardware_watch/**"
      - "orion/schemas/hardware_watch.py"
      - "orion/schemas/prediction.py"
      - "orion/schemas/curiosity_urgent.py"
      - "orion/schemas/notify.py"
      - "orion/autonomy/thermal_gate.py"
      - "services/orion-sql-db/manual_migration_hardware_watch_v1.sql"
      - "orion/cognition/plan_loader.py"
      - "orion/cognition/verbs/skills.runtime.image_prune.v1.yaml"
      - "orion/schemas/cortex/**"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "services/orion-cortex-exec/app/exec_ctx.py"
      - "services/orion-cortex-exec/tests/test_image_prune_hardware_watch_request.py"
      - ".github/workflows/orion-hardware-watch-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/orion-hardware-watch/**"
      - "orion/hardware_watch/**"
      - "orion/schemas/hardware_watch.py"
      - "orion/schemas/prediction.py"
      - "orion/schemas/curiosity_urgent.py"
      - "orion/schemas/notify.py"
      - "orion/autonomy/thermal_gate.py"
      - "services/orion-sql-db/manual_migration_hardware_watch_v1.sql"
      - "orion/cognition/plan_loader.py"
      - "orion/cognition/verbs/skills.runtime.image_prune.v1.yaml"
      - "orion/schemas/cortex/**"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "services/orion-cortex-exec/app/exec_ctx.py"
      - "services/orion-cortex-exec/tests/test_image_prune_hardware_watch_request.py"
      - ".github/workflows/orion-hardware-watch-tests.yml"

jobs:
  hardware-watch:
    name: hardware-watch — rules + watcher + real-history replay eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-hardware-watch/requirements.txt pytest
      - name: Rules + watcher tests
        run: cd services/orion-hardware-watch && PYTHONPATH=../..:. python -m pytest tests -q -p no:cacheprovider
      - name: "Replay eval (committed real history -- AC fires once on the 33.11 W stretch, heat rates, shed legs)"
        run: cd services/orion-hardware-watch && PYTHONPATH=../..:. python evals/run_rules_replay_eval.py
      - name: "Disk rule replay (14 real days -- 2 asks a day, keeps up with the real dangling-image prunes, fault injection)"
        run: cd services/orion-hardware-watch && PYTHONPATH=../..:. python evals/run_image_prune_replay_eval.py
      - name: "Disk rule floor is the skill's own; the dispatch prune trigger is gone"
        run: PYTHONPATH=. python -m pytest tests/test_image_prune_disk_rule_parity.py -q -p no:cacheprovider

  cortex-exec-contract:
    name: hardware-watch -> cortex-exec -- the disk rule's request reaches the image prune in execute mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-cortex-exec/requirements.txt pytest
      - name: The disk rule's payload through build_exec_ctx -> _plan_request_from_step_ctx -> the skill's run mode
        working-directory: services/orion-cortex-exec
        run: PYTHONPATH=${{ github.workspace }}/services/orion-cortex-exec:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_image_prune_hardware_watch_request.py tests/test_executor_docker_prune_skill_args.py
