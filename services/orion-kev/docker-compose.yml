services:
  kev:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT:-orion}-kev:local
    container_name: ${PROJECT}-kev
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${KEV_HOST_PORT:-8009}:8009"
    environment:
      - PROJECT=${PROJECT}
      - HF_HOME=/cache/huggingface
      # Docker remaps the pinned host GPU to container cuda:0.
      - CUDA_VISIBLE_DEVICES=0
      - KEV_MODEL=${KEV_MODEL:-jaredpalmer/kev-0.8b}
    volumes:
      - ${KEV_HF_CACHE_HOST_DIR:-/mnt/scripts/kev/.hf-cache}:/cache/huggingface
    # GPU pin by UUID (KEV_GPU_DEVICE_ID), remapped to cuda:0 inside. Never a
    # bare index: circe's indices renumbered when cards moved, and
    # orion-affectgpt-worker's index pin "1" put it on a full card, where it
    # crash-looped 601 times (2026-10-14..23). A UUID cannot move. No silent
    # default -- fail loud if unset. Gate: tests/test_gpu_pin.py.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${KEV_GPU_DEVICE_ID:?KEV_GPU_DEVICE_ID must be set to a circe GPU UUID in services/orion-kev/.env}"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/docs', timeout=3)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  app-net:
    external: true
