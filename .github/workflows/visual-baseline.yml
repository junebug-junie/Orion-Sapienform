name: Visual baseline contracts
on:
  pull_request:
    paths:
      - 'orion/reverie/**'
      - 'config/reverie/**'
      - 'orion/schemas/reverie_visual.py'
      - 'orion/schemas/reverie_visual_run.py'
      - 'orion/schemas/durable_run.py'
      - 'orion/autonomy/**'
      - 'config/physiology/families.yaml'
      - 'orion/physiology/client.py'
      - 'orion/self_monitor/gate.py'
      - 'orion/regulation/arousal_read.py'
      - 'services/orion-thought/**'
      - 'services/orion-cortex-exec/app/verb_adapters.py'
      - 'services/orion-cortex-exec/app/durable_kickoff.py'
      - 'services/orion-cortex-exec/tests/test_render_scene_durable_kickoff.py'
      - 'services/orion-sql-db/manual_migration_reverie_visual*.sql'
      - 'tests/test_visual_baseline_arousal_reader.py'
      - 'services/orion-analytics/models/marts/dim_reverie_outcomes.sql'
      - 'tests/test_dim_reverie_outcomes_covers_terminal_reasons.py'
      - 'orion/gpu_pool/client.py'
      - '.github/workflows/visual-baseline.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    # packages: read lets GITHUB_TOKEN pull the private GHCR postgres copy.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/junebug-junie/postgres:15  # private GHCR copy of postgres:15; Docker Hub and ECR Public both rate-limit shared runner IPs
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: visual_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORION_VISUAL_TEST_DATABASE_URL: postgresql://postgres:visual_test_only@127.0.0.1:5432/postgres
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio
      - name: Admission and accounting contracts
        run: >-
          python -m pytest -q tests/test_visual_baseline_arousal_reader.py
          tests/test_dim_reverie_outcomes_covers_terminal_reasons.py
          orion/reverie/tests/test_baseline_policy_file.py
      - name: Thought storage, source, HTTP and replica contracts
        run: >-
          python -m pytest -q services/orion-thought/tests/test_visual_activity.py
          services/orion-thought/tests/test_store.py services/orion-thought/tests/test_visual_chain.py
          services/orion-thought/tests/test_visual_chain_thermal_gate.py
          services/orion-thought/tests/test_thermal_line_pin.py
          services/orion-thought/tests/test_visual_chain_gpu_lease.py
          services/orion-thought/tests/test_visual_chain_run_deadline.py
          services/orion-thought/tests/test_visual_steps.py
          services/orion-thought/tests/test_visual_steps_db.py
          services/orion-thought/tests/test_bus_listener_visual_step.py
          services/orion-thought/tests/test_painting_act.py
          services/orion-thought/tests/test_painting_self_start.py
          services/orion-thought/tests/test_physiology_shadow_bid.py
          services/orion-thought/tests/test_visual_painting_gap_monitor.py
          services/orion-thought/tests/test_settings_mind_enrichment.py
      - name: Painting self-start replay (fixture)
        run: python -P services/orion-thought/evals/painting_self_start_replay.py
      - name: Durable render kickoff (cortex-exec)
        run: |
          pip install -r services/orion-cortex-exec/requirements.txt
          PYTHONPATH=services/orion-cortex-exec:. python -m pytest -q services/orion-cortex-exec/tests/test_render_scene_durable_kickoff.py
      - name: Image degradation eval
        run: PYTHONPATH=services/orion-thought:. python -m pytest -q services/orion-thought/evals/test_visual_chain_honesty_eval.py
