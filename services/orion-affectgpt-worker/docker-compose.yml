services:
  affectgpt-worker:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-affectgpt-worker/Dockerfile
    container_name: ${PROJECT}-affectgpt-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_NAME=${NODE_NAME:-circe}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}

      - CHANNEL_AFFECTGPT_INTAKE=${CHANNEL_AFFECTGPT_INTAKE}
      - CHANNEL_AFFECTGPT_REPLY_PREFIX=${CHANNEL_AFFECTGPT_REPLY_PREFIX}

      - AFFECTGPT_SRC_ROOT=${AFFECTGPT_SRC_ROOT}
      - AFFECTGPT_MODEL_ROOT=${AFFECTGPT_MODEL_ROOT}
      - AFFECTGPT_CKPT_ROOT=${AFFECTGPT_CKPT_ROOT}
      - AFFECTGPT_CFG_PATH=${AFFECTGPT_CFG_PATH}
      - AFFECTGPT_CKPT_EPOCH=${AFFECTGPT_CKPT_EPOCH}
      - AFFECTGPT_FACE_OR_FRAME=${AFFECTGPT_FACE_OR_FRAME}
      - AFFECTGPT_DEFAULT_USER_MESSAGE=${AFFECTGPT_DEFAULT_USER_MESSAGE}
      - AFFECTGPT_DEVICE=${AFFECTGPT_DEVICE:-cuda:0}
      - AFFECTGPT_MAX_NEW_TOKENS=${AFFECTGPT_MAX_NEW_TOKENS}
      - AFFECTGPT_MAX_LENGTH=${AFFECTGPT_MAX_LENGTH}
      - AFFECTGPT_FACE_MARGIN=${AFFECTGPT_FACE_MARGIN}
      - AFFECTGPT_FACE_MIN_SIZE_PX=${AFFECTGPT_FACE_MIN_SIZE_PX}
      - AFFECTGPT_REQUEST_TIMEOUT_S=${AFFECTGPT_REQUEST_TIMEOUT_S}

    volumes:
      # Model weights + checkpoint (~33GB) -- never baked into the image.
      # Host path is circe-local (no shared filesystem with athena's
      # /mnt/telemetry -- see reference_circe_gpu_inventory_and_lane_map).
      - /mnt/scripts/orion-affectgpt-models:/opt/affectgpt-src/AffectGPT/models:ro
      # Scratch: shared with orion-juniper-affective-state so it can hand
      # this worker a video/audio path both containers can read (its
      # capture_and_assess() writes fetched percept-store blobs here).
      # MUST match that service's AFFECTGPT_SCRATCH_DIR exactly -- review
      # finding, 2026-08-22: this used to be a bare literal with no env var,
      # so changing the other service's setting silently broke this mount
      # with no config-mismatch signal, just a generic file-not-found at
      # capture time. Same variable name, same default, on both sides now.
      - ${AFFECTGPT_SCRATCH_DIR:-/mnt/scripts/orion-affectgpt-scratch}:${AFFECTGPT_SCRATCH_DIR:-/mnt/scripts/orion-affectgpt-scratch}:ro

    ports:
      - "${HOST_PORT}:6610"

    # GPU pin: by UUID, never by index. Set AFFECTGPT_GPU_DEVICE_ID in
    # services/orion-affectgpt-worker/.env on circe; compose refuses to start
    # this container while it is empty or unset.
    #
    # History. 2026-08-25 the pin was device_ids: ["1"], which meant the Tesla
    # V100-SXM2-32GB then. circe's numbering later changed: index 1 became the
    # V100-PCIE-32GB that holds the agent llama-server (~24.3 GB). From
    # 2026-10-14 03:00Z to 2026-10-23 22:27Z this worker hit CUDA OOM at model
    # load and restarted 601 times (exit 3), ~144 W at the wall for 9 days.
    # The SXM2 is index 3 now. An index can move again; a UUID cannot.
    #
    # circe cards (nvidia-smi -L, 2026-10-23):
    # (a snapshot -- re-check with `nvidia-smi -L` before choosing)
    #   idx0 GPU-5b4609d2-95c2-2891-8aff-98ac1af92302  V100-PCIE-32GB
    #   idx1 GPU-83b0aa77-90da-ed6c-cc04-a1e530d0a0f1  V100-PCIE-32GB
    #   idx2 GPU-00e3b626-de2a-e344-796e-017b7a1b3f40  PG500-216
    #   idx3 GPU-599d16a7-8c7c-1e3a-ac94-a01e5cb5cf7a  V100-SXM2-32GB
    #
    # NO CARD IS CHOSEN HERE. This worker needs ~18.4 GB peak (2026-08 measurement, README; the OOM hit with 7.3 GB free)
    # and on 2026-10-23 no card had that much free. Juniper picks the card.
    # Until then the empty pin keeps compose from starting the container
    # (and from running ANY compose command for it: stop/down/logs too --
    # use `docker rm -f orion-circe-affectgpt-worker`, or set the variable
    # for that one command). It does not stop a container that already exists.
    #
    # Inside the container the one exposed card is always index 0, so
    # AFFECTGPT_DEVICE=cuda:0 above stays correct for any UUID.
    #
    # Compose's top-level `gpus:` key only accepts the literal 'all' --
    # confirmed live 2026-08-22. Per-device pinning needs the
    # deploy.resources.reservations.devices form. The NVIDIA runtime accepts
    # an index, a PCI bus id, or a GPU UUID in device_ids.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AFFECTGPT_GPU_DEVICE_ID:?AFFECTGPT_GPU_DEVICE_ID must be set to a circe GPU UUID in services/orion-affectgpt-worker/.env -- see docker-compose.yml}"]
              capabilities: [gpu]

    networks:
      - app-net

networks:
  app-net:
    external: true
