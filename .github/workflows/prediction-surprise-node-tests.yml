name: prediction-surprise-node-tests

# node:prediction.room / node:prediction.body (and node:prediction.chat_turn, 2026-11-13: settled
# chat-turn self-bets as surprise; node:prediction.body_joint / .room_joint, 2026-11-18: family A
# joint-group surprise, successor of node:substrate.biometrics): orion-prediction's gated surprise events folded
# into two body nodes (docs/superpowers/specs/2026-11-08-prediction-error-suite-rebuild-design.md,
# build item 3), and the attention/curiosity/self-readings readers that accept value_kind
# surprise_excess.
on:
  pull_request:
    paths:
      - "orion/prediction/surprisal.py"
      - "orion/prediction/tests/**"
      - "orion/curiosity/value.py"
      - "orion/curiosity/tests/test_curiosity_value.py"
      - "orion/substrate/prediction_street_rhythm.py"
      - "orion/substrate/prediction_surprise.py"
      - "orion/substrate/tests/test_prediction_surprise.py"
      - "orion/substrate/prediction_turn_surprise.py"
      - "orion/substrate/tests/test_prediction_turn_surprise.py"
      - "orion/substrate/prediction_joint_surprise.py"
      - "orion/substrate/tests/test_prediction_joint_surprise.py"
      - "orion/schemas/attention_candidate.py"
      - "orion/schemas/prediction.py"
      - "orion/attention/world_first.py"
      - "orion/attention/self_readings.py"
      - "orion/substrate/attention_broadcast.py"
      - "orion/substrate/endogenous_curiosity.py"
      - "orion/substrate/curiosity_seed_bar.py"
      - "orion/substrate/tests/test_curiosity_seed_bar.py"
      - "orion/substrate/data/chat_turn_calibrated_q_2026-11-24.json"
      - "orion/substrate/calm_band.py"
      - "orion/substrate/tests/test_calm_band.py"
      - "tests/test_attention_calm_band.py"
      - "orion/substrate/prediction_error_magnitude.py"
      - "orion/attention/pe_history_cache.py"
      - "orion/metrics/semantics.py"
      - "config/field/field_channel_glossary.v1.yaml"
      - "services/orion-substrate-runtime/**"
      - ".github/workflows/prediction-surprise-node-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/prediction/surprisal.py"
      - "orion/prediction/tests/**"
      - "orion/curiosity/value.py"
      - "orion/curiosity/tests/test_curiosity_value.py"
      - "orion/substrate/prediction_street_rhythm.py"
      - "orion/substrate/prediction_surprise.py"
      - "orion/substrate/prediction_turn_surprise.py"
      - "orion/substrate/prediction_joint_surprise.py"
      - "orion/schemas/prediction.py"
      - "orion/attention/world_first.py"
      - "orion/substrate/endogenous_curiosity.py"
      - "orion/substrate/curiosity_seed_bar.py"
      - "orion/substrate/calm_band.py"
      - "orion/substrate/prediction_error_magnitude.py"
      - "services/orion-substrate-runtime/**"
      - ".github/workflows/prediction-surprise-node-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio httpx
      - name: Fold (pure) + readers accept surprise_excess
        run: |
          python -m pytest -q -p no:cacheprovider \
            orion/prediction/tests \
            orion/curiosity/tests/test_curiosity_value.py \
            orion/substrate/tests/test_prediction_street_rhythm.py \
            orion/substrate/tests/test_prediction_surprise.py \
            orion/substrate/tests/test_prediction_turn_surprise.py \
            orion/substrate/tests/test_prediction_joint_surprise.py \
            orion/substrate/tests/test_endogenous_curiosity.py \
            orion/substrate/tests/test_curiosity_seed_bar.py \
            orion/substrate/tests/test_calm_band.py \
            tests/test_attention_calm_band.py \
            services/orion-substrate-runtime/evals/test_curiosity_seed_bar_replay_eval.py \
            tests/test_attention_world_first.py \
            tests/test_room_joint_world_source.py \
            tests/test_attention_self_readings.py
      - name: Runtime wiring (listener, node write, PE history)
        env:
          POSTGRES_URI: postgresql://unused/unused
        run: |
          PYTHONPATH=.:services/orion-substrate-runtime python -m pytest -q -p no:cacheprovider \
            services/orion-substrate-runtime/tests/test_prediction_surprise_listener.py \
            services/orion-substrate-runtime/tests/test_prediction_turn_surprise_listener.py \
            services/orion-substrate-runtime/tests/test_prediction_joint_surprise_listener.py
