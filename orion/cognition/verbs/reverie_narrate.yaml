name: reverie_narrate
label: Reverie Narrate
description: >
  Spontaneous felt-layer narration of the current winning coalition, with no
  user message. Produces SpontaneousThoughtV1 — the unprompted sibling of
  stance_react's ThoughtEventV1. Reflection-shaped (interpretation/salience),
  not reply-shaped (imperative/tone). Read-only; emits no action by itself.

category: ExecutiveControl
priority: normal

requires_gpu: true
requires_memory: false
# No user text to search for: recall runs only its "what is going on" feeds
# (recent chat, recent timeline, bus anomalies), never an empty-query search.
recall_query_mode: context_only
timeout_ms: 120000

services:
  - LLMGatewayService

prompt_template: reverie_narrate.j2

steps:
  - name: llm_reverie_narrate
    order: 0
    services: [LLMGatewayService]
    prompt_template: reverie_narrate.j2
    requires_gpu: true

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 2
  family: thought.reverie
  lanes: [metacog]
  deferrable_window_s: 900
