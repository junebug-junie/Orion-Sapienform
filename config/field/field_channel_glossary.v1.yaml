  # Family A joint surprise (2026-11-18, #3575; groups decided in #3580). orion-prediction
  # forecasts every raw body and room reading at once, 5 and 15 min ahead
  # (services/orion-prediction/app/family_a_live.py), and scores each bucket per joint
