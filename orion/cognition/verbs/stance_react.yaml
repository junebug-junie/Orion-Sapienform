name: stance_react
label: Stance React
description: >
  Reactive felt-layer synthesis for unified Hub turns.
  Produces ThoughtEventV1 harness input from association, coalition projection,
  and stance inputs — not user-facing speech.

category: ExecutiveControl
priority: high

requires_gpu: true
requires_memory: false
# REVERTED 2026-09-05, end of session ("move everything back to how it
# was"): was briefly 240000 (see PR #2108/#2112) to accommodate
# Qwen3.8-Flash-Next and Qwen3.8-27B-BF16, both of which live-confirmed
# needing >115s for a real stance_react completion at reasoning_effort
# xhigh. Reverted to 120000 alongside reverting the agent lane back to
# qwen3.8-27b-udq4kxl-v100-32gb-circe-agent-flex, which this value was
# already proven fine against before tonight's testing. If a future model
# swap on this lane produces the same "stance_react exec result missing
# thought payload" / gateway TIMEOUT at route=chat, re-raise this first
# before assuming something else broke -- see PR #2108 for the full
# incident writeup and self_study.py's SELF_STUDY_REFLECT_TIMEOUT_SEC for
# the matching precedent.
timeout_ms: 120000

services:
  - LLMGatewayService

prompt_template: stance_react.j2

personality_file: orion/cognition/personality/orion_identity.yaml

steps:
  - name: llm_stance_react
    order: 0
    services: [LLMGatewayService]
    prompt_template: stance_react.j2
    requires_gpu: true
