name: stance_react
label: Stance React
description: >
  Reactive felt-layer synthesis for unified Hub turns.
  Produces ThoughtEventV1 harness input from association, coalition projection,
  and stance inputs — not user-facing speech.

category: ExecutiveControl
priority: high

requires_gpu: true
requires_memory: false
# RE-RAISED 2026-09-10, per this file's own note: exactly the predicted
# recurrence. Live-caught mid curiosity-investigation-loop debugging: one
# real curiosity run needed 4 attempts to get a usable stance_react result,
# 3 of the 4 timing out against this file's then-120000 (120s) ceiling --
# `orion-thought` logged "stance_react error ... err=stance_react exec
# result missing thought payload" at 191s, 192s and 202s (all comfortably
# inside orion-thought's own 360s STANCE_REACT_TIMEOUT_SEC RPC wait, so the
# reply DID arrive -- it just arrived already cut off, because cortex-exec's
# `executor.py` enforces this verb's `timeout_ms` as the actual LLM-call
# cutoff at `step_timeout_sec = (step.timeout_ms or 60000) / 1000.0`,
# independent of the caller's own patience). This is the mechanism behind
# the curiosity-supervisor design doc's long-unexplained "~3 failures per
# run" pattern -- each failed attempt re-runs the ENTIRE curiosity turn from
# scratch (services/orion-durable-runs), not just this one step.
#
# 2026-09-05 history unchanged below: was briefly 240000 (see PR
# #2108/#2112) to accommodate Qwen3.8-Flash-Next and Qwen3.8-27B-BF16, both
# of which live-confirmed needing >115s for a real stance_react completion
# at reasoning_effort xhigh. Reverted to 120000 alongside reverting the
# agent lane back to qwen3.8-27b-udq4kxl-v100-32gb-circe-agent-flex, which
# this value was already proven fine against at the time. Raised back to
# 240000 now that the lane's real completion time (181-202s observed live)
# again exceeds 120s -- if it drifts again, check the agent lane's current
# model/load before just re-raising a third time; see PR #2108 for the full
# incident writeup (the matching precedent, a self-study reflect timeout, was
# retired with that verb on 2026-10-30).
#
# ROOT CAUSE 2026-10-31 (do NOT raise this a third time): the slow stances were
# the agent lanes THINKING. Agent profiles default thinking on (Strata
# agent-defaults.json reasoning_effort=high; Bonsai agent-gpu2 xhigh); the chat
# lane does not. Same prompt (~10k tokens), median completion tokens: chat 342
# (14 s), agent 2,918 (96 s), agent-gpu2 3,652 (158 s, max 6,285). 108 reading
# turns since 10-14 died at this 240 s ceiling on agent-gpu2 (cortex-exec gives
# the gateway this ceiling minus 5 s, so the logs show ~235 s). orion-thought now
# sends chat_template_kwargs.enable_thinking=False on every stance
# (services/orion-thought/app/bus_listener.py build_stance_react_context). If
# stance gets slow again, check llm_call_usage.completion_tokens for
# verb='stance_react' by pool_role before touching this number.
timeout_ms: 240000

services:
  - LLMGatewayService

prompt_template: stance_react.j2

personality_file: orion/cognition/personality/orion_identity.yaml

steps:
  - name: llm_stance_react
    order: 0
    services: [LLMGatewayService]
    prompt_template: stance_react.j2
    requires_gpu: true

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat]
  deferrable_window_s: 0
