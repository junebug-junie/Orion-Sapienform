name: shed-not-failure-tests

# A deliberate GPU-pool shed (gpu_pool_unavailable:shed:*) is not a failure (2026-10-20):
# cortex-exec keeps the shed reason on the failed-step atom, the execution reducer counts it
# as shed (failure_pressure stays 0), reverie does not count a pool refusal toward a theme's
# no_coalition streak. No DB, bus or LLM.

on:
  pull_request:
    paths:
      - "orion/gpu_pool/shed.py"
      - "orion/gpu_pool/tests/test_shed_reason_from_error.py"
      - "orion/schemas/execution_projection.py"
      - "orion/substrate/execution_loop/**"
      - "tests/test_execution_substrate_reducer.py"
      - "services/orion-cortex-exec/app/grammar_emit.py"
      - "services/orion-cortex-exec/app/router.py"
      - "services/orion-cortex-exec/tests/test_exec_grammar_emit.py"
      - "services/orion-thought/app/reverie.py"
      - "services/orion-thought/app/chain.py"
      - "services/orion-thought/tests/test_reverie_chain.py"
      - "services/orion-thought/tests/test_reverie_spontaneous_thought.py"
      - ".github/workflows/shed-not-failure-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/gpu_pool/shed.py"
      - "orion/schemas/execution_projection.py"
      - "orion/substrate/execution_loop/**"
      - "services/orion-cortex-exec/app/grammar_emit.py"
      - "services/orion-thought/app/reverie.py"
      - "services/orion-thought/app/chain.py"
      - ".github/workflows/shed-not-failure-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-cortex-exec/requirements.txt
          python -m pip install -r services/orion-thought/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Shed parsing + execution reducer
        run: python -m pytest -q -p no:cacheprovider orion/gpu_pool/tests/test_shed_reason_from_error.py tests/test_execution_substrate_reducer.py
      - name: cortex-exec failed-step atom (producer -> reducer)
        working-directory: services/orion-cortex-exec
        run: PYTHONPATH=${{ github.workspace }}/services/orion-cortex-exec:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_exec_grammar_emit.py
      - name: reverie chain refusal handling
        working-directory: services/orion-thought
        run: PYTHONPATH=${{ github.workspace }}/services/orion-thought:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_reverie_chain.py tests/test_reverie_spontaneous_thought.py tests/test_reverie_thin_import_boundary.py
