schema_version: proposal_policy.v1
policy_id: proposal_policy.v1

limits:
  max_candidates: 10
  max_suppressed: 10

thresholds:
  min_priority: 0.10
  suppress_below: 0.05
  policy_required_above_risk: 0.20

  # PROVENANCE (2026-08-12): definitional, not tuned. See
  # orion/field/action_warrant.py and orion/proposals/policy.py's own comment.
  # `action_warrant` is a combined tail probability, so 0.50 is by
  # construction "exactly a median normal day for this machine" -- the
  # threshold reads as "act when the state is busier than a median day".
  # Measured live over 10,548 real ticks: 62.9% of ticks fall below it (quiet)
  # and 1.7% exceed 0.95 (clearly elevated), so the gate can both rest and
  # fire. Re-derive with orion/field/evals/run_action_warrant_eval.py.
  action_warrant_min: 0.50

# 2026-07-30: uncertainty/field_intensity/agency_readiness/coherence weights
# removed. None of those 4 dimension_ids are ever produced by
# orion/field/pressure.py::field_pressures() (see that module's own
# docstring -- composite, hand-tuned SelfStateV1 dimensions with no
# principled non-hand-tuned replacement, not rebuilt in the 2026-07-22 burn).
# No template below references them anymore either (see the same-day removal
# of contract_pressure/field_intensity/agency_readiness/uncertainty from each
# template's own `dimensions` map) -- keeping dead weights here was a live
# trap: dimension_confidence() returns 0.0 PERMANENTLY for any dimension_id
# outside orion/proposals/scoring.py::PRESSURE_DIMENSIONS, so these weights
# multiplied a value that could only ever be 0.0.
dimension_weights:
  execution_pressure: 0.30
  resource_pressure: 0.25
  reasoning_pressure: 0.15
  reliability_pressure: 0.35

proposal_templates:
  inspect_execution_pressure:
    kind: inspect
    target_kind: capability
    target_id: capability:orchestration
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.40
    base_risk: 0.05
    reversibility: 1.0
    dimensions:
      execution_pressure: 0.60

  summarize_loaded_state:
    kind: summarize
    target_kind: self_state
    target_id: self:current
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.35
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30: never produced by field_pressures()
    # (see dimension_weights' own comment above) -- was a dead entry that
    # contributed 0.0 to match_score (harmless there, template_match_score()
    # uses max()) but PERMANENTLY halved proposal_confidence() via its
    # sum()/len() average with resource_pressure's real confidence.
    dimensions:
      resource_pressure: 0.40

  watch_reliability:
    kind: observe
    target_kind: capability
    target_id: capability:orchestration
    proposed_effect: preserve_stability
    required_policy_gate: read_only
    base_priority: 0.30
    base_risk: 0.02
    reversibility: 1.0
    dimensions:
      reliability_pressure: 0.50

  request_policy_review_for_action:
    kind: request_policy_review
    target_kind: system
    target_id: policy:execution
    proposed_effect: prepare_for_policy_gate
    required_policy_gate: operator_review
    base_priority: 0.20
    base_risk: 0.30
    reversibility: 0.8
    # agency_readiness removed 2026-07-30: never produced by field_pressures()
    # -- see dimension_weights' own comment above.
    dimensions:
      execution_pressure: 0.40

  inspect_transport_status:
    kind: inspect
    target_kind: capability
    target_id: capability:transport
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.42
    base_risk: 0.05
    reversibility: 1.0
    # contract_pressure removed 2026-07-30: never produced by field_pressures()
    # -- "already always 0.0 before the [2026-07-22 SelfStateV1] burn" per
    # that module's own docstring; was never real, not a regression.
    dimensions:
      reliability_pressure: 0.40

  inspect_bus_channel_catalog:
    kind: inspect
    target_kind: system
    target_id: orion/bus/channels.yaml
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.38
    base_risk: 0.05
    reversibility: 1.0
    # contract_pressure removed 2026-07-30: never produced by field_pressures()
    # -- was this template's ONLY dimension, so match_score/confidence were
    # both permanently 0.0 and proposal_urgency() was ALSO permanently 0.0
    # (contract_pressure's "_pressure" suffix let it pass proposal_urgency()'s
    # own dimension filter while contributing nothing, which suppressed that
    # function's real all-4-core-dimensions fallback that an empty dimensions
    # dict now correctly triggers). No real transport/bus-health dimension
    # exists in field_pressures() yet to replace it with -- CHANNEL_DIMENSION_MAP
    # (orion/field/pressure.py) doesn't route any transport-domain channel to
    # any category. Building that is real, separate follow-up work (a new
    # CHANNEL_DIMENSION_MAP category + PRESSURE_DIMENSIONS extension +
    # live variance verification, same discipline already applied to the
    # existing 4 dimensions), not done here. This template now honestly
    # scores 0.0 match/confidence and derives its urgency and priority from
    # the real all-4-core-pressures fallback plus base_priority, not from a
    # fabricated transport-specific signal.
    dimensions: {}

  summarize_transport_contract_drift:
    kind: summarize
    target_kind: capability
    target_id: capability:transport
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.36
    base_risk: 0.05
    reversibility: 1.0
    # contract_pressure removed 2026-07-30 -- see inspect_bus_channel_catalog's
    # comment above for the full account (same disease, same template shape).
    dimensions: {}

  watch_transport_backpressure:
    kind: observe
    target_kind: capability
    target_id: capability:transport
    proposed_effect: preserve_stability
    required_policy_gate: read_only
    base_priority: 0.32
    base_risk: 0.02
    reversibility: 1.0
    # contract_pressure removed 2026-07-30 -- see inspect_bus_channel_catalog's
    # comment above for the full account (same disease, same template shape).
    dimensions: {}

  defer_due_to_low_readiness:
    kind: defer
    target_kind: self_state
    target_id: self:current
    proposed_effect: preserve_stability
    required_policy_gate: none
    base_priority: 0.25
    base_risk: 0.0
    reversibility: 1.0
    # uncertainty removed 2026-07-30: never produced by field_pressures()
    # -- see dimension_weights' own comment above.
    dimensions:
      reliability_pressure: 0.50

  inspect_node_resource_pressure:
    kind: inspect
    target_kind: node
    target_id: node:atlas
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.34
    base_risk: 0.05
    reversibility: 1.0
    dimensions:
      resource_pressure: 0.50

  inspect_field_topology_catalog:
    kind: inspect
    target_kind: field
    target_id: config/field/orion_field_topology.v1.yaml
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.33
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30: never produced by field_pressures()
    # -- was this template's ONLY dimension (match_score/confidence
    # permanently 0.0 either way it's expressed). Unlike the contract_pressure
    # templates above, field_intensity never passed proposal_urgency()'s
    # "_pressure"-suffix filter, so that function's real all-4-core-
    # dimensions fallback was ALREADY triggering before this change --
    # urgency is unaffected, this edit only makes the empty match/confidence
    # honest in the schema instead of implying a scored (but fake) dimension.
    dimensions: {}

  # P5: attention-bound proposal target. target_id/target_kind below are the
  # fallback literal, used only if target_binding fails to resolve (empty
  # dominant_attention_target_details, or a resolved target_kind outside the
  # accepted whitelist). When it resolves, the candidate's target_id/target_kind
  # follow self_state.dominant_attention_target_details[0] instead.
  #
  # Kill criterion (falsifiable by design, not yet run -- needs live traffic):
  # over a 7-day window, distinct(target_id) across this template's candidates
  # must be >= 3, or the binding isn't doing anything Orion's attention doesn't
  # already do via the literal templates above. See
  # orion/autonomy/evals/run_attention_bound_proposal_eval.py.
  inspect_attended_target:
    kind: inspect
    target_kind: capability   # placeholder default kind; overridden per-candidate when binding resolves to a different kind
    target_id: capability:orchestration   # fallback literal, used only if the binding fails to resolve
    target_binding: "attention.dominant_targets[0]"
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.34   # shipped live per explicit user go-ahead ("turn on whatever you need"), not dark-shipped at 0.0 -- read-only inspect proposal under the existing policy gate, same risk class as every other already-live inspect template
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30 -- see inspect_field_topology_catalog's
    # comment above for the full account (same disease, same template shape).
    # This template's real live relevance signal is the attention binding
    # itself (target_binding above), not a pressure dimension -- it was never
    # this template's actual reason to exist.
    dimensions: {}

  # 2026-08-12: the first MUTATING template. Everything above proposes reading
  # or describing; this proposes doing something to the host.
  #
  # Triggered on resource_pressure, which is deliberately APPROXIMATE -- after
  # the 2026-08-11 thermal unmap that dimension is a max() over five live
  # capability channels (cpu/memory/gpu/disk/stream_backlog), so it rises on
  # disk pressure but also on the other four. That imprecision is fine here and
  # is the intended division of labour: the proposal only has to make the
  # action *worth considering*, and the skill's own gate does the precise
  # decision (disk >= 75% AND reclaimable >= 40GB, measured at execution time
  # from the real filesystem and the real Docker daemon). A proposal that
  # reaches a host with nothing to reclaim is DECLINED by the skill and
  # recorded as `declined_nothing_to_reclaim` with escalate=true, which is a
  # more useful outcome than never proposing.
  #
  # base_risk 0.12, and the number is load-bearing rather than decorative.
  #
  # It was 0.35 in the first draft, chosen to "signal that this is mutating and
  # serious". That was a category error: `risk` here is not a label, it is a
  # number the substrate policy's thresholds ACT on. At 0.35 it exceeds
  # config/policy/substrate_policy.v1.yaml's `require_review_above_risk: 0.20`,
  # so the evaluator returns `requires_operator_review` -- which is in
  # execution_dispatch_policy.v1.yaml's `blocked_policy_decisions`. The risk
  # value chosen to convey seriousness would have made the action permanently
  # undispatchable, silently. Caught by a gating test.
  #
  # 0.12 is under `approve_read_only_max_risk: 0.15` and reflects what this
  # action actually costs when wrong: Docker build cache is regenerable by
  # definition, so the worst case is one slow rebuild. reversibility 1.0 is
  # literal, not aspirational.
  #
  # The safety does not come from the risk number. It comes from three
  # independent gates: mode.allow_mutating_dispatch (ON since 2026-08-12), the
  # maintenance_bounded scope check, and the skill's own measured gate
  # (disk >= 75% AND reclaimable >= 40GB, read from the real filesystem and the
  # real Docker daemon at execution time).
  prune_build_cache:
    kind: maintain
    target_kind: system
    target_id: host:docker_build_cache
    proposed_effect: preserve_stability
    required_policy_gate: read_only
    base_risk: 0.12
    reversibility: 1.0
    # 2026-08-12: was unset, so it defaulted to 0.00 while every one of the
    # twelve sibling templates carries 0.20-0.42. That is an omission from the
    # template's original patch, not a deliberate ranking -- combined with the
    # wrong trigger dimension it is the other half of why this action could
    # never win a slot.
    #
    # 0.30 matches `watch_reliability`, the closest analogue (watch for a
    # condition, act when it is real). Deliberately NOT above the inspect
    # leaders at 0.38-0.42: this action should compete on the strength of its
    # own trigger being lit, not outrank everything by fiat.
    base_priority: 0.30
    dimensions:
      # 2026-08-12: was `resource_pressure: 0.50`, which measured the wrong
      # thing. Verified live after the arming deploy: real disk 84% full, and
      # this candidate was being built every tick, correctly evaluated as
      # `maintain`, and then SUPPRESSED at priority 0.0972 against
      # min_priority 0.10 -- because resource_pressure read 0.0521. That
      # dimension derives from cpu/stream-backlog load, so a quiet-but-full
      # host looks calm to it. `capacity_pressure` is fullness itself
      # (0.7953 at the same instant). See orion/field/pressure.py.
      capacity_pressure: 0.60
      # Kept, weighted low: a full disk on an already-loaded host is a worse
      # moment to add I/O than a full disk on an idle one, and the prune is
      # itself I/O-heavy. This is a tiebreak, not the trigger.
      resource_pressure: 0.15
