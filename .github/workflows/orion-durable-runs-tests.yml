      - "orion/gpu_pool/**"
      - "config/gpu_pool.yaml"
      - "config/llm_profiles.yaml"
      - "services/orion-durable-runs/**"
      - "orion/schemas/durable_run.py"
      - "orion/schemas/reverie_visual_run.py"
      - "orion/schemas/compactor_digest_run.py"
      - "orion/cognition/compactor/**"
      - "orion/schemas/orion_day.py"
      - "orion/orion_day/**"
      - "orion/dream/introspect_sql.py"
      - "orion/journaler/**"
      - "orion/world_pulse_read/introspect.py"
      - "orion/cognition/verbs/orion_day_*.yaml"
      - "orion/cognition/prompts/orion_day_*.j2"
      - "services/orion-sql-db/manual_migration_orion_day_letter_v1.sql"
      - "orion/schemas/resource_admission.py"
      - "orion/durable_runs/**"
      - "services/orion-sql-db/manual_migration_gpu_pool_stage5_drop_legacy_tables.sql"
      - "scripts/gpu_pool_stage5_snapshot_and_drop.sh"
      - "orion/llm/resource_lease.py"
      - "orion/schemas/gpu_pool.py"
      - "orion/schemas/harness_finalize.py"
      - "services/orion-llm-gateway/**"
      - "orion/harness/finalize.py"
      - "orion/harness/runner.py"
      - "orion/harness/fcc_motor.py"
      - "orion/hub/turn_orchestrator.py"
      - "services/orion-cortex-orch/app/durable_runs.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "services/orion-harness-governor/app/bus_listener.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "orion/schemas/thought.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-sql-db/manual_migration_durable_resource_admission_v1.sql"
      - "services/orion-sql-db/manual_migration_durable_resource_abandon_pending_v1.sql"
      - "orion/curiosity/journal.py"
      - "orion/curiosity/attention_schema.py"
      - ".github/workflows/orion-durable-runs-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/orion-gpu-pool/app/**"
      - "orion/gpu_pool/**"
      - "config/gpu_pool.yaml"
      - "config/llm_profiles.yaml"
      - "services/orion-durable-runs/**"
      - "orion/schemas/durable_run.py"
      - "orion/schemas/reverie_visual_run.py"
      - "orion/schemas/compactor_digest_run.py"
      - "orion/cognition/compactor/**"
      - "orion/schemas/orion_day.py"
      - "orion/orion_day/**"
      - "orion/dream/introspect_sql.py"
      - "orion/journaler/**"
      - "orion/world_pulse_read/introspect.py"
      - "orion/cognition/verbs/orion_day_*.yaml"
      - "orion/cognition/prompts/orion_day_*.j2"
      - "services/orion-sql-db/manual_migration_orion_day_letter_v1.sql"
      - "orion/schemas/resource_admission.py"
      - "orion/durable_runs/**"
      - "services/orion-sql-db/manual_migration_gpu_pool_stage5_drop_legacy_tables.sql"
      - "scripts/gpu_pool_stage5_snapshot_and_drop.sh"
      - "orion/llm/resource_lease.py"
      - "orion/schemas/gpu_pool.py"
      - "orion/schemas/harness_finalize.py"
      - "services/orion-llm-gateway/**"
      - "orion/harness/finalize.py"
      - "orion/harness/runner.py"
      - "orion/harness/fcc_motor.py"
      - "orion/hub/turn_orchestrator.py"
      - "services/orion-cortex-orch/app/durable_runs.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "services/orion-harness-governor/app/bus_listener.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "orion/schemas/thought.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-sql-db/manual_migration_durable_resource_abandon_pending_v1.sql"

jobs:
  unit:
    name: durable-runs — graph resume + contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16  # Docker Hub mirror: no unauthenticated pull rate limit
        env:
          POSTGRES_PASSWORD: admission-test
          POSTGRES_DB: admission_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (services/orion-durable-runs/requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-durable-runs/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/orion-durable-runs/tests/requirements-acceptance.txt
      - name: Pytest services/orion-durable-runs/tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: |
          cd services/orion-durable-runs && python -m pytest tests -q -p no:cacheprovider
      - name: Pytest orion/orion_day/tests (Orion's Day gather, budget, contracts)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest orion/orion_day/tests -q -p no:cacheprovider
      - name: Orion's Day eval (fixture day -- prompt separation, grounding, budget)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python orion/orion_day/evals/run_orion_day_eval.py
      - name: Durable-run GPU pool hold fairness eval (home card + gpu2) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/hold_fairness.py
      - name: Deploy-order skew eval (old pool refuses holds, then upgrades) on isolated Postgres
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_ADMISSION_TEST_DSN: postgresql://postgres:admission-test@127.0.0.1:5432/admission_test
        run: python services/orion-durable-runs/evals/deploy_order_skew.py

  gateway:
    # Renamed in GPU pool stage 6.6: the gateway's /capacity broker and shared-capacity
    # lifecycle were deleted in stages 4.6/5.6; this job now runs the gateway suite (pool
    # dispatch, passthrough, transport).
    name: Gateway — GPU pool dispatch and transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gateway and test dependencies
        run: |
          python -m pip install -r services/orion-llm-gateway/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Gateway transport regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest services/orion-llm-gateway/tests -q -p no:cacheprovider
