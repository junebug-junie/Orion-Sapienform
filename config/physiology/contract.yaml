sources:
  - module: scripts/analysis/sample_body_economy_bids.py
    role: display
    reason: read-only live sample (Patch C1); decides one want per family locally against the live prices and act history. Publishes, reserves and writes nothing.
  - module: scripts/analysis/smoke_body_economy_prices.py
    role: display
    reason: read-only live smoke; replays the Budget organ over stored physiology_state ticks and prints the prices. Gates nothing.
  - module: orion/autonomy/thermal_gate.py
    reason: defines ThermalState / thermal_state() and the 32/34 C lines (protected path).
  - module: orion/autonomy/cabinet_heat.py
    reason: reads cabinet temperature into CabinetHeatReading; defines the reflex reasons.
  - module: orion/regulation/arousal.py
    reason: the arousal reducer (levels, strain causes).
  - module: orion/regulation/arousal_view.py
    reason: judges a reading into a level; defines the arousal_* reason constants.
  - module: orion/regulation/arousal_read.py
    reason: shared one-GET fetch of orion:regulation:latest; gating stays in callers.
  - module: orion/regulation/strain_news.py
    reason: derives strain onset/rest news from the reading.
  - module: orion/schemas/regulation.py
    reason: RegulationStateV1 schema and the Redis key constant.
  - module: orion/schemas/registry.py
    reason: registers RegulationStateV1 in the schema registry.
  - module: orion/schemas/reverie_visual.py
    reason: visual-chain schema; defines the thermal_refused / deferred_thermal outcome literals.
  - module: orion/schemas/hardware_watch.py
    reason: hardware-watch claim schema (cabinet_hot reason literal).
  - module: orion/inner_state_registry.py
    reason: registers RegulationStateV1 as an inner-state surface.
  - module: services/orion-hub/scripts/arousal_reader.py
    reason: Hub-side fetch helper (ArousalReader); gating stays in its callers.
  - module: services/orion-durable-runs/app/main.py
    reason: producer; writes RegulationStateV1 to orion:regulation:latest.
  - module: services/orion-durable-runs/app/regulation_store.py
    reason: producer; gathers arousal inputs (cabinet heat, GPU faults).
  - module: services/orion-durable-runs/app/temporal_self_graph.py
    reason: producer; the regulate step that classifies arousal.
  - module: services/orion-durable-runs/app/temporal_self_driver.py
    reason: producer; drives the temporal-self thread and holds the latest state.
  - module: services/orion-durable-runs/app/runner.py
    reason: imports the temporal-self workflow name constant from the regulation schema module.
  # Body economy Patch A3 (Organ 1 Body). Define / produce / persist PhysiologyStateV1; gate nothing.
  - module: orion/schemas/physiology.py
    reason: defines PhysiologyStateV1 (Organ 1 Body readings; no prices yet).
  - module: orion/physiology/body.py
    reason: the pure Body reducer; builds PhysiologyStateV1 from raw source reads.
  - module: services/orion-durable-runs/app/physiology_store.py
    reason: producer; reads the Body organ's sources (energy, GPU leases, deferrable backlog, host watts, outreach, claude limits).
  # Body economy Patch B2 (Organ 2 Budget + Organ 5 strain dial), SHADOW: computes and publishes a
  # price per constraint on PhysiologyStateV1; nothing that decides reads it.
  - module: orion/physiology/budget.py
    reason: the pure Budget reducer; prices each Body reading (dual ascent, anti-windup) and the strain dial. Gates nothing.
  - module: orion/physiology/heat_config.py
    reason: loads config/physiology/heat_sensitivity.yaml (written by fit_heat_sensitivity.py --write-config) for the heat price. Gates nothing.
  - module: services/orion-sql-writer/app/worker.py
    reason: persists PhysiologyStateV1 to physiology_state (route + schema map); gates nothing.
  # Body economy Patch C1 (Organ 3 Appetite + Organ 3b weights + Organ 4 Choice), SHADOW: they compute
  # a WantDecisionV1 per bid and publish it; NOTHING obeys it yet (Patch D moves each `bidder` above to
  # bid(), one reader per PR, and that PR changes its row). orion/physiology/families.py and client.py
  # import no watched module (the checker does not see them as readers) and gate nothing either: a
  # failed bid returns None and the caller keeps its own gate.
  - module: orion/physiology/appetite.py
    reason: pure Appetite; intensity from time unfunded (act closes), value_rank within family, cost estimate. Gates nothing.
  - module: orion/physiology/weights.py
    reason: pure learned family weights (shrinkage toward act_downstream_use / Juniper-reply rates, 0.1/day drift cap). Gates nothing.
  - module: orion/physiology/choice.py
    reason: pure Choice; prices a want against the posted prices with reservations and returns a SHADOW decision. Nobody obeys it yet.
  - module: services/orion-durable-runs/app/physiology_market.py
    reason: producer; POST /physiology/bid reads act history + the latest physiology state, decides (shadow) and publishes the decision. Gates nothing.
