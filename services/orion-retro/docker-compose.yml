services:
  retro:
    container_name: orion-athena-retro
    build:
      context: ../..
      dockerfile: services/orion-retro/Dockerfile
    restart: unless-stopped
    init: true
    user: "${RETRO_UID:-1000}:${RETRO_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    # N64 renders in software (Angrylion, 16 threads): ~2x real speed at 12 CPUs,
    # 21 fps at 2. GoldenEye's microcode needs all 16 threads to hold 60 fps, so the
    # quota is 20 CPUs -- 16 render threads plus the core and worker, unthrottled.
    # The RSP is jttl (JIT); CXD4 (interpreted) left ~5 cores busy of this quota with
    # the render threads idle, so quota alone was never the ceiling.
    # A 32 MB ROM plus a 16.8 MB state needs more than 512 MB; measured use stays near
    # 0.2 GiB of 1.5 GiB (never OOMKilled), so 4 GiB is headroom, not the fix.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 20
    ulimits:
      core: 0
      fsize: 268435456
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    environment:
      RETRO_ENABLED: ${RETRO_ENABLED:-false}
      RETRO_COGNITION_ENABLED: ${RETRO_COGNITION_ENABLED:-true}
    network_mode: none
    volumes:
      - ${RETRO_SOCKET_DIR:?private socket directory required}:/ipc
      - ${RETRO_CATALOG_DIR:?local catalog required}:/catalog:ro
      - ${RETRO_EVIDENCE_DIR:?local evidence required}:/evidence
      - ${RETRO_SAVES_DIR:?save-state directory required}:/saves
      - ${RETRO_TOKEN_FILE:?operator credential required}:/run/secrets/retro_operator:ro
      - ${RETRO_HUB_TOKEN_FILE:-/dev/null}:/run/secrets/retro_hub:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: [CMD, python, -m, app.health]
      interval: 15s
      timeout: 3s
      retries: 3
