name: compare_options
label: Compare Options
description: >
  Produce a comparative analysis of options. Include pros/cons, tradeoffs,
  and concrete criteria. Output the actual comparison, not a meta-plan to compare.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 90000

services:
  - LLMGatewayService

prompt_template: compare_options_prompt.j2

steps:
  - name: compare
    order: 0
    services: [LLMGatewayService]
    prompt_template: compare_options_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
