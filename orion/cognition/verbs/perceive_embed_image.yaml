name: perceive_embed_image
description: "Compute embeddings for an image."
steps:
  - step: call_host
    service: vision.host
    method: request
    payload:
      task_type: embed_image
      request: "{{ input }}"
    result_key: host_result

output_template: "perceive_embed_image.j2"

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: autonomic
  lanes: []
  deferrable_window_s: 0
