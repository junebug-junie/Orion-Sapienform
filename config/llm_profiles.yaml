      - 32k context favors useful conversation memory without overcommitting KV cache.
      - Thinking enabled, but generation budget kept moderate for survivable latency.
      - If OOM: lower ctx_size to 24576, then lower batch_size to 512.

  qwen36-35b-a3b-udq5km-2xv100-32gb-deep-cognition:
    display_name: "Qwen 3.6 35B A3B – UD-Q5_K_M (llama.cpp, 2x V100 32GB, deep cognition)"
    task_type: chat
    backend: llamacpp
    model_id: "qwen36-35b-a3b-ud-q5_k_m"

    supports_tools: true
    supports_embeddings: false
    # NOTE: supports_vision was removed from the LLM gateway's profile model on
    # 2026-08-14 -- nothing read it, and this lane is exactly why it was
    # misleading. Vision is resolved at runtime from the worker's /props.

    gpu:
      num_gpus: 2
      tensor_parallel_size: 1
      # Primary = SXM2 (device 1 on Circe host numbering via CUDA_VISIBLE / override).
      # Keep both cards visible so overflow layers + long KV can land on the second V100.
      device_ids: [1, 0]
      max_model_len: 131072
      max_batch_tokens: 958
      max_concurrent_requests: 1
      gpu_memory_fraction: 0.90

    llamacpp:
      model_root: "/models/gguf"
      hf_repo_id: "unsloth/Qwen3.6-35B-A3B-GGUF"
      hf_filename: "Qwen3.6-35B-A3B-UD-Q5_K_M.gguf"
      # Multimodal projector for the chat lane, added 2026-08-14 so Juniper can
      # show Orion an image in Orion's own primary conversational voice rather
      # than being routed to a different model to be seen.
      #
      # This lane's weights were already VL-capable and nobody had noticed: the
      # GGUF's chat template opens with `image_count`/`video_count` namespaces
      # (the Qwen3-VL family template), and unsloth/Qwen3.6-35B-A3B-GGUF ships
      # mmproj-BF16/F16/F32. The worker was simply launched without --mmproj, so
      # `/props` reported `modalities.vision: false` (measured live on :8011).
      #
      # F16 rather than BF16/F32: V100 (sm_70) has no native bf16 path, and F32
      # doubles projector VRAM for no quality gain at this quant level.
      #
      # No env change is needed for this: mmproj_filename is profile-only (read by
      # _ensure_mmproj_file() in orion-llamacpp-host/app/main.py), and the mtmd
      # build requirement is already met -- this worker reports build_info
      # b10398-8e7f22b67, the same binary the agent lane serves images on
      # (verified live 2026-08-14). ctx_size is deliberately UNCHANGED at 131072.
      #
      # VRAM is the real risk and it is NOT yet measured: ~24GB of Q5_K_M weights
      # plus a 131k KV cache already sit close to the 2x V100 32GB budget, and the
      # projector adds ~1-2GB on top. If bring-up OOMs, drop ctx_size to 98304
      # before touching n_gpu_layers -- KV at this context is the larger term.
      # Note 131072 is documented above as needing to stay in lockstep with
      # HARNESS_FCC_MAX_CONTEXT_TOKENS and the Hub agent-claude budget, so lowering
      # it is not a free knob -- it is an operator decision, not a silent fallback.
      #
      # Still genuinely unverified: whether b10398 recognises the Qwen3-VL vision
      # tower for THIS gguf. The same binary handles Muse Glimmer's ViT-G/14, but
      # that is a different architecture. Watch the boot log for an mmproj/arch
      # error, not just for OOM.
      mmproj_filename: "mmproj-F16.gguf"
      host: "0.0.0.0"
      port: 8080

      # Native train ctx is 262k; 131k is the monster-FCC step before full native.
      # Must stay in lockstep with HARNESS_FCC_MAX_CONTEXT_TOKENS / Hub agent-claude budget.
      ctx_size: 131072
      n_gpu_layers: 99
      #97
      threads: 18
      #threads: 27

      # n_parallel=1 keeps the full window for FCC/harness (n_parallel>1 splits slots
      # and 400s long prompts as exceed_context).
      n_parallel: 1
      batch_size: 1024
      # mmproj_filename alone is not sufficient for images to actually work --
      # ubatch_size/image_min_tokens/image_max_tokens were unset here (the prior
      # #ubatch_size: 551 above was dead/commented, and this lane is the only one
      # of the four mmproj profiles in this file missing all three). Every other
      # working mmproj profile in this file sets all three together; without
      # image_max_tokens the mtmd vision encoder's token budget is whatever
      # llama-server defaults to (unverified for this build), and without
      # ubatch_size >= image_max_tokens (vision encoder is non-causal, same
      # constraint documented on the gemma4/muse-glimmer profiles below) an image
      # request can fail or silently truncate instead of just being slow.
      #
      # 280/560 chosen over muse-glimmer-agent-vision's 256/1024: this lane ties
      # gemma4-e4b at the largest ctx (131072) of the four mmproj profiles in
      # this file, but on 2 GPUs instead of gemma4-e4b's 1 -- and carries the
      # tightest documented VRAM margin per GPU (see the "VRAM is the real
      # risk" note above) -- matching gemma4-31b's 2x-V100 numbers (the closest
      # hardware analog) is the more conservative starting point.
      # ubatch_size kept at the already-proven-stable batch_size (1024, unchanged)
      # rather than raised to 2048 like gemma4-31b, since headroom here is
      # smaller and 1024 already clears >= image_max_tokens with margin.
      #
      # IMPORTANT: 280/560 is a GPU-hardware-similarity analogy to gemma4-31b,
      # not a Qwen3-VL-specific number -- image_min/max_tokens governs the mtmd
      # vision encoder's own patch/resolution token budget, a property of the
      # vision tower, not of GPU capacity. Gemma's figure comes from Google's
      # SigLIP tower sizing; whether Qwen3-VL's tower maps images to a similar
      # token count per image is genuinely unverified for this build/gguf (same
      # "unverified" status as the mmproj-recognition risk noted above). A wrong
      # number here degrades silently (over/under-budgeted visual detail, no
      # crash) -- confirm with a real image-description smoke test, not just a
      # clean boot, before trusting image quality on this lane.
      # If OOM: lower image_max_tokens to 280 (matches image_min_tokens, same
      # fallback gemma4-31b's notes use) before touching ctx_size or n_gpu_layers.
      ubatch_size: 1024
      image_min_tokens: 280
      image_max_tokens: 560

      reasoning: "off"
      reasoning_budget: 0
      #reasoning_format: "deepseek"
      #chat_template_kwargs:
      #  enable_thinking: true

      no_context_shift: true
      # ~25GB Q5 fits one 32GB V100; skew layers to GPU0 so GPU1 is mostly KV/overflow.
      # Equal 1,1 pays PCIe tax without buying context. No YaRN — native 262k first.
      # 2026-07-10 note: after llama-optimus, multi-GPU briefly produced token salad on this
      # host; may have been dirty GPU state. Dual 3,1 was previously stable for ~2 days —
      # re-verify with a short completion smoke after Circe reboot before trusting FCC.
      split_mode: "layer"
      tensor_split: "3,1"
      flash_attn: "off"

      # Cooler than Unsloth chat defaults (0.7/0.8/1.5) for FCC tool+code stability.
      temperature: 0.48
      top_k: 20
      top_p: 0.95
      min_p: 0.0
      presence_penalty: 1.10

      n_predict: 16384

      # --- Speculative decoding (OPTIONAL; leave commented until Circe VRAM/tg bench) ---
      # Draft competes with the 131k KV window on 2xV100. Do NOT lower ctx_size / FCC
      # budgets in the same change as enabling draft — treat Circe VRAM/tg evidence and
      # any FCC/Hub budget change as an explicit follow-up, not this annotation.
      # Candidate: same Qwen3 tokenizer family, tiny draft (~0.6B Q4_K_M).
      #hf_draft_repo_id: "unsloth/Qwen3-0.6B-GGUF"
      #hf_draft_filename: "Qwen3-0.6B-Q4_K_M.gguf"
      #n_gpu_layers_draft: 99
      #draft_min: 4
      #draft_max: 16

    notes: |
      Deep-cognition Qwen 3.6 35B-A3B profile for two V100 32GB GPUs (monster FCC).
      - Target lane: Cortex / planner / introspection / deep repo reasoning / FCC motor.
      - Uses Unsloth dynamic GGUF UD-Q5_K_M (~25GB) — prefer over Q6 so KV headroom survives.
      - 131k ctx (n_parallel=1) must match HARNESS_FCC_MAX_CONTEXT_TOKENS / Hub agent Claude budget.
      - tensor_split 3,1 + layer: park weights on primary V100; second card absorbs overflow/KV.
      - flash_attn off (Volta); sampling kept cooler than Unsloth chat card for agent stability.
      - If OOM at 131k: try tensor_split 3,1 then 2,1, then lower ctx_size to 98304 / 65536.
      - Do not enable YaRN until native 262k is proven and still insufficient.
      - Speculative decoding: host supports hf_draft_* / draft_min / draft_max / n_gpu_layers_draft.
        Uncomment the draft block above only after a live Circe VRAM + tg/s check. Draft VRAM
        competes with KV. Do not change FCC/Hub context budgets without an explicit follow-up.
        MTP / draft-mtp is out of scope for this profile annotation.


