name: introspect_spark
kind: task
personality_file: orion/cognition/personality/orion_identity.yaml
# Short timeout because this is a background feeling, not a complex thought
timeout_ms: 300000
steps:
  - name: generate_introspection
    # Point to the new file
    prompt_template: introspect_spark.j2
    # Use the standard gateway service
    services:
      - LLMGatewayService
    timeout_ms: 250000

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 1
  family: spark.introspect
  lanes: [fast]
  deferrable_window_s: 600
