  # ─────────────────────────────────────────────
  # Muse Glimmer 30B — HF: https://huggingface.co/unsloth/Muse-Glimmer-30B-GGUF
  # Dense causal transformer (~29.6B, all active — not MoE), 52 layers, 6656 hidden,
  # 32/2 attention heads (GQA 16:1), SwiGLU FFN, 202048 vocab, native 131072+ ctx.
  # Distilled from Muse Spark for autonomous agentic tasks. Apache 2.0.
  # Integrated frozen ViT-G/14 (~1.8B) perception encoder; text+image in, text out.
  # Reliable tool/function calling per model card.
  # Google-style sampling per model card: temperature=1.0, top_p=0.95, top_k=64.
  #
  # REQUIRED llama-server build: ggml-org/llama.cpp PR #26841 "model: Muse Glimmer
  # Support" (new LLM_ARCH + vision-encoder graph code + DFlash drafter support),
  # merged 2026-08-10 -- llama-server cannot recognize this architecture AT ALL
  # (text, vision, or draft) on any older build, including this stack's current
  # LLAMACPP_IMAGE_TAG=server-cuda-b8740 default (~April 2026). This profile needs
  # LLAMACPP_IMAGE_TAG=server-cuda-b10398 (or later).
  # DO NOT just bump the repo-wide default fallback for this: config/biometrics/
  # node_catalog.yaml confirms Circe already runs orion-atlas-llamacpp-chat (the
  # "chat" lane, port 8011) continuously, and LLAMACPP_IMAGE_TAG is one shared build
  # arg per docker-compose.atlas-workers.yml invocation -- if Circe's chat and agent
  # workers share one .env/compose invocation on that host (has not been confirmed
  # from here; verify before deploying), bumping the tag for this profile also
  # rebuilds the already-stable chat worker onto a 3-day-old master build with no
  # bench pass. If they do share an env file, either split Circe onto two compose
  # invocations with separate LLAMACPP_IMAGE_TAG values, or accept and bench the
  # chat-lane rebuild too -- don't bump silently either way.
  # RESOLVED 2026-08-14 by live probe of both Circe workers' /props:
  #   chat  :8011 -> build_info b10398-8e7f22b67, modalities.vision False
  #   agent :8014 -> build_info b10398-8e7f22b67, modalities.vision True
  # They DO share one build (same build_info), the tag is ALREADY b10398, and the
  # chat lane has been running stably on it -- so the "bumping the tag silently
  # rebuilds the stable chat worker" risk above is moot: that rebuild already
  # happened and held. No LLAMACPP_IMAGE_TAG change is needed for either lane.
  # The agent lane serving images on this exact binary is also the live proof that
  # mtmd/--mmproj works on b10398 here, not just in theory.
  muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision:
    display_name: "Muse Glimmer 30B – UD-Q4_K_XL + mmproj (llama.cpp, 1x V100 32GB, Circe Agent lane, text+image)"
    task_type: multimodal
    backend: llamacpp
    model_id: "muse-glimmer-30b-ud-q4_k_xl"

    supports_tools: true
    supports_embeddings: false
    supports_vision: true

    gpu:
      num_gpus: 1
      tensor_parallel_size: 1
      device_ids: [0]
      max_model_len: 32768
      max_batch_tokens: 1024
      max_concurrent_requests: 1
      gpu_memory_fraction: 0.90

    llamacpp:
      model_root: "/models/gguf"
      hf_repo_id: "unsloth/Muse-Glimmer-30B-GGUF"
      hf_filename: "Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
      # Q8_0 mmproj paired with the Q4 text weights (repo also ships a BF16 mmproj,
      # ~same size class since the vision tower is only ~1.8B — bump to BF16 if VRAM allows).
      mmproj_filename: "mmproj-Muse-Glimmer-30B-Q8_0.gguf"
      host: "0.0.0.0"
      port: 8080

      ctx_size: 32768
      n_gpu_layers: 99
      threads: 16
      n_parallel: 1
      batch_size: 1024
      ubatch_size: 1024

      # Card ceiling is 4096 visual tokens/image; kept well under that for VRAM/throughput
      # headroom on a single 32GB card. batch_size/ubatch_size must stay >= image_max_tokens
      # (mtmd vision encoder is non-causal) — raised both to 1024 to match.
      image_min_tokens: 256
      image_max_tokens: 1024

      # V100 is Volta. Left off: qwen3-coder-next-q5km-2xv100-32gb-agent-depth's llama-optimus
      # bench found flash_attn on collapses TG ~20x on Volta. The 1x-V100 qwen36-35b-a3b
      # "balanced" profile sets it on anyway — untested here, treat that as an open
      # inconsistency, not a precedent to copy without its own bench.
      no_context_shift: true
      flash_attn: "off"

      # Google-style sampling per Muse Glimmer model card (matches gemma4-*-it profiles).
      temperature: 1.0
      top_k: 64
      top_p: 0.95
      min_p: 0.0
      presence_penalty: 0.0

      n_predict: 16384

      # --- Speculative decoding (DFlash, native to this model — see model card) ---
      # HF README, verbatim: "Muse Glimmer ships with a lightweight 'drafter' model based
      # on DFlash, a small companion network that proposes entire blocks of tokens at
      # once." This is the model's own shipped drafter, not a hand-picked small LLM.
      # DFlash is architecturally different from classic small-LM speculative decoding
      # (block-diffusion drafting w/ target-hidden-state injection) and llama-server
      # requires --spec-type draft-dflash + --spec-draft-n-max for it (docs/speculative.md,
      # ggml-org/llama.cpp PR #22105, merged 2026-06-28) -- app/main.py now emits both when
      # spec_type is set, gated behind --spec-type appearing in --help (see main.py: if the
      # pinned build doesn't advertise it, the draft is skipped entirely rather than loaded
      # under the classic path, since a dflash-arch draft GGUF is not safely interpretable
      # there). spec_draft_n_max: 16 matches this drafter's trained block size (model card:
      # "Draft layers: 5, Block size: 16 tokens per forward pass") -- llama-server clamps to
      # the GGUF's own metadata regardless, but set explicitly rather than relying on that.
      # Needs the same LLAMACPP_IMAGE_TAG=server-cuda-b10398+ pin as the base model (see the
      # profile header above) -- the underlying arch-loading gap covers this too, it isn't a
      # separate requirement. Also worth knowing before trusting this in production: upstream
      # issue ggml-org/llama.cpp#25116 (status: bug-unconfirmed, open as of 2026-08-13)
      # reports a GGUF architecture-name/nested-key mismatch ("dflash" vs "dflash-draft";
      # flat vs nested target_layer_ids keys) breaking DFlash draft loading for a different
      # model (Qwen3.6-27B) on the same DFlash mechanism -- not confirmed to affect Muse
      # Glimmer's own dflash-kquant.gguf, but the failure mode is a hard load error
      # ("DFlash model requires 'target_layers' in GGUF metadata"), not silent degradation,
      # so a first-boot smoke check will surface it immediately if it does apply here.
      hf_draft_repo_id: "unsloth/Muse-Glimmer-30B-GGUF"
      hf_draft_filename: "dflash-kquant.gguf"
      spec_type: "draft-dflash"
      spec_draft_n_max: 16

    notes: |
      Agent-lane Muse Glimmer 30B (dense, text+image, tool-calling, DFlash speculative
      decoding) for 1x V100-class 32GB GPU on Circe, Agent compute GPU lane (wire via
      ATLAS_AGENT_PROFILE_NAME -- that env var name is a fixed naming convention for
      this worker pattern, not a statement of physical host; see the profile header
      above for a prior mix-up on exactly this point, corrected 2026-08-14).
      - REQUIRES LLAMACPP_IMAGE_TAG=server-cuda-b10398 (or later) — do not rely on the
        repo-wide default fallback (server-cuda-b8740, ~April 2026). llama.cpp did not
        recognize this model's architecture at all before ggml-org/llama.cpp PR #26841
        merged 2026-08-10; this gates text+vision, not just DFlash. LLAMACPP_IMAGE_TAG is
        one shared build arg per compose invocation across co-located workers on the same
        .env — Circe already runs orion-atlas-llamacpp-chat continuously
        (config/biometrics/node_catalog.yaml), so confirm whether that worker shares this
        one's env before bumping the tag.
        LIVE-VERIFIED 2026-08-14 on Circe at this tag: clean boot, target arch recognized,
        mmproj vision loaded, DFlash drafter loaded and self-described correctly
        (n_extract=5 matches the model card's "Draft layers: 5"). No "DFlash model
        requires 'target_layers'" error — upstream issue #25116 does not appear to affect
        this GGUF. NOT yet verified: actual completion output quality / tokens-per-sec
        with the drafter active — boot success alone doesn't confirm that.
      - VRAM budget: UD-Q4_K_XL weights ~15.9GB + Q8_0 mmproj ~1.9GB ≈ 17.8GB, leaving
        ~14GB of the 90%-of-32GB budget for 32k KV + batch/ubatch overhead. GQA 16:1
        (32 query / 2 KV heads) keeps KV cache lean at this context, same order as
        qwen36-35b-a3b-udq4km-v100-32gb-balanced already proven to fit this card. Speculative
        decoding adds a small draft-model + extra-KV overhead on top of this budget that
        hasn't been separately benched — watch VRAM headroom on first boot.
      - Thinking: this model does NOT use chat_template_kwargs.enable_thinking or
        --reasoning-budget like Qwen3/Gemma — the card's mechanism is literal
        "Reasoning strength: <low|medium|high|xhigh>" text placed in the system prompt.
        Left llamacpp.reasoning/reasoning_format/chat_template_kwargs unset here on purpose;
        wiring any of them would silently do nothing for this model. Set reasoning strength
        from the caller/orchestrator side (system prompt), not from this profile.
      - Single parallel slot (agent lane): matches qwen3-coder-next-*-agent-* precedent —
        keeps smolagents/tool-loop steps stable rather than splitting context across slots.
      - Speculative decoding (DFlash) is wired and live-verified booting (see header).
        Boot log detail worth knowing, not a bug: llama-server logs
        "dflash requires ctx_other to be set (this warning is normal during memory
        fitting)" as an E-level line during its first (intentionally-failing) memory
        probe pass, then loads for real on the second pass — expected two-pass behavior,
        not a real error. Also logs "requested draft size (n_max=16, n_min=0) exceeds
        the trained block size 16 -- clamping to 15" (upstream's own >= vs > boundary
        check on an exact-equal value) — harmless, drops to n_max=15 automatically.
        If the draft model fails to load for a different reason, check logs for
        "DFlash model requires 'target_layers'" specifically — that matches upstream
        issue #25116's signature, not confirmed to apply to this GGUF but not yet ruled
        out for every quant/config combination either.
      - If OOM: lower ctx_size to 24576 then 16384, then image_max_tokens to 560,
        before falling back to a lower quant (e.g. UD-Q3_K_XL) from the same repo. If VRAM
        is still tight with the draft model loaded, dropping spec_type/hf_draft_* entirely
        falls back to plain (non-speculative) decoding without changing anything else.
      - Wire: ATLAS_AGENT_PROFILE_NAME=muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision,
        LLAMACPP_IMAGE_TAG=server-cuda-b10398 (Circe's agent worker .env — confirm it
        doesn't silently affect Circe's already-running chat worker if they share one env)

  qwen3.8-27b-udq4kxl-v100-32gb-circe-agent-flex:
    display_name: "Qwen3.8 27B – UD-Q4_K_XL (llama.cpp, 1x V100 32GB, Circe Agent-Flex lane)"
    task_type: chat
    backend: llamacpp
    model_id: "qwen3.8-27b-ud-q4_k_xl"

    supports_tools: true
    supports_embeddings: false
    # Not confirmed vision-capable -- Unsloth's own Qwen3.8 deployment docs
    # (fetched 2026-09-02) describe this model's llama.cpp/llama-server
    # deployment in text-only terms, unlike muse-glimmer-30b-udq4kxl above
    # (which explicitly ships an mmproj + image token knobs). Leave false
    # rather than assume; flip once actually confirmed.
    supports_vision: false

    gpu:
      num_gpus: 1
      tensor_parallel_size: 1
      # Doc-only fallback -- the real pin comes from
      # CUDA_VISIBLE_DEVICES_OVERRIDE (services/orion-llamacpp-host/app/
      # main.py:17-18 always prefers that env var over this field when
      # both are present), which orion-gpu-lane-controller forces to "1"
      # at invocation time regardless of whatever's in the env file. Set
      # to 1 here anyway so this profile's own documentation isn't
      # actively wrong about which physical card it's meant for.
      device_ids: [1]
      # Keep in lockstep with llamacpp.ctx_size below.
      max_model_len: 131072
      max_batch_tokens: 1024
      max_concurrent_requests: 1
      gpu_memory_fraction: 0.90

    llamacpp:
      model_root: "/models/gguf"
      hf_repo_id: "unsloth/Qwen3.8-27B-GGUF"
      hf_filename: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
      host: "0.0.0.0"
      port: 8080

      # Unsloth's own recommended sweet spot for this model: 4-bit
      # (16-19GB weights) vs. 6-bit (23-26GB) or 8-bit (31GB, effectively
      # no headroom left on a 32GB card once KV cache is counted). Matches
      # what the user actually asked for ("Q16" isn't a real GGUF quant
      # level; confirmed with Juniper 2026-09-02 this was the intended one).
      #
      # 131072, not 32768 (raised 2026-09-03). At 32768 this lane could not
      # host a Hub Mode=Agent turn AT ALL: measured live, a bare
      # `claude -p "Say OK."` with no MCP config and no harness prefix already
      # costs 11,515 input tokens, and real harness turns on the 131072 lanes
      # measured p90 19,151 / max 25,003 -- and those grow with every tool
      # result inside the turn. The first correctly-routed Agent turn came back
      # "Prompt is too long" / claude exit 1 / verdict=partial.
      #
      # VRAM measured on circe, not estimated from the model card: GPU1 is
      # 32768 MiB and orion-gpu-lane-controller flips it EXCLUSIVELY between
      # affect and agent (that service's README), so this worker owns the whole
      # card while it is up. Live nvidia-smi showed a single tenant at
      # 18,636 MiB at ctx_size 32768; weights are 16,736 MiB (/v1/models
      # `size`), so KV + buffers were ~1,900 MiB. KV is linear in ctx, so
      # 131072 adds ~5.7 GiB -> ~24.3 GiB, inside the 0.90 gpu_memory_fraction
      # cap (29.5 GiB) with ~5 GiB margin. That estimate is deliberately
      # pessimistic: the ~1,900 MiB it scales from also contains fixed compute
      # buffers that do NOT grow with ctx.
      #
      # Now matches chat/harness (both 131072), so the agent lane stops being a
      # special case. If this ever OOMs at boot, 65536 (~20.5 GiB) is the
      # fallback and still clears the measured turn sizes by >2x.
      ctx_size: 131072
      n_gpu_layers: 99
      threads: 16
      n_parallel: 1
      batch_size: 1024

      # Same combination already live-proven for this model family on this
      # exact hardware class (qwen3-30b-a3b-q4km-atlas-agent-64k-think,
      # above): reasoning/reasoning_format enable+structure llama-server's
      # own <think> parsing, independent of the model's chat template.
      reasoning: "on"
      reasoning_format: "deepseek"
      # Qwen3.8's OWN toggle mechanism per Unsloth's docs (fetched
      # 2026-09-02) is chat_template_kwargs.reasoning_effort — NOT the
      # older Qwen3 enable_thinking boolean. xhigh is the model's own
      # documented default; medium/low/none are the other valid values if
      # a shallower budget is ever wanted for this lane specifically.
      # UNVERIFIED: whether the LLAMACPP_IMAGE_TAG already pinned for the
      # agent worker (server-cuda-b10398+, required for muse-glimmer above)
      # is recent enough to have the GGUF's own Jinja template actually
      # honor this kwarg — check the first-boot log for a
      # "chat_template_kwargs but --chat-template-kwargs was not emitted"
      # warning (services/orion-llamacpp-host/app/main.py's own guard) the
      # same way muse-glimmer's boot was checked before trusting this.
      chat_template_kwargs:
        reasoning_effort: "xhigh"
        # Unsloth's "Preserve Thinking": keep the previous turn's reasoning
        # trace in context instead of stripping it. Real variable, not a
        # guess -- it is branched on directly in THIS model's chat template,
        # read live off the running server's /props:
        #
        #   {%- if preserve_thinking is undefined
        #          or preserve_thinking is true
        #          or loop.index0 > ns.last_query_index %}
        #       ... '<think>' + reasoning_content + '</think>' + content
        #   {%- else %}   ... content only
        #
        # NOTE, so nobody re-derives this: `undefined` already takes the
        # preserve branch, so true is the DEFAULT and this line changes no
        # behavior today. Proven on the live lane via POST /apply-template
        # with a two-turn conversation carrying reasoning_content --
        # unset and true render byte-identical prompts (437 chars, trace
        # present); false renders 400 chars with the trace gone.
        #
        # It is set explicitly anyway, as a pin: the default lives in the
        # model's chat template, which ships with the GGUF and can change
        # under us on a re-quant or a template fix. Stating it here means a
        # future default flip is a visible diff rather than a silent
        # behavior change in Orion's continued conversations.
        #
        # CAVEAT worth knowing before expecting an effect: the branch only
        # fires for prior assistant messages that actually carry a
        # `reasoning_content` field. Whether Orion's harness path
        # (Claude Code -> FCC -> gateway anthropic_passthrough) round-trips
        # reasoning back on later turns is NOT established -- see the PR.
        # If it does not, this is inert in both positions.
        preserve_thinking: true

      no_context_shift: true
      # V100 is Volta -- same reasoning as muse-glimmer-30b-udq4kxl above
      # (that profile's own bench found flash_attn on collapses TG ~20x on
      # Volta). Off by default here for the same hardware reason, not
      # re-benched separately for this specific model.
      flash_attn: "off"

      # Unsloth's Thinking-Mode defaults (fetched 2026-09-02) -- reasoning_
      # effort defaults to xhigh above, so this lane runs in thinking mode
      # by default. Their separately-documented Non-Thinking/Instruct
      # sampling (temp 0.7, top_p 0.80, presence_penalty 1.5) is the right
      # set to switch to if chat_template_kwargs.reasoning_effort is ever
      # changed to "none" -- do not mix the two sampling sets with the
      # wrong reasoning_effort value, they were tuned as pairs.
      temperature: 1.0
      top_k: 20
      top_p: 0.95
      min_p: 0.0
      presence_penalty: 0.0
      # Unsloth also recommends repetition_penalty: 1.0 (both modes) --
      # this repo's LlamaCppConfig has no repeat_penalty/repetition_penalty
      # field to carry it (services/orion-llamacpp-host/app/profiles.py),
      # only presence_penalty. Not adding one for a single profile's sake;
      # 1.0 is llama.cpp's own no-op value for that knob, so the gap is
      # low-stakes. Flag if a future profile needs a real (non-1.0) value.

      n_predict: 16384

    notes: |
      Circe Agent-Flex lane: default resident for orion-gpu-lane-controller's
      "agent" target (services/orion-gpu-lane-controller/) once GPU1 (Tesla
      V100-SXM2-32GB, physically the same card orion-affectgpt-worker uses
      when the lane is flipped to "affect") is free. Single V100-32GB, no
      vision, no speculative decoding -- the plainest possible profile for
      this lane, matching what was actually asked for rather than adding
      capability this lane doesn't need yet.
      - REQUIRES LLAMACPP_IMAGE_TAG=server-cuda-b10398 (or later) for the
        chat_template_kwargs.reasoning_effort mechanism above to have any
        chance of being honored -- inherited requirement from the same
        constraint muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision already
        documents for this worker; not independently re-verified for this
        specific model's template.
      - NOT YET LIVE-VERIFIED. Sourced from Unsloth's own Qwen3.8 deployment
        docs (fetched 2026-09-02) plus this repo's existing
        qwen3-30b-a3b-q4km-atlas-agent-64k-think /
        muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision profiles as the
        closest same-hardware-class templates -- not yet booted on real
        hardware. First boot should confirm: (1) weights actually fit in
        ~19GB + 32768 ctx KV cache within the 90%-of-32GB budget, (2) the
        chat_template_kwargs.reasoning_effort kwarg is actually honored (see
        above), (3) real completion quality/tokens-per-sec, none of which
        boot success alone proves.
      - If OOM: lower ctx_size to 24576 then 16384 before falling back to a
        lower quant (e.g. UD-Q3_K_XL) from the same repo, same escalation
        order as muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision above.
      - Wire: ATLAS_AGENT_PROFILE_NAME=qwen3.8-27b-udq4kxl-v100-32gb-circe-agent-flex,
        LLAMACPP_IMAGE_TAG=server-cuda-b10398 (Circe's agent worker .env --
        confirm this doesn't silently affect the chat worker if they share
        one env; same caveat as muse-glimmer above).

  qwen3.8-flash-next-udiq4xs-3xv100-32gb-circe-flagship:
    display_name: "Qwen3.8-Flash-Next – UD-IQ4_XS (llama.cpp, 3x V100 32GB, Circe flagship, LIVE TEST 2026-09-04)"
    task_type: chat
    backend: llamacpp
    model_id: "qwen3.8-flash-next-ud-iq4_xs"

    supports_tools: true
    # Unconfirmed for this specific architecture -- inherited from every other
    # Qwen3.x chat-template profile in this file, not independently verified
    # against Qwen3.8-Flash-Next's actual template. Confirm on first boot.
    supports_embeddings: false
    # CORRECTED 2026-09-04: the original version of this card said no mmproj
    # was found. That was wrong -- it came from only checking the one quant
    # folder. A full repo listing (60 files, all quants) shows
    # `mmproj-BF16.gguf` (0.91GB) and `mmproj-F16.gguf` (0.90GB) at the repo
    # root, so this GGUF family genuinely is vision-capable, matching
    # Unsloth's "multimodal" label. Left false anyway for this first test:
    # wiring mmproj_filename is a separate, deliberate follow-up once the
    # text-only path is confirmed booting, not something to bolt on blind.
    supports_vision: false

    gpu:
      # LIVE TEST, evicted 2026-09-04 at Juniper's explicit go-ahead: GPU0+GPU3
      # (previously the chat/harness 35B, tensor_split 3,1) and GPU1
      # (previously orion-gpu-lane-controller's affect/agent-flex flip) are
      # being taken down for this. Orion's normal circe-hosted chat/agent
      # lanes are unavailable on these three cards for the duration -- see the
      # PR/session notes for exactly what was stopped and when it was restored.
      num_gpus: 3
      tensor_parallel_size: 1
      device_ids: [0, 1, 3]

      # UD-IQ4_XS is ~93.7GB (verified against both Unsloth's own quant table
      # AND the actual per-shard byte sizes on Hugging Face, 2026-09-04) vs
      # 96GB total VRAM across these three cards -- unlike UD-Q4_K_XL's
      # ~111.3GB, this one is at least in the right neighborhood. Still very
      # tight: ~2.3GB of raw headroom before KV cache, compute buffers, or any
      # CPU/GPU split inefficiency, on a model whose own docs say it's
      # designed to lean on system RAM. Do not expect full n_gpu_layers to
      # cleanly fit -- see the escalation ladder in llamacpp below.
      max_model_len: 32768
      max_batch_tokens: 512
      max_concurrent_requests: 1
      gpu_memory_fraction: 0.90

    llamacpp:
      model_root: "/models/gguf"
      hf_repo_id: "unsloth/Qwen3.8-Flash-Next-GGUF"
      # 3-shard split GGUF under UD-IQ4_XS/ -- main.py's
      # _shard_filenames_for_download() expands the remaining 00002/00003
      # shards automatically from this first-shard path, same mechanism
      # qwen3-coder-next-* uses above. Confirmed against the real HF API file
      # listing (`?blobs=true`), byte sizes checked by hand, 2026-09-04.
      hf_filename: "UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"

      # CORRECTED 2026-09-04: the original version of this card assumed a
      # separate PLE/n-gram GGUF existed in this repo for --model-ngram (per
      # Unsloth's own docs, which describe that flag for this exact model).
      # A full listing of all 60 files in unsloth/Qwen3.8-Flash-Next-GGUF
      # (every quant, every shard) turned up nothing ngram/PLE-shaped -- the
      # file the docs describe is not actually in this specific repo. Most
      # likely explanation: Unsloth folded the PLE tensors into the regular
      # weight shards rather than splitting them out (one BF16 shard,
      # 00003-of-00008, is ~102GB vs ~48GB for its siblings -- consistent with
      # that, not proof of it). Leaving ngram_filename UNSET for this test:
      # do not guess a path. If the model fails to load or loads with garbage
      # output, that is the first thing to re-investigate, not assumed away.
      # ngram_filename / ngram_repo_id / ngram_load_mode: see
      # services/orion-llamacpp-host/README.md's "PLE / n-gram table" section
      # for the mechanism if a real split file is ever located.

      host: "0.0.0.0"
      port: 8080

      # Starting at 99 (try full GPU residency) rather than a conservative
      # guess, since this is now a real live test, not a paper estimate --
      # but the VRAM-math note above means this may OOM immediately. Escalate
      # DOWN on OOM: 99 -> 60 -> 40 -> 20, checking `nvidia-smi` headroom at
      # each step before going lower. This profile is CPU/RAM-heavy by design
      # (unlike every other profile in this file that sets 99 because the
      # whole model actually fits), so a partial value here is expected to be
      # the normal outcome, not a failure.
      n_gpu_layers: 99
      threads: 24
      n_parallel: 1
      batch_size: 512

      # 32768, not the model's native 262144: (1) this card set's real VRAM
      # budget is unresolved (see gpu: above), and (2) the llama.cpp PR that
      # added this architecture (ggml-org/llama.cpp#27742) itself records a
      # CUDA abort at the full native ctx (ggml-cuda/norm.cu, invalid argument)
      # with a practical ceiling around 261,888 -- so native ctx is not simply
      # available even once VRAM is sorted. Raise only after both are checked
      # live, not from this table.
      ctx_size: 32768

      # Confirmed applicable to THIS model specifically (Unsloth's own docs
      # give `--chat-template-kwargs '{"reasoning_effort":"medium"}'` as the
      # worked CLI example for Qwen3.8-Flash-Next) -- same mechanism as the
      # 27B agent-flex card above, xhigh is Unsloth's documented default.
      reasoning: "on"
      reasoning_format: "deepseek"
      chat_template_kwargs:
        reasoning_effort: "xhigh"

      no_context_shift: true
      # No established anchor for a 3-way split on this architecture -- every
      # other multi-GPU profile in this file skews toward the card carrying
      # the bulk of the weights (e.g. "3,1" for 2 GPUs), but there is no prior
      # art here to skew from. "1,1,1" is a neutral starting point, not a
      # tuned value -- watch per-GPU `nvidia-smi` usage on first boot and
      # adjust toward whichever card is starving.
      split_mode: "layer"
      tensor_split: "1,1,1"
      # V100 is Volta (sm_70). Whether this brand-new architecture even runs
      # on Volta at all is UNVERIFIED -- nothing in the sources fetched while
      # writing this card confirms or denies it. Off by default for the same
      # reason every other V100 profile in this file is off (Volta flash-attn
      # regression), but this specific architecture was not itself bench-tested.
      flash_attn: "off"

      # Unsloth's Thinking-Mode sampling (fetched from unsloth.ai/docs/models/
      # qwen3.8-next, 2026-09-03/04) -- matches reasoning_effort=xhigh above.
      # Their separately documented Instruct/Non-Thinking set (temp 0.7,
      # top_p 0.80, presence_penalty 1.5) is the pair to switch to if
      # reasoning_effort is ever changed to "none" -- do not mix the two.
      temperature: 1.0
      top_k: 20
      top_p: 0.95
      min_p: 0.0
      presence_penalty: 0.0

      n_predict: 16384

    notes: |
      LIVE TEST, 2026-09-04. Superseded qwen3.8-flash-next-udq4kxl-3xv100-32gb-
      circe-flagship (same idea, UD-Q4_K_XL) after Juniper's explicit
      go-ahead to evict GPUs 0/1/3 for a real boot attempt. Renamed rather
      than edited in place because the quant changed (udq4kxl -> udiq4xs) --
      the old profile name never shipped anywhere, nothing points at it.

      Resolved since the first version of this card:
      1. GPU allocation: Juniper's call, made explicitly -- evict 0/1/3 for
         this test. No longer an open question for this card to flag.
      2. Quant: switched UD-Q4_K_XL (~111.3GB, does not fit 96GB VRAM under
         any circumstance) -> UD-IQ4_XS (~93.7GB, verified against Unsloth's
         own table AND actual per-shard HF byte sizes, 2026-09-04). Tight, but
         in the right neighborhood -- unlike Q4_K_XL, this is not flatly
         impossible.
      3. ngram file: there isn't one in this repo. A full listing of all 60
         files across every quant in unsloth/Qwen3.8-Flash-Next-GGUF has
         nothing ngram/PLE-shaped, despite Unsloth's own docs describing
         --model-ngram usage for this exact model. Not wiring ngram_filename
         for this test -- if the model fails to load or produces garbage
         output, re-open this, don't assume it away.
      4. Vision: corrected an earlier wrong claim in this card. mmproj-BF16.gguf
         / mmproj-F16.gguf DO exist at the repo root (missed originally because
         only the quant subfolder was checked, not the full repo). Deliberately
         not wired for this test (supports_vision stays false) -- confirm the
         text-only path boots first, wire vision as a real follow-up.

      Still open, and this test is exactly how they get resolved:
      5. llama.cpp build: the qwen4exp/PLE architecture merged
         ggml-org/llama.cpp#27742 on 2026-08-27 (~build b10666). Circe's
         current default LLAMACPP_IMAGE_TAG is server-cuda-b8740, and no
         other profile in this file has ever required newer than b10398 --
         this needs a real image bump before this profile can load at all,
         and (per the agent-flex card's own caveat above) may affect other
         workers sharing the same env file.
      6. Volta support unverified: nothing found while researching this card
         confirms or denies the new architecture runs on sm_70 (V100) at all.
         This is a real unknown a boot attempt will answer, not a formality.
      7. Total param count is still DISPUTED between sources fetched
         2026-09-03/04: Unsloth's docs page says 125B total; the model's own
         HF card says 177B total / 6B active per token. Neither number is
         used anywhere in this profile's runtime knobs. GPT-sourced claims of
         an exact "51B" PLE/n-gram table size could not be corroborated in
         any primary source and are NOT carried into this card.

      Escalation order once boot is attempted: if OOM, lower n_gpu_layers
      first (this profile is CPU/RAM-heavy by design, unlike every other
      profile in this file that sets 99 because the whole model fits), then
      ctx_size, before touching quant level.
