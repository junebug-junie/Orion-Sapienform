services:
  policy-runtime:
    build:
      context: ../..
      dockerfile: services/orion-policy-runtime/Dockerfile
    container_name: ${PROJECT}-policy-runtime
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${POLICY_RUNTIME_PORT:-8120}:8120"
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-policy-runtime}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - ORION_BUS_URL=${ORION_BUS_URL:-redis://100.92.216.81:6379/0}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - POSTGRES_URI=${POSTGRES_URI}
      - SUBSTRATE_POLICY_PATH=${SUBSTRATE_POLICY_PATH:-/app/config/policy/substrate_policy.v1.yaml}
      - POLICY_POLL_INTERVAL_SEC=${POLICY_POLL_INTERVAL_SEC:-2.0}
      # ROADMAP D2: bound the "next proposal without a policy frame" scan. 0 rolls it back.
      - POLICY_SCAN_WINDOW_SEC=${POLICY_SCAN_WINDOW_SEC:-0}
      - POLICY_SCAN_BACKSTOP_INTERVAL_SEC=${POLICY_SCAN_BACKSTOP_INTERVAL_SEC:-300}
      - ENABLE_POLICY_RUNTIME=${ENABLE_POLICY_RUNTIME:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

networks:
  app-net:
    external: true
