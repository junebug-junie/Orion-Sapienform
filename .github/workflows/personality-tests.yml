name: Personality
on:
  pull_request:
    paths:
      - 'orion/personality/**'
      - 'services/orion-sql-db/manual_migration_personality_graph_v1*.sql'
      - 'services/orion-sql-db/manual_migration_personality_choice_v1*.sql'
      - 'scripts/personality_rev3_retire_prose_nodes.py'
      - 'tests/test_personality_rev3_retire_prose_nodes.py'
      - 'scripts/analysis/measure_tone_dial_baseline.py'
      - 'scripts/analysis/tests/test_measure_tone_dial_baseline.py'
      - 'scripts/analysis/measure_personality_situation_specificity.py'
      - 'scripts/analysis/tests/test_measure_personality_situation_specificity.py'
      - 'scripts/analysis/eval_personality_naming_grounding.py'
      - 'scripts/analysis/tests/test_eval_personality_naming_grounding.py'
      - 'orion/schemas/personality.py'
      - 'orion/schemas/registry.py'
      - 'tests/test_personality_schemas_registered.py'
      - '.github/workflows/personality-tests.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pydantic==2.11.5 pyyaml
      - run: python -m pytest orion/personality/tests scripts/analysis/tests/test_measure_tone_dial_baseline.py scripts/analysis/tests/test_measure_personality_situation_specificity.py scripts/analysis/tests/test_eval_personality_naming_grounding.py tests/test_personality_schemas_registered.py tests/test_personality_rev3_retire_prose_nodes.py -q
