name: dig-kit-tests

on:
  pull_request:
    paths:
      - "orion/dig/**"
      - "orion/refs.py"
      - "orion/self_inventory.py"
      - "orion/body_atlas/**"
      - "orion/privacy/**"
      - "orion/schemas/reminiscence_run.py"   # test_reminisce_cmd.py pins the daily run's receipt contract
      - "orion/schemas/dream_day.py"          # test_dream_day_cmd.py pins the day dream's read receipt
      - "orion/harness/prefix.py"
      - "orion/harness/tests/test_stance_scope_hierarchy.py"
      - "orion/harness/working_notes.py"
      - "orion/harness/runner.py"
      - "orion/harness/session_resume.py"   # `dig digs` / `dig take-ons` rebuild transcript names with it
      - "orion/harness/evals/turn_repeat_baseline.py"
      - "orion/harness/tests/test_working_notes.py"
      - "orion/cockpit/**"
      - "orion/hub/cockpit_emit.py"
      - "orion/hub/tests/test_cockpit_working_notes_hop.py"
      - "orion/physiology/report_text.py"
      - "orion/physiology/evals/**"
      - "orion/schemas/physiology_report.py"
      - "orion/cognition/verbs/skills.physiology.state.v1.yaml"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/tests/test_skill_verbs.py"
      - "config/integration/**"            # `dig organs` enumerates the organ registry
      - "orion/integration/**"
      - "orion/temporal_self/now.py"
      - "scripts/report_integration_coverage.py"   # test_organs.py pins the roundup's footer to it
      - "orion/attention/**"               # `dig attention` reads world_first's windows and semantics
      - "orion/schemas/temporal_self.py"   # test_attention.py pins its event kinds to TemporalSourceKind
      - ".github/workflows/dig-kit-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/dig/**"
      - "orion/refs.py"
      - "orion/self_inventory.py"
      - "orion/body_atlas/**"
      - "orion/privacy/**"
      - "orion/schemas/reminiscence_run.py"   # test_reminisce_cmd.py pins the daily run's receipt contract
      - "orion/schemas/dream_day.py"          # test_dream_day_cmd.py pins the day dream's read receipt
      - "orion/harness/prefix.py"
      - "orion/harness/tests/test_stance_scope_hierarchy.py"
      - "orion/harness/working_notes.py"
      - "orion/harness/runner.py"
      - "orion/harness/session_resume.py"   # `dig digs` / `dig take-ons` rebuild transcript names with it
      - "orion/harness/evals/turn_repeat_baseline.py"
      - "orion/harness/tests/test_working_notes.py"
      - "orion/cockpit/**"
      - "orion/hub/cockpit_emit.py"
      - "orion/hub/tests/test_cockpit_working_notes_hop.py"
      - "orion/physiology/report_text.py"
      - "orion/physiology/evals/**"
      - "orion/schemas/physiology_report.py"
      - "orion/cognition/verbs/skills.physiology.state.v1.yaml"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/tests/test_skill_verbs.py"
      - "config/integration/**"            # `dig organs` enumerates the organ registry
      - "orion/integration/**"
      - "orion/temporal_self/now.py"
      - "scripts/report_integration_coverage.py"   # test_organs.py pins the roundup's footer to it
      - "orion/attention/**"               # `dig attention` reads world_first's windows and semantics
      - "orion/schemas/temporal_self.py"   # test_attention.py pins its event kinds to TemporalSourceKind
      - ".github/workflows/dig-kit-tests.yml"

jobs:
  dig-kit:
    name: Dig kit — commands, inventory, harness brief line
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi==0.111.0 httpx==0.27.2 pydantic==2.11.5 pydantic-settings==2.5.2 \
            SQLAlchemy==2.0.43 aiohttp==3.12.15 python-multipart requests python-dotenv loguru numpy==1.26.4
      - name: Dig kit + shared inventory (includes test_digs.py, `dig digs`)
        run: PYTHONPATH=. python -m pytest -q -p no:cacheprovider orion/dig/tests
      - name: Harness prefix with the dig line (turn-rules header rules still hold)
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            orion/harness/tests/test_stance_scope_hierarchy.py orion/harness/tests/test_harness_prefix.py
      - name: Turn working notes (carry, taint, shape; runner end to end; cockpit stage)
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            orion/harness/tests/test_working_notes.py orion/hub/tests/test_cockpit_working_notes_hop.py
      - name: Body-economy skill text + eval on fixture data (dig body-economy end to end)
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider orion/physiology/tests/test_report_text.py
          PYTHONPATH=. python orion/physiology/evals/physiology_state_skill_eval.py

  physiology-skill-adapter:
    # Own job: cortex-exec's requirements pin other versions (pydantic, fastapi) than the dig job.
    name: skills.physiology.state.v1 -- cortex-exec adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cortex-exec deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/orion-cortex-exec/requirements.txt
      - name: Adapter tests
        run: cd services/orion-cortex-exec && PYTHONPATH=../.. python -m pytest -q -p no:cacheprovider tests/test_skill_verbs.py -k physiology
