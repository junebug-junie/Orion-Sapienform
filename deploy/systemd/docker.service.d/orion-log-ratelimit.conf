# Install: /etc/systemd/system/docker.service.d/orion-log-ratelimit.conf
# dockerd writes every container's journald lines itself, so the whole fleet
# shares docker.service's journal rate limit (default 10000 lines / 30s).
# Fleet average on 2026-10-10 was ~4000 lines / 30s; boot bursts can exceed the
# default and journald would silently drop lines ("Suppressed N messages").
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200000
