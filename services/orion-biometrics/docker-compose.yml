# ───────────────────────────────────────────────────────────────
# 🧬 Orion Biometrics Service — Docker Compose Configuration
# ───────────────────────────────────────────────────────────────
services:
  biometrics:
    build:
      context: ../..
      dockerfile: services/orion-biometrics/Dockerfile
    container_name: ${PROJECT}-${SERVICE_NAME}
    restart: unless-stopped
    networks:
      - app-net
    privileged: true  # Required for raw hardware access (sensors, gpu)
    ports:
      - "${PORT}:8100"
    environment:
      # --- Service Identity & Runtime ---
      - PROJECT=${PROJECT}
      - NODE_NAME=${NODE_NAME}
      - NET=${NET}
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - TELEMETRY_INTERVAL=${TELEMETRY_INTERVAL}
      - LOG_LEVEL=${LOG_LEVEL}

      # --- Orion Bus & Database ---
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - TELEMETRY_PUBLISH_CHANNEL=${TELEMETRY_PUBLISH_CHANNEL}
      - BIOMETRICS_SAMPLE_CHANNEL=${BIOMETRICS_SAMPLE_CHANNEL}
      - BIOMETRICS_SUMMARY_CHANNEL=${BIOMETRICS_SUMMARY_CHANNEL}
      - BIOMETRICS_INDUCTION_CHANNEL=${BIOMETRICS_INDUCTION_CHANNEL}
      - BIOMETRICS_CLUSTER_CHANNEL=${BIOMETRICS_CLUSTER_CHANNEL}
      - SPARK_SIGNAL_CHANNEL=${SPARK_SIGNAL_CHANNEL}
      - PUBLISH_BIOMETRICS_GRAMMAR=${PUBLISH_BIOMETRICS_GRAMMAR:-true}
      - GRAMMAR_EVENT_CHANNEL=${GRAMMAR_EVENT_CHANNEL:-orion:grammar:event}
      - NODE_CATALOG_PATH=${NODE_CATALOG_PATH:-/app/config/biometrics/node_catalog.yaml}
      - EXTERNAL_SUBSCRIBE_CHANNEL=${EXTERNAL_SUBSCRIBE_CHANNEL}
      - BIOMETRICS_MODE=${BIOMETRICS_MODE}
      - CLUSTER_PUBLISH_INTERVAL=${CLUSTER_PUBLISH_INTERVAL}
      - CLUSTER_ROLE_WEIGHTS=${CLUSTER_ROLE_WEIGHTS}
      - SPARK_SIGNAL_TTL_MS=${SPARK_SIGNAL_TTL_MS}
      - THERMAL_MIN_C=${THERMAL_MIN_C}
      - THERMAL_MAX_C=${THERMAL_MAX_C}
      - DISK_BW_MBPS=${DISK_BW_MBPS}
      - NET_BW_MBPS=${NET_BW_MBPS}
      - HOST_PROC_PATH=${HOST_PROC_PATH:-/host_proc}
      - HOST_SYS_PATH=${HOST_SYS_PATH:-/host_sys}
      - POWER_BAND_ALPHA=${POWER_BAND_ALPHA}
      - DISK_CAPACITY_MOUNTS=${DISK_CAPACITY_MOUNTS}
      - ILO_HOST=${ILO_HOST}
      - ILO_USERNAME=${ILO_USERNAME}
      - ILO_PASSWORD=${ILO_PASSWORD}
      - ILO_POLL_INTERVAL_SEC=${ILO_POLL_INTERVAL_SEC:-60.0}
      - ILO_REQUEST_TIMEOUT_SEC=${ILO_REQUEST_TIMEOUT_SEC:-8.0}
      - PDU_HOST=${PDU_HOST}
      - PDU_OUTLETS=${PDU_OUTLETS}
      - PDU_SNMP_COMMUNITY=${PDU_SNMP_COMMUNITY:-public}
      - PDU_SNMP_PORT=${PDU_SNMP_PORT:-161}
      - PDU_POLL_INTERVAL_SEC=${PDU_POLL_INTERVAL_SEC:-60.0}
      - PDU_REQUEST_TIMEOUT_SEC=${PDU_REQUEST_TIMEOUT_SEC:-5.0}

    volumes:
      - ../../config/biometrics:/app/config/biometrics:ro
      - /mnt/scripts/Orion-Sapienform/orion/sensors:/orion/sensors # access host gpus
      - ${ORION_DATA_ROOT:-/mnt/graphdb}/logs/biometrics/logs:/app/logs
      # Read-only host disk-capacity telemetry mounts (piggybacked onto the
      # SystemHealthV1 heartbeat's `details.disk_usage_pct` -- see README.md).
      # Mounted under a parallel /host_mnt/* prefix, not the host's real absolute
      # path, so container code never confuses a host path with a container-real one.
      # Read-only HOST /proc and /sys, so the collector measures the NODE and not itself.
      # Network counters and sysfs are per-namespace: from inside a bridged container,
      # /proc/net/dev shows only this service's own veth (measured on athena 2026-08-14:
      # 1,357 B/s against the host's 159,304 B/s) and /sys/class/net shows no real NIC, so
      # link speed is unreadable. /host_proc/1/net/dev is the host init's namespace -- the
      # real one. Same /host_* prefix convention as the disk-capacity mounts below.
      # Read-only, and nothing is written through either path.
      - /proc:/host_proc:ro
      - /sys:/host_sys:ro
      - /mnt/docker:/host_mnt/docker:ro
      - /mnt/scripts:/host_mnt/scripts:ro
      - /mnt/postgres:/host_mnt/postgres:ro
      - /mnt/graphdb:/host_mnt/graphdb:ro
      - /mnt/telemetry:/host_mnt/telemetry:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

networks:
  app-net:
    name: ${NET}
    external: true
