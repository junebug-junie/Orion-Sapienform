# Must be applied together with the pool's matching commissioning override.
services:
  llm-gateway:
    logging: {driver: journald, options: {tag: "{{.Name}}"}}
    volumes:
      - type: bind
        source: /mnt/scripts/Orion-Sapienform/.orion/hecate-eval-pool.yaml
        target: /app/config/gpu_pool.yaml
        read_only: true
        bind: {create_host_path: false}
