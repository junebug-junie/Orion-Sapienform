name: Retro memory export and leisure consumer (Orion plays Zelda, lane C)

on:
  pull_request:
    paths:
      - "services/orion-hub/scripts/retro_memory_export.py"
      - "services/orion-hub/scripts/retro_leisure_listener.py"
      - "services/orion-hub/scripts/act_emit.py"
      - "services/orion-hub/tests/test_retro_memory_export*.py"
      - "services/orion-hub/tests/test_retro_leisure_listener.py"
      - "services/orion-hub/tests/test_act_ledger_producers.py"
      - "services/orion-sql-db/manual_migration_retro_play_sessions_v1.sql"
      - "orion/schemas/retro_play.py"
      - "orion/schemas/retro_leisure.py"
      - "orion/core/contracts/memory_cards.py"
      - "orion/core/storage/memory_cards.py"
      - ".github/workflows/retro-memory-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/orion-hub/scripts/retro_memory_export.py"
      - "services/orion-hub/scripts/retro_leisure_listener.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retro-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hub test dependencies and local PostgreSQL
        run: |
          python -m pip install -r services/orion-hub/tests/requirements-reading.txt
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Start a throwaway PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'retro-test';"
          sudo -u postgres createdb retro_test
      - name: Summary builder, memory card, play act, leisure consumer, real SQL
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORION_TEST_PG_URI: postgresql://postgres:retro-test@127.0.0.1:5432/retro_test
        run: |
          cd services/orion-hub
          python -m pytest -q \
            tests/test_retro_memory_export.py \
            tests/test_retro_memory_export_pg.py \
            tests/test_retro_leisure_listener.py \
            tests/test_act_ledger_producers.py
