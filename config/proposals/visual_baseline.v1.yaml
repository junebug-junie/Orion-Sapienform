# The visual-baseline schedule (orion/reverie/baseline.py). Since 2026-11-05 (ladder retirement PR 2)
# it is the ONLY trigger of a waking painting: orion-thought's app/painting_self_start.py runs it every
# 60 s on the visual_baseline_checkpoint row (due interval_sec after the last painting, retry_sec after a
# failed attempt). It lives under config/proposals/ for history; nothing in the proposal arena reads it.
# thought_url / timeout_sec are gone: only orion-proposal-runtime's HTTP read of thought used them.
enabled: true
policy_id: visual_baseline.v1
interval_sec: 5400
retry_sec: 600
# freshness_sec: how old a need's observed_at may be when validated. Since 2026-11-05 thought validates
# its own fresh read (prepare re-validates at max(observed_at, due_at)), so the margin is generous.
# History: freshness_sec was 60 -- shorter than the real proposal -> policy ->
# execution-dispatch round trip. Every stage re-validates this same
# `observed_at` against its own clock without re-stamping it, so a 60s
# window meant the candidate was born eligible and died of staleness before
# the last stage ever saw it. Live-measured 2026-09-23: a normal round trip
# took 3m54s (234s), and one taken while execution-dispatch was draining a
# multi-day backlog took much longer. 900s gives a real margin over both
# without approaching retry_sec (600s) badly or interval_sec (5400s).
freshness_sec: 900
target_id: host:circe_gpu
