services:
  cocreation-signals:
    container_name: ${PROJECT}-cocreation-signals
    build:
      context: ../..
      dockerfile: services/orion-cocreation-signals/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ${SERVICE_NAME}
      SERVICE_VERSION: ${SERVICE_VERSION}
      # Must be an explicit real value in .env (e.g. matching root .env's own
      # NODE_NAME), not left unset -- confirmed live 2026-07-30 that
      # app/settings.py's os.uname().nodename fallback resolves to the
      # *container's* hostname (a random container ID Docker assigns) when
      # this is absent, not the real physical host -- worse than unhelpful,
      # actively misleading in bus envelopes' source.node field. An empty
      # string here is equally wrong (silently wins over the code default
      # instead of triggering it, since pydantic-settings only falls back to
      # a field's default_factory when the env var is fully absent from the
      # container's environment, not merely empty).
      COCREATION_SIGNALS_NODE_NAME: ${COCREATION_SIGNALS_NODE_NAME}
      ORION_BUS_ENABLED: ${ORION_BUS_ENABLED}
      ORION_BUS_ENFORCE_CATALOG: ${ORION_BUS_ENFORCE_CATALOG}
      ORION_BUS_URL: ${ORION_BUS_URL}
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-10}
      COCREATION_SIGNALS_REPO_PATH: ${COCREATION_SIGNALS_REPO_PATH:-/repo}
      COCREATION_SIGNALS_GITHUB_OWNER: ${COCREATION_SIGNALS_GITHUB_OWNER}
      COCREATION_SIGNALS_GITHUB_REPO: ${COCREATION_SIGNALS_GITHUB_REPO}
      CHANNEL_CODEBASE_DELTA: ${CHANNEL_CODEBASE_DELTA}
      COCREATION_SIGNALS_GIT_DELTA_ENABLED: ${COCREATION_SIGNALS_GIT_DELTA_ENABLED}
      COCREATION_SIGNALS_PR_LIFECYCLE_ENABLED: ${COCREATION_SIGNALS_PR_LIFECYCLE_ENABLED}
      COCREATION_SIGNALS_GRAPH_DELTA_ENABLED: ${COCREATION_SIGNALS_GRAPH_DELTA_ENABLED}
      COCREATION_SIGNALS_GIT_DELTA_POLL_INTERVAL_SEC: ${COCREATION_SIGNALS_GIT_DELTA_POLL_INTERVAL_SEC}
      COCREATION_SIGNALS_PR_LIFECYCLE_POLL_INTERVAL_SEC: ${COCREATION_SIGNALS_PR_LIFECYCLE_POLL_INTERVAL_SEC}
      COCREATION_SIGNALS_PR_LIFECYCLE_COLD_START_LOOKBACK_SEC: ${COCREATION_SIGNALS_PR_LIFECYCLE_COLD_START_LOOKBACK_SEC}
      COCREATION_SIGNALS_GRAPH_DELTA_POLL_INTERVAL_SEC: ${COCREATION_SIGNALS_GRAPH_DELTA_POLL_INTERVAL_SEC}
      COCREATION_SIGNALS_PR_FETCH_LIMIT: ${COCREATION_SIGNALS_PR_FETCH_LIMIT}
      # gh CLI auth -- see requirements.txt/Dockerfile comment. Set in the
      # real .env, never committed to .env_example with a real value.
      GH_TOKEN: ${COCREATION_SIGNALS_GH_TOKEN}
      COCREATION_SIGNALS_CLAUDE_PROJECTS_PATH: ${COCREATION_SIGNALS_CLAUDE_PROJECTS_PATH:-/claude-projects}
      CHANNEL_JUNIPER_AFFECTIVE_STATE: ${CHANNEL_JUNIPER_AFFECTIVE_STATE}
      COCREATION_SIGNALS_AFFECTIVE_STATE_ENABLED: ${COCREATION_SIGNALS_AFFECTIVE_STATE_ENABLED:-false}
      COCREATION_SIGNALS_AFFECTIVE_STATE_POLL_INTERVAL_SEC: ${COCREATION_SIGNALS_AFFECTIVE_STATE_POLL_INTERVAL_SEC}
      COCREATION_SIGNALS_AFFECTIVE_STATE_COLD_START_LOOKBACK_SEC: ${COCREATION_SIGNALS_AFFECTIVE_STATE_COLD_START_LOOKBACK_SEC}
      CHANNEL_DOC_SEMANTIC_DRIFT: ${CHANNEL_DOC_SEMANTIC_DRIFT}
      CHANNEL_EMBEDDING_GENERATE: ${CHANNEL_EMBEDDING_GENERATE}
      COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_ENABLED: ${COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_ENABLED:-false}
      COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_POLL_INTERVAL_SEC: ${COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_POLL_INTERVAL_SEC}
      COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_EMBED_COLLECTION: ${COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_EMBED_COLLECTION}
      COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_EMBED_TIMEOUT_SEC: ${COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_EMBED_TIMEOUT_SEC}
      COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_TRUNCATION_CHAR_THRESHOLD: ${COCREATION_SIGNALS_DOC_SEMANTIC_DRIFT_TRUNCATION_CHAR_THRESHOLD}
    volumes:
      # Read-only mount of this repo's own working tree -- git_delta.py needs
      # a real `.git` directory (not baked into the image at build time,
      # which would freeze history), graph_delta.py needs a live
      # graphify-out/graph.json + GRAPH_REPORT.md. Host path is operator-
      # configured (COCREATION_SIGNALS_REPO_HOST_PATH), since it varies by
      # deployment node.
      - ${COCREATION_SIGNALS_REPO_HOST_PATH}:${COCREATION_SIGNALS_REPO_PATH:-/repo}:ro
      # Read-only mount of Juniper's real local ~/.claude/projects tree for
      # affective_state.py -- deliberately the whole tree (Juniper's explicit
      # call, 2026-08-11), not scoped to this repo's own transcripts. Only
      # ever read to compute an in-memory aggregate score (see
      # orion/cocreation/affective_signals.py) -- raw transcript content
      # never leaves this container. Host path is operator-configured
      # (COCREATION_SIGNALS_CLAUDE_PROJECTS_HOST_PATH), since it's per-user.
      #
      # COCREATION_SIGNALS_CLAUDE_PROJECTS_PATH MUST be set to the exact same
      # value as COCREATION_SIGNALS_CLAUDE_PROJECTS_HOST_PATH, not remapped to
      # a different in-container path -- confirmed live 2026-08-11 against
      # this real mount: Claude Code represents a cross-project subagent
      # transcript as an *absolute-path symlink* (e.g. a file under one
      # session's `subagents/` dir pointing at
      # `/home/athena/.claude/projects/<other-project>/.../agent-*.jsonl`).
      # An absolute symlink resolves against the container's own root
      # filesystem, not the mount's -- remap the mount point and every such
      # symlink silently breaks (FileNotFoundError, gracefully skipped by
      # claude_code_ingest.py's OSError handling, but real messages behind
      # those symlinks are then never scored). Mounting at the identical
      # path makes every absolute symlink resolve exactly like it does on
      # the host.
      - ${COCREATION_SIGNALS_CLAUDE_PROJECTS_HOST_PATH}:${COCREATION_SIGNALS_CLAUDE_PROJECTS_PATH}:ro
    networks:
      - app-net

networks:
  app-net:
    external: true
