schema_version: execution_dispatch_policy.v1
policy_id: execution_dispatch_policy.v1

mode:
  default_dispatch_mode: dry_run
  # Real sends require BOTH this true AND the runtime's own
  # EXECUTION_DISPATCH_MODE=dispatch_read_only (services/orion-execution-
  # dispatch-runtime/.env, which is the live value on this host and is what
  # .env_example now ships) -- default_dispatch_mode above stays dry_run, so
  # a deployment that does NOT set the env key gets dry_run regardless of
  # this flag.
  allow_dispatch_read_only: true
  # 2026-11-06 (ladder retirement PR 4): allow_mutating_dispatch is gone. It gated only the
  # maintenance_bounded scope, whose three docker prune routes left this policy (see
  # template_to_cortex below). orion-hardware-watch asks for the image prune now.
  # 2026-08-30: opens EXPRESS_SCOPE. Opened for Orion's first outward action
  # (skills.imagination.render_scene.v1, which left dispatch on 2026-11-05). Since the
  # aitown_session route left (2026-11-05, ladder retirement PR 3) no express route is left;
  # inert until PR 6 retires the package.
  allow_express_dispatch: true
  # 2026-10-01..2026-11-05: opened SELF_REVERSIBLE_SCOPE for shed_background_gpu. Closed again in ladder
  # retirement PR 5: the act left dispatch for the want market (orion-durable-runs app/cooling_act.py), and
  # no self-reversible route is left here.
  allow_self_reversible_dispatch: false

allowed_policy_decisions:
  - approved_read_only
  # 2026-11-06 (ladder retirement PR 4): approved_maintenance (2026-08-12) is gone with the
  # maintenance routes. A `maintain` decision is now blocked here (not an allowed decision).
  # 2026-08-30: Orion's first outward action.
  - approved_express
  # 2026-10-01: attend-to-act loop A1 (see mode.allow_self_reversible_dispatch).
  - approved_self_reversible

blocked_policy_decisions:
  - requires_operator_review
  - deferred
  - rejected

proposal_kind_to_cortex:
  inspect:
    dispatch_kind: inspect
    cortex_verb: substrate.inspect
    cortex_mode: brain
    allowed_scope: inspect_only

  summarize:
    dispatch_kind: summarize
    cortex_verb: substrate.summarize
    cortex_mode: brain
    allowed_scope: summarize_only

  observe:
    dispatch_kind: observe
    cortex_verb: substrate.observe
    cortex_mode: brain
    allowed_scope: inspect_only

  # 2026-11-05 (ladder retirement PR 2): the `express` kind's default route is gone. It pointed at
  # skills.imagination.render_scene.v1, and painting left dispatch (orion-thought
  # app/painting_self_start.py starts it). An express proposal with no template route of its own is
  # now blocked `no_cortex_route_for_proposal_kind` instead of silently becoming a painting.
  # 2026-11-06 (ladder retirement PR 4): the `maintain` kind's default route is gone (2026-08-12 ..
  # 2026-11-06; skills.runtime.builder_prune.v1, the maintenance_bounded scope). A maintain proposal
  # is now blocked `no_cortex_route_for_proposal_kind`. Build cache is pruned by hand only.

# 2026-08-16 (docs/superpowers/specs/2026-08-16-tension-driven-mutating-
# dispatch-design.md): per-TEMPLATE overrides (orion/execution_dispatch/
# policy.py::template_to_cortex, live since 2026-08-13, checked before the
# proposal_kind_to_cortex map above).
template_to_cortex:
  # Read-only: no new gate needed. allowed_scope=inspect_only is already
  # unconditionally allowed (orion/execution_dispatch/builder.py's
  # scope_allowed check).
  # skills.perception.look_at_camera.v1 reads orion-vision-window's existing
  # passive projection -- verb yaml timeout_ms=20000, so 40s gives a 2x margin
  # (there is no long-running subprocess here).
  observe_tension_via_camera:
    dispatch_kind: inspect
    cortex_verb: skills.perception.look_at_camera.v1
    cortex_mode: brain
    allowed_scope: inspect_only
    rpc_timeout_sec: 40

  # 2026-11-05 (ladder retirement PR 5): the shed_background_gpu route (executor orion.gpu_pool.shed.v1)
  # is gone. The cooling world act is decided by the want market in orion-durable-runs (app/cooling_act.py).

  # 2026-11-05 (ladder retirement PR 2): the render_scene route (the thought.painting `make` act,
  # 2026-08-30 .. 2026-11-05) is gone, with its `act:` declaration (how the allocator scored it).
  # Orion starts its own paintings in orion-thought (app/painting_self_start.py); the act ledger still
  # grades each one from the run's own steps. One trigger, never two.

  # 2026-10-21 (thinking rung 3 follow-up): the reading pull. This dispatch IS one extra
  # hub.world_pulse_read `look` act on the seed the self-scheduled lane would claim next (Hub picks
  # it with CLAIM_SQL's own order and answers with read_seed:<seed_id>, the act's ledger key).
  # Not a cortex verb: orion.world_pulse_read.pull.v1 is the executor key the dispatch runtime maps
  # to one orion:world_pulse_read:pull:request RPC (check, precommit, act). Hub runs every gate:
  # HUB_WORLD_PULSE_READ_PULL_ENABLED, the lane's own window/refund backoff, the daily cap (derived:
  # 8), arousal strained, thermal hot. inspect_only: it reads the world and writes nothing outside
  # Orion's own reading queue.
  # horizon_sec 12000: derived, not picked -- p90 of (Stage 1 durable turn submitted -> look act
  # closed) over the 83 successful reads with both on record (live 2026-10-21: p50 4205 s, p90
  # 11992 s; most of it is the GPU queue). A pulled read that has not closed by then counts 0, the
  # same for a held-back decision whose seed the lane did not read.
  # object_source queue: the seed exists without the dispatch, so the control arm is informative.
  # Dispatch-side kill switch: ORION_DISPATCH_READING_PULL_ENABLED.
  read_world_pulse:
    dispatch_kind: observe
    cortex_verb: orion.world_pulse_read.pull.v1
    cortex_mode: brain
    allowed_scope: inspect_only
    rpc_timeout_sec: 15
    act:
      verb: look
      actor: hub.world_pulse_read
      signal_id: artifact_produced
      horizon_sec: 12000
      object_source: queue

  # 2026-11-05 (ladder retirement PR 1): the retro_leisure_session route left. Hub starts leisure on
  # its own timer (services/orion-hub/scripts/retro_leisure_self_start.py) and still opens and closes
  # the hub.retro_leisure `play` act. One trigger, never two.

  # 2026-11-05 (ladder retirement PR 3): the aitown_session route left (2026-10-30 .. 2026-11-05), with
  # its `act:` declaration and the act-duration cost rule only it used. orion-embodiment starts Orion's town
  # sessions on its own timer (services/orion-embodiment/app/town_self_start.py) under the session
  # controller's caps, and still opens and closes the aitown.session `play` act. One trigger, never two.

  # 2026-08-25: analysis -> self-study journal entry.
  #
  # `summarize_only`, not a new scope. builder.py::scope_allowed permits
  # inspect_only / summarize_only unconditionally; adding another scope would mean
  # editing that check, which is a safety gate, to buy nothing this route needs.
  # summarize_only is also the honest label: the action summarises a window.
  #
  # NO `skill_args.source`. The route mechanism exists (CortexRouteTemplateV1.
  # skill_args, added in this patch) and is deliberately left unset -- the verb
  # then studies whichever of its four inputs has gone longest without being
  # studied. Pin one here only to deliberately narrow the action to a single
  # lens; the enum is in orion/cognition/verbs/skills.self_study.analyze.v1.yaml.
  #
  # NO reserved slot, and that was checked rather than assumed. The starvation
  # fix this file already carries (starvation_aging_bonus_per_tick 0.002, cap
  # 0.25) is explicitly general -- "anything else quietly losing this race gets
  # the same relief without being named" -- and 0.34 + a full aging bonus (0.59)
  # clears every fresh competitor here. Revisit if real post-deploy dispatch
  # counts show it starving anyway; do not pre-emptively reserve capacity.
  #
  # Verb timeout_ms is 30000; 60s gives the same ~2x margin the other
  # short routes use. The work is four windowed SELECTs plus one dedup lookup,
  # each already capped by a 4s per-connection statement_timeout.
  analyze_self_study_source:
    dispatch_kind: summarize
    cortex_verb: skills.self_study.analyze.v1
    cortex_mode: brain
    allowed_scope: summarize_only
    rpc_timeout_sec: 60

  # 2026-11-06 (ladder retirement PR 4): the prune_dangling_images and prune_stopped_containers routes
  # (2026-08-16 .. 2026-11-06) are gone. orion-hardware-watch's disk rule asks cortex-exec for
  # skills.runtime.image_prune.v1 (services/orion-hardware-watch/app/image_prune.py); stopped
  # containers are pruned by hand only. One trigger, never two.

hard_blocks:
  - approved_for_execution
  - prepare_action
  - external_side_effect
  - settings_mutation
  - service_restart
  - operator_notification
  - file_write
  - network_call
  - destructive_action

limits:
  # 2026-08-30: raised 5 -> 50 so it STOPS BEING A PRE-FILTER.
  #
  # This is a priority cut that runs BEFORE the allocator, so a hand-typed float
  # decided which candidates the value-of-information scorer was allowed to see.
  # Measured live: a cold action worth 0.198 nats/sec -- 100x anything else in
  # the arena -- was cut 36 times in 6 minutes at base_priority 0.30, and never
  # lost on value because it never reached the thing that judges value. A cheap
  # heuristic gating the correct one is backwards.
  #
  # Not deleted, because the admission machinery underneath it is good (reserved
  # slots, then a general pass that hands unclaimed reservations back). 50 sits
  # well above the 11 candidates/frame observed live, so it no longer binds
  # while staying a real backstop if a producer ever runs away.
  #
  # THE REAL SEND CAP IS UNCHANGED: max_dispatches_per_tick below is a separate,
  # independent limit on what actually goes out, and the motor budget and the
  # allocator both still apply. This widens what gets CONSIDERED, not what runs.
  max_dispatch_candidates: 50
  # 2026-07-31 (docs/superpowers/specs/2026-07-30-execution-dispatch-
  # staleness-discard-design.md's Part 2): raised from 1 -- sends are now
  # concurrent (asyncio.gather(..., return_exceptions=True) in
  # _send_prepared_candidates), so this is a real per-tick fan-out width,
  # not just a formerly-inert loop bound. 5 is a disclosed, uncalibrated
  # starting value (meaningfully closes the measured ~12-17/min production
  # vs ~4-5/min sequential-dispatch gap without a large first-patch blast
  # radius) -- revisit against real post-deploy dispatch-rate data, same
  # discipline as every other constant shipped in this arc.
  max_dispatches_per_tick: 5

  # 2026-08-12 .. 2026-11-06: reserved_slots_by_scope held 1 of 5 slots for maintenance_bounded
  # (the docker prunes). Gone with those routes (ladder retirement PR 4); the mechanism stays
  # (orion/execution_dispatch/policy.py::DispatchLimitsV1) and reserves nothing.

  # The general fix, applying to every kind rather than the one that prompted
  # it: a candidate that keeps losing accrues a bounded bonus, so starvation
  # becomes finite instead of permanent. Uncalibrated starting values,
  # disclosed as such -- same discipline as max_dispatches_per_tick above.
  #
  # 0.002/tick with a 0.25 cap: at the live ~90 active frames/hour measured
  # 2026-08-12, a candidate 0.20 below the cut line reaches parity in ~100
  # ticks (~1.1 hours of continuous losing) and can never gain more than
  # 0.25, so aging cannot invert a genuinely large priority gap -- a 0.6818
  # candidate can reach the 0.84-0.90 leaders, it cannot outrank a 0.99.
  # Revisit against real post-deploy starvation_counts, which this patch
  # persists on every frame precisely so that data exists.
  starvation_aging_bonus_per_tick: 0.002
  starvation_aging_bonus_cap: 0.25
