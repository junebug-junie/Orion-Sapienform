name: schedule-browser-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hub-schedule-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright pillow
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run schedule panel browser smoke
        run: pytest -q services/orion-hub/tests/test_schedule_panel_browser_smoke.py
      - name: Run GPU pool panel browser smoke
        run: pytest -q services/orion-hub/tests/test_gpu_pool_panel_browser_smoke.py
      - name: Run Reading panel browser smoke
        run: pytest -q services/orion-hub/tests/test_reading_panel_browser_smoke.py
      - name: Run "Orion is asking" panel browser smoke
        run: pytest -q services/orion-hub/tests/test_orion_is_asking_browser_smoke.py
      - name: Run Vision panel "Walkway (live)" browser smoke
        run: pytest -q services/orion-hub/tests/test_vision_live_frame_browser_smoke.py
      - name: Run "Walkway stories" spot-check card browser smoke (360 px)
        run: |
          set -o pipefail
          pytest -q -rs services/orion-hub/tests/test_walkway_stories_browser_smoke.py | tee walkway_stories_smoke.out
          if grep -q "SKIPPED" walkway_stories_smoke.out; then echo "walkway stories smoke skipped -- playwright missing" >&2; exit 1; fi
      - name: Run "People Orion knows" panel browser smoke (360 px)
        run: |
          set -o pipefail
          pytest -q -rs services/orion-hub/tests/test_people_panel_browser_smoke.py | tee people_smoke.out
          if grep -q "SKIPPED" people_smoke.out; then echo "people panel smoke skipped -- playwright missing" >&2; exit 1; fi
      - name: Run "Walkway history" panel browser smoke (360 px)
        run: |
          set -o pipefail
          pytest -q -rs services/orion-hub/tests/test_walkway_history_browser_smoke.py | tee walkway_history_smoke.out
          if grep -q "SKIPPED" walkway_history_smoke.out; then echo "walkway history smoke skipped -- playwright missing" >&2; exit 1; fi
      - name: Run Orion messages tray browser smoke
        run: |
          set -o pipefail
          pytest -q -rs services/orion-hub/tests/test_orion_message_tray_browser_smoke.py | tee orion_tray_smoke.out
          if grep -q "SKIPPED" orion_tray_smoke.out; then echo "orion message tray smoke skipped -- playwright missing" >&2; exit 1; fi
