# Second, independent orion-vision-host instance -- circe's dedicated P100
# lane, running a real VLM (Qwen2-VL) instead of the shared athena
# instance's BLIP-base. See README.md "Circe Qwen2-VL lane" for the full
# story and orion/bus/channels.yaml's "orion:exec:request:VisionHostService:
# circe-vl" entry for why this needs its own isolated channel (never the
# shared bare one -- two consumers racing that channel already caused a
# real incident, PR #1859/#1860).
#
# Similar spirit to services/orion-llamacpp-host/docker-compose.atlas-workers.yml
# (a second, differently-configured deployment of the same service image) --
# not identical structure: that file puts FOUR named lanes as separate
# service blocks in ONE compose file. This is the first circe-qwen-style
# vision-host lane, so it gets its own file; if a second one is ever added,
# put it as a second service block in THIS file (matching atlas-workers.yml's
# real precedent), not a third top-level file.
#
# Every value this file needs beyond the shared root .env (ORION_BUS_URL,
# PROJECT) has a real default baked in below via ${VAR:-default} -- a
# second --env-file is optional, for overriding a default without editing
# this file (e.g. CIRCE_QWEN_* keys already live in
# services/orion-vision-host/.env via the normal sync script, same as any
# other env override in this repo -- AGENTS.md section 8's "load BOTH the
# root .env and the service's own .env" convention, so include it here too).
#
# EVERY lane-specific tunable below is read via a CIRCE_QWEN_-prefixed key,
# never a bare shared name -- no exceptions, including ones that happen to
# match the shared athena instance's own default today (LOG_LEVEL,
# ORION_BUS_ENABLED, HEARTBEAT_INTERVAL_SEC, TORCH_CUDA_ALLOC_CONF). Real
# incident, 2026-08-26: several of these were originally read bare, and
# services/orion-vision-host/.env_example sets several of those same bare
# names to a DIFFERENT value for the shared instance -- the moment
# services/orion-vision-host/.env exists at all (required by the bring-up
# command below), athena's value silently won with no error. One broke
# functionally (VISION_PERCEPT_STORE_URL -> image_not_found on the reverie
# visual chain's own re-observation tick); the rest stayed silently
# harmless only because the values happened to coincide. See README.md's
# "Circe Qwen2-VL lane" section for the full incident writeup -- not
# repeated at every site below, to avoid the different sites drifting out
# of sync with each other (an earlier draft of this fix did that: a stale
# key count in one comment vs. the actual list in another).
#
# Bring up from a worktree ON CIRCE (never the shared checkout):
#   docker compose \
#     --env-file .env \
#     --env-file services/orion-vision-host/.env \
#     -f services/orion-vision-host/docker-compose.circe-qwen.yml \
#     up -d --build
#
# To override a default one-off without touching either .env, export it
# before the command above -- docker compose reads the real process
# environment too, not just --env-file:
#   CIRCE_QWEN_CUDA_VISIBLE_DEVICES=5 docker compose ...

services:
  vision-host-circe-qwen:
    build:
      context: ../..
      dockerfile: services/orion-vision-host/Dockerfile
    container_name: ${PROJECT:-orion}-circe-vision-host-qwen
    restart: unless-stopped

    environment:
      # Same literal-not-interpolated reasoning as the main compose file's
      # own comment: must win over anything env_file/Dockerfile set.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID

      - LOG_LEVEL=${CIRCE_QWEN_LOG_LEVEL:-INFO}
      - NODE_NAME=circe
      - SERVICE_NAME=orion-vision-host-circe-qwen

      - ORION_BUS_ENABLED=${CIRCE_QWEN_ORION_BUS_ENABLED:-true}
      - ORION_BUS_ENFORCE_CATALOG=${CIRCE_QWEN_ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${CIRCE_QWEN_HEARTBEAT_INTERVAL_SEC:-10}

      # The isolated channel this lane exists for -- never the shared bare
      # orion:exec:request:VisionHostService (athena's instance owns that).
      - CHANNEL_VISIONHOST_INTAKE=orion:exec:request:VisionHostService:circe-vl
      - CHANNEL_VISIONHOST_REPLY_PREFIX=orion:vision:reply
      # Artifact broadcast disabled outright for this lane (review finding,
      # revised): main.py publishes on EVERY successful task unconditionally,
      # and orion-vision-window's consumer falls back to a default stream key
      # for an artifact with no stream_id/camera_id (which caption_frame
      # calls never set), so a shared CHANNEL_VISIONHOST_PUB would let a
      # synthetic dream caption land in the same projection bucket as a real
      # camera frame. Originally isolated onto its own channel instead --
      # reverted after scripts/check_metric_lineage.py's orphan-ratchet gate
      # correctly caught that a channel with zero registered consumers is
      # exactly the class of thing CLAUDE.md section 0A bans. The caller
      # (orion-thought) already gets the full result via the RPC reply, so
      # nothing needs this broadcast to exist at all for this lane.
      - VISION_ARTIFACT_BROADCAST_ENABLED=false

      - MODEL_CACHE_DIR=/mnt/storage-warm/models/vision-circe-qwen
      - HF_HOME=/mnt/storage-warm/models/vision-circe-qwen/hf
      - TRANSFORMERS_CACHE=/mnt/storage-warm/models/vision-circe-qwen/hf/transformers

      - VISION_PROFILES_PATH=/app/config/vision_profiles.yaml
      # Only the captioner -- this lane exists for one job (re-observe a
      # generated image). No retina/detection/embedding profiles: those
      # stay on athena's P4, and circe has no shared filesystem to read a
      # frame path from anyway (percept-store bytes only).
      - VISION_ENABLED_PROFILES=vlm_caption

      # The one thing this whole lane is for: a real, non-degenerate VLM.
      # Overrides the shared BLIP-base default -- do not remove.
      - VISION_VLM_MODEL_ID=Qwen/Qwen2-VL-2B-Instruct
      - VISION_VLM_MAX_TOKENS=${CIRCE_QWEN_VISION_VLM_MAX_TOKENS:-128}
      - VISION_VLM_TEMPERATURE=${CIRCE_QWEN_VISION_VLM_TEMPERATURE:-0.2}
      - VISION_VLM_QWEN_MIN_PIXELS=${CIRCE_QWEN_VISION_VLM_QWEN_MIN_PIXELS:-200704}
      - VISION_VLM_QWEN_MAX_PIXELS=${CIRCE_QWEN_VISION_VLM_QWEN_MAX_PIXELS:-1003520}

      # Physical index confirmed live via nvidia-smi immediately before
      # every deploy (README.md) -- do not trust a snapshot from earlier in
      # the session; GPU assignments on this host have moved before.
      - CUDA_VISIBLE_DEVICES=${CIRCE_QWEN_CUDA_VISIBLE_DEVICES:-4}
      - VISION_DEVICE_STRATEGY=fixed
      - VISION_DEFAULT_DEVICE=cuda:0
      - VISION_DTYPE=fp16
      - VISION_TIMEOUT_S=${CIRCE_QWEN_VISION_TIMEOUT_S:-30}

      # No queueing needed -- single caller (orion-thought's visual chain),
      # single-flight by its own design (services/orion-thought/app/
      # visual_chain.py). Reject rather than queue if that ever changes.
      - VISION_MAX_INFLIGHT=1
      - VISION_MAX_INFLIGHT_PER_GPU=1
      - VISION_QUEUE_WHEN_BUSY=false
      - VISION_MAX_QUEUE=0

      # Deliberately LOWER than settings.py's own tuned defaults
      # (1200/1000/800) -- those were calibrated for athena's shared P4,
      # co-hosting 4+ warm profiles at once (see .env_example's 2026-08-21
      # recalibration note there). This lane is one small model alone on a
      # 16GB card (~5.4GB used, ~11GB free measured live) -- no co-hosted
      # workload to reserve headroom against, so lower floors are correct
      # for this deployment. CIRCE_QWEN_-prefixed -- see this file's own
      # header comment for why every key here is, no exceptions.
      - VISION_VRAM_RESERVE_MB=${CIRCE_QWEN_VISION_VRAM_RESERVE_MB:-512}
      - VISION_VRAM_SOFT_FLOOR_MB=${CIRCE_QWEN_VISION_VRAM_SOFT_FLOOR_MB:-1024}
      - VISION_VRAM_HARD_FLOOR_MB=${CIRCE_QWEN_VISION_VRAM_HARD_FLOOR_MB:-512}

      - TORCH_CUDA_ALLOC_CONF=${CIRCE_QWEN_TORCH_CUDA_ALLOC_CONF:-}

      # This lane never reads a local frame -- no use_latest_frame path. It
      # DOES need to reach percept-store, though: the caller (orion-thought)
      # uploads bytes and hands this lane a percept_sha256, but
      # runner.py::_load_image_from_percept_store is what actually
      # downloads those bytes back, server-side, to run inference on.
      #
      # MUST BE THE REAL TAILSCALE IP, never a docker-internal hostname:
      # this container runs on circe, percept-store on athena, and the
      # docker-internal service name (orion-athena-percept-store) only
      # resolves on athena's OWN docker network -- live-caught deploying
      # this lane both the first time (bare hostname default) and again
      # after a fix (bare-name collision silently restored the wrong
      # hostname; see this file's header comment).
      - VISION_PERCEPT_STORE_URL=${CIRCE_QWEN_VISION_PERCEPT_STORE_URL:-http://100.92.216.81:8021/percepts}
      - VISION_PERCEPT_STORE_TOKEN=${CIRCE_QWEN_VISION_PERCEPT_STORE_TOKEN:-}
      - VISION_PERCEPT_TIMEOUT_SEC=${CIRCE_QWEN_VISION_PERCEPT_TIMEOUT_SEC:-10.0}

      # No camera here -- liveness alerting (built for "is the camera still
      # producing frames") doesn't apply to an on-demand re-observation lane.
      - VISION_LIVENESS_ALERT_ENABLED=false

    volumes:
      - /mnt/storage-warm/models/vision-circe-qwen:/mnt/storage-warm/models/vision-circe-qwen

    ports:
      - "${CIRCE_QWEN_HOST_PORT:-6602}:6600"

    gpus: all

    networks:
      - app-net

networks:
  app-net:
    external: true
