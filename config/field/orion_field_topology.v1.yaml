# Canonical Orion field topology (biometrics + execution dynamics).
schema_version: field_lattice.v1

nodes:
  - node_id: atlas
  - node_id: athena
  - node_id: circe
  - node_id: prometheus

capabilities:
  - capability_id: llm_inference
  - capability_id: transport
  - capability_id: orchestration
  - capability_id: storage
  - capability_id: vision
  - capability_id: graph
  - capability_id: memory

node_channels:
  - availability
  - staleness
  - cpu_pressure
  - memory_pressure
  - gpu_pressure
  - thermal_pressure
  - disk_pressure
  - expected_offline_suppression
  - cortex_exec_step_load
  - execution_friction
  - reasoning_load
  - failure_pressure
  - stream_backlog_pressure
  - contract_pressure
  - catalog_drift_pressure
  - delivery_confidence
  - stream_backlog_health
  - observer_failure_pressure
  - conversation_load
  - repair_pressure

capability_channels:
  - pressure
  - confidence
  - available_capacity
  - execution_pressure
  - reasoning_pressure
  - reliability_pressure
  - stream_backlog_pressure
  - contract_pressure

edges:
  - source_id: node:atlas
    target_id: capability:llm_inference
    edge_type: node_capability
    weight: 0.85
    channel_map:
      gpu_pressure: pressure
      memory_pressure: pressure
      reasoning_load: reasoning_pressure

  # 2026-07-26: stream_backlog_pressure/delivery_confidence/stream_backlog_health
  # removed from this edge -- confirmed live degenerate (confidence/
  # available_capacity pinned at exactly 0.85 with zero variance, pressure
  # pinned at exactly 0.00082, over a 2h real window). Source: the narrow
  # 2-Redis-Stream "world_pulse" census (BUS_OBSERVER_STREAMS), already
  # documented dead in docs/superpowers/specs/2026-07-24-bus-vitality-field-
  # signal-brainstorm.md and docs/notes/2026-07-12-metrics-swamp-arsonist-
  # review.md. catalog_drift_pressure/observer_failure_pressure are a
  # separate, independently-fixed metric (PR #1373) and kept as-is.
  - source_id: node:athena
    target_id: capability:transport
    edge_type: node_capability
    weight: 0.85
    channel_map:
      catalog_drift_pressure: contract_pressure
      observer_failure_pressure: reliability_pressure

  # 2026-07-26: real mesh-wide transport signal, replacing the removed
  # world_pulse-derived pressure above. node:substrate.bus_synaptic is not a
  # physical host (unlike node:athena/atlas/circe/prometheus above) -- it's
  # the Active-Inference domain node written by services/orion-substrate-
  # runtime/app/worker.py::_bus_synaptic_tick via a receipt into
  # substrate_reduction_receipts, consumed into this service's own
  # substrate_field_state through the same generic prediction_signal
  # perturbation path (app/ingest/state_deltas.py) the other 5 Active-
  # Inference domains already use -- not a shared table/row between the two
  # services (orion-substrate-runtime never touches substrate_field_state
  # directly). Confirmed live: 100% tick coverage over the same 2h window
  # used to confirm the edge above was dead. confidence/available_capacity
  # are intentionally NOT mapped here -- apply_diffusion()'s existing derived-fallback formula
  # (max(0, 1-pressure) / max(0, 1-0.5*pressure)) already produces them from
  # this real pressure value once no direct edge claims those channels, so
  # they get a genuine derivation instead of a second fabricated constant.
  - source_id: node:substrate.bus_synaptic
    target_id: capability:transport
    edge_type: node_capability
    weight: 0.85
    channel_map:
      prediction_error: pressure

  # 2026-08-13: capability:vision had NO edge at all until this one. Its live
  # vector was therefore fabricated by the no-inbound-edge path -- pressure=0.0,
  # confidence=1.0, available_capacity=1.0, capability_provenance empty -- i.e.
  # Orion's self-model asserted perfect vision, permanently, whether or not a
  # camera was running. That is the "schema-valid payload with meaningless
  # content" CLAUDE.md §0A bans, sitting in the self-model.
  #
  # node:substrate.vision is not a physical host. Same shape as
  # node:substrate.bus_synaptic above: an Active-Inference-style domain node
  # written by services/orion-substrate-runtime/app/worker.py::
  # _vision_channel_tick via a receipt, consumed through the same generic
  # prediction_signal perturbation path. Unlike that node it reads nothing from
  # the bus synaptic graph: it listens to the vision artifact channel and
  # measures the eye's own output on a clock. A first revision did read that
  # graph's gap_zscore, and was deleted rather than tuned -- it z-scored a
  # fixed 5s scheduler, and froze rather than rose when the eye went silent.
  #
  # confidence/available_capacity intentionally NOT mapped, exactly as for
  # capability:transport above -- apply_diffusion()'s derived-fallback formula
  # produces them from this real pressure rather than fabricating a second
  # constant, which is the specific bug this edge exists to remove.
  # `prediction_error` is the channel name, and it carries the AVAILABILITY
  # reading (vision_channel_staleness_pressure) for this node.
  #
  # Not a free choice: `prediction_error` is the only pressure-hint key the
  # shared receipt path emits. _prediction_error_receipt() hardcodes
  # `pressure_hints: {"prediction_error": ...}`, state_deltas.py turns exactly
  # that into the node-vector perturbation, and reconcile.py prunes any
  # node-vector key that field-digester's channels.py::NODE_CHANNELS does not
  # declare. An earlier revision of this edge mapped `perception_staleness`
  # here, which reads better and was **dead**: nothing writes that channel onto
  # a field node vector, so diffusion.py's src.get() returned 0.0 forever and
  # capability:vision kept the fabricated pressure=0.0/confidence=1.0 vector
  # this edge exists to delete -- including during a total blackout. Caught by
  # code review, confirmed live against substrate_field_state.
  #
  # perception_staleness/perception_yield remain on the FalkorDB node as
  # inspectable detail (see falkor_codec's allowlist); they are not field
  # channels. Promoting either to a real one means plumbing it through
  # _prediction_error_receipt + state_deltas.py + NODE_CHANNELS, which is a
  # contract change, not a config line.
  #
  # perception_yield is deliberately not mapped to pressure at all: a sustained
  # zero is equally consistent with a blinded eye and an empty dark room at
  # 3am, and separating those needs a per-stream day-shape prior that does not
  # exist yet.
  - source_id: node:substrate.vision
    target_id: capability:vision
    edge_type: node_capability
    weight: 0.85
    channel_map:
      prediction_error: pressure

  # 2026-08-19 (P2, docs/superpowers/specs/2026-08-12-perception-frontier-
  # design.md): node:substrate.perception exists as of this patch, written by
  # services/orion-substrate-runtime/app/worker.py's
  # _perception_prediction_error_tick / _handle_perception_prediction_error_
  # message, through the same generic prediction_signal perturbation path as
  # every other node:substrate.* domain node in this file. It is a SEPARATE
  # node from node:substrate.vision above -- that node's prediction_error
  # channel is availability (arrival timing); this one's prediction_error is
  # `1 - cos(frame_embedding, EWMA_embedding)`, a measure of the embedding
  # model's own content encoding, plus a distinct `embedding_staleness`
  # freshness channel. See orion/substrate/prediction_error.py's own P2
  # section for the independence check against every other perceptual signal.
  #
  # Deliberately NO edge below, and NO entry in `nodes:` above (same as
  # node:substrate.vision/bus_synaptic: neither is declared there either --
  # both are dynamically-created domain nodes, not part of the static
  # topology). This is the explicit non-goal of the patch that introduces
  # this node: "not promoting a perceptual domain into ACTIVE_INFERENCE_
  # DOMAINS [or a capability edge] in the same patch that introduces it."
  # Ships shadow-only, default-off (SUBSTRATE_PERCEPTION_PREDICTION_ERROR_
  # TICK_ENABLED=false) -- an edge here would be premature before the
  # live-data sanity check documented in perception_prediction_error()'s own
  # docstring has run against real accumulated history.

  - source_id: node:athena
    target_id: capability:orchestration
    edge_type: node_capability
    weight: 0.90
    channel_map:
      cpu_pressure: pressure
      cortex_exec_step_load: execution_pressure
      execution_friction: reliability_pressure
      failure_pressure: reliability_pressure
      stream_backlog_pressure: pressure
      reasoning_load: reasoning_pressure

  - source_id: node:athena
    target_id: capability:storage
    edge_type: node_capability
    weight: 0.75
    channel_map:
      disk_pressure: pressure
      memory_pressure: pressure

  - source_id: node:athena
    target_id: capability:graph
    edge_type: node_capability
    weight: 0.70
    channel_map:
      cpu_pressure: pressure

  - source_id: node:prometheus
    target_id: capability:memory
    edge_type: node_capability
    weight: 0.60
    channel_map:
      cpu_pressure: pressure

  - source_id: node:circe
    target_id: capability:llm_inference
    edge_type: node_capability
    weight: 0.50
    channel_map:
      gpu_pressure: pressure

  # capability→capability: transport degradation bleeds into orchestration
  - source_id: capability:transport
    target_id: capability:orchestration
    edge_type: capability_capability
    weight: 0.70
    channel_map:
      stream_backlog_pressure: stream_backlog_pressure

  # capability→capability: inference unavailability raises orchestration pressure
  - source_id: capability:llm_inference
    target_id: capability:orchestration
    edge_type: capability_capability
    weight: 0.60
    channel_map:
      pressure: pressure
