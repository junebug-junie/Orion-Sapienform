name: held-turn-lane-rule-tests

# Juniper's rule (2026-11-12): a world-pulse reading turn never sends LLM work to the fast or the
# metacog lane. Reading turns are durable runs and always hold a GPU pool seat, so the one rule is
# "a held turn runs all its LLM work on its hold" (orion.llm.resource_lease.held_call_route).
# These tests pin every link: the helper, the pre-turn check request contract, cortex-exec's probe
# route, the probe's logprob parsing on both reply shapes, orion-thought carrying the hold onto the
# Mind request, and orion-mind routing every phase onto it. The Hub link runs in
# orion-hub-full-suite. No DB, bus or LLM.

on:
  pull_request:
    paths:
      - "orion/llm/resource_lease.py"
      - "orion/schemas/pre_turn_appraisal.py"
      - "orion/mind/v1.py"
      - "orion/substrate/appraisal/**"
      - "tests/test_held_turn_lane_rule.py"
      - "services/orion-cortex-exec/app/pre_turn_appraisal.py"
      - "services/orion-cortex-exec/tests/test_pre_turn_appraisal_rpc.py"
      - "services/orion-mind/app/**"
      - "services/orion-mind/tests/test_mind_turn_route.py"
      - "services/orion-thought/app/mind_enrichment.py"
      - "services/orion-thought/tests/test_mind_utterance_origin.py"
      - ".github/workflows/held-turn-lane-rule-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/llm/resource_lease.py"
      - "orion/schemas/pre_turn_appraisal.py"
      - "orion/mind/v1.py"
      - "orion/substrate/appraisal/**"
      - "tests/test_held_turn_lane_rule.py"
      - "services/orion-cortex-exec/app/pre_turn_appraisal.py"
      - "services/orion-cortex-exec/tests/test_pre_turn_appraisal_rpc.py"
      - "services/orion-mind/app/**"
      - "services/orion-mind/tests/test_mind_turn_route.py"
      - "services/orion-thought/app/mind_enrichment.py"
      - "services/orion-thought/tests/test_mind_utterance_origin.py"
      - ".github/workflows/held-turn-lane-rule-tests.yml"

permissions:
  contents: read

# One job per service: their requirements pin different pydantic/fastapi versions.
jobs:
  cortex-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-cortex-exec/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Rule helper, request contract, probe parsing
        run: >-
          PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider
          tests/test_held_turn_lane_rule.py tests/test_repair_pressure_v2_paradigm.py
          tests/test_logprob_probe_runner.py tests/test_pre_turn_appraisal_schemas.py
      - name: A held turn's probe runs on its seat; Juniper's keeps quick_turn
        working-directory: services/orion-cortex-exec
        run: PYTHONPATH=${{ github.workspace }}/services/orion-cortex-exec:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_pre_turn_appraisal_rpc.py

  mind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-mind/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: A held turn's Mind phases run on its seat
        working-directory: services/orion-mind
        run: PYTHONPATH=${{ github.workspace }}/services/orion-mind:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_mind_turn_route.py

  thought:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-thought/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: orion-thought carries the turn's hold onto the Mind request
        working-directory: services/orion-thought
        run: PYTHONPATH=${{ github.workspace }}/services/orion-thought:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_mind_utterance_origin.py
