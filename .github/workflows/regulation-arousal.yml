name: Regulation arousal

# Temporal Self rev 4, order 3 (R2/R3 core): the pure arousal reducer, its
# schema/registry entries, and the shipped-reducer replay eval. The regulate
# node and its SQL run in orion-durable-runs-tests.yml (isolated Postgres);
# the dream idle fix runs in regulation-history.yml (isolated Postgres).

on:
  pull_request:
    paths:
      - "orion/regulation/**"
      - "orion/schemas/regulation.py"
      - "orion/schemas/drive_reading.py"
      - "orion/schemas/registry.py"
      - "orion/autonomy/cabinet_heat.py"
      - "tests/test_regulation_arousal.py"
      - "tests/test_regulation_immune.py"
      - "orion/field/channel_glossary.py"
      - "config/field/field_channel_glossary.v1.yaml"
      - "scripts/analysis/measure_arousal_reducer_replay.py"
      - "scripts/analysis/tests/test_measure_arousal_reducer_replay.py"
      - "scripts/check_env_key_single_source.py"
      - "tests/test_regulation_strain_news.py"
      - "scripts/analysis/replay_strain_news.py"
      - "scripts/analysis/tests/test_replay_strain_news.py"
      - "orion/attention/world_first.py"
      - "orion/attention/sustained.py"
      - "services/orion-substrate-runtime/app/worker.py"
      - "services/orion-substrate-runtime/app/store.py"
      - "services/orion-substrate-runtime/tests/test_strain_news_tick.py"
      - ".github/workflows/regulation-arousal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arousal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
      ORION_BUS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r services/orion-sql-writer/requirements.txt pytest pytest-asyncio pyyaml
      - name: Reducer, Juniper-turn rule, schema registry
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider tests/test_regulation_arousal.py tests/test_regulation_immune.py
      - name: Shipped-reducer replay eval
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider scripts/analysis/tests/test_measure_arousal_reducer_replay.py
      - name: Strain news rule, glossary event-written check, budget replay logic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider tests/test_regulation_strain_news.py scripts/analysis/tests/test_replay_strain_news.py
      - name: Strain news substrate-runtime tick
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/orion-substrate-runtime
        run: |
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          cd services/orion-substrate-runtime && python -m pytest -q -p no:cacheprovider tests/test_strain_news_tick.py tests/test_cabinet_heat_tick.py
      - name: DREAM_IDLE_MINUTES has one owner
        run: python scripts/check_env_key_single_source.py
