services:
  gpu-pool:
    build:
      context: ../..
      dockerfile: services/orion-gpu-pool/Dockerfile
    container_name: ${PROJECT}-gpu-pool
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${GPU_POOL_PORT:-8127}:8127"
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-gpu-pool}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - RPC_HEALTH_PUBLISH_ENABLED=${RPC_HEALTH_PUBLISH_ENABLED:-true}
      - RPC_HEALTH_PUBLISH_INTERVAL_SEC=${RPC_HEALTH_PUBLISH_INTERVAL_SEC:-30}
      - POSTGRES_URI=${POSTGRES_URI}
      - GPU_POOL_MODE=${GPU_POOL_MODE:-observe}
      - GPU_POOL_TICK_SEC=${GPU_POOL_TICK_SEC:-1.0}
      - GPU_POOL_PROBE_INTERVAL_SEC=${GPU_POOL_PROBE_INTERVAL_SEC:-15.0}
      - GPU_POOL_PROBE_TIMEOUT_SEC=${GPU_POOL_PROBE_TIMEOUT_SEC:-3.0}
      - GPU_POOL_ANNOUNCE_STALE_SEC=${GPU_POOL_ANNOUNCE_STALE_SEC:-120.0}
      - GPU_POOL_STATE_PUBLISH_SEC=${GPU_POOL_STATE_PUBLISH_SEC:-5.0}
      - GPU_POOL_OPERATOR_TOKEN=${GPU_POOL_OPERATOR_TOKEN:-}
      - GPU_POOL_REPLAY_PAYLOAD_MAX_BYTES=${GPU_POOL_REPLAY_PAYLOAD_MAX_BYTES:-262144}
      - GPU_POOL_CONFIG_PATH=/app/config/gpu_pool.yaml
      - GPU_POOL_PROFILES_PATH=/app/config/llm_profiles.yaml
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8127/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app-net:
    external: true
