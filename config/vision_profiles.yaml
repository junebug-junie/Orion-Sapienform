version: 0.4.0

# ===================================================================
# Orion Vision Host Profiles (Model-Runtime Platform)
# ===================================================================
# vision-host is the llama-cpp analog for vision:
# - keeps heavyweight vision models warm (selectively)
# - runs tasks via a stable task_type contract
# - emits dense scene artifacts (objects/masks/tracks/embeddings/captions)
# - schedules across multi-GPU (4x V100 16GB) with VRAM-aware degrade
# ===================================================================

runtime:
  device_strategy: best_free_vram          # best_free_vram | fixed | round_robin
  default_device: cuda:0
  default_dtype: auto                     # auto | fp16 | bf16 | fp32
  default_timeout_s: 30

  scheduler:
    max_inflight_tasks: 4                 # total across all GPUs
    max_inflight_per_gpu: 1               # heavy-safety on shared node
    queue_when_busy: true
    max_queue: 200
    pick_gpu_metric: free_vram_mb         # free_vram_mb | free_fraction

  # These MUST stay in sync with services/orion-vision-host/.env_example's
  # VISION_VRAM_{RESERVE,SOFT_FLOOR,HARD_FLOOR}_MB -- the env keys are what
  # scheduler.py actually enforces (app/main.py:64); this block is read by
  # nothing and exists only as documentation. Gated by
  # services/orion-vision-host/tests/test_vram_budget_matches_env_example.py.
  #
  # The old values here (3500/2200/1400) took orion-vision-host down for ~21h on
  # 2026-08-20/21. THE CONFIG DID NOT DRIFT -- THE HARDWARE MOVED. Those were the
  # originals from the first vision-host commit (626c103ee), written when athena
  # carried a P100 16GB, and correct there: ~13.1GB free warm - 3500 = ~9.6GB,
  # far above the 1400 floor. The P100 later moved to circe and athena kept a
  # Tesla P4 (7.68GB). Nobody re-derived the budget. gpu.py computes
  # `effective_free = free_mb - reserve_mb` and refuses below hard_floor, so on
  # the P4 with ~3.2GB warm resident (4191 - 3500 = 691 < 1400) the scheduler
  # could never pick the GPU again once models loaded. Every task failed
  # `gpu_hard_floor`, the container stayed `Up` and healthy, and Orion went blind.
  #
  # So: this budget is a function of THE CARD, not of the service. Re-derive it
  # whenever a GPU moves between nodes, and check against the RESIDENT footprint,
  # never against total VRAM. The test above reads real hardware for this reason.
  vram_budget:
    reserve_mb: 1200                      # headroom kept free for cohabiting spikes
    soft_floor_mb: 1000                   # degrade when free below this
    hard_floor_mb: 800                    # refuse heavy tasks when free below this

  # -----------------------------------------------------------------
  # NOT ENFORCED by services/orion-vision-host today (documentation-only).
  # VRAM refuse/scheduling uses runtime.scheduler + vram_budget above.
  # -----------------------------------------------------------------
  adaptive_degrade:
    enabled: true
    steps:
      - name: shrink_resolution
        set:
          max_short_side_px: 640

      - name: drop_optional_profiles
        disable_profiles:
          - retina_segment
          - identity_face
          - vlm_vqa

      - name: refuse_ultra_tasks
        refuse_task_types:
          - vqa
          - identity_face

  defaults:
    max_short_side_px: 960
    max_detections: 60
    score_threshold: 0.25
    nms_iou: 0.6

# ===================================================================
# Task Routing
# ===================================================================
# Callers send task_type; host resolves it to a pipeline or profile below.
# ===================================================================

task_routing:
  retina_fast: pipeline_retina_fast
  retina_dense: pipeline_retina_dense

  detect_open_vocab: retina_detect_open_vocab
  segment_anything: retina_segment
  track_objects: retina_track

  embed_image: embed_image
  caption_frame: vlm_caption
  vqa: vlm_vqa

  identity_face: identity_face

# ===================================================================
# Pipelines (Retina Modes)
# ===================================================================

pipelines:
  - name: pipeline_retina_fast
    enabled: true
    description: >
      Fast, high-value "retina" mode: open-vocab detect + optional tracking (video),
      optional image embedding, optional caption.
      Designed to be stable under shared VRAM constraints.
    steps:
      - use: retina_detect_open_vocab
      - use: retina_track
        when: "request.is_video == true"
      - use: embed_image
        when: "request.want_embeddings == true"
      - use: vlm_caption
        when: "request.want_caption == true"
    outputs:
      emits:
        - objects
        - tracks_optional
        - embedding_optional
        - caption_optional

  - name: pipeline_retina_dense
    enabled: true
    description: >
      Dense retina foundation: open-vocab detect + optional segmentation +
      optional tracking + optional embeddings + optional caption.
      Segmentation is intentionally "optional" to avoid VRAM thrash.
    steps:
      - use: retina_detect_open_vocab
      - use: retina_segment
        when: "request.want_masks == true"
      - use: retina_track
        when: "request.is_video == true"
      - use: embed_image
        when: "request.want_embeddings == true"
      - use: vlm_caption
        when: "request.want_caption == true"
    outputs:
      emits:
        - objects
        - masks_optional
        - tracks_optional
        - embedding_optional
        - caption_optional

# ===================================================================
# Profiles (Atomic Model Runtimes)
# ===================================================================
# model_id values are placeholders — swap later without changing Orion architecture.
# ===================================================================

profiles:

  - name: retina_detect_open_vocab
    enabled: true
    warm_on_start: true
    kind: detect_open_vocab
    backend: custom
    description: >
      Open-vocabulary detection (not closed-class YOLO-only). Choose backend later
      (GroundingDINO/OWL-ViT/YOLO-World/etc).
    model_id: "REPLACE_ME/open_vocab_detector"
    device: auto
    dtype: fp32                       # GroundingDINO matmul fails fp16 on P100; fp32 required.
                                       # FOLLOW-UP (2026-09-01): circe's P100 at nvidia-smi index 4
                                       # is being swapped for a T10 16GB on 2026-09-04. T10 is Turing,
                                       # not Pascal -- this fp32 forcing was never verified against it.
                                       # Re-test fp16 on the T10 before assuming this line still applies.
    cost:
      vram_estimate_mb: 2800
      latency_class: medium            # low|medium|high
      gpu_class: heavy                 # light|medium|heavy
    params:
      max_short_side_px: 960
      max_detections: 60
      # Measured on 6 consecutive cam0 frames of a static room holding exactly
      # one desk, one table and two chairs (2026-08-12), sweeping this value:
      #   0.25 -> 119 detections: desk x23, box x24, table x18  (~3.8 desks/frame)
      #   0.35 ->  57 detections: desk x5,  box x6,  table x13  (~0.8 desks/frame)
      #   0.50 ->  20 detections: only chair x14 and door x6
      # At 0.25 the low-confidence tail is scattered false positives -- verified
      # spatially disjoint (pairwise IoU ~0.000), so NMS cannot remove them; only
      # the threshold can. At 0.50 real objects vanish. 0.35 keeps the object
      # classes while roughly halving the phantom count.
      # Per-frame counts remain approximate; do not read narrative plurals as
      # inventory. See the PR report for the full sweep.
      score_threshold: 0.35     # alias honoured as box_threshold by the runner
      nms_iou: 0.6
      label_mode: open_vocab           # open_vocab | closed_set
      labels_hint: []                  # optional label shortlist per request
      # Open-vocabulary detection can only name what the prompt asks about.
      # With this unset, runner.py fell back to a hardcoded six-word list
      # (person/face/phone/screen/door/package), which is why 19 days of live
      # cam0 events describe nothing but doors, screens and the occasional
      # package -- the detector was blindfolded, not weak. Reviewed frames from
      # cam0 on 2026-08-12 contain a desk, two office chairs, two monitors, a
      # whiteboard, a guitar case, storage totes and a table, none of which
      # were nameable.
      #
      # `face` is deliberately absent: identity/face/re-ID stays a non-goal.
      # Keep terms visually distinct -- near-synonyms make GroundingDINO emit
      # duplicate overlapping boxes for one object.
      #
      # SINGLE WORDS ONLY. GroundingDINO maps detections back to token spans in
      # the dot-joined caption, and adjacent multi-word phrases bleed into each
      # other. Observed live on 2026-08-12 with `cardboard box . storage bin`:
      # the believed label set came back holding `cardboard box storage` and a
      # bare `storage`, and never once `storage bin`. A garbled label is worse
      # than a coarse one -- it reaches the narrative and it churns.
      default_prompts:
        # `monitor` is deliberately absent: it and `screen` fired on the same
        # physical panel (live 2026-08-12: screen x3 + monitor x2 for two
        # monitors). NMS is per-label, so cross-label synonyms have to be
        # resolved here rather than downstream.
        - person
        - door
        - screen
        - laptop
        - keyboard
        - desk
        - table
        - chair
        - whiteboard
        - guitar
        - backpack
        - bag
        - box
        - bin
        - book
        - lamp
        - window
        - plant
        - cup
        - bottle
        - shoe
        - clothing
        - cable
        - phone
        - package
    outputs:
      objects:
        include_boxes: true
        include_scores: true
        include_labels: true

  - name: retina_segment
    enabled: true
    warm_on_start: false
    kind: segmentation
    backend: custom
    description: >
      Segmentation masks (SAM/SAM2 class). Heavy; keep lazy-load and only call when requested.
    model_id: "REPLACE_ME/segmentation_sam2"
    device: auto
    dtype: auto
    cost:
      vram_estimate_mb: 5200
      latency_class: high
      gpu_class: heavy
    params:
      max_short_side_px: 960
      mask_quality: balanced           # fast|balanced|high
      output_format: rle               # rle|polygons|bitmap_ref
      refine_edges: false
    outputs:
      masks:
        include_scores: true
        include_object_links: true

  - name: retina_track
    enabled: true
    warm_on_start: false
    kind: tracking
    backend: internal
    description: >
      Tracking across frames/windows. CPU by default (stable); upgrade to GPU later if desired.
    device: cpu
    cost:
      vram_estimate_mb: 0
      latency_class: low
      gpu_class: light
    params:
      method: bytetrack                # bytetrack|deepsort|custom
      max_tracks: 20
      min_track_len_frames: 6
      iou_threshold: 0.3
      max_age_frames: 30
    outputs:
      tracks:
        include_track_ids: true
        include_trajectories: true
        include_track_scores: true

  - name: embed_image
    enabled: true
    warm_on_start: true
    kind: embedding
    backend: transformers
    description: >
      Image embeddings for recall/similarity (foundation for memory + retrieval).
    model_id: "REPLACE_ME/siglip_or_clip_image_embedder"
    device: auto
    dtype: auto
    cost:
      vram_estimate_mb: 1600
      latency_class: low
      gpu_class: medium
    params:
      normalize: true
      output_dim: auto
      store_as: reference              # reference|inline
      collection: vision_embeddings
    outputs:
      # Documentation-only -- app/runner.py never reads this `outputs:` block
      # (confirmed: zero references to include_ref/include_vector/etc.
      # anywhere in runner.py; every profile's runner method returns a fixed
      # shape regardless of what's declared here). Kept accurate anyway:
      # 2026-08-19 (P2 wire-contract patch, orion/schemas/vision.py's
      # VisionEmbedding.vector) -- _run_embedding_siglip now always inlines
      # the vector, so include_vector: false was stale as of that patch.
      embedding:
        include_ref: true
        include_vector: true

  - name: vlm_caption
    enabled: true
    warm_on_start: true
    kind: caption_frame
    backend: transformers
    description: >
      Vision-Language captioner for converting perception into language artifacts.
      Keep max_tokens conservative. On-demand is supported via request.want_caption.
    model_id: "REPLACE_ME/qwen2-vl_or_llava_next"
    device: auto
    dtype: auto
    cost:
      vram_estimate_mb: 4200
      latency_class: high
      gpu_class: heavy
    params:
      mode: caption
      max_tokens: 128
      temperature: 0.2
      top_p: 0.9
    outputs:
      text:
        include_confidence: true
        include_rationale: false

  - name: vlm_vqa
    # Enabled 2026-08-20 (runner.py's kind=vlm execution shipped the same
    # day -- was "contract-only, kind not implemented yet" before that).
    # "Enable later once VRAM coexistence is proven" was this profile's own
    # original gate; checked live before flipping, not assumed: the P4
    # serving orion-vision-host had ~4.2GB free (3.49GB/7.68GB used) at the
    # time, comfortable headroom for a second REPLACE_ME-resolved (BLIP-
    # class, small) VLM instance alongside the already-warm vlm_caption one.
    # The `vram_estimate_mb: 5200`/`gpu_class: heavy` below describe the
    # eventual dedicated-VQA-model target (a real Qwen2-VL/LLaVA-class
    # model per model_id's own REPLACE_ME), not what actually loads today --
    # same REPLACE_ME -> VISION_VLM_MODEL_ID fallback vlm_caption uses, so
    # this loads the same small captioning-class model for now, prompted
    # differently. Revisit this cost estimate together with model_id once a
    # dedicated VQA model is actually wired in.
    enabled: true
    warm_on_start: false
    kind: vlm
    backend: transformers
    description: >
      Visual Q&A -- a caller-supplied question against the current frame,
      not a fixed caption. Lazy-loads its own model instance on first real
      request (warm_on_start left false deliberately: rare, event-driven,
      not part of the always-on passive pipeline -- see the design doc's
      Foveal tier).
    model_id: "REPLACE_ME/qwen2-vl_or_llava_next"
    device: auto
    dtype: auto
    cost:
      vram_estimate_mb: 5200
      latency_class: high
      gpu_class: heavy
    params:
      mode: vqa
      max_tokens: 160
      temperature: 0.2
    outputs:
      text:
        include_confidence: true
        include_rationale: false

  # Deliberately kept (chore, 2026-08-25): the other 8 profiles that shipped
  # alongside this one at repo genesis were deleted in the same patch that
  # added this comment -- confirmed zero references anywhere in real code,
  # keyword-cathedral stubs per docs/superpowers/specs/2026-08-21-seeing-
  # juniper-identity-and-situated-observation-design.md section 3.1's
  # blast-radius-checked table. identity_face is the one survivor: that same
  # doc's verdict is IMPLEMENT, not delete ("the one thing that cannot leave
  # the node") -- its section 4 is the design for filling this in.
  #
  # Implemented 2026-08-26, Juniper's direct go-ahead ("yeah build it"),
  # satisfying AGENTS.md section 0A's "unless Juniper directly asks to
  # implement" exception to proposal-mode-first. Real MTCNN + InceptionResnetV1
  # (facenet-pytorch, VGGFace2-pretrained) -- see app/identity_gallery.py and
  # app/runner.py's _run_identity_face. Non-negotiables from section 4 are
  # enforced in code, not just in this comment: ONE enrolled subject, gallery
  # never grows at runtime (only scripts/enroll_identity_face.py, a human-run
  # CLI, can write a gallery entry), non-matches are never stored, `unsure`
  # is a real reachable third band (see probable_threshold/match_threshold
  # below), and the result is always a hypothesis dict
  # ({subject, similarity, state}), never a bare label. Two rounds of code
  # review (findings fixed, mutation-tested, live-verified against the real
  # production container) -- see the PR report for the full record.
  #
  # `enabled: true` -- Juniper's explicit call, 2026-08-26 ("shipping
  # enabled true... there should be some affective state that has photos
  # of me"), after both open items below were addressed rather than left
  # blocking:
  #   1. match_threshold/probable_threshold WERE unvalidated against real
  #      enrolled photos when this comment first shipped disabled. Closed
  #      the same day: triggered a real, live capture_and_assess() on
  #      orion-juniper-affective-state (the SAME already-approved, already-
  #      running capture path Hub's own "Check now" button uses -- no new
  #      capture infrastructure), fetched the resulting video from
  #      orion-percept-store by its own reported sha256 (hash re-verified
  #      on receipt, chain-of-custody), extracted 6 real frames, enrolled
  #      via scripts/enroll_identity_face.py (all 6 frames: real face
  #      detected at 0.996-0.9996 confidence each). AffectGPT's own face
  #      detector independently found a face in 85% of that clip's frames
  #      (face_detection.detection_rate=0.8485), corroborating a real,
  #      usable subject before enrollment ever ran. Then real end-to-end
  #      validation, not just enrollment: a HELD-OUT frame from the same
  #      clip (not one of the 6 enrollment frames) matched at
  #      similarity=0.9585, state="probable" -- comfortably clearing
  #      probable_threshold (0.55) with real margin. Negative control: the
  #      room's own (empty at the time) ceiling-camera frame correctly
  #      returned zero candidates (no_face_detected), not a false positive.
  #      Both directions verified with real data, not assumed.
  #   2. orion-vision-frame-router fully Pydantic-deserialized every
  #      identity_face reply before checking relevance, then discarded it --
  #      real, transient (never logged/persisted/forwarded), initially
  #      shipped as an accepted-not-fixed residual exposure. Narrowed same-
  #      day (Juniper: "you need to sort hte wildcard?"): dispatcher.py's
  #      clear_pending() check only needs env.correlation_id, so it now
  #      gates the full model_validate instead of following it -- typed
  #      deserialization and label extraction now confined to corr_ids
  #      frame-router actually dispatched. NOT fully closed: main.py's bus
  #      codec already JSON-decodes every wildcard message's raw payload
  #      before dispatch is even called, so the raw dict is resident in
  #      memory regardless of ownership -- see
  #      services/orion-vision-host/README.md's "Wildcard reply-channel
  #      fan-out" section for the full accounting of what did and did not
  #      change.
  - name: identity_face
    enabled: true
    warm_on_start: false
    kind: identity
    backend: custom
    description: >
      Face detection + identity hypothesis for the one enrolled subject.
      Returns {subject, similarity, state} per detected face, never a bare
      label. Empty/unenrolled gallery degrades to "not_enrolled", not an
      error -- this ships with zero real photos of anyone.
    model_id: "facenet-pytorch/vggface2"
    device: auto
    dtype: auto
    cost:
      vram_estimate_mb: 600
      latency_class: low
      gpu_class: light
    params:
      # Below this cosine similarity: state="unsure", subject="unknown".
      match_threshold: 0.35
      # At/above this: state="probable". Between the two: state="possible".
      probable_threshold: 0.55
      # Reinterpreted from "gallery candidate count" (the gallery is capped
      # at exactly one subject by contract) to "max detected faces per
      # frame to report a hypothesis for".
      max_candidates: 5
    outputs:
      identities:
        include_candidates: true
        include_confidence: true
        # Embedding vectors are never returned or stored for any request --
        # see app/identity_gallery.py's module docstring. This flag stays
        # false; it is not a toggle, it documents the contract.
        include_embedding_ref: false

