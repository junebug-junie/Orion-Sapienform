# Load variables from `.env` beside this file (see `.env_example`).
# Run from `services/orion-mind`: docker compose -f docker-compose.yml up --build

services:
  mind:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-mind/Dockerfile
    container_name: ${PROJECT:-orion}-mind
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-orion-mind}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      NODE_NAME: ${NODE_NAME:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-6611}
      MIND_SNAPSHOT_MAX_BYTES: ${MIND_SNAPSHOT_MAX_BYTES:-512000}
      MIND_WALL_MS_DEFAULT: ${MIND_WALL_MS_DEFAULT:-180000}
      MIND_N_LOOPS_DEFAULT: ${MIND_N_LOOPS_DEFAULT:-1}
      MIND_ROUTER_PROFILES_PATH: ${MIND_ROUTER_PROFILES_PATH:-}
      MIND_EVIDENCE_MAX_CHARS: ${MIND_EVIDENCE_MAX_CHARS:-12000}
      MIND_EVIDENCE_MAX_MESSAGES: ${MIND_EVIDENCE_MAX_MESSAGES:-8}
      MIND_EVIDENCE_MAX_RECALL_FRAGMENTS: ${MIND_EVIDENCE_MAX_RECALL_FRAGMENTS:-8}
      MIND_EVIDENCE_MAX_PROJECTION_ITEMS: ${MIND_EVIDENCE_MAX_PROJECTION_ITEMS:-16}
      MIND_LLM_SYNTHESIS_ENABLED: ${MIND_LLM_SYNTHESIS_ENABLED:-false}
      MIND_SEMANTIC_MODEL_ROUTE: ${MIND_SEMANTIC_MODEL_ROUTE:-quick}
      MIND_APPRAISAL_MODEL_ROUTE: ${MIND_APPRAISAL_MODEL_ROUTE:-metacog}
      MIND_STANCE_MODEL_ROUTE: ${MIND_STANCE_MODEL_ROUTE:-metacog}
      MIND_TURN_MODEL_ROUTE: ${MIND_TURN_MODEL_ROUTE:-metacog_turn}
      MIND_LLM_TIMEOUT_SEC: ${MIND_LLM_TIMEOUT_SEC:-60}
      MIND_LLM_HELD_TIMEOUT_SEC: ${MIND_LLM_HELD_TIMEOUT_SEC:-150}
      MIND_LLM_MAX_TOKENS_SEMANTIC: ${MIND_LLM_MAX_TOKENS_SEMANTIC:-2048}
      MIND_LLM_MAX_TOKENS_APPRAISAL: ${MIND_LLM_MAX_TOKENS_APPRAISAL:-3072}
      MIND_LLM_MAX_TOKENS_STANCE: ${MIND_LLM_MAX_TOKENS_STANCE:-1536}
      MIND_LLM_THINKING_APPRAISAL: ${MIND_LLM_THINKING_APPRAISAL:-true}
      MIND_LLM_FAIL_OPEN_LEGACY: ${MIND_LLM_FAIL_OPEN_LEGACY:-true}
      MIND_LLM_PHASE_SAFETY_MS: ${MIND_LLM_PHASE_SAFETY_MS:-50}
      MIND_LLM_RETURN_LOGPROBS_SEMANTIC: ${MIND_LLM_RETURN_LOGPROBS_SEMANTIC:-false}
      MIND_LLM_LOGPROB_PROBE_MODE: ${MIND_LLM_LOGPROB_PROBE_MODE:-}
      MIND_LLM_UNCERTAINTY_METACOG_ENABLED: ${MIND_LLM_UNCERTAINTY_METACOG_ENABLED:-false}
      MIND_LLM_USE_BUS: ${MIND_LLM_USE_BUS:-true}
      ORION_BUS_ENABLED: ${ORION_BUS_ENABLED:-true}
      ORION_BUS_URL: ${ORION_BUS_URL:-redis://100.92.216.81:6379/0}
      MIND_LLM_INTAKE_CHANNEL: ${MIND_LLM_INTAKE_CHANNEL:-orion:exec:request:LLMGatewayService}
      MIND_LLM_REPLY_PREFIX: ${MIND_LLM_REPLY_PREFIX:-orion:mind:llm:reply}
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-10}
      RPC_HEALTH_PUBLISH_ENABLED: ${RPC_HEALTH_PUBLISH_ENABLED:-true}
      RPC_HEALTH_PUBLISH_INTERVAL_SEC: ${RPC_HEALTH_PUBLISH_INTERVAL_SEC:-30}
      RPC_HEALTH_CHANNEL_LATENCY_ENABLED: ${RPC_HEALTH_CHANNEL_LATENCY_ENABLED:-true}
      # Orion Prime 2A (app/prime_loop.py); see .env_example.
      PRIME_ENABLED: ${PRIME_ENABLED:-true}
      PRIME_TICK_SEC: ${PRIME_TICK_SEC:-15}
      PRIME_REFRACTORY_SEC: ${PRIME_REFRACTORY_SEC:-300}
      PRIME_SETTLE_INTERVAL_SEC: ${PRIME_SETTLE_INTERVAL_SEC:-300}
      PRIME_LLM_ROUTE: ${PRIME_LLM_ROUTE:-prime}
      PRIME_STARVED_LLM_ROUTE: ${PRIME_STARVED_LLM_ROUTE:-prime_starved}
      PRIME_SEAT_WAIT_SEC: ${PRIME_SEAT_WAIT_SEC:-600}
      PRIME_BID_LANE: ${PRIME_BID_LANE:-chat}
      PRIME_MAX_TOKENS: ${PRIME_MAX_TOKENS:-700}
      PRIME_LLM_TIMEOUT_SEC: ${PRIME_LLM_TIMEOUT_SEC:-60}
      PRIME_HOLDBACK_FRACTION: ${PRIME_HOLDBACK_FRACTION:-0.2}
      PRIME_DURABLE_RUNS_URL: ${PRIME_DURABLE_RUNS_URL:-http://orion-athena-durable-runs:8121}
      PRIME_HUB_URL: ${PRIME_HUB_URL:-http://100.92.216.81:8080}
      PRIME_REGULATE_ENABLED: ${PRIME_REGULATE_ENABLED:-true}
      PRIME_FAMILIES_PATH: ${PRIME_FAMILIES_PATH:-/repo/config/physiology/families.yaml}
      # Prime's concerns from funded event wants (app/prime_loop.py); see .env_example.
      PRIME_CONCERNS_FROM_EVENT_WANTS: ${PRIME_CONCERNS_FROM_EVENT_WANTS:-true}
      PRIME_EVENT_WANTS_HOURS: ${PRIME_EVENT_WANTS_HOURS:-24}
      PRIME_EVENT_WANTS_LIMIT: ${PRIME_EVENT_WANTS_LIMIT:-8}
      # Living Prime Part 2, turn hand-back (app/prime_loop.py); see .env_example.
      PRIME_TURN_HANDBACK_ENABLED: ${PRIME_TURN_HANDBACK_ENABLED:-true}
      # Living Prime Part 3, the day letter as Prime's end-of-day turn (app/prime_loop.py); see .env_example.
      PRIME_DAY_LETTER_ENABLED: ${PRIME_DAY_LETTER_ENABLED:-true}
      PRIME_DAY_LETTER_MAX_ATTEMPTS: ${PRIME_DAY_LETTER_MAX_ATTEMPTS:-3}
      PRIME_DAY_LETTER_TURN_TIMEOUT_SEC: ${PRIME_DAY_LETTER_TURN_TIMEOUT_SEC:-1800}
      PRIME_DAY_LETTER_RUN_DEADLINE_HOURS: ${PRIME_DAY_LETTER_RUN_DEADLINE_HOURS:-12}
      # Self-monitor E1 act gate on Prime's acts (app/prime_loop.py); see .env_example.
      SELF_MONITOR_ACT_GATE_ENABLED: ${SELF_MONITOR_ACT_GATE_ENABLED:-true}
      SELF_MONITOR_PROBE_INTERVAL_SEC: ${SELF_MONITOR_PROBE_INTERVAL_SEC:-21600}
      SELF_MONITOR_LEDGER_PG_DSN: ${SELF_MONITOR_LEDGER_PG_DSN:-}
      # The curiosity replica (app/replica_loop.py); see .env_example.
      CURIOSITY_REPLICA_ENABLED: ${CURIOSITY_REPLICA_ENABLED:-true}
      CURIOSITY_REPLICA_TICK_SEC: ${CURIOSITY_REPLICA_TICK_SEC:-15}
      CURIOSITY_REPLICA_REFRACTORY_SEC: ${CURIOSITY_REPLICA_REFRACTORY_SEC:-0}
      CURIOSITY_REPLICA_SETTLE_INTERVAL_SEC: ${CURIOSITY_REPLICA_SETTLE_INTERVAL_SEC:-300}
      CURIOSITY_REPLICA_LLM_ROUTE: ${CURIOSITY_REPLICA_LLM_ROUTE:-prime}
      CURIOSITY_REPLICA_SEAT_WAIT_SEC: ${CURIOSITY_REPLICA_SEAT_WAIT_SEC:-45}
      CURIOSITY_REPLICA_BID_LANE: ${CURIOSITY_REPLICA_BID_LANE:-chat}
      CURIOSITY_REPLICA_MAX_TOKENS: ${CURIOSITY_REPLICA_MAX_TOKENS:-500}
      CURIOSITY_REPLICA_LLM_TIMEOUT_SEC: ${CURIOSITY_REPLICA_LLM_TIMEOUT_SEC:-40}
      CURIOSITY_REPLICA_HUB_URL: ${CURIOSITY_REPLICA_HUB_URL:-http://100.92.216.81:8080}
      CURIOSITY_REPLICA_PG_DSN: ${CURIOSITY_REPLICA_PG_DSN:-}
      CURIOSITY_REPLICA_ANSWERS_ENABLED: ${CURIOSITY_REPLICA_ANSWERS_ENABLED:-true}
      CURIOSITY_REPLICA_REFUSAL_HOLDBACK_FRACTION: ${CURIOSITY_REPLICA_REFUSAL_HOLDBACK_FRACTION:-0.2}
      CURIOSITY_REPLICA_CHALLENGE_HOLDBACK_FRACTION: ${CURIOSITY_REPLICA_CHALLENGE_HOLDBACK_FRACTION:-0.2}
      CURIOSITY_REPLICA_ANSWERS_PER_DAY: ${CURIOSITY_REPLICA_ANSWERS_PER_DAY:-3}
      CURIOSITY_REPLICA_ANSWER_REFRACTORY_SEC: ${CURIOSITY_REPLICA_ANSWER_REFRACTORY_SEC:-1800}
    volumes:
      # Read-only repo mount so config/ readers (prime_loop.py's
      # config/physiology/families.yaml at /repo) can reach config/ -- the
      # Dockerfile only COPYs
      # orion/ and this service dir, not config/ (a sibling of orion/ on
      # disk, never a subdirectory of it). Same dual-path pattern
      # services/orion-hub/docker-compose.yml already uses for the
      # identical gap (see channel_glossary.py's own docstring).
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:/repo:ro
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:/mnt/scripts/Orion-Sapienform:ro
    networks:
      app-net:
        aliases:
          - orion-athena-mind
          - orion-mind
    ports:
      - "${HOST_PORT:-6611}:${PORT:-6611}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf \"http://127.0.0.1:$${PORT:-6611}/health\" >/dev/null || exit 1",
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-net:
    external: true
