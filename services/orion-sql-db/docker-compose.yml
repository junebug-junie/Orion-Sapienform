# ───────────────────────────────────────────────────────────────
# 🐘 Orion SQL DB — PostgreSQL Database + pgAdmin Client
# ───────────────────────────────────────────────────────────────

services:
  orion-sql-db:
    image: postgres:15
    container_name: ${PROJECT}-sql-db
    shm_size: '1gb'
    # Cap RSS so runaway autovacuum/TOAST work cannot freeze the host (346Gi).
    # 16g is enough for normal ops; 48g let TOAST vacuum thrash disk for minutes per OOM cycle.
    mem_limit: ${POSTGRES_MEM_LIMIT:-16g}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-16g}
    restart: unless-stopped
    # Bound vacuum memory so a single worker cannot pin the cgroup before the cap trips.
    command:
      - postgres
      # ROADMAP D2. Without this we cannot answer "which query is reading this table",
      # only "which query happens to be running right now". Sampling pg_stat_activity 14
      # times failed to identify the consumer scanning substrate_proposal_frames because
      # each execution finishes in well under a second -- a fast, frequent query is close
      # to invisible to sampling and dominant in aggregate. pg_stat_statements aggregates
      # every execution instead, so shared_blks_read/calls answers it directly.
      # Requires a restart to take effect (shared_preload_libraries is postmaster-only).
      # THIS FLAG ONLY LOADS THE LIBRARY. The pg_stat_statements VIEW does not exist until
      # `CREATE EXTENSION pg_stat_statements;` is run once per database:
      #   docker exec orion-athena-sql-db psql -U postgres -d conjourney \
      #     -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
      # Without that step a rebuilt container pays the shared-memory and per-execution cost and
      # still answers `relation "pg_stat_statements" does not exist`.
      # Cost: a fixed shared-memory allocation for pg_stat_statements.max entries and a
      # small per-execution bookkeeping overhead. Defaults kept (max=5000, track=top).
      - -c
      - shared_preload_libraries=pg_stat_statements
      # Connection ceiling. Declared here because the postgres:15 DEFAULT of 100 is
      # what we were silently running on, and 25 distinct clients had grown into it.
      # This is an ongoing condition, not a one-off: the server log holds 217
      # `FATAL: sorry, too many clients already` over five days (2026-08-26..08-31),
      # and psql was refused three times while diagnosing an unrelated problem.
      #
      # The wall is max_connections, NOT max_connections minus
      # superuser_reserved_connections: every client backend connects as `postgres`,
      # a superuser, and the reserve does not hold slots back from superusers. The
      # log proves it -- all 217 refusals are the "too many clients" form and ZERO
      # are "remaining connection slots are reserved ...", which is what an ordinary
      # role gets at the lower ceiling.
      #
      # HAZARD, not yet fixed here: because services ARE the superuser, the 3
      # reserved slots guarantee an operator nothing. When this fills there is no
      # emergency door. Moving services to a non-superuser role is the real fix;
      # raising the ceiling only buys room. The check below warns when it sees this.
      #
      # Why 300 and not the ~375 a fully-saturated pool census implies: 78 of the 80
      # non-test create_engine sites use SQLAlchemy's default sizing (5+10), so a
      # simultaneous max-out across ~25 clients would want ~375. That has never
      # happened -- observed peak is ~100. 300 is ~3x observed peak, and the gate
      # below is what turns an approach to the new ceiling into a warning instead of
      # another silent outage. Sizing for a worst case that has never occurred would
      # cost page cache (see next paragraph) to buy slots nothing has asked for.
      #
      # Memory: backend anon RSS is ~2.6MB here, so 300 backends is ~780MB. There is
      # no OOM risk (oom_kill=0). But note the cgroup is ALREADY at 97.6% of its 16g
      # limit (memory.current 16.77GB) -- almost entirely reclaimable page cache,
      # which with shared_buffers at the 128MB default IS this database's cache. New
      # backend memory comes out of that cache. The cost here is cache pressure on a
      # 40GB database, not an availability risk.
      #
      # Watch headroom (must pass --gate, and must use the repo venv for psycopg2):
      #   .venv/bin/python scripts/check_postgres_connection_headroom.py --gate
      # or `make postgres-headroom`. Exit 1 = alarm, 2 = could not check.
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - vacuum_cost_delay=2ms
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "${VOLUMES_ORION_POSTGRES_PATH}"
    networks:
      - app-net
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  orion-sql-client:
    image: dpage/pgadmin4:8
    container_name: ${PROJECT}-sql-client
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - orion-sql-db
    networks:
      - app-net

networks:
  app-net:
    name: ${NET}
    external: true
