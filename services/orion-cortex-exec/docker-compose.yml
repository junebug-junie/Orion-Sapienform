      SKILLS_ALLOW_DOCKER_COMPOSE_BRINGUP: ${SKILLS_ALLOW_DOCKER_COMPOSE_BRINGUP:-false}
      SKILLS_DOCKER_COMPOSE_BRINGUP_TIMEOUT_SEC: ${SKILLS_DOCKER_COMPOSE_BRINGUP_TIMEOUT_SEC:-900}
      SKILLS_DOCKER_COMPOSE_BRINGUP_HEALTH_POLL_SEC: ${SKILLS_DOCKER_COMPOSE_BRINGUP_HEALTH_POLL_SEC:-60}
      BIOMETRICS_SERVICE_URL: ${BIOMETRICS_SERVICE_URL:-http://orion-athena-biometrics:8100}
      BIOMETRICS_HTTP_TIMEOUT_SEC: ${BIOMETRICS_HTTP_TIMEOUT_SEC:-5}
      ORION_SITUATION_RUNTIME_ENABLED: ${ORION_SITUATION_RUNTIME_ENABLED:-true}
      ORION_SITUATION_RUNTIME_ROUTE: ${ORION_SITUATION_RUNTIME_ROUTE:-chat}
      ORION_SITUATION_RUNTIME_TTL_SECONDS: ${ORION_SITUATION_RUNTIME_TTL_SECONDS:-120}
      ORION_SITUATION_RUNTIME_PROBE_TIMEOUT_SEC: ${ORION_SITUATION_RUNTIME_PROBE_TIMEOUT_SEC:-2.0}
      CORTEX_EXEC_LLM_GATEWAY_URL: ${CORTEX_EXEC_LLM_GATEWAY_URL:-http://llm-gateway:8210}
      # ROADMAP A5: reads the gateway's GET /admission so Orion can perceive whether its own
      # background thinking was made to wait. Inherited by cortex-exec-{chat,spark,background}
      # via `extends`. Set _ENABLED=false to remove both the fetch and the cue key.
      CORTEX_EXEC_ADMISSION_CUE_ENABLED: ${CORTEX_EXEC_ADMISSION_CUE_ENABLED:-true}
      CORTEX_EXEC_ADMISSION_CUE_WINDOW_S: ${CORTEX_EXEC_ADMISSION_CUE_WINDOW_S:-21600}
      CORTEX_EXEC_ADMISSION_CUE_TTL_SEC: ${CORTEX_EXEC_ADMISSION_CUE_TTL_SEC:-60}
      CORTEX_EXEC_ADMISSION_CUE_TIMEOUT_SEC: ${CORTEX_EXEC_ADMISSION_CUE_TIMEOUT_SEC:-2.0}
