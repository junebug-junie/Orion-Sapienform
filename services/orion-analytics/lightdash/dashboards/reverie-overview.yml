name: Reverie Overview
description: Grain-safe text and visual Reverie activity, shown as separate systems on one dashboard.
slug: reverie-overview
spaceSlug: orion-analytics
version: 1
tiles:
  - x: 0
    "y": 0
    h: 4
    w: 36
    tabUuid: null
    type: markdown
    properties:
      title: How to read this dashboard
      content: |-
        Text and visual Reverie are parallel systems with different grains,
        schedules, and meanings. Their measures stay separate.

        Counts represent rows that reached PostgreSQL persistence. Missing or
        late rows do not by themselves prove that a service was down. Terminal
        reasons are recorded stop conditions, not success/failure judgments.
        Prompts, captions, themes, paths, continuity text, and raw JSON are
        deliberately excluded.
    tileSlug: reverie-overview-scope
  - x: 0
    "y": 4
    h: 2
    w: 36
    tabUuid: null
    type: markdown
    properties:
      title: Text reverie
      content: Persisted text chains, recorded terminal reasons, and UTC dates with no persisted rows.
    tileSlug: reverie-overview-text-heading
