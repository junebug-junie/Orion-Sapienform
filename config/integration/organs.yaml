# Orion's organ registry: which organ every producer of Orion experience belongs to, whether the organ
# emits through the experience contract and reads the now back, and what "bigger" means for salience.
#
# Spec: docs/superpowers/specs/2026-11-15-orion-integration-and-a-life-design.md, Part A (A2, A5, A.6).
# Consumers (the reason this file exists):
#   * orion/temporal_self/now.py   -- GET /temporal-self/now: "at most 2 per organ", "never the
#     reader's own organ", and the integration metric's per-organ split;
#   * orion-durable-runs' chronicle -- salience per kind (salience_magnitude) at insert;
#   * scripts/check_integration_seam.py (CI, the integration gate in CLAUDE.md);
#   * scripts/report_integration_coverage.py (the live coverage report);
#   * orion/dig/organs.py (`dig organs <date>`, the daily roundup in the day letter, integration patch 4).
#
# Per organ:
#   temporal_sources    TemporalSourceKind values this organ emits (each kind belongs to exactly one organ).
#   exempt_emit         Required when temporal_sources is empty: why this organ does not emit yet.
#   salience_magnitude  kind -> rule in orion/temporal_self/now.py MAGNITUDE_RULES. No rule: salience NULL.
#   reads_now           The module that calls build_now / GET /temporal-self/now and records cites.
#   exempt_read         Required when reads_now is null: why this organ does not read the now yet.
#   families            config/physiology/families.yaml families (one organ each, or exempt_families).
#   workflows           DurableWorkflowV1 values (one organ each, or exempt_workflows).
#   intention_sources   modules in orion/prime/intention_sources/ (one organ each).
#   channels            orion/bus/channels.yaml channels that carry this organ's output. Only channels
#                       ADDED since the merge base with origin/main are checked (exempt_channels otherwise).
#
# Salience is computed from the source's own magnitude only, never from use counts.
# A reviewer reads every new exemption (CLAUDE.md "Integration gate").

organs:
  reverie:
    # Reveries that ask (2026-11-24, docs/superpowers/specs/2026-11-18-reverie-questions-design.md): one
    # reverie_question experience per reverie (a question, a none_reason or a code refusal). No magnitude
    # rule yet: salience NULL. reverie_chain and expectation_verdict are RETIRED (no producer since
    # 2026-11-24; their adapters and readers are deleted). They stay listed only because history rows in
    # temporal_self_event still carry them and must keep their organ (the now's per-organ split; the
    # registry has no exemption form for TemporalSourceKind). Each reverie reads the now (app/reverie.py via
    # app/temporal_self_cue.py) and records its cites (#3499).
    temporal_sources: [reverie_question, reverie_chain, expectation_verdict]
    families: [thought.reverie]
    reads_now: services/orion-thought/app/temporal_self_cue.py
  painting:
    temporal_sources: [visual_run, visual_deferral]
    families: [thought.painting, thought.dream_hop]
    workflows: [reverie.visual]
    # Integration patch 7b (#3429): a waking painting's one model step, the interpret call
    # (services/orion-thought/app/visual_chain.py compute_visual_plan -> interpret_context_for_visual), is shown
    # GET /temporal-self/now?organ=painting; the [experience:<id>] tags it writes are posted to
    # /temporal-self/now/use and stripped before the diffusion prompt. The read and the post live in this module
    # (read_painting_now, close_painting_now). A run with no interpret call reads nothing; dream hop pictures
    # (thought.dream_hop) are the dream's prompt verbatim and never read.
    reads_now: services/orion-thought/app/temporal_self_cue.py
  dream:
    # dream_day (the day dream, 2026-11-18): one experience per night's dream_day row; experience only, no
    # magnitude yet (salience NULL). The dream.day run reads the now (app/dream_day_store.py: GET
    # /temporal-self/now?organ=dream at gather, its experience: cites to /temporal-self/now/use at persist).
    # The sleep cycle (dream.cycle) and dream.carry still do not read it: the cycle's replay picks keyed
    # candidates by code with no model step that could cite, and a carry run's first text hop would need the
    # shown id carried across its steps (#3972).
    temporal_sources: [dream_cycle, dream_hypothesis, dream_day]
    salience_magnitude:
      dream_cycle: dream_hypothesis_count
    families: [dream.cycle, dream.compaction]
    workflows: [dream.carry, dream.day]
    reads_now: services/orion-durable-runs/app/dream_day_store.py
  curiosity:
    temporal_sources: [curiosity_run]
    salience_magnitude:
      curiosity_run: curiosity_moved_formed
    families: [durable.curiosity_investigate, curiosity.replica, curiosity.compaction, curiosity.supervisor,
               durable.self_inquiry, hub.curiosity_finding]
    workflows: [curiosity.investigate, curiosity.compaction]
    reads_now: services/orion-hub/scripts/curiosity_now.py
  reading:
    # reading_turn has no magnitude: the act ledger's surprisal for a finished read falls with the
    # family posterior's age (daily median 0.0253 on 10-16 -> 0.000087 on 11-15), so against 30 days every
    # successful read reads ~0 and only failed fetches read high. It would rank by "this read failed".
    temporal_sources: [reading_turn]
    families: [hub.world_pulse_read, actions.daily_pulse]
    workflows: [reading.turn, reading.resonance]
    reads_now: null
    exempt_read: "no read-back planned in the spec yet (#3457)"
  camera:
    temporal_sources: [vision_percept, presence_transition, street_event, office_session]
    # vision_percept has no magnitude: entity count stepped from 1 to 4-5 per percept on 2026-11-09 (a
    # producer change), so against its 30-day history every ordinary scene read >= 0.9 (88% live, 11-15).
    salience_magnitude:
      office_session: visit_seconds
    families: [vision.council, perception, perception.office, orion.look, orion.look_check, vision.ask]
    reads_now: null
    # Integration patch 7b looked and kept this exempt: no camera model step should cite other organs' experiences.
    exempt_read: "no model step of its own that could cite: a look (orion.look, orion.look_check) is a dig command inside a chat or curiosity turn that copies a frame or files a check, so its read of the now is that turn's organ's; vision.council and perception describe frames, and mixing other organs' experiences into perception would corrupt it; camera asks (vision.ask) are opened by rules in sql-writer. A cite here would be another organ's cite under the camera's name (#3429)"
  body:
    temporal_sources: [body_binding, gpu_wait, arousal_transition]
    salience_magnitude:
      gpu_wait: waited_ms
    families: [self_regulate.shed]
    reads_now: null
    exempt_read: "a reflex organ: regulation and the body economy act on sensor state, not on other organs' experiences (design call, #3457)"
  prediction:
    # action_outcome: the act ledger's predicted-vs-observed outcome rows (substrate_action_outcomes),
    # one per closed act of any organ. Scoring a prediction is this organ's work, whoever acted.
    # action_outcome has no magnitude: like reading_turn, the ledger's surprisal falls with each family
    # posterior's age (weekly median 0.0105 the week of 10-12 -> 0.00024 the week of 11-09; corr(time,
    # ln surprisal) = -0.43 over 35 days), so it would rank by age. prediction_surprise is a forecast's own
    # -ln P(observed) and does not drift that way.
    # experiment_result (Family C, 2026-11-16): one item per finished randomised experiment RUN (not per block or
    # night): "I held my town sessions to see what they cost". Magnitude effect_z = |estimate| / SE of the primary
    # outcome: a clear effect is more notable than a null, and z does not drift with age.
    temporal_sources: [prediction_surprise, action_outcome, experiment_result]
    salience_magnitude:
      prediction_surprise: surprise_nats
      experiment_result: effect_z
    families: [prediction.experiment]
    # orion:prediction:joint_surprise (#3575, 2026-11-18): family A body / room joint-group surprise, folded by
    # substrate-runtime into node:prediction.body_joint / .room_joint (attention, curiosity, self-readings read
    # those nodes). Not yet a temporal-self kind of its own: big joint spikes as experience items is a follow-up.
    # orion:prediction:street_rhythm_surprise (PE retire rev 4 item 5, 2026-11-25): walkway rhythm forecast
    # surprise per scored expectation, folded by substrate-runtime into node:prediction.street_rhythm (a world
    # node, SHADOW until its 7-day calm check: written, not yet read by attention or curiosity). Emits through
    # no temporal-self kind yet, same as joint surprise: the source rows (vision_percept_expectation) are the
    # sql-writer rhythm learner's, and an experience item per street forecast is the same follow-up.
    channels: ["orion:prediction:joint_surprise", "orion:prediction:street_rhythm_surprise"]
    reads_now: null
    exempt_read: "orion-prediction forecasts sensor series; no forecast reads experiences yet (design call, #3457). The experiment runner (prediction.experiment) must not read experience: a randomised arm that depends on Orion's state is no longer randomised; its stop rules read sensors and the pool only"
  metacognition:
    temporal_sources:
      - metacog_observation
      - faculty_status_changed
      - attention_row
      - attention_loop_raised
      - attention_loop_verdict
      - field_dominance_run
    salience_magnitude:
      metacog_observation: metacog_severity
      field_dominance_run: dominance_ticks
    families: [metacog.log, actions.daily_metacog, durable.self_sense_eval, spark.introspect]
    workflows: [self_sense_eval, situation.update]
    reads_now: null
    exempt_read: "no read-back planned in the spec yet (#3457)"
  memory:
    temporal_sources: [memory_episode, consolidation_window_close]
    families: [memory.consolidation, durable.reminiscence, actions.journal, durable.journal_compose, compactor.digest,
               topic_foundry.run, concept_induction, durable.pr_field_note]
    workflows: [memory.episode_distill, journal.compose, reminiscence.episode, compactor.digest, pr.field_note]
    # Integration patch 7b (#3429): reminiscence.episode's where_i_am_now hop (the one hop about the present) is
    # shown GET /temporal-self/now?organ=memory and posts the reply's [experience:<id>] tags to
    # /temporal-self/now/use. Episode distill, journal compose and field notes do not read: their evidence is a
    # conversation, a trigger or a PR, and other organs' experiences would mix into it.
    reads_now: services/orion-durable-runs/app/reminiscence_now.py
  chat:
    temporal_sources: [chat_turn]
    families: [hub.chat_reply, hub.outreach, durable.consult_orion_turn, durable.session_roundup]
    workflows: [consult.orion_turn, session_roundup.orion_turn]
    reads_now: null
    exempt_read: "the chat turn reads the Prime block, which carries the now's top 2 lines in integration patch 3"
  play:
    # retro_play also carries a person's own sitting (kind human_play, game company patch 1): Hub's
    # Retro gateway records it (services/orion-hub/scripts/retro_sitting.py). No family: a person
    # playing is not an act of Orion's and nothing bids for it.
    # Patch 3 (lines): retro_look is a look a line turn checked against its frames and found to hold
    # (verdict checked_holds), keyed by its settle time and labelled "Saw on the game screen: <note>". Unchecked
    # and contradicted looks never become events. Looks carry no salience (no magnitude here): they rank after
    # every scored item in a reader's now and fill a place only when one is free (spec rev 4 section 8).
    temporal_sources: [retro_play, retro_look]
    salience_magnitude:
      retro_play: sitting_minutes
    # Patch 2 (looks): hub.retro_watch bids for each look; orion.watch_choice is Orion's own switch (dig watch).
    # Patch 3 (lines): hub.retro_commentary bids for each line Orion says to the person who plays.
    # Patch 4 (Prime and attention): hub.retro_sitting is the event want a finished sitting posts (event_ref
    # retro_sitting:<id>, salience = sitting minutes against the last 30 days), so Prime can hold it as a concern.
    # Patch 4 also adds a NEW PRIME CONCERN SOURCE that CI cannot see (scripts/check_integration_seam.py reads no
    # method): the two sitting wakes, read by services/orion-mind/app/prime_loop.py ``_read_sitting`` from the open
    # sitting's Redis key (orion:retro:sitting) and folded by orion/prime/sitting.py. They are facts Prime is shown
    # (at most two per sitting), not scores.
    families: [hub.retro_coplay, hub.retro_leisure, aitown.session, hub.retro_watch, orion.watch_choice,
               hub.retro_commentary, hub.retro_sitting]
    # The line turn reads GET /temporal-self/now?organ=play, puts up to 3 items in its game block and records its
    # cites with POST /temporal-self/now/use (closes the play part of #3457).
    reads_now: services/orion-hub/scripts/retro_commentary.py
  prime:
    # prime_thought has no magnitude yet: the act ledger's surprisal for a Prime thought drifts by
    # 1e-6 per thought (0.000454 -> 0.000443 over 11-14..15) whatever the thought did, so it ranks by
    # nothing. Unscored items rank after scored ones, newest first. Part B (hunger, orion/prime/hunger.py):
    # Prime reads GET /temporal-self/hunger (no new kind, family or channel) and pins a need's experience into
    # its now (include=); a need-woken thought's label starts "woke: need:<name> <ref>".
    temporal_sources: [prime_thought]
    families: [prime]
    reads_now: services/orion-mind/app/prime_loop.py
  intention:
    # intention_close (integration patch 7a, #3429): one experience per closed Prime make intention:<id> act,
    # produced / not_produced, with the act, its trace and the carry run as refs. No magnitude: salience NULL.
    temporal_sources: [intention_close]
    families: [durable.intention]
    workflows: [intention.carry]
    intention_sources: [turn_promise]
    reads_now: null
    exempt_read: "a carry turn reads its own promise's thread only (intention design; design call, #3457)"
  day_letter:
    # day_letter (integration patch 7a, #3429): one experience per written letter, its threads as refs
    # (orion_day_letter:<day>#thread<i>, the ref each thread's Prime concern carries). No magnitude.
    temporal_sources: [day_letter]
    workflows: [orion_day.letter]
    reads_now: null
    # Integration patch 4: the letter's input carries the daily organ roundup (orion/dig/organs.py), with the
    # day's experience_use rows quoted per organ. Its [experience:] cites are counted in the run's finish
    # detail (note_roundup_refs); they are not experience_use rows, because the roundup is a read-only dig and
    # writes no experience_shown row a cite could be checked against.
    exempt_read: "reads the daily organ roundup, not GET /temporal-self/now; cites counted in finish detail note_roundup_refs, not as experience_use (integration patch 4)"
  personality:
    # personality_choice (integration patch 7a, #3429): one experience per Prime choice the personality loop
    # folded (personality_evidence lane prime), with the leaning it joined. No magnitude: salience NULL.
    # Live, every Prime choice is a prime/infer act, so a fold repeats that act's prime_thought ~10-20 min later. Kept
    # on purpose (spec A1: one per choice point; the fold, and the leaning it joined, is the new fact). Both carry the
    # same act:<act_id> ref, so a reader can tell them apart from the same thought.
    temporal_sources: [personality_choice]
    reads_now: null
    exempt_read: "choices are made by Prime; the personality loop folds them and reads no other organ (design call, #3457)"

# Producers that are no organ's experience. Each needs a reason a reviewer can check.
exempt_families:
  execution_dispatch.maintain: "dispatch ladder retired 2026-11-07 (ladder retirement PR 6); no grammar_acts row for this actor ever (live, 2026-11-15)"
  execution_dispatch.inspect: "dispatch ladder retired 2026-11-07 (ladder retirement PR 6); no grammar_acts row for this actor ever (live, 2026-11-15)"
  execution_dispatch.substrate: "dispatch ladder retired 2026-11-07 (ladder retirement PR 6); no grammar_acts row for this actor ever (live, 2026-11-15)"
exempt_workflows:
  harness.echo_smoke: "a hand-triggered seam smoke for the durable-run -> harness step path; not an organ's output"
exempt_channels:
  "orion:stream:gpu_pool:event": "transport, not a new experience: a durable copy of the existing orion:gpu_pool:event payload (same GpuPoolEventV1 envelope) so sql-writer stops losing pool events while it restarts (#3920); the body organ's gpu_wait source still reads the same gpu_pool_events rows"
  "orion:stream:gpu_pool:event:dlq": "dead letters of the stream above (undecodable, or unwritable after max attempts); no organ reads it, an operator inspects it"
  "orion:heartbeat:seat:rollup": "telemetry, not experience: a 5-minute per-seat sum of the heartbeat's routed grammar atoms, stored for the field-demon replay (scripts/demon_network_replay.py, issue #3886); no organ reads it at runtime and it carries no content of its own"
