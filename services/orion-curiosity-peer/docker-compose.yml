services:
  curiosity-peer:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-curiosity-peer/Dockerfile
    container_name: ${PROJECT}-curiosity-peer
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NODE_NAME=${NODE_NAME}
      - INSTANCE_ID=${INSTANCE_ID}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC}

      - CURIOSITY_PEER_NODE_NAME=${CURIOSITY_PEER_NODE_NAME:-${NODE_NAME}}
      # Dual kill switch (service side). Hub also needs
      # HUB_CURIOSITY_CONTRACTOR_PEER_ENABLED=true at enqueue time.
      - CURIOSITY_PEER_ENABLED=${CURIOSITY_PEER_ENABLED:-false}

      - CURIOSITY_PEER_EPISODES_ENABLED=${CURIOSITY_PEER_EPISODES_ENABLED:-false}
      # Claude usage meter root. A transcript-observed `limited` refuses; an
      # idle (unobserved) meter tries Claude (#3655).
      - CURIOSITY_PEER_CLAUDE_PROJECTS_PATH=${CURIOSITY_PEER_CLAUDE_PROJECTS_PATH:?set CURIOSITY_PEER_CLAUDE_PROJECTS_PATH}
      # Back-off after Claude says "you've hit your limit" with no reset time.
      - CURIOSITY_PEER_CLAUDE_LIMIT_BACKOFF_DEFAULT_SEC=${CURIOSITY_PEER_CLAUDE_LIMIT_BACKOFF_DEFAULT_SEC:-3600}

      - ORION_CURIOSITY_GRAPH_HOST=${ORION_CURIOSITY_GRAPH_HOST:-}
      - ORION_CURIOSITY_GRAPH_PORT=${ORION_CURIOSITY_GRAPH_PORT:-}
      - ORION_CURIOSITY_GRAPH_USER=${ORION_CURIOSITY_GRAPH_USER:-}
      - ORION_CURIOSITY_GRAPH_PASSWORD=${ORION_CURIOSITY_GRAPH_PASSWORD:-}
      - ORION_CURIOSITY_GRAPH_OWN=${ORION_CURIOSITY_GRAPH_OWN:-orion_worldview}

      - CHANNEL_HELP_REQUEST=${CHANNEL_HELP_REQUEST:-orion:curiosity:help:request}
      - CHANNEL_PEER_BRIEF=${CHANNEL_PEER_BRIEF:-orion:curiosity:peer:brief}
      - CHANNEL_PEER_BRIEF_CONSUMED=${CHANNEL_PEER_BRIEF_CONSUMED:-orion:curiosity:peer:brief:consumed}
      - CHANNEL_ROOM_CLAUDE_REQUEST=${CHANNEL_ROOM_CLAUDE_REQUEST:-orion:room:claude:request}
      - CHANNEL_ROOM_CLAUDE_UTTERANCE=${CHANNEL_ROOM_CLAUDE_UTTERANCE:-orion:room:claude:utterance}
    volumes:
      # Read-only Claude Code transcripts for the Claude usage meter
      # (orion.dev_economics.rate_limit_events.observe). Only an in-memory
      # limit state is computed; transcript text never leaves this container.
      # Mounted at the SAME path as the host so absolute symlinks inside the
      # tree (cross-project subagent transcripts) still resolve -- same rule
      # as orion-cocreation-signals. Without this mount the meter cannot see a
      # transcript-observed limit (an unobserved meter now tries Claude, #3655).
      - ${CURIOSITY_PEER_CLAUDE_PROJECTS_PATH:?set CURIOSITY_PEER_CLAUDE_PROJECTS_PATH in services/orion-curiosity-peer/.env}:${CURIOSITY_PEER_CLAUDE_PROJECTS_PATH:?set CURIOSITY_PEER_CLAUDE_PROJECTS_PATH}:ro
    # DELIBERATELY ABSENT: no docker.sock, no SSH/gh mounts, no host network.
    # Credential isolation is the point of this container existing.

networks:
  app-net:
    name: ${NET}
    external: true
