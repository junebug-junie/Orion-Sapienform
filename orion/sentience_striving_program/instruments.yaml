# Sentience Striving Program -- instrument manifest.
#
# WHY THIS FILE EXISTS
# --------------------
# README.md (this directory) is the program's narrative record. It goes stale
# silently: on 2026-09-02 a read found four separate claims in it that live data
# had already moved past -- section 15d asserted PR #1894 was unmerged, the
# curiosity loop undeployed and at "zero real runs" (it was merged, enabled, and
# 26 runs deep, with its own falsifiable detector passing); and Objective 7's
# 2026-08-20 "only 5 distinct narratives exist" -- the finding that whole
# objective was CLOSED on -- had since become 16.
#
# Prose cannot detect its own decay. This file records the same claims as
# re-runnable queries so `scripts/check_sentience_instruments.py` can go red the
# day one drifts, per CLAUDE.md's "deterministic gates over repeated yelling."
#
# WHAT THIS FILE IS NOT
# ---------------------
# Not a taxonomy, and not a second metric registry. Every mechanical fact about
# an instrument -- who writes it, who reads it, is the signal degenerate -- is
# resolved at read time from `orion/metrics/` (lineage.py, consumers.py,
# liveness.py), the existing metric semantic layer. This file declares only what
# that layer structurally cannot know:
#
#   1. that a thing is an *instrument of this program* at all (the metric layer's
#      four surfaces -- bus_channel, field_channel, inner_state, organ_signal --
#      have no notion of "the AST/HOT reducer" as one object),
#   2. which program outcome (O1-O4) it ladders to, and why -- irreducibly
#      editorial, so it is freshness-gated rather than correctness-gated,
#   3. the claims the program currently rests on it, as SQL.
#
# Per CLAUDE.md's keyword-cathedral rule, every entry below has a schema, a
# producer (this file), a consumer (the checker + Hub's /sentience-program page),
# a reducer (instruments.py's join), a test, and a gate. An entry that names
# something not present in the repo fails the checker -- that is the point.

version: 1

# Section 5 of README.md, verbatim. Restated here so the checker can verify every
# instrument claims a real outcome, and so the Hub page has one source for labels.
outcomes:
  O1:
    title: "Capability actually varies with state"
    claim: >-
      Orion's autonomous-action budget demonstrably rises and falls with real
      internal pressure, not a flat per-cycle allowance, with a demonstrated,
      verified ceiling.
  O2:
    title: "Self-initiation is attributable, not orphaned"
    claim: >-
      When self-initiated action occurs, it is traceable to a live, currently-
      firing internal signal -- not a mechanism that has never once fired across
      its deployed lifetime.
  O3:
    title: "A consciousness-theory instrument produces a distinguishable signal"
    claim: >-
      A blind rater, given only the instrument's output on real historical data
      (not shown which theory produced it), can distinguish it from noise and
      describe what it appears to track.
  O4:
    title: "The drives question is answered empirically, continuously"
    claim: >-
      Named categories (if any survive) are a report on clustering of real
      coalition-winning history, versioned and re-derivable, not a constant.

# How long an `unlock:` narrative may go un-re-read before the checker flags it.
# 90 days is deliberately generous: this gate exists to catch narratives that
# have been abandoned, not to manufacture review churn. The claims below carry
# their own drift detection and need no such window -- they are checked against
# live data on every run.
review_max_age_days: 90

instruments:
  - id: ast_hot_reducer
    title: "AST/HOT attention self-model reducer"
    theory: "Attention Schema Theory + Higher-Order Theories"
    program_ref: "README.md section 6 item 2; section 9b items 2 and 4"
    module: orion/substrate/attention_self_model.py
    entrypoint: reduce_attention_self_model
    outcome: O3
    storage:
      kind: append_only
      table: substrate_attention_self_model
      ts_column: created_at
      # Confirmed 2026-09-02: this is why history is ~7 days, and the setting's
      # own comment says it was sized to clear a 48h replay window with margin --
      # NOT to save disk. The table is 50 MB for 7 days against a 41 GB database
      # and 136 GB of free host disk, so a full year would cost ~2.6 GB.
      retention_setting: SUBSTRATE_ATTENTION_SELF_MODEL_LOG_RETENTION_HOURS
      retention_service: orion-substrate-runtime
    metrics:
      - metric://field_channel/orion-field-digester/prediction_error
    unlock: >-
      The only instrument in this program whose selection logic is actually
      proven correct (unit-tested branch-for-branch). O3 is therefore gated not
      on whether it works but on whether its OUTPUT is legible -- its narrative
      layer is a fixed template with one substituted slot, so a blind-rater trial
      would trivially pass without testing what O3 asks. Objective 7 was closed
      partly on this. Enriching the narrative is named path-back-open (b).
    last_reviewed: 2026-09-02
    claims:
      - id: narrative_diversity
        question: "How many distinct reason_narrative strings has the reducer ever emitted?"
        sql: >-
          SELECT count(DISTINCT self_model_json->>'reason_narrative')
          FROM substrate_attention_self_model
        recorded: 16
        recorded_at: 2026-09-02
        blocks: O3
        note: >-
          Was 5 when Objective 7 was closed on 2026-08-20 ("too template-thin for
          the legibility bar"). It moved to 16 and nothing noticed for 13 days.
          This claim is the reason this file exists.
      - id: branch_coverage
        question: "How many distinct attention_reason branches has the reducer ever taken?"
        sql: >-
          SELECT count(DISTINCT self_model_json->>'attention_reason')
          FROM substrate_attention_self_model
        recorded: 1
        recorded_at: 2026-09-02
        blocks: O3
        note: >-
          100% bottom_up_salience across all rows. Zero top_down_override, zero
          field_salience_only -- the two branches whose why-logic is unit-tested
          but has never once fired in production. Unmoved since 2026-08-20.

  - id: attention_schema_surface
    title: "Attention schema surface (four attending processes, one shape)"
    theory: "Attention Schema Theory (Graziano) -- the schema as a lossy shared cartoon of attention"
    program_ref: "README.md section 6 item 2; section 9b items 2 and 4; docs/superpowers/specs/2026-09-04-attention-schema-surface-design.md"
    module: orion/schemas/attention_schema.py
    # No `def` entrypoint on purpose: the schema is the instrument; the four
    # adapters are to_attention_schema() in orion/substrate/attention_self_model.py,
    # orion/reverie/attention_schema.py, orion/curiosity/attention_schema.py and
    # orion/substrate/attention_frame.py (cortex chat turn).
    outcome: O3
    storage:
      kind: append_only
      table: substrate_attention_schema
      ts_column: created_at
      # 90 days, not the self-model table's 7: the design doc's Missing
      # Question 4 found a 168h window silently expires the control windows
      # the blind-rater check needs. Written by orion-sql-writer off the
      # orion:attention:schema channel; retention lives with the writer.
      retention_setting: SUBSTRATE_ATTENTION_SCHEMA_RETENTION_DAYS
      retention_service: orion-sql-writer
    metrics:
      - metric://bus_channel/orion-cortex-exec/orion:attention:schema
    unlock: >-
      Makes O3's blind-rater test a real discrimination test. The AST/HOT
      reducer above could only be rated against a straw man (its own output
      vs noise); with substrate attention, reverie, curiosity, and the cortex
      chat turn all projecting the same four facts -- what won, why, how
      confident, what next -- the question becomes "which of these is
      deliberating, drifting, reacting?", with real alternatives. Shipped
      2026-09-06 as four write-only adapters and one bus channel; nothing
      routes or gates off it. The curiosity lane's WHY is still not captured
      (only the WHAT -- which prior was tested, from Orion's own graph
      stamps); asking Orion to record it is a kickoff-prompt change and a
      separate proposal.
    last_reviewed: 2026-09-06
    claims:
      - id: producers_live
        question: "How many distinct processes have emitted a row in the retained window? (Acceptance Check 1: all four, or it is a failure -- a lane that emits zero rows is reported, not omitted.)"
        sql: >-
          SELECT count(DISTINCT process) FROM substrate_attention_schema
        recorded: 5
        recorded_at: 2026-09-07
        blocks: O3
        note: >-
          Curiosity lane FAILURE resolved: PR #2128 (durable cognition runs
          via orion-durable-runs, kicked off from cortex) merged 05:31Z.
          24h read (2026-09-07 05:40Z, since HUB_CURIOSITY_KICKOFF_VIA_CORTEX
          was flipped true): substrate_attention 2718, cortex_turn 1497,
          reverie 215, curiosity 3 (was 0), plus a new fifth lane durable_run
          12 (the sequencing itself, one row per node transition). Two
          distinct runs both reached finish/completed today, one of them
          after surviving a real container restart (Acceptance Check 1 of
          the durable-runs design, docs/superpowers/specs/2026-09-06-durable-
          cognition-runs-from-cortex-design.md, PASSED live). This is the
          FIRST read since the flag went live in normal (not manually
          triggered) operation -- acceptance checks 2-6 of that design
          (cortex sees every kickoff, cap not burned by a restart, nothing
          else moved, kill switch still works) need a proper 24h read once a
          full day of organic tick-driven runs has accumulated, not just
          today's two manually-triggered test runs.
      - id: cortex_lane_is_constant
        question: "How many distinct reason_narrative strings has the cortex_turn lane emitted? (Acceptance Check 4, per lane: 2 means the lane is a constant, not an instrument.)"
        sql: >-
          SELECT count(DISTINCT reason_narrative) FROM substrate_attention_schema
          WHERE process = 'cortex_turn'
        recorded: 2
        recorded_at: 2026-09-06
        blocks: O3
        note: >-
          871 rows, 850 distinct turns, 2 distinct attended ids, 2 narratives
          -- 870 of them "already-known target should not be asked about
          again" (orion/substrate/attention/policy.py::select_actions takes
          the already_known branch for the same open loop on every unified
          turn). The lane is honest about what cortex's chat attention policy
          does, and what it does is a constant. Reported per lane on purpose;
          not folded into an aggregate. Not this patch's fix.
      - id: narrative_diversity_per_lane_is_scoped_to_retention
        question: "Distinct reason_narrative per process over the retained window (Acceptance Check 4 -- per lane, never an aggregate; the substrate lane's own count is the baseline to beat)."
        kind: manual
        recorded: "not yet measured -- run: SELECT process, count(DISTINCT reason_narrative), count(*) FROM substrate_attention_schema GROUP BY 1"
        recorded_at: 2026-09-06
        note: >-
          Deliberately MANUAL, not SQL: a single scalar cannot carry four
          lanes, and folding them into one number is exactly the aggregate
          the design doc forbids. The question is scoped to the retained
          window on purpose (Missing Question 4).

  - id: durable_runs
    title: "Durable cognition runs (curiosity investigation under a checkpointer, kicked off from cortex)"
    theory: "Continuity of cognition across process death -- a run is a thing that can be resumed, not a stack frame"
    program_ref: "README.md section 6 item 2; docs/superpowers/specs/2026-09-06-durable-cognition-runs-from-cortex-design.md"
    module: orion/schemas/durable_run.py
    outcome: O3
    storage:
      kind: append_only
      table: substrate_durable_run_state
      ts_column: created_at
      retention_setting: SUBSTRATE_DURABLE_RUN_STATE_RETENTION_DAYS
      retention_service: orion-sql-writer
    metrics:
      - metric://bus_channel/orion-durable-runs/orion:durable:run:state
    unlock: >-
      Step 3 of the attention-schema-surface ordering, reframed by evidence
      from the surface itself: on 2026-09-06 three curiosity runs started and
      none finished (daily cap 3/3 spent; last run traced into cortex at
      18:49Z, Hub recreated 19:01Z). A run whose only state is a process's
      memory dies with the process and leaves nothing to resume. This
      instrument reads the runner's state rows: which runs resumed, from
      which node, how many were abandoned. It says nothing about what Orion
      thought -- only whether the thinking survived.
    last_reviewed: 2026-09-06
    claims:
      - id: runs_resumed
        question: "How many durable runs have resumed after a restart (a state row with resumed_from_node set) in the retained window?"
        sql: >-
          SELECT count(DISTINCT run_id) FROM substrate_durable_run_state
          WHERE resumed_from_node IS NOT NULL
        recorded: 2
        recorded_at: 2026-09-07
        blocks: O3
        note: >-
          Acceptance check passed live: run ff8a379217d8 was container-restarted
          4.5h into a harness_turn, resumed under the same run_id, and finished
          (journal + finish-detail) 2026-09-07 04:37:29Z after 8 attempts (2 RPC
          timeouts from a missing bus-catalog entry, then legitimate no_final_frame
          declines, then a real turn). run 4b9621bab74b also resumed once (an
          in-flight RPC lost to the Hub redeploy that shipped the catalog fix) and
          finished clean on its next attempt. Both counted here.
      - id: runs_abandoned
        question: "How many durable runs were abandoned (checkpoint older than DURABLE_RUNS_MAX_AGE_HOURS) in the retained window?"
        sql: >-
          SELECT count(DISTINCT run_id) FROM substrate_durable_run_state
          WHERE status = 'abandoned'
        recorded: 0
        recorded_at: 2026-09-07
        note: >-
          Still zero after the first real resume cycle. Should stay near zero.
          A rising count means runs are dying and NOT being picked up within a
          day -- the failure this service exists to prevent, measured on itself.

