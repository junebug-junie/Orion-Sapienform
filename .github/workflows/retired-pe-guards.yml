name: retired-pe-guards

# PE suite rebuild step 5 (2026-11): node:substrate.bus_synaptic and
# node:substrate.route are retired; step 6 (2026-11-13): node:substrate.chat. These guards fail if a producer, a reader
# or a stored-value path comes back (CLAUDE.md 0A "kill means kill"). The
# mood-arc metacog trigger must stay off until the encoder is retrained.
# No DB, bus or LLM.

on:
  pull_request:
    paths:
      - "orion/substrate/**"
      - "orion/attention/**"
      - "orion/schemas/attention_candidate.py"
      - "orion/mood_arc/**"
      - "config/field/**"
      - "services/orion-field-digester/app/tensor/channels.py"
      - "services/orion-substrate-runtime/**"
      - "services/orion-mind/**"
      - "services/orion-equilibrium-service/**"
      - "services/orion-recall/app/fusion.py"
      - "services/orion-recall/app/storage/falkor_bus_synaptic_adapter.py"
      - ".github/workflows/retired-pe-guards.yml"
  push:
    branches: [main]
    paths:
      - "orion/substrate/**"
      - "orion/attention/**"
      - "services/orion-substrate-runtime/**"
      - "services/orion-mind/**"
      - "services/orion-equilibrium-service/**"
      - ".github/workflows/retired-pe-guards.yml"

jobs:
  guards:
    name: Retired PE nodes stay retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r services/orion-equilibrium-service/requirements.txt
          python -m pip install -r services/orion-mind/requirements.txt
          python -m pip install -r services/orion-recall/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Shared readers + mood-arc enrichment
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            tests/test_retired_pe_step5_readers.py \
            orion/substrate/tests/test_attention_self_model.py \
            orion/mood_arc/tests/test_corpus_enrichment.py
      - name: substrate-runtime producers gone
        run: |
          PYTHONPATH=services/orion-substrate-runtime:. python -m pytest -q -p no:cacheprovider \
            services/orion-substrate-runtime/tests/test_retired_pe_step5.py \
            services/orion-substrate-runtime/tests/test_prediction_error_domain_map.py \
            services/orion-substrate-runtime/tests/test_prediction_error_receipt_not_gated.py \
            services/orion-substrate-runtime/tests/test_prediction_error_node_write_not_gated.py
      - name: equilibrium body signals + quiet mood-arc trigger
        working-directory: services/orion-equilibrium-service
        run: |
          PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_retired_pe_nodes_not_body_signals.py \
            tests/test_telemetry_anomaly_trigger_quiet.py
      - name: mind digest line gone
        working-directory: services/orion-mind
        run: PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_evidence_bus_synaptic_retired.py
      - name: recall causal fragments survive fusion
        working-directory: services/orion-recall
        run: PYTHONPATH=.:${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_fusion_causal_fragment_survives.py
