# Canonical Orion field topology (biometrics + execution dynamics).
schema_version: field_lattice.v1

nodes:
  # atlas removed 2026-08-21 (decommissioned -- see
  # config/biometrics/node_catalog.yaml). Its GPUs/llm_inference role moved
  # to circe, which already has its own node:circe -> capability:llm_inference
  # edge below.
  - node_id: athena
  - node_id: circe
  - node_id: prometheus

capabilities:
  - capability_id: llm_inference
  - capability_id: transport
  - capability_id: orchestration
  - capability_id: storage
  - capability_id: vision
  - capability_id: graph
  - capability_id: memory

node_channels:
  - availability
  - staleness
  - cpu_pressure
  - memory_pressure
  - gpu_pressure
  - thermal_pressure
  - disk_pressure
  - expected_offline_suppression
  - cortex_exec_step_load
  - execution_friction
  - reasoning_load
  - failure_pressure
  - contract_pressure
  - catalog_drift_pressure
  - observer_failure_pressure
  - rpc_timeout_pressure
  - write_failure_pressure
  - conversation_load
  - repair_pressure

capability_channels:
  - pressure
  - confidence
  - available_capacity
  - execution_pressure
  - reasoning_pressure
  - reliability_pressure
  - contract_pressure

edges:
  # node:atlas -> capability:llm_inference (weight 0.85) removed 2026-08-21:
  # atlas decommissioned, node no longer exists. See node list comment above.

  # 2026-07-26: stream_backlog_pressure/delivery_confidence/stream_backlog_health
  # removed from this edge -- confirmed live degenerate (confidence/
  # available_capacity pinned at exactly 0.85 with zero variance, pressure
  # pinned at exactly 0.00082, over a 2h real window). Source: the narrow
  # 2-Redis-Stream "world_pulse" census (BUS_OBSERVER_STREAMS), already
  # documented dead in docs/superpowers/specs/2026-07-24-bus-vitality-field-
  # signal-brainstorm.md and docs/notes/2026-07-12-metrics-swamp-arsonist-
  # review.md. catalog_drift_pressure/observer_failure_pressure are a
  # separate, independently-fixed metric (PR #1373) and kept as-is.
  - source_id: node:athena
    target_id: capability:transport
    edge_type: node_capability
    weight: 0.85
    channel_map:
      catalog_drift_pressure: contract_pressure
      observer_failure_pressure: reliability_pressure

  # 2026-07-26: real mesh-wide transport signal, replacing the removed
  # world_pulse-derived pressure above. node:substrate.bus_synaptic is not a
  # physical host (unlike node:athena/circe/prometheus above -- atlas was a
  # fourth physical host here too until its 2026-08-21 decommission) -- it's
  # the Active-Inference domain node written by services/orion-substrate-
  # runtime/app/worker.py::_bus_synaptic_tick via a receipt into
  # substrate_reduction_receipts, consumed into this service's own
  # substrate_field_state through the same generic prediction_signal
  # perturbation path (app/ingest/state_deltas.py) the other 5 Active-
  # Inference domains already use -- not a shared table/row between the two
  # services (orion-substrate-runtime never touches substrate_field_state
  # directly). Confirmed live: 100% tick coverage over the same 2h window
  # used to confirm the edge above was dead. confidence/available_capacity
  # are intentionally NOT mapped here -- apply_diffusion()'s existing derived-fallback formula
  # (max(0, 1-pressure) / max(0, 1-0.5*pressure)) already produces them from
  # this real pressure value once no direct edge claims those channels, so
  # they get a genuine derivation instead of a second fabricated constant.
  - source_id: node:substrate.bus_synaptic
    target_id: capability:transport
    edge_type: node_capability
    weight: 0.85
    channel_map:
      prediction_error: pressure

  # 2026-09-25: caller-side RPC delivery. node:substrate.rpc_delivery is written
  # by orion-substrate-runtime's RPC delivery bridge (orion/substrate/
  # rpc_delivery.py) from every service's rpc-health snapshots: the worst bus
  # request channel's timeouts / max(calls, 10) over 10 minutes. Before this,
  # reliability_pressure's only source was node:athena's
  # observer_failure_pressure (the bus-observer's own failures), which has read
  # exactly 0 for weeks while LLMGatewayService RPC timeouts ran 30-150/day.
  # Diffusion takes the max of the two, so neither masks the other.
  # What it claims: "a part of Orion asked another over the bus and got no
  # answer before its own deadline" -- lost messages AND slow callees. On live
  # data nearly all nonzero readings name LLMGatewayService or
  # orion:cortex:request, so it co-moves with capability:llm_inference load
  # when inference is slow; the receipt names the hop. It is not the gateway's
  # inference_failure_pressure (an error reply counts as answered here).
  - source_id: node:substrate.rpc_delivery
    target_id: capability:transport
    edge_type: node_capability
    weight: 0.85
    channel_map:
      rpc_timeout_pressure: reliability_pressure

  # capability:vision -- the eye reporting on itself (2026-10-02).
  #
  # node:substrate.vision_organ is an off-lattice domain node (same shape as
  # node:substrate.rpc_delivery), written only by orion-substrate-runtime's
  # vision_organ reducer (orion/substrate/vision_organ_loop/) from the frame
  # router's per-window report (services/orion-vision-frame-router/app/
  # grammar_emit.py, trace prefix vision.organ:). The router is the one process
  # that sees frames arrive per stream, the tasks it sends the vision host, and
  # every reply or timeout.
  #
  #   vision_frame_staleness -> pressure: staleness of the freshest camera
  #     stream (0.0 while any camera delivers; 1.0 when none does, when a
  #     configured stream set has never delivered, or when the router stops
  #     reporting -- written on a clock by the substrate, so silence rises).
  #   vision_processing_failure_pressure -> reliability_pressure: rolling 600 s
  #     share of dispatched frames with no usable answer (timeout, invalid reply,
  #     host error), hop_pressure rule. Absent when nothing was dispatched.
  #
  # Replaces the node:substrate.vision -> capability:vision edge (prediction_
  # error: pressure) and the substrate artifact tick behind it, killed in the
  # same patch: it pooled detect artifacts from every camera, so one live
  # camera hid every dead one (0.0 on all 124,612 field ticks 2026-09-29..10-02
  # while the carbon webcam sent nothing). node:substrate.vision is pruned from
  # the field via channels.py RETIRED_PSEUDO_NODES.
  #
  # confidence/available_capacity intentionally NOT mapped: apply_diffusion()'s
  # derived-fallback formula produces them from the real pressure. Per-stream
  # status (carbon dark while cam0 runs) stays on the projection, not here: a
  # laptop webcam is off whenever the laptop is, and with no day-shape prior a
  # worst-stream reading would pin capability:vision at alarm every evening.
  - source_id: node:substrate.vision_organ
    target_id: capability:vision
    edge_type: node_capability
    weight: 0.85
    channel_map:
      vision_frame_staleness: pressure
      vision_processing_failure_pressure: reliability_pressure

  # 2026-08-19 (P2, docs/superpowers/specs/2026-08-12-perception-frontier-
  # design.md): node:substrate.perception exists as of this patch, written by
  # services/orion-substrate-runtime/app/worker.py's
  # _perception_prediction_error_tick / _handle_perception_prediction_error_
  # message, through the same generic prediction_signal perturbation path as
  # every other node:substrate.* domain node in this file. It is a SEPARATE
  # node from the retired node:substrate.vision (now node:substrate.vision_organ
  # above) -- that node's prediction_error channel was availability (arrival
  # timing); this one's prediction_error is
  # `1 - cos(frame_embedding, EWMA_embedding)`, a measure of the embedding
  # model's own content encoding, plus a distinct `embedding_staleness`
  # freshness channel. See orion/substrate/prediction_error.py's own P2
  # section for the independence check against every other perceptual signal.
  #
  # Deliberately NO edge below, and NO entry in `nodes:` above (same as
  # node:substrate.vision/bus_synaptic: neither is declared there either --
  # both are dynamically-created domain nodes, not part of the static
  # topology). This is the explicit non-goal of the patch that introduces
  # this node: "not promoting a perceptual domain into ACTIVE_INFERENCE_
  # DOMAINS [or a capability edge] in the same patch that introduces it."
  # Ships shadow-only, default-off (SUBSTRATE_PERCEPTION_PREDICTION_ERROR_
  # TICK_ENABLED=false) -- an edge here would be premature before the
  # live-data sanity check documented in perception_prediction_error()'s own
  # docstring has run against real accumulated history.

  - source_id: node:athena
    target_id: capability:orchestration
    edge_type: node_capability
    weight: 0.90
    channel_map:
      cpu_pressure: pressure
      cortex_exec_step_load: execution_pressure
      execution_friction: reliability_pressure
      failure_pressure: reliability_pressure
      # stream_backlog_pressure: pressure removed 2026-09-25
      # (chore/transport-lattice-semantics). Same dead world_pulse census
      # (BUS_OBSERVER_STREAMS) the node:athena -> capability:transport edge
      # above dropped on 2026-07-26, left behind here. Measured over the 72h
      # substrate_field_state holds (121,114 ticks): node:athena's
      # stream_backlog_pressure sat at 0.0016 (max 0.0016, 5 distinct values),
      # a contribution of 0.0014 against orchestration pressure's own minimum
      # of 0.108 -- it never won the max once, and capability_provenance never
      # named it. Removing it changes no tick.
      reasoning_load: reasoning_pressure

  - source_id: node:athena
    target_id: capability:storage
    edge_type: node_capability
    weight: 0.75
    channel_map:
      disk_pressure: pressure
      memory_pressure: pressure

  # 2026-10-02: storage write health. node:substrate.storage_write is written by
  # orion-substrate-runtime's storage_write reducer (orion/substrate/
  # storage_write_loop/) from orion-sql-writer's own per-window write outcomes:
  # the worst table family's failed / max(attempted, 10) over 10 minutes, 0 until
  # 2 failures. Before this, capability:storage had only athena's disk/memory
  # biometrics, which read calm while 863 home-cooling rows in a row failed to
  # serialize (2026-09-26) or Postgres refused connections (2026-09-21).
  # What it claims: "rows Orion produced did not reach their table" -- schema
  # rejects, constraint and serialization errors, DB unavailable/timeouts, and
  # grammar-queue shedding. Not routing gaps (unrouted kinds; fallback_watch owns
  # those). The receipt names the family. Expires (unmeasured) 180 s after the
  # writer stops reporting.
  - source_id: node:substrate.storage_write
    target_id: capability:storage
    edge_type: node_capability
    weight: 0.85
    channel_map:
      write_failure_pressure: reliability_pressure

  - source_id: node:athena
    target_id: capability:graph
    edge_type: node_capability
    weight: 0.70
    channel_map:
      cpu_pressure: pressure

  - source_id: node:prometheus
    target_id: capability:memory
    edge_type: node_capability
    weight: 0.60
    channel_map:
      cpu_pressure: pressure

  - source_id: node:circe
    target_id: capability:llm_inference
    edge_type: node_capability
    # weight bumped 0.50 -> 0.85 and channel_map extended 2026-08-21: this
    # was circe's own pre-existing burst-capacity edge; it now also carries
    # the full weight/channel_map atlas's now-deleted edge had (memory_pressure,
    # reasoning_load), since circe absorbed atlas's full llm_inference role,
    # not just a supplementary one. Without this, capability:llm_inference's
    # reasoning_pressure channel would have no diffusion target at all and
    # freeze at its reconcile-seeded 0.0 forever (see
    # services/orion-field-digester/app/digestion/decay.py's comment on
    # CAPABILITY_DECAY_CHANNELS not being a diffusion target) -- caught by
    # code review, not by a gate.
    weight: 0.85
    channel_map:
      gpu_pressure: pressure
      memory_pressure: pressure
      reasoning_load: reasoning_pressure
      # added 2026-09-25: the gateway's own count of calls to this node that
      # came back without an answer (orion/substrate/llm_inference_loop/).
      # gpu/memory pressure read an idle, broken backend as calm; this is the
      # only input here that can say "inference is failing", not just "busy".
      inference_failure_pressure: reliability_pressure

  # capability:transport -> capability:orchestration (weight 0.70,
  # stream_backlog_pressure -> stream_backlog_pressure) DELETED 2026-09-25
  # (chore/transport-lattice-semantics; docs/superpowers/specs/
  # 2026-09-22-substrate-lattice-audit.md "Dead topology edge").
  #
  # It carried nothing: no edge writes stream_backlog_pressure onto
  # capability:transport, so the source read 0.0 on 121,114 of 121,114 ticks
  # (72h). Rewiring it to `pressure -> pressure` was measured and rejected:
  #   - effect: transport would win orchestration pressure on 0.63% of ticks,
  #     mean lift +0.025 when it wins, overall mean 0.2088 -> 0.2089;
  #   - no downstream reach: transport `pressure` already feeds the proposal
  #     arena's resource_pressure directly (orion/field/pressure.py, max over
  #     every capability's pressure), and 0.7x of it can never beat itself;
  #   - no theory anchor: capability:transport.pressure is the FRACTION of
  #     bus edges with anomalous timing (|z| >= 3, bus_synaptic_prediction_
  #     error). Bursts count the same as stalls, and orchestration's own RPC
  #     traffic is one of the things that makes bus timing anomalous, so the
  #     arrow could as easily point the other way (corr with orchestration
  #     pressure 0.027, execution_pressure -0.003 -- independent, but not
  #     evidence of "transport degradation bleeds into orchestration").
  # The real "the bus is failing orchestration" signal is RPC timeouts,
  # which feat/rpc-health-field-bridge is bringing onto capability:transport's
  # reliability_pressure. If that lands and passes the metric gate, a
  # reliability_pressure -> reliability_pressure edge is the honest successor.
  # tests/test_field_topology_edges.py refuses any cap->cap edge whose source
  # channel nothing writes. stream_backlog_pressure itself is retired end to
  # end as of fix/bus-observer-scope (2026-09-25).

  # capability→capability: inference unavailability raises orchestration pressure
  - source_id: capability:llm_inference
    target_id: capability:orchestration
    edge_type: capability_capability
    weight: 0.60
    channel_map:
      pressure: pressure
