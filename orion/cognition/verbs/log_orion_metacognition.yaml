# orion/cognition/verbs/log_orion_metacognition.yaml
# Lane A — collapse mirror publish (SQL via MetacogPublishService).
# Single-pass Draft (LLM) -> Publish (real ctx artifacts). Enrich step removed
# 2026-07-28: zero of its 7 output fields ever survived into the published
# MetacogEntryV1 -- see docs/superpowers/design/2026-07-18-collapse-mirror-metacog-redesign.md
# "Orphans, dead reads, and a full Draft/Enrich survival audit (2026-07-28)".
# Draft template does not use memory_digest; optional plan-level pre-recall is telemetry-only.
name: log_orion_metacognition
kind: task
timeout_ms: 1280000
# Disable plan-level pre-recall unless equilibrium/trigger explicitly sets recall.enabled=true.
recall_enabled: false
steps:
  - name: collect_metacog_context
    services:
      - MetacogContextService
    timeout_ms: 60000

  - name: draft_entry
    # CHANGED: Point directly to the file so Orchestrator loads it
    prompt_template: log_orion_metacognition_draft.j2
    services:
      - MetacogDraftService
    timeout_ms: 600000

  - name: publish_to_sql_writer
    services:
      - MetacogPublishService
    timeout_ms: 10000
