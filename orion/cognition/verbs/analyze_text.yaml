name: analyze_text
label: Analyze Text
description: Analyzes raw text to extract structure, sentiment, and intent.
category: cognition
version: "1.0"

# Timeout: 60s
timeout_ms: 60000

services:
  - LLMGatewayService

steps:
  - name: analyze
    order: 0
    services: [LLMGatewayService]
    prompt_template: analyze_text_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
