services:
  orion-energy:
    container_name: ${PROJECT}-orion-energy
    build:
      context: ../..
      dockerfile: services/orion-energy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${ENERGY_HOST_DATA_DIR:-/mnt/storage-warm/orion-energy}:/data/energy
    networks:
      - app-net

  orion-energy-portal:
    container_name: ${PROJECT}-orion-energy-portal
    # Not started by a plain `up`: needs the chmod-600 credentials file first (README "Portal").
    profiles: ["portal"]
    build:
      context: ../..
      dockerfile: services/orion-energy/Dockerfile.portal
    restart: unless-stopped
    env_file:
      - .env
    shm_size: "1gb"
    volumes:
      - ${ENERGY_HOST_DATA_DIR:-/mnt/storage-warm/orion-energy}:/data/energy
    networks:
      - app-net

networks:
  app-net:
    external: true
