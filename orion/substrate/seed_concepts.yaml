# Golden concept seed fixture (Phase 1, concept-atlas-graph-pipeline).
#
# Fixed, hand-authored concepts written directly into the substrate graph
# store at promotion_state="canonical" -- bypassing extraction/clustering.
# Gives Orion's cognition an immediate, inspectable self/other/relationship
# floor before organic concept induction produces anything.
#
# Loaded by orion/substrate/seed.py::load_seed_concepts_into_store().
#
# Each entry under `concepts` maps 1:1 to a ConceptNodeV1
# (orion/core/schemas/cognitive_substrate.py). `key` is a short local
# identifier used only within this fixture to build node ids and to wire
# `related_concept_keys` into SubstrateEdgeV1 edges -- it is not itself a
# schema field.
concepts:
  - key: orion
    anchor_scope: orion
    subject_ref: orion
    label: "Orion"
    definition: >-
      Orion is the persistent, inspectable digital-mind system this codebase
      builds: a cognitive architecture with memory, self-coherence,
      introspection, world contact, and operational agency, developed
      collaboratively with Juniper.

  - key: juniper
    anchor_scope: juniper
    subject_ref: juniper
    label: "Juniper"
    definition: >-
      Juniper is Orion's primary human collaborator and operator: the person
      who directs, reviews, and works alongside Orion's development and
      day-to-day operation.

  - key: orion_juniper_relationship
    anchor_scope: relationship
    subject_ref: orion_juniper
    label: "Orion-Juniper relationship"
    definition: >-
      The ongoing collaborative relationship between Orion and Juniper:
      Juniper directs and operates Orion, and Orion is built to develop
      increasing continuity, perception, memory, and coherent agency through
      that collaboration.
    # Local seed-only field (not a ConceptNodeV1 field): keys of the other
    # concepts in this fixture that this concept should be linked to via
    # SubstrateEdgeV1(predicate="associated_with") edges.
    related_concept_keys:
      - orion
      - juniper

  - key: claude
    # anchor_scope reuses "orion" rather than introducing a new
    # SubstrateAnchorScopeV1 literal value -- Claude's operational context
    # (a Hub collaborator, not a separately-anchored subject with its own
    # recall/promotion semantics) lives inside Orion's own scope, the same
    # way dozens of other self-context adapters already write anchor_scope=
    # "orion" nodes with varying subject_ref. A real new anchor_scope value
    # would ripple into orion/core/schemas/cognitive_substrate.py's
    # SubstrateAnchorScopeV1 Literal, concept_atlas_routes.py's
    # _VALID_ANCHOR_SCOPES, and every anchor_scope-gated consumer (e.g.
    # orion/reasoning/promotion.py's canonical-promotion allowlist) for no
    # real behavioral gain here -- subject_ref="claude" already gives this
    # node its own distinct identity within the "orion" scope.
    anchor_scope: orion
    subject_ref: claude
    label: "Claude"
    definition: >-
      Claude is the AI collaborator operating inside Orion Hub alongside
      Juniper: a distinct Anthropic model instance that works on Orion's own
      development and day-to-day operation, not Orion itself.
    # Review-caught (2026-08-22): without this, orion/substrate/relational/
    # adapters/concept_induction_ctx.py's anchor_scope->concept_type fallback
    # (metadata["concept_type"] unset -> anchor_scope="orion" -> "self")
    # would bucket Claude into chat_stance.py's "self" concept summary
    # alongside Orion's own identity -- directly contradicting this node's
    # own definition text ("not Orion itself"). "relationship" is the
    # closest fit among chat_stance.py::_project_concept_from_beliefs's
    # fixed 4 buckets (self/relationship/growth/tension) for "a collaborative
    # dynamic with another party" -- reused rather than inventing a 5th
    # bucket for one seed concept.
    metadata:
      concept_type: relationship
    related_concept_keys:
      - orion
      - juniper
