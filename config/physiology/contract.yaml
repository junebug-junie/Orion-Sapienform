# Body-economy contract (Phase 2 "hard gates", early slice landed in Patch A1).
#
# Design: docs/superpowers/specs/2026-10-23-organism-body-economy-design.md ("Phase 2").
# Checked by scripts/check_body_economy_contract.py (CI: orion-static-gates.yml;
# local: `make check-body-economy-contract`).
#
# What the gate enforces today ("No unregistered veto"): every module that reads Orion's
# regulation / arousal / thermal / price state must be listed below, either in `readers`
# (with a role) or in `sources`. Detection is structural (AST): imports from the arousal,
# regulation-schema, thermal_gate, cabinet_heat or physiology modules; references to their
# state symbols; the literals "orion:regulation:latest", "arousal_level",
# "arousal_strained"/"arousal_engaged"/"arousal_engaged_cooldown", "cabinet_hot"; and any
# comparison against the arousal level "strained". Tests and evals are not scanned.
#
# Roles (readers):
#   spinal  -- may veto. A fact about hardware safety or consent. Adding one needs Juniper's
#              sign-off (Phase 2: "Body-Economy-Spinal: approved <date>" in the PR report).
#   bidder  -- gates optional work on the state today. Phase 1 Patch D moves each of these to
#              bid() against posted prices, one reader per PR; until then they are listed so
#              the pile cannot grow while it is being retired.
#   display -- reads the state but gates nothing: status pages, logs, self-narrative,
#              grading, offline replay, data loaders.
#
# `sources` are not readers: they define, produce or fetch the state for others and gate
# nothing themselves (schemas, the reducer, the producer, shared fetch helpers).
#
# Adding a new reader: prefer not to. A new `if arousal == "strained": return` is exactly what
# this file exists to stop. If you must, add a row with role + one-line reason, and expect
# review to ask why it is not a bid.

version: 1

protected_paths:
  - {glob: "orion/physiology/**", organ: "all (body, budget, appetite, choice, felt state, learning)"}
  - {glob: "orion/regulation/arousal.py", organ: body}
  - {glob: "orion/autonomy/thermal_gate.py", organ: "body / spinal (heat reflex thresholds)"}
  - {glob: "orion/gpu_pool/shed.py", organ: "budget / spinal (shed reasons)"}
  - {glob: "orion/gpu_pool/scheduler.py", organ: budget}
  - {glob: "orion/gpu_pool/shed_backoff.py", organ: budget}
  - {glob: "orion/autonomy/allocator.py", organ: choice}
  - {glob: "orion/grammar/act_ledger.py", organ: learning}
  - {glob: "config/physiology/**", organ: "contract"}
  # "the bid sites in each producer" (design doc) are added here as Patch D lands each bid().
  # Patch D 2026-10-30: curiosity investigate's bid binds here (bind_verdict). Not a `readers` row: it
  # reads no regulation/price state itself, it obeys the market's decision (the checker sees no read).
  - {glob: "services/orion-durable-runs/app/run_bids.py", organ: "choice (Patch D bid site: curiosity investigate binds)"}

readers:
