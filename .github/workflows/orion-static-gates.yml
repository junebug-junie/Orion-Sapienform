# Workflow: repo-wide static gates.
#
# Why this exists: this repo has a dozen `make check-*` gates and, until now,
# NO workflow ran any of them. They were local targets that an agent or human
# had to remember to invoke -- which is the same "nudge you can skip" failure
# the gates themselves were written to replace.
#
# That is not hypothetical. `scripts/check_inner_state_registry.py` was found
# RED on main on 2026-08-13 (two schemas matching its keyword heuristic with no
# registry entry). It had rotted precisely because nothing ran it. See the
# exclusion note below.
#
# Scope: only gates that are BOTH static (no Postgres, Redis, or live bus) and
# currently green on main. Verified 2026-08-13 in a clean venv containing only
# the three deps installed below -- deliberately not the repo's full
# requirements, which pull heavy service dependencies these checks never touch.
#
# check_inner_state_registry.py was excluded when this workflow first shipped
# because it was RED on main -- wiring an already-failing gate would have
# blocked every PR. PR #1613 registered the two missing attention schemas and
# turned it green, so it is now included below. That sequencing was the point:
# a gate joins CI only once it passes on main.
#
# Deliberately EXCLUDED, with reasons:
#   - check_single_consumer_channels.py, check_activation_saturation.py,
#     check_substrate_projection_schema_drift.py,
#     check_concept_relation_digest_liveness.py -- all need live infra
#     (ORION_BUS_URL / POSTGRES_URI). Not CI-runnable without standing up real
#     services; out of scope here.
#   - check_service_env_compose_parity.py -- requires a SERVICE argument, not
#     standalone-runnable across the repo.
#
# No path filters: these gates check repo-wide invariants (bus channel
# consumers, metric lineage, hostname references, stdlib shadowing), so
# scoping them to specific paths would let the exact cross-cutting edits they
# exist to catch slip through. Total runtime is well under a minute.

name: orion-static-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-gates:
    name: Static repo gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `git merge-base HEAD origin/main` resolves. The
      # definition-drift gate verifies the committed _last_change block against
      # the merge base; with the default depth-1 checkout there is no merge
      # base, and that check degrades to a printed skip. The drift check itself
      # still runs either way -- this is what keeps the integrity half honest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Minimal, verified dep set -- every gate below was confirmed to pass in
      # a fresh venv containing exactly these three packages.
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pydantic-settings PyYAML

      # Each gate is its own step so a failure names itself in the UI rather
      # than surfacing as one opaque red block.
      - name: Metric lineage gate (consumer existence, orphan ratchet)
        run: python scripts/check_metric_lineage.py --gate

      # R4 definition-change alert. Red means a metric's meaning, schema,
      # producers or consumers changed without config/metrics/
      # metric_definitions.lock.json being regenerated -- the fix is to run
      # `--update` and commit, which writes the change into the lock in plain
      # English so it lands in the PR diff Juniper reads.
      - name: Metric definition drift (re-lock required on any def change)
        run: python scripts/check_definition_drift.py --gate

      - name: Inner-state registry completeness
        run: python scripts/check_inner_state_registry.py

      - name: scripts/ must not shadow a stdlib module
        run: python scripts/check_scripts_dir_no_stdlib_shadow.py

      - name: Service hostname references
        run: python scripts/check_service_hostname_refs.py

      # A relative bind mount resolves against the compose file's own directory
      # at `up` time, so deploying from a worktree -- which safe_docker_build.sh
      # REQUIRES -- pins that disposable tree as production infrastructure.
      # Caught live 2026-08-29 on orion-circe-biometrics.
      - name: Compose host mounts must not be relative
        run: python scripts/check_compose_no_relative_mounts.py

      - name: Journal dispatch registry completeness
        run: python scripts/check_journal_dispatch_registry.py

      - name: Daily schedule collisions (report-only)
        run: python scripts/check_daily_schedule_collisions.py

      # Sentience Striving Program instrument manifest. --static-only because
      # this workflow admits DB-free gates only; the SQL-backed claims report
      # SKIPPED here (a third state, deliberately not HOLDS) and are covered by
      # the full `make check-sentience-instruments` against live Postgres.
      # What the static lane still catches, and what it exists for: a manifest
      # naming a module or entrypoint that no longer exists, and an unlock
      # narrative that has gone unreviewed past its window. Green on this branch.
      - name: Sentience program instrument manifest (static lane)
        run: python scripts/check_sentience_instruments.py --static-only

      # Stdlib-only, no live infra, green on main. Every SystemHealthV1(...) call
      # site must pass the fields the model requires plus heartbeat_interval_sec.
      # Producers build the payload inside a heartbeat loop's try/except, so a
      # missing field logs a warning per tick and publishes nothing while the
      # container stays Up and /health stays 200 -- found live in three services at
      # once on 2026-08-29, one of which had never published a heartbeat.
      - name: SystemHealthV1 producers pass required fields
        run: python scripts/check_system_health_producers.py

      # Stdlib-only, no live infra. The substrate control surface fails OPEN: with
      # no database configured it silently serves a per-process in-memory default
      # instead of the value another service wrote. Found live 2026-08-30 with
      # orion-hub on postgres (0.5) and orion-cortex-orch -- which reads the value
      # on every routing decision -- on memory (0.75). Same code, same key, two
      # stores, no symptom. Checks the declared dependency too: cortex-orch was
      # correctly configured and STILL fell back, on a missing SQLAlchemy that the
      # Postgres path swallows as ImportError.
      - name: Substrate control surface consumers are configured
        run: python scripts/check_control_surface_store_parity.py

      # A synchronous DB call inside an `async def` route holds the WHOLE event
      # loop, so every other request stalls behind it -- including static
      # assets, which is what makes it so hard to spot: the endpoint doing the
      # blocking is fast, and the unrelated file five requests later takes 30
      # seconds. Per-endpoint latency checks cannot see it.
      #
      # Found live twice on 2026-09-03, hours apart, in code written months
      # apart: /api/biometrics/preview/induction and /api/self-brain/frames/tail
      # (the hub's most-polled endpoint). A third sweep with the checker
      # following helper calls turned up 21 more across the substrate_* routes.
      # Nothing in tests or CI could see any of it. Hence a gate.
      - name: No blocking DB calls inside async routes
        run: python scripts/check_async_routes_not_blocking.py

      # Hub frontend unit tests. These are plain `node:test` files with no DOM,
      # no network and no service dependencies -- as static as anything else in
      # this workflow. There are 13 of them and, until now, NOTHING ran any of
      # them: they were hand-run only, which is exactly the "nudge you can skip"
      # failure this whole workflow exists to replace. Found while adding
      # biometrics-view.test.js in the Hub biometrics-poll fix (2026-09-03).
      #
      # Files are enumerated explicitly rather than passing a directory or a
      # glob, because neither is portable across Node majors: `node --test
      # <dir>` does directory discovery on Node 20 but is treated as a module
      # path on Node 22 (`Cannot find module .../static/js`), and quoted glob
      # patterns are the reverse -- Node 22 expands them, Node 20 does not.
      # Caught by this very workflow on its first run: green locally on Node
      # 20.20.2, red on the runner's 22.23.2. `find` also picks up any future
      # test file in a subdirectory, which a single-level glob would silently
      # skip. Node is preinstalled on ubuntu-latest, so no setup step needed.
      - name: Hub frontend unit tests (node:test)
        run: |
          files=$(find services/orion-hub/static/js -name '*.test.js' | sort)
          if [ -z "$files" ]; then
            echo "no hub JS test files found -- discovery is broken, not the suite empty"
            exit 1
          fi
          echo "$files" | sed 's/^/  /'
          node --test $files
