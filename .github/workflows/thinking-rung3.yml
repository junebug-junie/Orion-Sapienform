name: Thinking rung 3 (bind the winner, compete across doers)
on:
  pull_request:
    paths:
      - 'orion/autonomy/act_candidates.py'
      - 'orion/autonomy/allocator.py'
      - 'orion/autonomy/self_shed.py'
      - 'orion/autonomy/prediction.py'
      - 'orion/autonomy/evals/run_rung3_replay_eval.py'
      - 'orion/substrate/attention_broadcast.py'
      - 'orion/substrate/attention/policy.py'
      - 'orion/execution_dispatch/**'
      - 'config/execution_dispatch/**'
      - 'services/orion-execution-dispatch-runtime/**'
      - 'tests/test_rung3_*.py'
      - 'orion/autonomy/act_episodes.py'
      - 'orion/autonomy/evals/run_rung3_reading_replay_eval.py'
      - 'orion/world_pulse_read/pull.py'
      - 'orion/schemas/world_pulse_read_pull.py'
      - 'services/orion-hub/scripts/world_pulse_read_pipeline.py'
      - 'services/orion-hub/scripts/world_pulse_read_pull_listener.py'
      - 'services/orion-sql-db/manual_migration_reading_pull_v1.sql'
      - 'config/proposals/proposal_policy.v1.yaml'
      - '.github/workflows/thinking-rung3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rung3:
    runs-on: ubuntu-latest
    # packages: read lets GITHUB_TOKEN pull the private GHCR postgres copy (same as sql-writer CI).
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/junebug-junie/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio psycopg2-binary asyncpg sqlalchemy
      - name: Binding fix + act-backed allocator candidates + holdback draw
        run: python -m pytest -q tests/test_rung3_world_first_action_floor.py tests/test_rung3_act_candidates.py tests/test_motor_allocator.py
      - name: Reading pull + holdback rule
        run: python -m pytest -q tests/test_rung3_reading_pull.py
      - name: Reading pull against Postgres (must not skip)
        env:
          ORION_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/scratch
          ORION_TEST_PG_MUST_RUN: "1"
        run: python -m pytest -q tests/test_rung3_reading_pull_pg.py
      - name: Rung 3 replay eval (fixture mode)
        run: python orion/autonomy/evals/run_rung3_replay_eval.py
      - name: Rung 3 reading replay eval (fixture mode)
        run: python orion/autonomy/evals/run_rung3_reading_replay_eval.py
