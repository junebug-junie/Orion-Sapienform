services:
  sql-writer:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-sql-writer/Dockerfile
    container_name: ${PROJECT}-sql-writer
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-net
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ${ORION_DATA_ROOT:-/mnt/graphdb}/sql_logs:/app/logs
      # Walkway story pictures (app/vision_story_strip.py): frames read-only,
      # strips written here and served read-only by orion-hub.
      - ${VISION_STORY_FRAMES_DIR:-/mnt/telemetry/vision/frames}:${VISION_STORY_FRAMES_DIR:-/mnt/telemetry/vision/frames}:ro
      - ${VISION_STORY_STRIP_DIR:-/mnt/telemetry/vision/story_strips}:${VISION_STORY_STRIP_DIR:-/mnt/telemetry/vision/story_strips}
      # Postgres is external; removing SQLite volume mapping to avoid confusion
    environment:
      - GPU_POOL_STATE_HISTORY_RETENTION_DAYS=${GPU_POOL_STATE_HISTORY_RETENTION_DAYS:-30}
      - SELF_SIGNAL_OUTCOME_ASSOCIATION_RETENTION_DAYS=${SELF_SIGNAL_OUTCOME_ASSOCIATION_RETENTION_DAYS:-30}
      - GRAMMAR_RETENTION_PERIODIC_MAX_CYCLE_SEC=${GRAMMAR_RETENTION_PERIODIC_MAX_CYCLE_SEC:-75}
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NODE_NAME=${NODE_NAME}
      - PORT=${PORT}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_URL=${ORION_BUS_URL}

      # Channel list lives in env_file (.env) — compose ${} substitution strips JSON quotes.
      - SQL_WRITER_ENABLE_SPARK_SNAPSHOT_CHANNEL=${SQL_WRITER_ENABLE_SPARK_SNAPSHOT_CHANNEL}
      - SQL_WRITER_ENABLE_GRAMMAR_CHANNEL=${SQL_WRITER_ENABLE_GRAMMAR_CHANNEL:-true}
      - SQL_WRITER_ACT_LEDGER_ENABLED=${SQL_WRITER_ACT_LEDGER_ENABLED:-true}
      - SQL_WRITER_ACT_RESOLVER_INTERVAL_SEC=${SQL_WRITER_ACT_RESOLVER_INTERVAL_SEC:-60}
      - SQL_WRITER_ACT_WORKSPACE_BINDING_ENABLED=${SQL_WRITER_ACT_WORKSPACE_BINDING_ENABLED:-true}
      - SQL_WRITER_CONCURRENT_HANDLERS=${SQL_WRITER_CONCURRENT_HANDLERS:-true}
      - SQL_WRITER_MAX_INFLIGHT=${SQL_WRITER_MAX_INFLIGHT:-12}
      - SQL_WRITER_DB_POOL_SIZE=${SQL_WRITER_DB_POOL_SIZE:-10}
      - SQL_WRITER_DB_MAX_OVERFLOW=${SQL_WRITER_DB_MAX_OVERFLOW:-20}
      - SQL_WRITER_ROUTE_MAP_JSON=${SQL_WRITER_ROUTE_MAP_JSON}
      - SQL_WRITER_EMIT_JOURNAL_CREATED=${SQL_WRITER_EMIT_JOURNAL_CREATED}
      - SQL_WRITER_JOURNAL_CREATED_CHANNEL=${SQL_WRITER_JOURNAL_CREATED_CHANNEL}
      - SQL_WRITER_EMIT_SOCIAL_TURN_STORED=${SQL_WRITER_EMIT_SOCIAL_TURN_STORED}
      - SQL_WRITER_SOCIAL_TURN_STORED_CHANNEL=${SQL_WRITER_SOCIAL_TURN_STORED_CHANNEL}
      - SPARK_LEGACY_MODE=${SPARK_LEGACY_MODE}
      - VISION_SPLIT_ON_VERDICT_ENABLED=${VISION_SPLIT_ON_VERDICT_ENABLED:-true}
      - VISION_MOTION_STORIES_ENABLED=${VISION_MOTION_STORIES_ENABLED:-true}
      - VISION_MOTION_FRAME_SIZE_BY_STREAM=${VISION_MOTION_FRAME_SIZE_BY_STREAM:-}
      - VISION_MOTION_EDGE_ZONE_FRAC=${VISION_MOTION_EDGE_ZONE_FRAC:-0.05}
      - VISION_STORY_STRIPS_ENABLED=${VISION_STORY_STRIPS_ENABLED:-true}
      - VISION_ROLLUP_ENABLED=${VISION_ROLLUP_ENABLED:-true}
      - VISION_HANDOFF_ENABLED=${VISION_HANDOFF_ENABLED:-true}
      - VISION_HANDOFF_STREET_EVENTS_ENABLED=${VISION_HANDOFF_STREET_EVENTS_ENABLED:-true}
      - VISION_HANDOFF_SELF_LOOK_ENABLED=${VISION_HANDOFF_SELF_LOOK_ENABLED:-true}
      - VISION_INDIVIDUALS_MATCH_THRESHOLD=${VISION_INDIVIDUALS_MATCH_THRESHOLD:-0.90}
      - VISION_INDIVIDUALS_CONTINUATION_ENABLED=${VISION_INDIVIDUALS_CONTINUATION_ENABLED:-true}
      - VISION_INDIVIDUALS_CONTINUATION_THRESHOLD=${VISION_INDIVIDUALS_CONTINUATION_THRESHOLD:-0.88}
      - VISION_INDIVIDUALS_CONTINUATION_GAP_SEC=${VISION_INDIVIDUALS_CONTINUATION_GAP_SEC:-10}
      - VISION_INDIVIDUALS_CONTINUATION_MAX_DISP=${VISION_INDIVIDUALS_CONTINUATION_MAX_DISP:-1.5}
      - METACOG_TRACE_RETENTION_DAYS=${METACOG_TRACE_RETENTION_DAYS:-14}
      - SQL_WRITER_DB_STATEMENT_TIMEOUT_MS=${SQL_WRITER_DB_STATEMENT_TIMEOUT_MS:-30000}
      - SQL_WRITER_DB_LOCK_TIMEOUT_MS=${SQL_WRITER_DB_LOCK_TIMEOUT_MS:-10000}
      - SQL_WRITER_GRAMMAR_PERSIST_TIMEOUT_SEC=${SQL_WRITER_GRAMMAR_PERSIST_TIMEOUT_SEC:-15}
      - SQL_WRITER_GRAMMAR_WORKERS=${SQL_WRITER_GRAMMAR_WORKERS:-4}
      - SQL_WRITER_GRAMMAR_POOL_SIZE=${SQL_WRITER_GRAMMAR_POOL_SIZE:-4}
      - SQL_WRITER_GRAMMAR_POOL_MAX_OVERFLOW=${SQL_WRITER_GRAMMAR_POOL_MAX_OVERFLOW:-4}
      - SQL_WRITER_GRAMMAR_STATEMENT_TIMEOUT_MS=${SQL_WRITER_GRAMMAR_STATEMENT_TIMEOUT_MS:-10000}
      - SQL_WRITER_GRAMMAR_LOCK_TIMEOUT_MS=${SQL_WRITER_GRAMMAR_LOCK_TIMEOUT_MS:-3000}
      - GRAMMAR_EVENTS_RETENTION_DAYS=${GRAMMAR_EVENTS_RETENTION_DAYS:-15}
      - GRAMMAR_EVENTS_RETENTION_BATCH_SIZE=${GRAMMAR_EVENTS_RETENTION_BATCH_SIZE:-1000}
      - GRAMMAR_EVENTS_RETENTION_MAX_BATCHES_PER_STARTUP=${GRAMMAR_EVENTS_RETENTION_MAX_BATCHES_PER_STARTUP:-100}
      - GRAMMAR_EVENTS_RETENTION_MAX_ELAPSED_SEC=${GRAMMAR_EVENTS_RETENTION_MAX_ELAPSED_SEC:-120}
      - GRAMMAR_EDGES_RETENTION_DAYS=${GRAMMAR_EDGES_RETENTION_DAYS:-15}
      - GRAMMAR_ATOMS_RETENTION_DAYS=${GRAMMAR_ATOMS_RETENTION_DAYS:-15}
      - SUBSTRATE_ORGAN_EMISSIONS_RETENTION_DAYS=${SUBSTRATE_ORGAN_EMISSIONS_RETENTION_DAYS:-15}
      - SQL_WRITER_ALLOW_ACCEPTED_PRESSURE_INGEST=${SQL_WRITER_ALLOW_ACCEPTED_PRESSURE_INGEST:-false}
      - SQL_WRITER_GRAMMAR_TRACE_BATCH_MAX=${SQL_WRITER_GRAMMAR_TRACE_BATCH_MAX:-64}
      - SQL_WRITER_GRAMMAR_QUEUE_MAXSIZE=${SQL_WRITER_GRAMMAR_QUEUE_MAXSIZE:-512}
      - SQL_WRITER_GRAMMAR_DRAIN_INTERVAL_SEC=${SQL_WRITER_GRAMMAR_DRAIN_INTERVAL_SEC:-30}
      - SQL_WRITER_GRAMMAR_DRAIN_BATCH=${SQL_WRITER_GRAMMAR_DRAIN_BATCH:-200}

      # bus_fallback_log backlog watcher -> Hub in_app + email via orion-notify.
      - SQL_WRITER_FALLBACK_WATCH_ENABLED=${SQL_WRITER_FALLBACK_WATCH_ENABLED:-true}
      - SQL_WRITER_FALLBACK_WATCH_INTERVAL_SEC=${SQL_WRITER_FALLBACK_WATCH_INTERVAL_SEC:-300}
      - SQL_WRITER_FALLBACK_WATCH_WINDOW_SEC=${SQL_WRITER_FALLBACK_WATCH_WINDOW_SEC:-86400}
      - SQL_WRITER_FALLBACK_WATCH_THRESHOLD_STEP=${SQL_WRITER_FALLBACK_WATCH_THRESHOLD_STEP:-5}
      # storage-write organ (app/write_health.py) -> orion:grammar:event
      - SQL_WRITER_WRITE_HEALTH_ENABLED=${SQL_WRITER_WRITE_HEALTH_ENABLED:-false}
      - SQL_WRITER_WRITE_HEALTH_WINDOW_SEC=${SQL_WRITER_WRITE_HEALTH_WINDOW_SEC:-60}
      # "notify" is the compose SERVICE name; "orion-notify" (directory) and
      # "orion-athena-notify" (container_name) have both already broken this
      # exact URL elsewhere. See services/orion-notify-digest/.env_example.
      - NOTIFY_SERVICE_URL=${NOTIFY_SERVICE_URL:-http://notify:7140}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:-}

      - DATABASE_URL=${DATABASE_URL}
      # POSTGRES_URI removed as redundant/conflict

networks:
  app-net:
    name: ${NET}
    external: true
