name: write_recommendation
label: Write Recommendation
description: >
  Produce a decision recommendation with clear options, tradeoffs, and a
  suggested path. Support the user in making a choice with concrete reasoning.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 90000

services:
  - LLMGatewayService

prompt_template: write_recommendation_prompt.j2

steps:
  - name: write_recommendation
    order: 0
    services: [LLMGatewayService]
    prompt_template: write_recommendation_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
