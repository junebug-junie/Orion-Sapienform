# Per-camera zones, in normalized image coordinates (0..1, origin top-left).
# docs/superpowers/specs/2026-09-22-walkway-camera-busy-world-design.md ideas 6, 9.
#
# A box belongs to the first zone that contains its bottom-center point (where
# a person or dog stands), else to no zone.
#
# embed: false means boxes in this zone are NEVER crop-embedded and never
# become individuals. The patio is the family's space: Orion may know people
# are there (count + presence), but keeps no pictures and no vectors of them.
# The same rule is enforced by a CHECK constraint on vision_crop_observation.
#
# dwell_rare_sec: dwell longer than this is unusual here (attention score input).
#
# Traced 2026-10-15 from a 2560x1920 frame of the mounted walkway camera
# (Reolink, 192.168.1.87). The walkway retina instance reads this same
# 2560x1920 main stream; coordinates are normalized, so any 4:3 size works. Camera looks out from under the
# porch roof: porch slab + furniture lower right, community mailboxes
# left-middle, lawn/sidewalk/street everywhere else below the sky.
version: 1
streams:
  walkway:
    zones:
      # Porch slab, its plant bed and furniture. Family space.
      - name: patio
        embed: false
        polygon: [[0.58, 0.53], [1.0, 0.47], [1.0, 1.0], [0.56, 1.0]]
      # The community mailbox cluster and the ground in front of it.
      - name: mailbox
        embed: true
        dwell_rare_sec: 180
        polygon: [[0.15, 0.39], [0.38, 0.39], [0.38, 0.66], [0.15, 0.66]]
      # Everything public below the sky line (lawn, sidewalk, street, far houses).
      - name: walkway
        embed: true
        dwell_rare_sec: 120
        polygon: [[0.0, 0.14], [1.0, 0.14], [1.0, 1.0], [0.0, 1.0]]
