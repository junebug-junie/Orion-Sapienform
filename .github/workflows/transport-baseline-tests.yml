name: transport-baseline-tests

# Deterministic gate for the per-hop transport EWMA gate (spec 2026-09-24,
# section A): the pure reducer, its silence-pause mutation eval, the
# equilibrium wiring + hourly readings, the mesh and real-hop replay evals,
# the grader, and the sql-writer row shape. No DB, bus or LLM.
#
# Added 2026-10-13: until then no workflow ran any of these, so the reducer's
# own tests were never a CI gate -- the silence bug (sparse hops aging latency
# episodes out, drift absorbed instead of stated) shipped and ran live for days.

on:
  pull_request:
    paths:
      - "orion/metacog/transport_baseline.py"
      - "orion/metacog/evidence_map.py"
      - "orion/metacog/tests/test_transport_baseline.py"
      - "orion/metacog/evals/run_transport_baseline_pause_mutations.py"
      - "orion/schemas/telemetry/transport_baseline_hourly.py"
      - "services/orion-equilibrium-service/app/transport_*.py"
      - "services/orion-equilibrium-service/tests/test_transport_*.py"
      - "services/orion-equilibrium-service/evals/**"
      - "services/orion-sql-writer/app/models/transport_baseline_hourly.py"
      - "services/orion-sql-writer/app/main.py"
      - "services/orion-sql-writer/tests/test_transport_baseline_hourly_sql_shape.py"
      - "scripts/analysis/grade_transport_baseline.py"
      - "scripts/analysis/tests/test_grade_transport_baseline.py"
      - ".github/workflows/transport-baseline-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/metacog/transport_baseline.py"
      - "orion/metacog/evidence_map.py"
      - "orion/schemas/telemetry/transport_baseline_hourly.py"
      - "services/orion-equilibrium-service/app/transport_*.py"
      - "services/orion-equilibrium-service/evals/**"
      - "scripts/analysis/grade_transport_baseline.py"
      - ".github/workflows/transport-baseline-tests.yml"

jobs:
  unit:
    name: Transport baseline — reducer, mutations, equilibrium wiring, evals, grader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-equilibrium-service/requirements.txt
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Reducer + grader
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            orion/metacog/tests/test_transport_baseline.py \
            scripts/analysis/tests/test_grade_transport_baseline.py
      - name: Silence-pause mutation eval (every mutant must be killed)
        run: PYTHONPATH=. python orion/metacog/evals/run_transport_baseline_pause_mutations.py
      - name: Equilibrium transport wiring + evals (mesh, real sparse-hop replay)
        working-directory: services/orion-equilibrium-service
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider \
            tests/test_transport_baseline_gate.py \
            tests/test_transport_baseline_hourly.py \
            tests/test_transport_timeout_dedupe.py \
            evals/test_transport_baseline_mesh_eval.py
      - name: sql-writer hourly row shape
        working-directory: services/orion-sql-writer
        run: PYTHONPATH=${{ github.workspace }} python -m pytest -q -p no:cacheprovider tests/test_transport_baseline_hourly_sql_shape.py
