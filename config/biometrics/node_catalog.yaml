schema_version: biometrics_node_catalog.v1

defaults:
  expected_online: true
  role: unknown
  capabilities: {}

nodes:
  atlas:
    # DECOMMISSIONED 2026-08-21. The physical chassis is gone as a distinct node: its disks
    # were pulled and replaced with athena's (athena now boots from that box, inheriting its
    # iLO at 192.168.1.34 -- see services/orion-biometrics/.env), its 2x V100 16GB moved into
    # circe, and its old PDU outlets (34,35) are now athena's own reading, not a proxy. This
    # entry is kept, not deleted, so `atlas` still resolves for any historical trace/lineage
    # lookup; expected_online:false stops pressure_organ.py from treating its permanent
    # silence as an unexpected outage (see orion/substrate/biometrics_loop/pressure_organ.py).
    # It will never report again -- do not re-flip this without a real box behind the name.
    aliases:
      - atlas
      - atlas.tail348bbe.ts.net
    role: inference_gpu
    expected_online: false
    capabilities:
      local_llm_heavy: true
      local_llm_quick: true
      embedding: true
      batch_inference: true
      graphdb: false
      postgres: false
      hub: false
      monitoring: false

  athena:
    aliases:
      - athena
      - athena.tail348bbe.ts.net
    role: orchestration
    expected_online: true
    capabilities:
      hub: true
      redis_bus: true
      graphdb: true
      postgres: true
      orchestration: true
      local_llm_heavy: false
      local_llm_quick: false
      monitoring: false

  circe:
    aliases:
      - circe
      - circe.tail348bbe.ts.net
    role: burst_gpu
    # Was false: circe was intermittent/burst-only. A real llamacpp chat worker
    # (orion-atlas-llamacpp-chat, port 8011) has been running on circe continuously
    # for days (2026-07-18) -- expected_online=false was making pressure_organ.py
    # suppress circe's real strain pressure as "expected staleness" instead of
    # surfacing it (see orion/substrate/biometrics_loop/pressure_organ.py:125).
    expected_online: true
    capabilities:
      local_llm_heavy: true
      local_llm_quick: true
      training: true
      batch_inference: true
      dream_batch: true
      graphdb: false
      postgres: false
      hub: false

  prometheus:
    aliases:
      - prometheus
      - prometheous
      - prometheus.tail348bbe.ts.net
      - prometheous.tail348bbe.ts.net
    role: observability
    expected_online: true
    capabilities:
      monitoring: true
      logs: true
      metrics: true
      orchestration: false
      local_llm_heavy: false
