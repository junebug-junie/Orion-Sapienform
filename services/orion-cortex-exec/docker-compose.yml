# Mesh: skills.mesh.tailscale_mesh_status.v1 runs inside this container. The image does not ship
# `tailscale`. Bind-mounts below pull the HOST CLI + tailscaled socket so Agent/Hub mesh works after
# a normal `docker compose up` (no extra -f file). Override ORION_HOST_TAILSCALE_BIN if yours is
# e.g. /usr/sbin/tailscale. If the host has no Tailscale, `up` may fail on the bind — install it or
# comment these volumes for dev-only nodes.
services:
  cortex-exec:
    build:
      context: ../..
      dockerfile: services/orion-cortex-exec/Dockerfile
    container_name: ${PROJECT}-cortex-exec
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HEALTH_HTTP_PORT:-8070}:${HEALTH_HTTP_PORT:-8070}"

    volumes:
      - ${ORION_HOST_TAILSCALE_BIN:-/usr/bin/tailscale}:${ORION_CONTAINER_TAILSCALE_BIN:-/usr/bin/tailscale}:ro
      - ${ORION_HOST_TAILSCALE_RUN:-/var/run/tailscale}:/var/run/tailscale:ro
      # Host Docker engine + CLI for skills.runtime.docker_prune_stopped_containers.v1 (and other docker skills).
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${ORION_HOST_DOCKER_CLI:-/usr/bin/docker}:/usr/bin/docker:ro
      # Host Docker data-root, READ-ONLY, for skills.runtime.builder_prune.v1's disk
      # measurement (2026-08-12). The socket above gives build-cache totals but NOT
      # filesystem capacity -- shutil.disk_usage() needs a real path on the target
      # filesystem, and the host's /mnt/docker is not otherwise visible in here.
      # Caught by the first live preview run, which failed with FileNotFoundError.
      # Adds no meaningful privilege: the docker socket two lines up is already
      # root-equivalent.
      - ${ORION_HOST_DOCKER_DATA_ROOT:-/mnt/docker}:/hostfs/docker:ro
      # `docker compose` (v2) is a CLI plugin, not a built-in subcommand -- mounting the docker binary
      # alone isn't enough. Without this, `docker compose ...` inside the container fails as an
      # unrecognized command (confirmed live 2026-08-12: skills.docker.compose_service_bringup.v1's
      # build step got "unknown flag: --env-file" / top-level `docker [OPTIONS] COMMAND` usage text,
      # because the CLI silently treated `compose` as an unknown command and choked on the next flag).
      # Container side is intentionally hardcoded, NOT ${ORION_HOST_DOCKER_CLI_PLUGINS_DIR} -- the docker
      # CLI's plugin search list (~/.docker/cli-plugins, /usr/local/lib(exec)/docker/cli-plugins,
      # /usr/lib/docker/cli-plugins, /usr/libexec/docker/cli-plugins) is fixed at compile time, not
      # env-configurable, so an override pointing the host side at a nonstandard path (e.g. /opt/docker/
      # cli-plugins on some distros) while also relocating the container side would silently reproduce this
      # exact failure -- the containerized CLI would never look there. Mirrors ORION_HOST_DOCKER_CLI just
      # above: host side overridable, container side fixed to a path the CLI actually scans.
      - ${ORION_HOST_DOCKER_CLI_PLUGINS_DIR:-/usr/libexec/docker/cli-plugins}:/usr/libexec/docker/cli-plugins:ro
      # NVIDIA: slim image omits nvidia-smi; bind-mount host binary. Needs NVIDIA Container Toolkit + `gpus`
      # below. On hosts without a GPU stack, comment this line and `gpus`, or point ORION_HOST_NVIDIA_SMI at a
      # valid host path.
      - ${ORION_HOST_NVIDIA_SMI:-/usr/bin/nvidia-smi}:/usr/bin/nvidia-smi:ro
      # Read-only host repo mount (2026-08-12, skills.docker.compose_service_bringup.v1): the image only ships a
      # build-time COPY of the repo (baked at Dockerfile build, goes stale the moment host code changes), so
      # `docker compose build` run from *inside* this container -- even talking to the host daemon over the
      # docker.sock bind above -- would otherwise construct its build context from that stale snapshot, not live
      # host code. This mount fixes that. MUST stay `:ro` -- do NOT change to a write mount under any framing
      # (env sync, log writes, etc.); Juniper does not want this container able to write into the host repo /
      # main branch. Mounted at the SAME absolute path on both sides so ORION_REPO_ROOT / self_study's
      # `_resolve_repo_root()` and any script-relative paths resolve identically inside and outside the
      # container. Override ORION_HOST_REPO_ROOT if this node's checkout lives elsewhere.
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:ro
      # Read-only mount of orion-self-study-enrichment's cache volume (2026-08,
      # self_study.py's _semantic_enrichment_concepts()). That service names
      # its volume `${PROJECT}-self-study-enrichment-data` (see
      # services/orion-self-study-enrichment/docker-compose.yml) and mounts it
      # at /data; cortex-exec never writes into it, only reads cached
      # enrichment JSON already written by that service. Mount target here
      # MUST match SELF_STUDY_ENRICHMENT_CACHE_MOUNT_DIR's default in
      # self_study.py (currently /mnt/self_study_enrichment_data) -- if they
      # diverge, the cache silently reads as "unreachable" with no error.
      - self_study_enrichment_data:/mnt/self_study_enrichment_data:ro
      # Small, writable volume (2026-08) so
      # _structural_delta_concepts()'s "last observed graphify snapshot" can
      # survive a container restart instead of resetting to cold start every
      # time. Deliberately NOT the read-only host repo mount above -- that
      # one stays read-only on purpose (see its own comment). This is a
      # dedicated volume for exactly this purpose, same pattern as
      # self_study_enrichment_data, and owned solely by this SERVICE (not
      # external/cross-service, unlike the enrichment volume above).
      # "Solely by this service" does NOT mean solely by one container,
      # though (review finding, 2026-08-12): cortex-exec-chat/-spark/
      # -background below all `extends: cortex-exec` with no volumes
      # override, so all 4 containers share this same volume and can call
      # the self_concept_induce/reflect verbs concurrently. self_study.py's
      # append-only JSONL history log has no cross-process file lock, so a
      # race there can produce a handful of duplicate entries around a
      # restart or commit transition -- harmless (the log is read as
      # "take the last entry", and a duplicate entry is byte-identical to
      # the one before it), not corruption. Scoping this to a single lane
      # was considered and rejected as more invasive than the problem
      # warrants; documenting the real multi-writer shape here instead.
      - self_study_structural_mass_data:/mnt/self_study_structural_mass_data

    # Block-device access for skills.storage.disk_health_snapshot.v1 (smartctl/nvme need host nodes).
    privileged: true
    # Expose GPU devices + driver libs into the container for nvidia-smi / NVML (requires nvidia-container-toolkit).
    gpus: all

    #volumes:
    #  - ./services/orion-cortex-exec/app:/app/app

    environment:
      # Cortex-specific settings from .env
      NODE_NAME: ${NODE_NAME}

      SERVICE_NAME: ${SERVICE_NAME}
      SERVICE_VERSION: ${SERVICE_VERSION}

      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC}

      RPC_HEALTH_PUBLISH_ENABLED: ${RPC_HEALTH_PUBLISH_ENABLED:-false}
      RPC_HEALTH_PUBLISH_INTERVAL_SEC: ${RPC_HEALTH_PUBLISH_INTERVAL_SEC:-30}

      HEALTH_HTTP_PORT: ${HEALTH_HTTP_PORT:-8070}

      ORION_BUS_URL: ${ORION_BUS_URL}
      ORION_BUS_ENFORCE_CATALOG: ${ORION_BUS_ENFORCE_CATALOG}
      ORION_BUS_VELOCITY_TRACKING_ENABLED: ${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      ORION_BUS_ENABLED: ${ORION_BUS_ENABLED}

      CHANNEL_EXEC_REQUEST: ${CHANNEL_EXEC_REQUEST}
      EXEC_LANE: ${EXEC_LANE:-legacy}
      EXEC_AUTONOMOUS_BACKGROUND_ROUTING: ${EXEC_AUTONOMOUS_BACKGROUND_ROUTING:-true}
      EXEC_CONCURRENT_HANDLERS: ${EXEC_CONCURRENT_HANDLERS:-true}
      ENABLE_PRE_TURN_APPRAISAL_HANDLER: ${ENABLE_PRE_TURN_APPRAISAL_HANDLER:-true}
      CHANNEL_COGNITION_TRACE_PUB: ${CHANNEL_COGNITION_TRACE_PUB:-orion:cognition:trace}
      CHANNEL_METACOG_TRACE_PUB: ${CHANNEL_METACOG_TRACE_PUB:-orion:metacog:trace}
      EXEC_REQUEST_PREFIX: ${EXEC_REQUEST_PREFIX}
      EXEC_RESULT_PREFIX: ${EXEC_RESULT_PREFIX}
      CORTEX_LOG_CHANNEL: ${CORTEX_LOG_CHANNEL}
      CHANNEL_LLM_INTAKE: ${CHANNEL_LLM_INTAKE}
      ATLAS_METACOG_PROFILE_NAME: ${ATLAS_METACOG_PROFILE_NAME:-}
      CHANNEL_RECALL_INTAKE: ${CHANNEL_RECALL_INTAKE}
      RECALL_RPC_TIMEOUT_SEC: ${RECALL_RPC_TIMEOUT_SEC:-90}
      CHAT_QUICK_RECALL_TIMEOUT_SEC: ${CHAT_QUICK_RECALL_TIMEOUT_SEC:-30}
      CHAT_QUICK_RECALL_PROFILE: ${CHAT_QUICK_RECALL_PROFILE:-assist.light.v1}
      CHANNEL_CONTEXT_EXEC_INTAKE: ${CHANNEL_CONTEXT_EXEC_INTAKE:-orion:exec:request:ContextExecService}
      CHANNEL_CONTEXT_EXEC_REPLY_PREFIX: ${CHANNEL_CONTEXT_EXEC_REPLY_PREFIX:-orion:exec:result:ContextExecService}
      CONTEXT_EXEC_ENABLED: ${CONTEXT_EXEC_ENABLED:-true}
      CONTEXT_EXEC_TIMEOUT_SEC: ${CONTEXT_EXEC_TIMEOUT_SEC:-60}
      CONTEXT_EXEC_LEGACY_FALLBACK: ${CONTEXT_EXEC_LEGACY_FALLBACK:-true}
      CHANNEL_PLANNER_INTAKE: ${CHANNEL_PLANNER_INTAKE}
      CHANNEL_COUNCIL_INTAKE: ${CHANNEL_COUNCIL_INTAKE}
      CHANNEL_COUNCIL_REPLY_PREFIX: ${CHANNEL_COUNCIL_REPLY_PREFIX}
      CHANNEL_COLLAPSE_SQL_WRITE: ${CHANNEL_COLLAPSE_SQL_WRITE:-orion:collapse:sql-write}
      CHANNEL_METACOG_SQL_WRITE: ${CHANNEL_METACOG_SQL_WRITE:-orion:metacog:sql-write}
      CHANNEL_COLLAPSE_INTAKE: ${CHANNEL_COLLAPSE_INTAKE:-orion:collapse:intake}
      CHANNEL_STATE_REQUEST: ${CHANNEL_STATE_REQUEST:-orion:state:request}
      CHANNEL_STATE_REPLY_PREFIX: ${CHANNEL_STATE_REPLY_PREFIX:-orion:state:reply}
      CHANNEL_CORE_EVENTS: ${CHANNEL_CORE_EVENTS:-orion:core:events}
      PUBLISH_CORTEX_EXEC_GRAMMAR: ${PUBLISH_CORTEX_EXEC_GRAMMAR:-true}
      GRAMMAR_EVENT_CHANNEL: ${GRAMMAR_EVENT_CHANNEL:-orion:grammar:event}
      NOTIFY_URL: ${NOTIFY_URL:-http://orion-notify:7140}
