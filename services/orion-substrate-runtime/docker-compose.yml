services:
  substrate-runtime:
    build:
      context: ../..
      dockerfile: services/orion-substrate-runtime/Dockerfile
    container_name: ${PROJECT}-substrate-runtime
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${SUBSTRATE_RUNTIME_PORT:-8115}:8115"
    environment:
      - PROJECT=${PROJECT}
      - NODE_NAME=${NODE_NAME}
      - SERVICE_NAME=${SERVICE_NAME:-orion-substrate-runtime}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - POSTGRES_URI=${POSTGRES_URI}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - ENABLE_BIOMETRICS_NODE_REDUCER=${ENABLE_BIOMETRICS_NODE_REDUCER:-true}
      - ENABLE_BIOMETRICS_PRESSURE_ORGAN=${ENABLE_BIOMETRICS_PRESSURE_ORGAN:-true}
      - ENABLE_NODE_PRESSURE_REDUCER=${ENABLE_NODE_PRESSURE_REDUCER:-true}
      - BIOMETRICS_NODE_STALE_AFTER_SEC=${BIOMETRICS_NODE_STALE_AFTER_SEC:-180}
      - BIOMETRICS_PRESSURE_MIN_CONFIDENCE=${BIOMETRICS_PRESSURE_MIN_CONFIDENCE:-0.60}
      - NODE_CATALOG_PATH=${NODE_CATALOG_PATH:-/app/config/biometrics/node_catalog.yaml}
      - GRAMMAR_POLL_INTERVAL_SEC=${GRAMMAR_POLL_INTERVAL_SEC:-1.0}
      - SUBSTRATE_WRITE_PREDICTION_ERROR_NODES=${SUBSTRATE_WRITE_PREDICTION_ERROR_NODES:-false}
      - SUBSTRATE_DYNAMICS_TICK_ENABLED=${SUBSTRATE_DYNAMICS_TICK_ENABLED:-false}
      - SUBSTRATE_DYNAMICS_TICK_INTERVAL_SEC=${SUBSTRATE_DYNAMICS_TICK_INTERVAL_SEC:-30.0}
      - SUBSTRATE_STORE_BACKEND=${SUBSTRATE_STORE_BACKEND:-sparql}
      - FALKORDB_URI=${FALKORDB_URI:-}
      - FALKORDB_SUBSTRATE_GRAPH=${FALKORDB_SUBSTRATE_GRAPH:-orion_substrate}
      - SUBSTRATE_STORE_PRIMARY=${SUBSTRATE_STORE_PRIMARY:-}
      - SUBSTRATE_STORE_SHADOW=${SUBSTRATE_STORE_SHADOW:-}
      - SUBSTRATE_ROUTE_WORKLOAD=${SUBSTRATE_ROUTE_WORKLOAD:-substrate.runtime}
      - SUBSTRATE_GRAPH_QUERY_URL=${SUBSTRATE_GRAPH_QUERY_URL}
      - SUBSTRATE_GRAPH_UPDATE_URL=${SUBSTRATE_GRAPH_UPDATE_URL}
      - SUBSTRATE_GRAPH_URI=${SUBSTRATE_GRAPH_URI:-http://conjourney.net/graph/substrate}
      - SUBSTRATE_GRAPH_USER=${SUBSTRATE_GRAPH_USER:-admin}
      - SUBSTRATE_GRAPH_PASS=${SUBSTRATE_GRAPH_PASS:-orion}
      - SUBSTRATE_SNAPSHOT_FORCE_REFRESH_CEILING_SEC=${SUBSTRATE_SNAPSHOT_FORCE_REFRESH_CEILING_SEC:-30.0}
      - SUBSTRATE_SNAPSHOT_CACHE_TTL_SEC=${SUBSTRATE_SNAPSHOT_CACHE_TTL_SEC:-2.0}
      - SUBSTRATE_EPISODIC_TICK_ENABLED=${SUBSTRATE_EPISODIC_TICK_ENABLED:-false}
      - SUBSTRATE_EPISODIC_TICK_INTERVAL_SEC=${SUBSTRATE_EPISODIC_TICK_INTERVAL_SEC:-300.0}
      - SUBSTRATE_EPISODIC_WINDOW_SECONDS=${SUBSTRATE_EPISODIC_WINDOW_SECONDS:-900}
      - SUBSTRATE_EPISODIC_MAX_RECEIPTS=${SUBSTRATE_EPISODIC_MAX_RECEIPTS:-64}
      - SUBSTRATE_EPISODIC_RETENTION_DAYS=${SUBSTRATE_EPISODIC_RETENTION_DAYS:-14.0}
      - SUBSTRATE_BUS_SYNAPTIC_TICK_ENABLED=${SUBSTRATE_BUS_SYNAPTIC_TICK_ENABLED:-false}
      - SUBSTRATE_BUS_SYNAPTIC_TICK_INTERVAL_SEC=${SUBSTRATE_BUS_SYNAPTIC_TICK_INTERVAL_SEC:-30.0}
      - SUBSTRATE_BUS_SYNAPTIC_MIN_EDGE_COUNT=${SUBSTRATE_BUS_SYNAPTIC_MIN_EDGE_COUNT:-5}
      - SUBSTRATE_BUS_SYNAPTIC_MAX_EDGE_AGE_SEC=${SUBSTRATE_BUS_SYNAPTIC_MAX_EDGE_AGE_SEC:-3600.0}
      - SUBSTRATE_VISION_CHANNEL_TICK_ENABLED=${SUBSTRATE_VISION_CHANNEL_TICK_ENABLED:-false}
      - SUBSTRATE_VISION_CHANNEL_TICK_INTERVAL_SEC=${SUBSTRATE_VISION_CHANNEL_TICK_INTERVAL_SEC:-30.0}
      - SUBSTRATE_VISION_ARTIFACTS_CHANNEL=${SUBSTRATE_VISION_ARTIFACTS_CHANNEL:-orion:vision:artifacts}
      - FALKORDB_BUS_GRAPH=${FALKORDB_BUS_GRAPH:-orion_bus_synapse}
      - ORION_ATTENTION_BROADCAST_ENABLED=${ORION_ATTENTION_BROADCAST_ENABLED:-false}
      - ORION_ATTENTION_BROADCAST_INTERVAL_SEC=${ORION_ATTENTION_BROADCAST_INTERVAL_SEC:-30.0}
      - ORION_ATTENTION_BROADCAST_MIN_SALIENCE=${ORION_ATTENTION_BROADCAST_MIN_SALIENCE:-0.2}
      - ORION_ATTENTION_BROADCAST_LOG_RETENTION_HOURS=${ORION_ATTENTION_BROADCAST_LOG_RETENTION_HOURS:-168.0}
      - ORION_ATTENTION_VERDICT_EXCLUSION_TTL_HOURS=${ORION_ATTENTION_VERDICT_EXCLUSION_TTL_HOURS:-48.0}
      - SUBSTRATE_ATTENTION_SELF_MODEL_TICK_ENABLED=${SUBSTRATE_ATTENTION_SELF_MODEL_TICK_ENABLED:-true}
      - SUBSTRATE_ATTENTION_SELF_MODEL_TREND_WINDOW_TICKS=${SUBSTRATE_ATTENTION_SELF_MODEL_TREND_WINDOW_TICKS:-2}
      - SUBSTRATE_ATTENTION_SELF_MODEL_LOG_RETENTION_HOURS=${SUBSTRATE_ATTENTION_SELF_MODEL_LOG_RETENTION_HOURS:-168.0}
      - SUBSTRATE_WRITE_CODEBASE_PREDICTION_ERROR_NODE=${SUBSTRATE_WRITE_CODEBASE_PREDICTION_ERROR_NODE:-false}
      - CHANNEL_CODEBASE_DELTA=${CHANNEL_CODEBASE_DELTA:-orion:substrate:codebase_delta}
      - SUBSTRATE_CODEBASE_MASS_BASELINE_RETENTION_DAYS=${SUBSTRATE_CODEBASE_MASS_BASELINE_RETENTION_DAYS:-30.0}
      - SUBSTRATE_CODEBASE_DELTA_LOG_RETENTION_DAYS=${SUBSTRATE_CODEBASE_DELTA_LOG_RETENTION_DAYS:-180.0}
      - SUBSTRATE_PERCEPTION_PREDICTION_ERROR_TICK_ENABLED=${SUBSTRATE_PERCEPTION_PREDICTION_ERROR_TICK_ENABLED:-false}
      - SUBSTRATE_PERCEPTION_PREDICTION_ERROR_TICK_INTERVAL_SEC=${SUBSTRATE_PERCEPTION_PREDICTION_ERROR_TICK_INTERVAL_SEC:-30.0}
      - SUBSTRATE_PERCEPTION_BASELINE_RETENTION_DAYS=${SUBSTRATE_PERCEPTION_BASELINE_RETENTION_DAYS:-30.0}
      - SUBSTRATE_WORLD_MODEL_PUBLISH_TICK_ENABLED=${SUBSTRATE_WORLD_MODEL_PUBLISH_TICK_ENABLED:-false}
      - SUBSTRATE_WORLD_MODEL_PUBLISH_TICK_INTERVAL_SEC=${SUBSTRATE_WORLD_MODEL_PUBLISH_TICK_INTERVAL_SEC:-30.0}
      - SUBSTRATE_WORLD_MODEL_REQUEST_CHANNEL=${SUBSTRATE_WORLD_MODEL_REQUEST_CHANNEL:-orion:exec:request:WorldModelService}
      - SUBSTRATE_WORLD_MODEL_DIM_BIOMETRICS=${SUBSTRATE_WORLD_MODEL_DIM_BIOMETRICS:-32}
      - SUBSTRATE_WORLD_MODEL_DIM_AFFECT=${SUBSTRATE_WORLD_MODEL_DIM_AFFECT:-16}
      - SUBSTRATE_WORLD_MODEL_DIM_EXECUTION_CONTEXT=${SUBSTRATE_WORLD_MODEL_DIM_EXECUTION_CONTEXT:-16}
      - SUBSTRATE_WORLD_MODEL_DIM_MEMORY_POINTERS=${SUBSTRATE_WORLD_MODEL_DIM_MEMORY_POINTERS:-32}
      - SUBSTRATE_WORLD_MODEL_DIM_TEMPORAL=${SUBSTRATE_WORLD_MODEL_DIM_TEMPORAL:-8}
      - SUBSTRATE_WORLD_MODEL_DIM_VISION_EMBEDDING=${SUBSTRATE_WORLD_MODEL_DIM_VISION_EMBEDDING:-512}
      - SUBSTRATE_WORLD_MODEL_VISION_EMBEDDING_MAX_AGE_SEC=${SUBSTRATE_WORLD_MODEL_VISION_EMBEDDING_MAX_AGE_SEC:-120.0}
      - SUBSTRATE_HEARTBEAT_H1_URL=${SUBSTRATE_HEARTBEAT_H1_URL:-http://orion-athena-heartbeat:7251/h1}
      - SUBSTRATE_HEARTBEAT_H1_FETCH_TIMEOUT_SEC=${SUBSTRATE_HEARTBEAT_H1_FETCH_TIMEOUT_SEC:-2.0}
      - ORION_ATTENTION_SALIENCE_V2_ENABLED=${ORION_ATTENTION_SALIENCE_V2_ENABLED:-false}
      - ORION_ENDOGENOUS_CURIOSITY_ENABLED=${ORION_ENDOGENOUS_CURIOSITY_ENABLED:-false}
      - ORION_ENDOGENOUS_CURIOSITY_KILL_SWITCH=${ORION_ENDOGENOUS_CURIOSITY_KILL_SWITCH:-false}
      - ORION_ENDOGENOUS_CURIOSITY_BUDGET=${ORION_ENDOGENOUS_CURIOSITY_BUDGET:-3}
      - ORION_ENDOGENOUS_CURIOSITY_TICK_INTERVAL_SEC=${ORION_ENDOGENOUS_CURIOSITY_TICK_INTERVAL_SEC:-60.0}
      - ORION_ENDOGENOUS_CURIOSITY_MIN_REPAIR_LEVEL=${ORION_ENDOGENOUS_CURIOSITY_MIN_REPAIR_LEVEL:-0.6}
      - BIOMETRICS_GRAMMAR_BATCH_LIMIT=${BIOMETRICS_GRAMMAR_BATCH_LIMIT:-500}
      - EXECUTION_GRAMMAR_BATCH_LIMIT=${EXECUTION_GRAMMAR_BATCH_LIMIT:-500}
      - TRANSPORT_GRAMMAR_BATCH_LIMIT=${TRANSPORT_GRAMMAR_BATCH_LIMIT:-1000}
      - REDUCER_HEARTBEAT_STALE_SEC=${REDUCER_HEARTBEAT_STALE_SEC:-120}
      - REDUCER_POISON_MAX_RETRIES=${REDUCER_POISON_MAX_RETRIES:-3}
      - PUBLISH_ACCEPTED_PRESSURE_GRAMMAR=${PUBLISH_ACCEPTED_PRESSURE_GRAMMAR:-true}
      - ACCEPTED_PRESSURE_GRAMMAR_CHANNEL=${ACCEPTED_PRESSURE_GRAMMAR_CHANNEL:-orion:grammar:accepted-pressure}
      - CHANNEL_FINALIZE_APPRAISAL_REQUEST=${CHANNEL_FINALIZE_APPRAISAL_REQUEST:-orion:substrate:finalize_appraisal:request}
      - CHANNEL_FINALIZE_APPRAISAL_RESULT_PREFIX=${CHANNEL_FINALIZE_APPRAISAL_RESULT_PREFIX:-orion:substrate:finalize_appraisal:result:}
      - CHANNEL_POST_TURN_CLOSURE=${CHANNEL_POST_TURN_CLOSURE:-orion:substrate:post_turn_closure}
      - ENABLE_POST_TURN_CLOSURE_LISTENER=${ENABLE_POST_TURN_CLOSURE_LISTENER:-true}
      - SUBSTRATE_CURSOR_TAIL_SEED_ON_LAG=${SUBSTRATE_CURSOR_TAIL_SEED_ON_LAG:-false}
      - SUBSTRATE_CURSOR_LAG_RESYNC_HOURS=${SUBSTRATE_CURSOR_LAG_RESYNC_HOURS:-6}
      - SUBSTRATE_CURSOR_RESET_OPERATOR_TOKEN=${SUBSTRATE_CURSOR_RESET_OPERATOR_TOKEN:-}
      - ENABLE_EXECUTION_TRAJECTORY_REDUCER=${ENABLE_EXECUTION_TRAJECTORY_REDUCER:-false}
      - EXECUTION_TRAJECTORY_MAX_RUNS=${EXECUTION_TRAJECTORY_MAX_RUNS:-2000}
      - EXECUTION_TRAJECTORY_MAX_AGE_SEC=${EXECUTION_TRAJECTORY_MAX_AGE_SEC:-86400}
      - ENABLE_TRANSPORT_BUS_REDUCER=${ENABLE_TRANSPORT_BUS_REDUCER:-false}
      - BUS_STREAM_DEPTH_CRITICAL=${BUS_STREAM_DEPTH_CRITICAL:-100000}
      - TRANSPORT_SUBSTRATE_MATURITY=${TRANSPORT_SUBSTRATE_MATURITY:-trace_only}
      - ENABLE_CHAT_GRAMMAR_REDUCER=${ENABLE_CHAT_GRAMMAR_REDUCER:-false}
      - CHAT_GRAMMAR_BATCH_LIMIT=${CHAT_GRAMMAR_BATCH_LIMIT:-100}
      - ENABLE_ROUTE_GRAMMAR_REDUCER=${ENABLE_ROUTE_GRAMMAR_REDUCER:-true}
      - ROUTE_GRAMMAR_BATCH_LIMIT=${ROUTE_GRAMMAR_BATCH_LIMIT:-100}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ORION_RECEIPT_RETENTION_SUCCESS_MINUTES=${ORION_RECEIPT_RETENTION_SUCCESS_MINUTES:-30}
      - ORION_RECEIPT_RETENTION_ERROR_HOURS=${ORION_RECEIPT_RETENTION_ERROR_HOURS:-6}
      - ORION_RECEIPT_FULL_PAYLOAD_SUCCESS=${ORION_RECEIPT_FULL_PAYLOAD_SUCCESS:-false}
      - ORION_RECEIPT_FULL_PAYLOAD_SAMPLE_RATE=${ORION_RECEIPT_FULL_PAYLOAD_SAMPLE_RATE:-0}
      - ORION_RECEIPT_MAX_TABLE_GB=${ORION_RECEIPT_MAX_TABLE_GB:-25}
      - ORION_RECEIPT_WARN_TABLE_GB=${ORION_RECEIPT_WARN_TABLE_GB:-15}
      - ORION_RECEIPT_CRITICAL_TABLE_GB=${ORION_RECEIPT_CRITICAL_TABLE_GB:-20}
      - ORION_RECEIPT_EMERGENCY_METADATA_ONLY=${ORION_RECEIPT_EMERGENCY_METADATA_ONLY:-true}
      - ORION_RECEIPT_PRUNE_INTERVAL_SEC=${ORION_RECEIPT_PRUNE_INTERVAL_SEC:-300}
      - ORION_RECEIPT_PRUNE_BATCH_SIZE=${ORION_RECEIPT_PRUNE_BATCH_SIZE:-10000}
      - ORION_RECEIPT_POSTGRES_DATA_PATH=${ORION_RECEIPT_POSTGRES_DATA_PATH:-/mnt/postgres}
      - ORION_RECEIPT_DISK_CRITICAL_PCT=${ORION_RECEIPT_DISK_CRITICAL_PCT:-85}
      - SUBSTRATE_RUNTIME_HEALTH_CHECK_INTERVAL_SEC=${SUBSTRATE_RUNTIME_HEALTH_CHECK_INTERVAL_SEC:-900.0}
      - SUBSTRATE_RUNTIME_HEALTH_RECHECK_DELAY_SEC=${SUBSTRATE_RUNTIME_HEALTH_RECHECK_DELAY_SEC:-15.0}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL:-http://orion-athena-notify:7140}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:-}
      - EMBODIMENT_DRIVES_STATE_CHANNEL=${EMBODIMENT_DRIVES_STATE_CHANNEL:-orion:memory:drives:state}
      - ORION_ATTENTION_TOPDOWN_ENABLED=${ORION_ATTENTION_TOPDOWN_ENABLED:-false}
      - ATTENTION_TOPDOWN_GAIN=${ATTENTION_TOPDOWN_GAIN:-0.6}
      - ATTENTION_EFFORT_MAX=${ATTENTION_EFFORT_MAX:-1.0}
      - ATTENTION_EFFORT_SCALE_BY_AGENCY=${ATTENTION_EFFORT_SCALE_BY_AGENCY:-true}
      - ATTENTION_TOPDOWN_WEIGHTS_VERSION=${ATTENTION_TOPDOWN_WEIGHTS_VERSION:-seed-v1}

networks:
  app-net:
    external: true
