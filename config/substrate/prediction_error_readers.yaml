# Who reads node prediction_error values, and how they treat alarms (#3307).
# Checked in CI by scripts/check_pe_alarm_readers.py.
#
# node:substrate.cabinet / .strain / .street are ALARMS, not prediction errors: their value means "it
# fired", not "how big a surprise" (orion/substrate/prediction_error_freshness.py, ALARM_NODE_IDS).
# Since PE retire Patch 2 (2026-11-24) they no longer ride the prediction_error slot: their writer puts
# the value in node metadata signal_value and in substrate_node_signal_history, history readers read
# both tables (orion/prediction/signal_history_sql.py HISTORY_WITH_MOVED_SOURCE_SQL) until the old PE
# rows age out, and the gate below also FAILS any producer that writes prediction_error for one of
# them (moved-node writer fence). Since Patch 3 (2026-11-24) the two cameras (node:substrate.perception,
# .perception_walkway) are moved too: camera scene change in signal_value / the signal table, read
# signal-table-only with scale IN ('v2','v2_partial'); the gate fails any producer writing
# prediction_error for them and any SQL naming the signal table with a camera id and no scale predicate.
#
# Every non-test Python file that touches prediction_error (names the history table, or reads the
# "prediction_error" key or attribute) either skips alarms itself (calls is_alarm_node / uses
# ALARM_NODE_IDS: no entry needed) or is listed here with a class and a reason:
#   alarm_aware   reads alarms on purpose, as alarms (fired / trigger semantics), or shows them as pressure
#   filters_via   skips alarms through a helper it imports (name the helper)
#   single_node   reads only named non-alarm nodes (name them)
#   not_a_reader  writes, stores, defines, transports or decodes the value; never reads it as a size
# Classified 2026-11-16 by reading each file (PR report lists the evidence).
version: 1
excluded_paths:
  - path: scripts/analysis/
    reason: offline replays and measurements a person runs and reads; never feed Orion's runtime
files:
  # --- alarm_aware -------------------------------------------------------------------------------
  orion/attention/world_first.py:
    class: alarm_aware
    reason: the attention contest; bad_direction_percentile treats glossary value_kind trigger as "it fired"
  orion/substrate/pressure.py:
    class: alarm_aware
    reason: dynamics pressure seed reads one node's value; admitting firing alarms to the workspace is its job
  orion/metacog/self_signal_episode.py:
    class: alarm_aware
    reason: observation_from_verdict reads world_first.judge_candidate verdicts, so alarms use the trigger rule
  services/orion-equilibrium-service/app/self_signal_episode_gate.py:
    class: alarm_aware
    reason: the metacog episode gate; judge_candidate per node (trigger rule), labels via node_signal_label
  services/orion-substrate-runtime/app/worker.py:
    class: alarm_aware
    reason: writes the alarm nodes and samples history for the contest; labels via ALARM_LABELS; self-model
      PE domains are the explicit _PREDICTION_ERROR_DOMAIN_NODE_IDS (empty since 2026-11-24, when execution, the last, retired)
  orion/attention/field_attention/selectors.py:
    class: alarm_aware
    reason: precision path reads only PREDICTION_ERROR_NATIVE_TARGETS (empty since 2026-11-24); world-first
      path ranks contest verdicts (world_first trigger rule), where alarms compete as alarms
  services/orion-attention-runtime/app/worker.py:
    class: alarm_aware
    reason: builds the world-first contest candidates; alarms keep their own label via node_signal_label
      and are judged by the trigger rule
  services/orion-thought/app/self_readings_cue.py:
    class: alarm_aware
    reason: fills NodePeHistoryCache and hands it to project_self_readings, which counts trigger fires per hour
  orion/attention/pe_history_cache.py:
    class: alarm_aware
    reason: per-node percentile cache; every consumer is alarm-aware (contests, self_readings, episode gate,
      rollup); a new consumer must check is_alarm_node itself
  # --- single_node -------------------------------------------------------------------------------
  orion/substrate/metacog_trend_signals.py:
    class: single_node
    reason: reads the field prediction_error of the node ids its callers pass (none since 2026-11-24),
      one SQL JSON path per named node
  # --- not_a_reader ------------------------------------------------------------------------------
  orion/attention/field_attention/candidate_precision_weighted.py:
    class: not_a_reader
    reason: names the channel in a docstring only
  orion/autonomy/world_settlement_store.py:
    class: not_a_reader
    reason: column list of the action ledger (observed minus predicted), not a substrate node value
  orion/substrate/falkor_store.py:
    class: not_a_reader
    reason: list of node metadata keys the store preserves
  services/orion-field-digester/app/tensor/channels.py:
    class: not_a_reader
    reason: the field channel-name list
  services/orion-hub/scripts/autonomy_constitution.py:
    class: not_a_reader
    reason: a constitution category label
  scripts/backfill_signal_history_from_pe.py:
    class: not_a_reader
    reason: one-off copy of the five signal nodes' PE-table rows into substrate_node_signal_history (PR #3781 Patch 1); copies values unchanged, never reads them as a size
  scripts/check_pe_alarm_readers.py:
    class: not_a_reader
    reason: this gate; names the key in its own patterns and messages
  orion/attention/sustained.py:
    class: not_a_reader
    reason: pure dwell rule over one history it is handed; reads no prediction_error itself
  orion/autonomy/contrast.py:
    class: not_a_reader
    reason: mentions only the action ledger's observed-minus-predicted, never a substrate node value
  orion/metrics/semantics.py:
    class: not_a_reader
    reason: defines value kinds (trigger = it fired) and the URN inventory; interprets no values
  orion/schemas/attention_frame.py:
    class: not_a_reader
    reason: schema (PredictionErrorMagnitudeV1)
  orion/schemas/context_provenance.py:
    class: not_a_reader
    reason: provenance description text
  orion/schemas/introspect.py:
    class: not_a_reader
    reason: constants and schema
  orion/schemas/prediction_error_definitions.py:
    class: not_a_reader
    reason: definition version per reducer key
  orion/schemas/self_reading.py:
    class: not_a_reader
    reason: schema
  orion/schemas/self_signal_outcome.py:
    class: not_a_reader
    reason: schema
  orion/substrate/falkor_codec.py:
    class: not_a_reader
    reason: encodes and decodes node metadata keys; preserves the value only
  orion/substrate/vision_organ_loop/extract.py:
    class: not_a_reader
    reason: producer side; computes its own staleness pressure, reads no node prediction_error
  orion/temporal_self/sources.py:
    class: not_a_reader
    reason: copies the action-ledger row's prediction_error (observed minus predicted), not a substrate node
  services/orion-attention-runtime/app/store.py:
    class: not_a_reader
    reason: data access for the contest cache; the EWMA baseline advances only for the native targets
      (none since 2026-11-24)
  services/orion-equilibrium-service/app/pe_history_reader.py:
    class: not_a_reader
    reason: read-only SELECT of history rows into NodePeHistoryCache
  services/orion-equilibrium-service/app/settings.py:
    class: not_a_reader
    reason: config
  services/orion-field-digester/app/ingest/state_deltas.py:
    class: not_a_reader
    reason: transports pressure hints into the field channel "prediction_error" (alarms included); the
      cross-node merge (orion/field/pressure.py skips_merge, #3307) drops alarm nodes from that channel
  services/orion-heartbeat/app/substrate/bus_synaptic.py:
    class: not_a_reader
    reason: its own gap z-score mirror; reads no node prediction_error
  services/orion-hub/scripts/main.py:
    class: not_a_reader
    reason: wires the node-history introspect listener only
  services/orion-hub/scripts/node_history_introspect_listener.py:
    class: not_a_reader
    reason: bus transport for orion.introspect.node_history, which labels alarms
  services/orion-sql-writer/app/models/self_signal_outcome.py:
    class: not_a_reader
    reason: ORM model
  services/orion-substrate-runtime/app/settings.py:
    class: not_a_reader
    reason: config for the alarm writers and history
  services/orion-substrate-runtime/app/store.py:
    class: not_a_reader
    reason: history persistence (save, fetch, count, prune); event-time fetch is per named node
  services/orion-thought/app/settings.py:
    class: not_a_reader
    reason: config
