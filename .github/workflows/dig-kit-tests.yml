name: dig-kit-tests

on:
  pull_request:
    paths:
      - "orion/dig/**"
      - "orion/self_inventory.py"
      - "orion/body_atlas/**"
      - "orion/harness/prefix.py"
      - "orion/harness/tests/test_stance_scope_hierarchy.py"
      - "orion/physiology/report_text.py"
      - "orion/physiology/evals/**"
      - "orion/schemas/physiology_report.py"
      - "orion/cognition/verbs/skills.physiology.state.v1.yaml"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/tests/test_skill_verbs.py"
      - ".github/workflows/dig-kit-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/dig/**"
      - "orion/self_inventory.py"
      - "orion/body_atlas/**"
      - "orion/harness/prefix.py"
      - "orion/harness/tests/test_stance_scope_hierarchy.py"
      - "orion/physiology/report_text.py"
      - "orion/physiology/evals/**"
      - "orion/schemas/physiology_report.py"
      - "orion/cognition/verbs/skills.physiology.state.v1.yaml"
      - "services/orion-cortex-exec/app/verb_adapters.py"
      - "services/orion-cortex-exec/tests/test_skill_verbs.py"
      - ".github/workflows/dig-kit-tests.yml"

jobs:
  dig-kit:
    name: Dig kit — commands, inventory, harness brief line
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi==0.111.0 httpx==0.27.2 pydantic==2.11.5 pydantic-settings==2.5.2 \
            SQLAlchemy==2.0.43 aiohttp==3.12.15 python-multipart requests python-dotenv loguru numpy==1.26.4
      - name: Dig kit + shared inventory
        run: PYTHONPATH=. python -m pytest -q -p no:cacheprovider orion/dig/tests
      - name: Harness prefix with the dig line (turn-rules header rules still hold)
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            orion/harness/tests/test_stance_scope_hierarchy.py orion/harness/tests/test_harness_prefix.py
      - name: Body-economy skill (skills.physiology.state.v1) -- text, cortex-exec adapter, eval on fixture data
        run: |
          python -m pip install -r services/orion-cortex-exec/requirements.txt
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider orion/physiology/tests/test_report_text.py
          (cd services/orion-cortex-exec && PYTHONPATH=../.. python -m pytest -q -p no:cacheprovider tests/test_skill_verbs.py -k physiology)
          PYTHONPATH=. python orion/physiology/evals/physiology_state_skill_eval.py
