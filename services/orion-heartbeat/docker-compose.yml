services:
  heartbeat:
    build:
      context: ../..
      dockerfile: services/orion-heartbeat/Dockerfile
    container_name: ${PROJECT}-heartbeat
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${HEARTBEAT_HTTP_PORT:-7251}:7251"
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-orion-heartbeat}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME}
      - INSTANCE_ID=${INSTANCE_ID}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - ORION_HEALTH_CHANNEL=${ORION_HEALTH_CHANNEL:-orion:system:health}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10.0}

      - CHANNEL_GRAMMAR_EVENT=${CHANNEL_GRAMMAR_EVENT:-orion:grammar:event}
      - HEARTBEAT_H1_INTERVAL_SEC=${HEARTBEAT_H1_INTERVAL_SEC:-30.0}
      - HEARTBEAT_SUBSTRATE_SEED=${HEARTBEAT_SUBSTRATE_SEED:-42}
      - HEARTBEAT_HTTP_PORT=${HEARTBEAT_HTTP_PORT:-7251}

      - HEARTBEAT_N_TRAJECTORIES=${HEARTBEAT_N_TRAJECTORIES:-8}
      - HEARTBEAT_DECAY_GAMMA=${HEARTBEAT_DECAY_GAMMA:-0.2}
      - HEARTBEAT_BASE_DECAY_PROB=${HEARTBEAT_BASE_DECAY_PROB:-0.15}
      - HEARTBEAT_DECAY_SPREAD_SENSITIVITY=${HEARTBEAT_DECAY_SPREAD_SENSITIVITY:-4.0}
      - HEARTBEAT_REHEAT_STRENGTH=${HEARTBEAT_REHEAT_STRENGTH:-0.08}
      - HEARTBEAT_REHEAT_PROB_SCALE=${HEARTBEAT_REHEAT_PROB_SCALE:-0.02}
      - HEARTBEAT_DECAY_REHEAT_INTERVAL_SEC=${HEARTBEAT_DECAY_REHEAT_INTERVAL_SEC:-2.0}
      - FALKORDB_URI=${FALKORDB_URI:-redis://orion-athena-falkordb:6379}
      - FALKORDB_BUS_GRAPH=${FALKORDB_BUS_GRAPH:-orion_bus_synapse}
      - HEARTBEAT_ABSORB_QUEUE_MAXSIZE=${HEARTBEAT_ABSORB_QUEUE_MAXSIZE:-10000}

networks:
  app-net:
    name: ${NET}
    external: true
