name: extract_facts
label: Fact Extraction
description: >
  Extract structured facts from unstructured text.

category: Transform
priority: medium

interruptible: true
can_interrupt_others: false

requires_gpu: true
requires_memory: false

timeout_ms: 60000
max_recursion_depth: 1

services:
  - LLMGatewayService

prompt_template: extract_facts_prompt.j2

plan:
  - name: compose_extraction_prompt
    description: Build fact-extraction template.
    order: 0
    prompt_template: extract_facts_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: llm_extract_facts
    description: Transform text→triples / key-value facts.
    order: 1
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []


# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
