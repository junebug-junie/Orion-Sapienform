services:
  vision-edge:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-vision-edge/Dockerfile
    container_name: ${PROJECT:-orion}-vision-edge
    restart: unless-stopped
    env_file:
      - .env

    environment:
      - SOURCE=${REOLINK_URL}
      - HIRES_SOURCE=${REOLINK_HIRES_URL:-}
      - WIDTH=${WIDTH}
      - HEIGHT=${HEIGHT}
      - FPS=${FPS}

      - DETECTORS=${DETECTORS}
      - MOTION_MIN_AREA=${MOTION_MIN_AREA}
      - DETECT_EVERY_N_FRAMES=${DETECT_EVERY_N_FRAMES}
      - STREAM_ID=${STREAM_ID}
      - ENABLE_UI=${ENABLE_UI}

      - ENABLE_YOLO=${ENABLE_YOLO}
      - YOLO_MODEL=${YOLO_MODEL}
      - YOLO_CLASSES=${YOLO_CLASSES}
      - YOLO_CONF=${YOLO_CONF}
      - YOLO_CONF_THRES=${YOLO_CONF_THRES}
      - YOLO_IOU_THRES=${YOLO_IOU_THRES}
      - YOLO_IMG_SIZE=${YOLO_IMG_SIZE}
      - YOLO_DEVICE=${YOLO_DEVICE}
      - YOLO_PERSON_RETRY_THRESHOLD=${YOLO_PERSON_RETRY_THRESHOLD}

      - FACE_CASCADE_PATH=${FACE_CASCADE_PATH}
      - FACE_SCALE_FACTOR=${FACE_SCALE_FACTOR}
      - FACE_MIN_NEIGHBORS=${FACE_MIN_NEIGHBORS}
      - FACE_MIN_SIZE=${FACE_MIN_SIZE}

      - ANNOTATE=${ANNOTATE}

      - ENABLE_PRESENCE=${ENABLE_PRESENCE}
      - PRESENCE_TIMEOUT=${PRESENCE_TIMEOUT}
      - PRESENCE_LABEL=${PRESENCE_LABEL}

      - JPEG_QUALITY=${JPEG_QUALITY}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}

      - VISION_EVENTS_PUBLISH_RAW=${VISION_EVENTS_PUBLISH_RAW}
      - VISION_EVENTS_SUBSCRIBE_RAW=${VISION_EVENTS_SUBSCRIBE_RAW}
      - VISION_EVENTS_PUBLISH_NOTABLE=${VISION_EVENTS_PUBLISH_NOTABLE}

      - CHANNEL_VISION_FRAMES=${CHANNEL_VISION_FRAMES}
      - CHANNEL_VISION_ARTIFACTS=${CHANNEL_VISION_ARTIFACTS}
      - CHANNEL_VISION_EDGE_ACTIVITY=${CHANNEL_VISION_EDGE_ACTIVITY}
      - EDGE_ACTIVITY_MIN_INTERVAL_S=${EDGE_ACTIVITY_MIN_INTERVAL_S}

      - FRAME_STORAGE_DIR=${FRAME_STORAGE_DIR}
      - EDGE_PUBLISH_ARTIFACTS=${EDGE_PUBLISH_ARTIFACTS:-true}
      - EDGE_DEBUG_SAVE_FRAMES=${EDGE_DEBUG_SAVE_FRAMES}
      - EDGE_DEBUG_DIR=${EDGE_DEBUG_DIR}

    volumes:
      - /mnt/telemetry/orion-vision-edge
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames
      - /tmp/orion-debug:/mnt/debug

    ports:
      - "7100:7100"

    # GPU pin (2026-10-15). The old form (`runtime: nvidia` + a device
    # request with no device_ids) handed the container every athena card,
    # and YOLO_DEVICE=0 then landed on whatever CUDA's fastest-first order
    # called cuda:0 -- the T10, by accident. device_ids exposes exactly one
    # card, which is cuda:0 inside the container, so YOLO_DEVICE stays 0.
    # Value is the HOST's PCI bus id (athena: the P4, 00000000:86:00.0).
    # `runtime: nvidia` is gone on purpose: in CDI mode it refuses a PCI bus
    # id ("unresolvable CDI devices"), checked live 2026-10-15. Same pattern
    # as services/orion-whisper-tts. No default: unset fails the bring-up.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VISION_EDGE_GPU_DEVICE_ID:?VISION_EDGE_GPU_DEVICE_ID must be set in services/orion-vision-edge/.env}"]
              capabilities: [gpu]

    networks:
      - app-net

networks:
  app-net:
    external: true
