# Deterministic path → service mapping for scripts/rebuild_affected_services.py
#
# Direct rules (always applied, not listed here):
#   services/<name>/...     → <name>
#   orion/**/<module>.py    → services whose runtime (non-tests/evals) code
#                             imports that module, or imports a module of the
#                             same orion/<pkg>/ that reaches it, or one package
#                             hop beyond (orion_import_hops). A package
#                             __init__.py counts for every import under it.
#   orion/**/<data file>    → importers of its orion_data_readers entry, else of
#                             any module in its top-level orion/<pkg>/ (verb
#                             YAML, prompt templates are read by their package).
#   orion/**/*.md, Makefile, non-.py files under tests/ or evals/ → never rebuild.
#   orion/__init__.py       → every service importing orion (it runs everywhere).
#   orion/**/tests/, test_*.py, conftest.py → never rebuild.
#   orion/bus/, orion/schemas/ (contract_paths) .py → import graph like any
#                             other module. Non-.py files there have no import
#                             edge to their readers → fallback: all services
#                             whose Dockerfile COPY orion (printed to stderr).
#
# Paths listed here extend or override the generic rules.

# Contract roots: schema/bus .py modules resolve through the import graph
# (only real importers rebuild, not the 60+ COPY-orion fleet — the reason the
# 2026-08-30 narrowing, cbfd353a9, skipped these roots entirely). Only an
# unresolvable non-.py file here falls back to the whole COPY-orion fleet.
contract_paths:
  - orion/bus/
  - orion/schemas/

# Files every bus service reads at runtime (one edit would rebuild the whole
# fleet). Never auto-rebuilt; the producer/consumer services changed in the
# same pull rebuild through their own services/ paths. path → reason.
fleet_wide_paths:
  orion/bus/channels.yaml: "bus channel catalog; cbfd353a9 stopped it broadcasting a 60+ service rebuild"

# Consumers of a changed orion module: every module of its own top-level
# package that (transitively) imports it, then this many hops into other
# orion packages; services importing any of those rebuild.
orion_import_hops: 1

# Modules that count as consumers but are never walked through. The schema
# registry imports every registered schema and is imported by
# orion.core.bus.async_service, so walking through it reaches every bus
# service (~60 per orion edit on the last 10 merges, vs 0-23 with this).
# Services that import the registry directly still rebuild.
orion_import_barriers:
  - orion.schemas.registry

# Non-Python orion/ data read by modules OUTSIDE its own top-level package
# (no import edge exists). path prefix → reader modules; their importers
# rebuild. Data with no entry here maps to its whole top-level orion/<pkg>/.
# Values: orion.* reader modules (their importers rebuild) or service names
# (rebuilt directly, for a service that opens the file itself).
orion_data_readers:
  orion/recall/profiles/:
    - orion.cognition.recall_query
    - orion.cognition.daily_metacog_budget
  orion/core/storage/sql/graphiti_projection.sql:
    - orion-graphiti-adapter
  orion/core/storage/sql/memory_cards.sql:
    - orion.core.storage.memory_cards
    - orion-recall
    - orion-hub
  orion/core/storage/sql/memory_crystallizations.sql:
    - orion.memory.crystallization.repository
    - orion-hub
    - orion-cortex-exec

# Data files here without an orion_data_readers entry are skipped (with a
# printed reason) instead of whole-package fallback: orion.core contains the
# bus core, so "every importer of orion.core" is the whole fleet (67 services).
orion_data_no_fallback:
  - orion/core/

# Root-level or repo-wide paths: never trigger docker rebuild (log skip reason).
skip_prefixes:
  - docs/
  - graphify-out/
  - tests/
  - orion/tests/
  - .github/
  - .cursor/
  - .claude/
  - mesh-utilities/
  - config/

# Hand-applied SQL migrations (fnmatch globs; `*` also matches `/`). These are
# applied with `docker exec ... psql`, never by a container: orion-sql-db runs
# the stock postgres:15 image, has no Dockerfile, and mounts only its data
# volume, so recreating it applies nothing. 2026-10-15: PR #2698 added one
# migration file and the post-merge rebuild recreated orion-athena-sql-db --
# an unclean Postgres shutdown and a fleet-wide "not yet accepting
# connections" burst. Never rebuilt; the post-merge script lists each changed
# migration with its live applied/missing verdict and apply command instead
# (consumers stay refused by safe_docker_build.sh's migration gate until then).
hand_applied_migration_globs:
  - services/orion-sql-db/manual_migration_*.sql

# Files under services/<svc>/ that the service's containers never read
# (fnmatch glob → reason). A bind-mount/COPY hit from a docker-compose.yml or
# Dockerfile still wins over these, so mounting one later makes it rebuild
# again without editing this list. docker-compose.yml and .env stay direct.
service_skip_globs:
  "services/orion-sql-db/*.sql": "orion-sql-db runs stock postgres:15 and mounts only its data volume; .sql files here are not read by the container"

# Single files at repo root with no runtime docker effect.
skip_exact:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - Makefile
  - .gitignore
  - .env_example

# scripts/<path> → services (when the script change implies redeploying those stacks).
# Unlisted scripts/ changes are skipped with a message — rebuild manually if needed.
script_services:
  scripts/safe_docker_build.sh: []
  scripts/sync_local_env_from_example.py: []
  scripts/smoke_llm_gateway_routes.py:
    - orion-llm-gateway
    - orion-hub
  scripts/smoke_harness_finalize_lane.py:
    - orion-harness-governor
    - orion-cortex-exec

# Optional manual overrides keyed by top-level orion subpackage (orion/<pkg>/)
# when import scanning misses a consumer (dynamic import, data file read by
# another package). Prefer keeping this empty. To stop a package from ever
# auto-rebuilding, add orion/<pkg>/ to skip_prefixes instead.
orion_package_extra_services: {}

# Per-host positive allowlists live beside exclude_services.txt:
#   mesh-utilities/common/include_services_<host>.txt
# When present for the detected host (NODE_NAME / ORION_MESH_HOST / hostname),
# only those services may rebuild. exclude_services.txt is ignored on that host.
# Hosts without an include file (e.g. athena) use exclude_services.txt only.
