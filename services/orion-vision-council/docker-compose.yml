services:
  orion-vision-council:
    build:
      context: ../..
      dockerfile: services/orion-vision-council/Dockerfile
    container_name: ${PROJECT}-vision-council
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NODE_NAME=${NODE_NAME:-athena}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - CHANNEL_COUNCIL_INTAKE=${CHANNEL_COUNCIL_INTAKE:-orion:vision:windows}
      - CHANNEL_COUNCIL_PUB=${CHANNEL_COUNCIL_PUB:-orion:vision:events}
      - CHANNEL_COUNCIL_REQUEST=${CHANNEL_COUNCIL_REQUEST:-orion:exec:request:VisionCouncilService}
      - CHANNEL_LLM_REQUEST=${CHANNEL_LLM_REQUEST:-orion:exec:request:LLMGatewayService}
      - CHANNEL_LLM_REPLY_PREFIX=${CHANNEL_LLM_REPLY_PREFIX:-orion:council:reply}
      - COUNCIL_MODEL=${COUNCIL_MODEL:-llama-3-8b-instruct-q4_k_m}
      - COUNCIL_LLM_ROUTE=${COUNCIL_LLM_ROUTE:-metacog}
      - COUNCIL_LLM_MAX_TOKENS=${COUNCIL_LLM_MAX_TOKENS:-1024}
      - COUNCIL_LLM_TIMEOUT_SEC=${COUNCIL_LLM_TIMEOUT_SEC:-90}
      - COUNCIL_STRUCTURED_OUTPUT_METHOD=${COUNCIL_STRUCTURED_OUTPUT_METHOD:-json_object_schema}
      - COUNCIL_TRANSITION_GATE_ENABLED=${COUNCIL_TRANSITION_GATE_ENABLED:-true}
      - COUNCIL_TRANSITION_REFRESH_SEC=${COUNCIL_TRANSITION_REFRESH_SEC:-600}
      - FOVEAL_LLM_ROUTE=${FOVEAL_LLM_ROUTE:-chat}
      - FOVEAL_HOST_TIMEOUT_SEC=${FOVEAL_HOST_TIMEOUT_SEC:-45}
      - FOVEAL_FRAMES_DIR=${FOVEAL_FRAMES_DIR:-/mnt/telemetry/vision/frames}
      - FOVEAL_PERCEPT_STORE_URL=${FOVEAL_PERCEPT_STORE_URL:-}
      - FOVEAL_PERCEPT_STORE_TOKEN=${FOVEAL_PERCEPT_STORE_TOKEN:-}
      - FOVEAL_PERCEPT_UPLOAD_TIMEOUT_SEC=${FOVEAL_PERCEPT_UPLOAD_TIMEOUT_SEC:-10}
    volumes:
      # Read-only: same convention orion-vision-host itself uses for
      # VISION_FRAMES_DIR. The probe only ever reads the newest frame here;
      # it never writes to this node's disk.
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames:ro
    networks:
      - app-net
    ports:
      - "${VISION_COUNCIL_HTTP_PORT:-8025}:8000"

networks:
  app-net:
    external: true
