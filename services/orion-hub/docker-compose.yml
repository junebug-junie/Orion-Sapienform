services:

  hub-app:
    build:
      context: ../..
      dockerfile: services/orion-hub/Dockerfile
      args:
        INSTALL_DEV_DEPS: ${INSTALL_DEV_DEPS:-true}
    container_name: ${PROJECT}-hub

    # Default deployment posture for Hub:
    # network_mode: "host" means this container resolves hosts through the host network stack.
    # In this mode, Docker service DNS names (e.g. "orion-athena-sql-db") are not valid DB hosts.
    # Use a host-reachable Postgres host in *_POSTGRES_URL / DATABASE_URL
    # (127.0.0.1, LAN IP, Tailscale IP, etc.).
    network_mode: "host"

    # use when on athena:
    #ports:
    #  - "${HUB_PORT}:${HUB_PORT}" # if running brain and hub on single node

    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-hub/templates:/app/templates
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-hub/static:/app/static
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:/repo:ro
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}:/mnt/scripts/Orion-Sapienform:ro
      - ${HOME}/.fcc:/root/.fcc:ro
      - ${HOME}/.claude.json:/root/.claude.json:ro
      # Orion's disposable FCC sandbox checkout (see orion/fcc/sandbox_sync.py). A
      # standalone git clone, not a worktree -- no shared .git object store with the
      # primary checkout at /mnt/scripts/Orion-Sapienform. Mounted rw so Orion can
      # commit/push from inside it; the only path back to the real repo is git push
      # to a non-main branch, gated by GitHub branch protection (PR + review required,
      # force-push disabled). Mounted at the same absolute host path for the same
      # reason as the /mnt/scripts/Orion-Sapienform :ro mount above (network_mode:
      # host means no path translation needed).
      - ${HUB_ORION_FCC_SANDBOX_HOST:-/mnt/orion-fcc}:/mnt/orion-fcc
      # Content-addressed store for images Juniper attaches to a chat turn.
      # Bind-mounted at the same absolute path inside and out (network_mode: host,
      # so no path translation) and rw because the Hub writes uploads here. Without
      # this the store lives in the container layer and every upload is lost on
      # restart, which would dangle every AttachmentRefV1 already sitting in a turn.
      - ${HUB_CHAT_ATTACHMENT_DIR:-/mnt/orion-chat-attachments}:${HUB_CHAT_ATTACHMENT_DIR:-/mnt/orion-chat-attachments}
      # Reverie tab (read-only): orion-thought's visual chain writes real
      # generated images here (orion.reverie.visual_storage). Same absolute
      # path in/out (network_mode: host, no path translation needed), :ro
      # since Hub only ever reads these -- it is not the producer.
      - ${REVERIE_VISUAL_STORAGE_DIR:-/mnt/storage-lukewarm/orion/reverie-visual}:${REVERIE_VISUAL_STORAGE_DIR:-/mnt/storage-lukewarm/orion/reverie-visual}:ro
      # Reuse the operator's existing host-level git/gh auth read-only, same pattern
      # as the .claude.json/claude-binary mounts above -- no credentials are stored
      # in this repo. `origin` is an SSH remote (git@github.com:...), so `git push`
      # needs the SSH key + known_hosts; `gh` (PR creation) needs its own token dir.
      # Same identity/keys this worktree's own git/gh operations already use.
      # NOT ${HOME}/.gitconfig -- a read-only bind mount there fully replaces the
      # file, which shadows the safe.directory/identity config baked into the
      # image (Dockerfile) and can't be written to at runtime either (confirmed
      # live: "could not write config file /root/.gitconfig: Device or resource
      # busy"). Git identity/safe.directory live in the image instead.
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.config/gh:/root/.config/gh:ro
      - ${HUB_AGENT_GH_BIN_HOST:-${HOME}/.local/bin/gh}:/usr/local/bin/gh:ro
      - ${HUB_AGENT_CLAUDE_BIN_HOST:-${HOME}/.local/bin/claude}:/usr/local/bin/claude:ro
      - /var/run/docker.sock:/var/run/docker.sock
      #- /mnt/telemetry/models/whisper/${WHISPER_MODEL_SIZE}:/root/.cache/huggingface/hub/models--distil-whisper--${WHISPER_MODEL_SIZE}
      # FIELD_PLASTICITY_SQL_DB_PATH lives on the same disk as Postgres (a sibling
      # directory to postgres_data, never inside it), shared with orion-field-digester's
      # identical mount so both containers see the same sqlite file -- otherwise a Causal
      # Geometry proposal adopted in this container is invisible to orion-field-digester's
      # diffusion tick, which runs in a separate container.
      - ${STORAGE_ROOT:-/mnt/postgres}/field_topology:/mnt/postgres/field_topology
      # Host cabinet sensor snapshot (systemd reader -> /run/orion-sensors/latest.json).
      # Same :ro mount as orion-biometrics; create via scripts/setup_athena_cabinet_sensors.sh.
      - /run/orion-sensors:/run/orion-sensors:ro
      # Host ambient-audio snapshot (systemd reader -> /run/orion-audio/latest.json).
      - /run/orion-audio:/run/orion-audio:ro
    environment:
      # Core service identity
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - HUB_PORT=${HUB_PORT}
      - HUB_API_BASE_OVERRIDE=${HUB_API_BASE_OVERRIDE}
      - HUB_WS_BASE_OVERRIDE=${HUB_WS_BASE_OVERRIDE}
      - ORION_REPO_ROOT=${ORION_REPO_ROOT:-/repo}

      # Whisper + Brain
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE}
      - WHISPER_DEVICE=${WHISPER_DEVICE}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE}

      # Orion Bus
      - ORION_BUS_URL=${ORION_BUS_URL:-${ORION_BUS_URL}}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - BIOMETRICS_ENABLED=${BIOMETRICS_ENABLED}
      - BIOMETRICS_STALE_AFTER_SEC=${BIOMETRICS_STALE_AFTER_SEC}
      - BIOMETRICS_NO_SIGNAL_AFTER_SEC=${BIOMETRICS_NO_SIGNAL_AFTER_SEC}
      - BIOMETRICS_ROLE_WEIGHTS_JSON=${BIOMETRICS_ROLE_WEIGHTS_JSON}
      - BIOMETRICS_PUSH_INTERVAL_SEC=${BIOMETRICS_PUSH_INTERVAL_SEC}
      - CABINET_SENSORS_PATH=${CABINET_SENSORS_PATH:-/run/orion-sensors/latest.json}
      - CABINET_BOOT_PATH=${CABINET_BOOT_PATH:-/run/orion-sensors/boot.json}
      - CABINET_SENSORS_B_PATH=${CABINET_SENSORS_B_PATH:-}
      - CABINET_BOOT_B_PATH=${CABINET_BOOT_B_PATH:-}
      - CABINET_SENSORS_STALE_AFTER_SEC=${CABINET_SENSORS_STALE_AFTER_SEC:-10.0}
      - AMBIENT_AUDIO_PATH=${AMBIENT_AUDIO_PATH:-/run/orion-audio/latest.json}
      - AMBIENT_AUDIO_STALE_AFTER_SEC=${AMBIENT_AUDIO_STALE_AFTER_SEC:-5}
      - CABINET_AMBIENT_HISTORY_NODE=${CABINET_AMBIENT_HISTORY_NODE:-athena}
      - CABINET_AMBIENT_HISTORY_MAX_POINTS=${CABINET_AMBIENT_HISTORY_MAX_POINTS:-800}
      - NOTIFY_IN_APP_ENABLED=${NOTIFY_IN_APP_ENABLED}
      - NOTIFY_IN_APP_CHANNEL=${NOTIFY_IN_APP_CHANNEL}
      - NOTIFY_IN_APP_MAX=${NOTIFY_IN_APP_MAX}
      - NOTIFY_TOAST_SECONDS=${NOTIFY_TOAST_SECONDS}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN}
      - COGNITION_TRACE_CACHE_ENABLED=${COGNITION_TRACE_CACHE_ENABLED:-true}
      - COGNITION_TRACE_CACHE_MAX=${COGNITION_TRACE_CACHE_MAX:-200}
      - COGNITION_TRACE_CACHE_TTL_SEC=${COGNITION_TRACE_CACHE_TTL_SEC:-300}
      - COGNITION_TRACE_SUBSCRIBE_CHANNEL=${COGNITION_TRACE_SUBSCRIBE_CHANNEL:-orion:cognition:trace}
      - COGNITION_TRACE_API_DEBUG=${COGNITION_TRACE_API_DEBUG:-false}
      - TOPIC_FOUNDRY_BASE_URL=${TOPIC_FOUNDRY_BASE_URL}
      - WORLD_PULSE_BASE_URL=${WORLD_PULSE_BASE_URL}
      - WORLD_PULSE_PROXY_TIMEOUT_SEC=${WORLD_PULSE_PROXY_TIMEOUT_SEC:-10}
      - WORLD_PULSE_UI_FIXTURE_RUN_ENABLED=${WORLD_PULSE_UI_FIXTURE_RUN_ENABLED:-false}
      - HUB_PROPOSAL_REVIEW_ENABLED=${HUB_PROPOSAL_REVIEW_ENABLED:-false}
      - HUB_PROPOSAL_REVIEW_API_URL=${HUB_PROPOSAL_REVIEW_API_URL:-http://orion-context-exec:8096}
      - HUB_PROPOSAL_REVIEW_TIMEOUT_SEC=${HUB_PROPOSAL_REVIEW_TIMEOUT_SEC:-10}
      - HUB_LLM_GATEWAY_URL=${HUB_LLM_GATEWAY_URL:-http://orion-llm-gateway:8210}
      - HUB_LLM_GATEWAY_TIMEOUT_SEC=${HUB_LLM_GATEWAY_TIMEOUT_SEC:-5}
      - HUB_AGENT_CONTEXT_EXEC_ENABLED=${HUB_AGENT_CONTEXT_EXEC_ENABLED:-true}
      - HUB_CONTEXT_EXEC_API_URL=${HUB_CONTEXT_EXEC_API_URL:-http://orion-context-exec:8096}
      - HUB_CONTEXT_EXEC_TIMEOUT_SEC=${HUB_CONTEXT_EXEC_TIMEOUT_SEC:-600}
      - HUB_AGENT_REPL_ENABLED=${HUB_AGENT_REPL_ENABLED:-true}
      # Room companion (Claude as a third room participant). NOTE: no
      # credential here on purpose -- orion-room-companion owns it.
      - HUB_ROOM_CLAUDE_ENABLED=${HUB_ROOM_CLAUDE_ENABLED:-false}
      - HUB_ROOM_CLAUDE_ROOM_ID=${HUB_ROOM_CLAUDE_ROOM_ID:-hub-direct}
      - HUB_ROOM_CLAUDE_PARTICIPANT_NAME=${HUB_ROOM_CLAUDE_PARTICIPANT_NAME:-Claude}
      - HUB_ROOM_CLAUDE_TRANSCRIPT_TURNS=${HUB_ROOM_CLAUDE_TRANSCRIPT_TURNS:-12}
      - HUB_ROOM_CLAUDE_AUTO_RESPOND=${HUB_ROOM_CLAUDE_AUTO_RESPOND:-false}
      - HUB_ROOM_CLAUDE_AUTO_MIN_GAP_SEC=${HUB_ROOM_CLAUDE_AUTO_MIN_GAP_SEC:-8}
      - CHANNEL_ROOM_CLAUDE_REQUEST=${CHANNEL_ROOM_CLAUDE_REQUEST:-orion:room:claude:request}
      - CHANNEL_ROOM_CLAUDE_UTTERANCE=${CHANNEL_ROOM_CLAUDE_UTTERANCE:-orion:room:claude:utterance}
      - HUB_AGENT_CLAUDE_ENABLED=${HUB_AGENT_CLAUDE_ENABLED:-false}
      - HUB_FCC_ENV_PATH=/root/.fcc/.env
      - HUB_FCC_SERVER_URL=${HUB_FCC_SERVER_URL:-http://127.0.0.1:8082}
      - HUB_FCC_AUTH_TOKEN=${HUB_FCC_AUTH_TOKEN:-}
      - HUB_AGENT_CLAUDE_BIN=claude
      - HUB_AGENT_CLAUDE_WORKSPACE=${HUB_AGENT_CLAUDE_WORKSPACE:-/mnt/orion-fcc/repo}
      - HUB_AGENT_CLAUDE_TIMEOUT_SEC=${HUB_AGENT_CLAUDE_TIMEOUT_SEC:-900}
      - HUB_AGENT_CLAUDE_MAX_CONCURRENT=${HUB_AGENT_CLAUDE_MAX_CONCURRENT:-1}
      - HUB_AGENT_CLAUDE_MCP_ENABLED=${HUB_AGENT_CLAUDE_MCP_ENABLED:-false}
      - HUB_AITOWN_ENABLED=${HUB_AITOWN_ENABLED:-false}
      - HUB_AITOWN_UI_URL=${HUB_AITOWN_UI_URL:-http://127.0.0.1:5173}
      - HUB_AGENT_CLAUDE_STREAM_READ_LIMIT=${HUB_AGENT_CLAUDE_STREAM_READ_LIMIT:-8388608}
      - HUB_AGENT_CLAUDE_MAX_CONTEXT_TOKENS=${HUB_AGENT_CLAUDE_MAX_CONTEXT_TOKENS:-65536}
      - HUB_AGENT_CLAUDE_FILE_READ_MAX_TOKENS=${HUB_AGENT_CLAUDE_FILE_READ_MAX_TOKENS:-8192}
      - HUB_AGENT_CLAUDE_AUTOCOMPACT_PCT_OVERRIDE=${HUB_AGENT_CLAUDE_AUTOCOMPACT_PCT_OVERRIDE:-70}
      - HUB_AGENT_CLAUDE_CONTEXT_PRESSURE_PCT=${HUB_AGENT_CLAUDE_CONTEXT_PRESSURE_PCT:-70}
      - ORION_FCC_MCP_TOOL_RESULT_MAX_CHARS=${ORION_FCC_MCP_TOOL_RESULT_MAX_CHARS:-12000}
      - HUB_CONTEXT_EXEC_EVENT_CHANNEL=${HUB_CONTEXT_EXEC_EVENT_CHANNEL:-orion:context_exec:event}
      - CONTEXT_EXEC_INVESTIGATION_V2_ENABLED=${CONTEXT_EXEC_INVESTIGATION_V2_ENABLED:-false}
      - SUBSTRATE_TELEMETRY_BASE_URL=${SUBSTRATE_TELEMETRY_BASE_URL:-}
      - SUBSTRATE_TELEMETRY_READ_TOKEN=${SUBSTRATE_TELEMETRY_READ_TOKEN:-}
      - SOCIAL_MEMORY_BASE_URL=${SOCIAL_MEMORY_BASE_URL}
      - SELF_EXPERIMENTS_BASE_URL=${SELF_EXPERIMENTS_BASE_URL}
      - SELF_EXPERIMENTS_TIMEOUT_SEC=${SELF_EXPERIMENTS_TIMEOUT_SEC:-6}
      - JUNIPER_AFFECTIVE_STATE_BASE_URL=${JUNIPER_AFFECTIVE_STATE_BASE_URL:-}
      - JUNIPER_AFFECTIVE_STATE_TIMEOUT_SEC=${JUNIPER_AFFECTIVE_STATE_TIMEOUT_SEC:-240}
      - AFFECT_AMBIENT_ENABLED=${AFFECT_AMBIENT_ENABLED:-true}
      - AFFECT_AMBIENT_INTERVAL_SEC=${AFFECT_AMBIENT_INTERVAL_SEC:-300}
      - AFFECT_AMBIENT_POLL_SEC=${AFFECT_AMBIENT_POLL_SEC:-5}
      # AFFECT_CHAT_TURN_SCOPE is deliberately NOT listed here.
      #
      # It arrives via `env_file: .env` above (confirmed:
      # scripts/check_service_env_compose_parity.py orion-hub reports all
      # 309 .env_example keys reach the container regardless of this list).
      # An entry here would ACTIVELY BREAK the kill switch rather than
      # reinforce it -- review finding, 2026-08-26: compose gives
      # `environment:` precedence over `env_file:`, and
      # ${AFFECT_CHAT_TURN_SCOPE:-voice} interpolates from the compose
      # invocation's env-file context (usually the repo-root .env, which
      # does not define this key), not from services/orion-hub/.env. So an
      # operator setting AFFECT_CHAT_TURN_SCOPE=off in the service .env
      # would have it silently overridden back to "voice" and the container
      # would come up recording. For a camera kill switch that is the wrong
      # direction to fail, so the key is left to env_file alone.
      - VISION_FRAME_CACHE_ENABLED=${VISION_FRAME_CACHE_ENABLED:-true}
      - VISION_FRAME_CACHE_STREAM_IDS=${VISION_FRAME_CACHE_STREAM_IDS:-carbon}
      - VISION_FRAME_CHANNEL=${VISION_FRAME_CHANNEL:-orion:vision:frames}
      - PERCEPT_STORE_BASE_URL=${PERCEPT_STORE_BASE_URL:-}
      - PERCEPT_STORE_TIMEOUT_SEC=${PERCEPT_STORE_TIMEOUT_SEC:-10}
      - PERCEPT_STORE_TOKEN=${PERCEPT_STORE_TOKEN:-}

      # New Titanium Channels
      - CORTEX_GATEWAY_REQUEST_CHANNEL=${CORTEX_GATEWAY_REQUEST_CHANNEL:-orion-cortex-gateway:request}
      - CORTEX_GATEWAY_RESULT_PREFIX=${CORTEX_GATEWAY_RESULT_PREFIX:-orion-cortex-gateway:result}
      - TTS_REQUEST_CHANNEL=${TTS_REQUEST_CHANNEL:-orion:tts:intake}
      - TTS_RESULT_PREFIX=${TTS_RESULT_PREFIX:-orion:tts:result}
      - STT_REQUEST_CHANNEL=${STT_REQUEST_CHANNEL:-orion:stt:intake}
      - STT_RESULT_PREFIX=${STT_RESULT_PREFIX:-orion:stt:result}

      # LLM Gateway (Legacy)
      - CHANNEL_LLM_INTAKE=${CHANNEL_LLM_INTAKE}
      - CHANNEL_LLM_REPLY_PREFIX=${CHANNEL_LLM_REPLY_PREFIX}

      # Channels
      - CHANNEL_VOICE_TRANSCRIPT=${CHANNEL_VOICE_TRANSCRIPT}
      - CHANNEL_VOICE_LLM=${CHANNEL_VOICE_LLM}
      - CHANNEL_VOICE_TTS=${CHANNEL_VOICE_TTS}
      - CHANNEL_TTS_INTAKE=${CHANNEL_TTS_INTAKE}
      - CHANNEL_COLLAPSE_INTAKE=${CHANNEL_COLLAPSE_INTAKE}
      - CHANNEL_COLLAPSE_TRIAGE=${CHANNEL_COLLAPSE_TRIAGE}

      - CHAT_HISTORY_LOG_CHANNEL=${CHAT_HISTORY_LOG_CHANNEL:-${CHANNEL_CHAT_HISTORY_LOG}}
      - CHANNEL_CHAT_HISTORY_LOG=${CHANNEL_CHAT_HISTORY_LOG}

      # --- Agent Council integration (Legacy) ---
      - CHANNEL_COUNCIL_INTAKE=${CHANNEL_COUNCIL_INTAKE}
      - CHANNEL_COUNCIL_REPLY_PREFIX=${CHANNEL_COUNCIL_REPLY_PREFIX}

      # --- Cortex Orchestrator integration (Legacy) ---
      - CORTEX_REQUEST_CHANNEL=${CORTEX_REQUEST_CHANNEL}
      - CORTEX_RESULT_PREFIX=${CORTEX_RESULT_PREFIX}


      # --- Recall / RAG integration (Legacy) ---
      - CHANNEL_RECALL_REQUEST=${CHANNEL_RECALL_REQUEST}
      - CHANNEL_RECALL_DEFAULT_REPLY_PREFIX=${CHANNEL_RECALL_DEFAULT_REPLY_PREFIX}
      - RECALL_DEFAULT_MAX_ITEMS=${RECALL_DEFAULT_MAX_ITEMS}
      - RECALL_DEFAULT_TIME_WINDOW_DAYS=${RECALL_DEFAULT_TIME_WINDOW_DAYS}
      - RECALL_DEFAULT_MODE=${RECALL_DEFAULT_MODE}
      - RECALL_PG_DSN=${RECALL_PG_DSN:-}
      - GRAPHITI_ENABLED=${GRAPHITI_ENABLED:-false}
      - GRAPHITI_URL=${GRAPHITI_URL:-}
      - FALKORDB_URI=${FALKORDB_URI:-}
      - FALKORDB_BUS_GRAPH=${FALKORDB_BUS_GRAPH:-orion_bus_synapse}
      # Attention organ operator tab (read-only). Inline defaults are the real
      # working values, not placeholders: a worktree with no Hub .env falls
      # through to these, not to .env_example (this repo's new_worktree.sh does
      # not provision one) -- the exact gap that silently killed the AST/HOT
      # tick for an hour on 2026-07-29.
      - FALKORDB_SUBSTRATE_GRAPH=${FALKORDB_SUBSTRATE_GRAPH:-orion_substrate}
      # AI Town's own concept graph (docs/superpowers/specs/2026-08-18-
      # aitown-concept-graph-split-and-atlas-readability-design.md) -- same
      # inline-default-matters-at-runtime reasoning as FALKORDB_SUBSTRATE_GRAPH
      # immediately above.
      - FALKORDB_AITOWN_SUBSTRATE_GRAPH=${FALKORDB_AITOWN_SUBSTRATE_GRAPH:-orion_substrate_aitown}
      - HUB_HEARTBEAT_BASE_URL=${HUB_HEARTBEAT_BASE_URL:-http://localhost:7251}
      - HUB_ATTENTION_ORGAN_TIMEOUT_SEC=${HUB_ATTENTION_ORGAN_TIMEOUT_SEC:-3.0}
      - CRYSTALLIZER_VECTOR_COLLECTION=${CRYSTALLIZER_VECTOR_COLLECTION:-orion_memory_crystallizations}
      - CRYSTALLIZER_EMBED_HOST_URL=${CRYSTALLIZER_EMBED_HOST_URL:-}
      - CRYSTALLIZER_EMBED_MODE=${CRYSTALLIZER_EMBED_MODE:-http}
      - CRYSTALLIZER_EMBED_TIMEOUT_MS=${CRYSTALLIZER_EMBED_TIMEOUT_MS:-8000}
      - CRYSTALLIZER_AUTO_PROJECT_ON_APPROVE=${CRYSTALLIZER_AUTO_PROJECT_ON_APPROVE:-true}
      - CHROMA_HOST=${CHROMA_HOST:-}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - GRAPHITI_ADAPTER_URL=${GRAPHITI_ADAPTER_URL:-}

      # --- Runtimes ---
      - TIMEOUT_SEC=${TIMEOUT_SEC}
      - HUB_STT_TIMEOUT_SEC=${HUB_STT_TIMEOUT_SEC:-120}
      - HUB_TTS_TIMEOUT_SEC=${HUB_TTS_TIMEOUT_SEC:-180}
      - NVIDIA_VISIBLE_DEVICES=all

      # --- Hub Prompt Context (UI-side rolling history) ---
      - HUB_CONTEXT_TURNS=${HUB_CONTEXT_TURNS}
      - HUB_CONTEXT_MAX_CHARS=${HUB_CONTEXT_MAX_CHARS}
      - HUB_DEBUG_RECALL=${HUB_DEBUG_RECALL}
      - HUB_DEBUG_COUNCIL=${HUB_DEBUG_COUNCIL}
      - HUB_SOCIAL_SKILLS_ENABLED=${HUB_SOCIAL_SKILLS_ENABLED}
      - HUB_SOCIAL_SKILLS_ALLOWLIST=${HUB_SOCIAL_SKILLS_ALLOWLIST}
      - HUB_SOCIAL_STYLE_ADAPTATION_ENABLED=${HUB_SOCIAL_STYLE_ADAPTATION_ENABLED}
      - HUB_SOCIAL_ROOM_RITUALS_ENABLED=${HUB_SOCIAL_ROOM_RITUALS_ENABLED}
      - HUB_SOCIAL_STYLE_CONFIDENCE_FLOOR=${HUB_SOCIAL_STYLE_CONFIDENCE_FLOOR}
      - HUB_SOCIAL_ROOM_REDACTION_POSTURE=${HUB_SOCIAL_ROOM_REDACTION_POSTURE}
      - ORION_SITUATION_ENABLED=${ORION_SITUATION_ENABLED:-true}
      - ORION_SITUATION_TTL_SECONDS=${ORION_SITUATION_TTL_SECONDS:-300}
      - ORION_SITUATION_TIMEZONE=${ORION_SITUATION_TIMEZONE:-America/Denver}
      - ORION_SITUATION_WEATHER_PROVIDER=${ORION_SITUATION_WEATHER_PROVIDER:-stub}
      - HUB_DEFAULT_NO_WRITE=${HUB_DEFAULT_NO_WRITE}
      - HUB_AUTO_DEFAULT_ENABLED=${HUB_AUTO_DEFAULT_ENABLED}
      - HUB_AUTONOMY_SUBJECT_DISPLAY=${HUB_AUTONOMY_SUBJECT_DISPLAY:-two}
      - AUTONOMY_GOAL_EXECUTION_ENABLED=${AUTONOMY_GOAL_EXECUTION_ENABLED:-false}
      - HUB_DOCKER_NETWORK_MODE=${HUB_DOCKER_NETWORK_MODE:-host}
      # Control-plane Postgres precedence in Hub:
      # SUBSTRATE_CONTROL_PLANE_POSTGRES_URL -> SUBSTRATE_POLICY_POSTGRES_URL -> DATABASE_URL
      - DATABASE_URL=${DATABASE_URL}
