# services/orion-llamacpp-bonsai-host/docker-compose.yml
# Ternary-Bonsai-2-27B bake-off worker on Circe (PrismML llama.cpp fork).
# NOT managed by orion-gpu-lane-controller. Card is gpu1 or gpu2 only, never gpu0
# (chat's card). BONSAI_CUDA_VISIBLE_DEVICES is required: no default can pick a card.
#
#   services/orion-llamacpp-bonsai-host/scripts/build-bonsai-volta.sh
#   scripts/safe_docker_build.sh orion-llamacpp-bonsai-host up -d

services:
  bonsai-worker:
    # `up --build` (post-merge auto-rebuild) must rebuild, or wrapper/profile
    # changes never reach the image. The fork compile layer stays cached.
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-bonsai-host/Dockerfile
      args:
        - HOST_IMAGE=orion-llamacpp-host:0.1.0
    image: ${BONSAI_LLAMACPP_IMAGE:-llamacpp-bonsai-prism:server-local-volta}
    container_name: ${PROJECT:-orion}-bonsai-worker
    # Borrowed card: never come back on its own after a reboot or controller swap.
    restart: "no"
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-orion-llamacpp-bonsai-host}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-true}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${BONSAI_PROFILE_NAME:-ternary-bonsai2-27b-pq2-v100-32gb-circe-np4}
      # Not a config/gpu_pool.yaml role: the pool lists it under `unclaimed`
      # instead of fighting the DeepSeek soak for the `experiment` announcement.
      - LLM_ROLE=bonsai-bakeoff
      - LLM_ANNOUNCE_PORT=${BONSAI_HOST_PORT:-8017}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${BONSAI_CUDA_VISIBLE_DEVICES:?set to 1 or 2 - never 0, which is chat's card}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      - "${BONSAI_HOST_PORT:-8017}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

networks:
  app-net:
    external: true
