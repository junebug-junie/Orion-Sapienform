services:
  hardware-watch:
    build:
      context: ../..
      dockerfile: services/orion-hardware-watch/Dockerfile
    container_name: ${PROJECT}-hardware-watch
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${HARDWARE_WATCH_PORT:-8131}:8131"
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-hardware-watch}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - POSTGRES_URI=${POSTGRES_URI}
      - NOTIFY_BASE_URL=${NOTIFY_BASE_URL:-http://orion-athena-notify:7140}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:-}
      - HARDWARE_WATCH_ENABLED=${HARDWARE_WATCH_ENABLED:-false}
      - HARDWARE_WATCH_SHED_ENABLED=${HARDWARE_WATCH_SHED_ENABLED:-false}
      - HARDWARE_WATCH_URGENT_ENABLED=${HARDWARE_WATCH_URGENT_ENABLED:-false}
      - HARDWARE_WATCH_TEST_HOOK_ENABLED=${HARDWARE_WATCH_TEST_HOOK_ENABLED:-false}
      - HARDWARE_WATCH_TICK_SEC=${HARDWARE_WATCH_TICK_SEC:-30}
      - HARDWARE_WATCH_REFRESH_SEC=${HARDWARE_WATCH_REFRESH_SEC:-60}
      - HARDWARE_WATCH_SHED_VALID_SEC=${HARDWARE_WATCH_SHED_VALID_SEC:-300}
      - HARDWARE_WATCH_OPERATOR_SNOOZE_SEC=${HARDWARE_WATCH_OPERATOR_SNOOZE_SEC:-3600}
      - HARDWARE_WATCH_ALERT_MAX_ATTEMPTS=${HARDWARE_WATCH_ALERT_MAX_ATTEMPTS:-60}
      - HARDWARE_WATCH_AC_ROLE=${HARDWARE_WATCH_AC_ROLE:-cabinet_cooling}
      - HARDWARE_WATCH_AC_LOW_W=${HARDWARE_WATCH_AC_LOW_W:-150}
      - HARDWARE_WATCH_AC_LOW_SEC=${HARDWARE_WATCH_AC_LOW_SEC:-180}
      - HARDWARE_WATCH_AC_STALE_SEC=${HARDWARE_WATCH_AC_STALE_SEC:-300}
      - HARDWARE_WATCH_AC_FROZEN_SEC=${HARDWARE_WATCH_AC_FROZEN_SEC:-3600}
      - HARDWARE_WATCH_AC_RESOLVE_W=${HARDWARE_WATCH_AC_RESOLVE_W:-500}
      - HARDWARE_WATCH_AC_RESOLVE_SEC=${HARDWARE_WATCH_AC_RESOLVE_SEC:-600}
      - HARDWARE_WATCH_CABINET_NODE=${HARDWARE_WATCH_CABINET_NODE:-athena}
      - HARDWARE_WATCH_SHED_RISE_C=${HARDWARE_WATCH_SHED_RISE_C:-1.0}
      - HARDWARE_WATCH_SHED_RISE_WINDOW_SEC=${HARDWARE_WATCH_SHED_RISE_WINDOW_SEC:-900}
      - HARDWARE_WATCH_HEAT_CONTROLLER=${HARDWARE_WATCH_HEAT_CONTROLLER:-v2}
      - HARDWARE_WATCH_READING_GRACE_SEC=${HARDWARE_WATCH_READING_GRACE_SEC:-300}
      - HARDWARE_WATCH_HEAT_LOOKAHEAD_MIN=${HARDWARE_WATCH_HEAT_LOOKAHEAD_MIN:-20}
      - HARDWARE_WATCH_AC_LOW_MEAN_W=${HARDWARE_WATCH_AC_LOW_MEAN_W:-140}
      - HARDWARE_WATCH_AC_LOW_WINDOW_SEC=${HARDWARE_WATCH_AC_LOW_WINDOW_SEC:-900}
      - HARDWARE_WATCH_ALERT_DEDUPE_WINDOW_SEC=${HARDWARE_WATCH_ALERT_DEDUPE_WINDOW_SEC:-21600}
      - HARDWARE_WATCH_HEAT_NODES=${HARDWARE_WATCH_HEAT_NODES:-athena,circe}
      - HARDWARE_WATCH_GPU_NODES=${HARDWARE_WATCH_GPU_NODES:-athena,circe}
      - HARDWARE_WATCH_HEAT_SUSTAIN_SEC=${HARDWARE_WATCH_HEAT_SUSTAIN_SEC:-600}
      - HARDWARE_WATCH_HEAT_BASELINE_DAYS=${HARDWARE_WATCH_HEAT_BASELINE_DAYS:-7}
      - HARDWARE_WATCH_HEAT_BASELINE_REFRESH_SEC=${HARDWARE_WATCH_HEAT_BASELINE_REFRESH_SEC:-3600}
      - HARDWARE_WATCH_CPU_MIN_HISTORY_SEC=${HARDWARE_WATCH_CPU_MIN_HISTORY_SEC:-86400}
      - HARDWARE_WATCH_GPU_MIN_HISTORY_SEC=${HARDWARE_WATCH_GPU_MIN_HISTORY_SEC:-259200}
      - HARDWARE_WATCH_GPU_CEILING_C=${HARDWARE_WATCH_GPU_CEILING_C:-85}
      - HARDWARE_WATCH_GPU_CEILING_SUSTAIN_SEC=${HARDWARE_WATCH_GPU_CEILING_SUSTAIN_SEC:-120}
      - HARDWARE_WATCH_GPU_CEILING_REARM_C=${HARDWARE_WATCH_GPU_CEILING_REARM_C:-80}
      - HARDWARE_WATCH_CPU_CEILING_C=${HARDWARE_WATCH_CPU_CEILING_C:-90}
      - HARDWARE_WATCH_CPU_CEILING_REARM_C=${HARDWARE_WATCH_CPU_CEILING_REARM_C:-85}
      - HARDWARE_WATCH_HEAT_SENSOR_LOST_SEC=${HARDWARE_WATCH_HEAT_SENSOR_LOST_SEC:-900}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8131/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app-net:
    external: true
