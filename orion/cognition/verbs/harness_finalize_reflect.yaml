name: harness_finalize_reflect
label: Harness Finalize Reflect
description: >
  Integrative 5b check for unified turns. Reads draft, felt thought, and
  substrate finalize appraisal to produce FinalizeReflectionV1 — not user speech.

category: ExecutiveControl
priority: high

requires_gpu: true
requires_memory: false
# Raised 300000 -> 480000 with FINALIZE_REFLECT_TIMEOUT_SEC (2026-09-15).
# Cortex-exec uses this as the LLMGateway RPC wait; must not sit under the
# harness outer wait or the governor times out while the model is still mid-gen.
timeout_ms: 480000

services:
  - LLMGatewayService

prompt_template: harness_finalize_reflect.j2

steps:
  - name: llm_harness_finalize_reflect
    order: 0
    services: [LLMGatewayService]
    prompt_template: harness_finalize_reflect.j2
    requires_gpu: true
