services:
  dream:
    build:
      context: ../..
      dockerfile: services/orion-dream/Dockerfile
    container_name: ${PROJECT}-dream
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NODE_NAME=${NODE_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=${PORT}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}

      - CHANNEL_DREAM_TRIGGER=${CHANNEL_DREAM_TRIGGER}

      - POSTGRES_URI=${POSTGRES_URI}
      - ORION_DREAM_CYCLE_ENABLED=${ORION_DREAM_CYCLE_ENABLED:-false}
      - DREAM_CYCLE_CHECK_INTERVAL_SEC=${DREAM_CYCLE_CHECK_INTERVAL_SEC:-600}
      - DREAM_SLEEP_PRESSURE_THRESHOLD=${DREAM_SLEEP_PRESSURE_THRESHOLD:-3.0}
      - DREAM_IDLE_MINUTES=${DREAM_IDLE_MINUTES:-45}
      - DREAM_MIN_INTERVAL_HOURS=${DREAM_MIN_INTERVAL_HOURS:-6}
      - DREAM_LOOKBACK_HOURS=${DREAM_LOOKBACK_HOURS:-48}
      - DREAM_CANDIDATES_PER_SOURCE=${DREAM_CANDIDATES_PER_SOURCE:-50}
      - DREAM_REPLAY_MAX=${DREAM_REPLAY_MAX:-12}
      - DREAM_HYPOTHESES_PER_CYCLE=${DREAM_HYPOTHESES_PER_CYCLE:-3}
      - DREAM_CONTROL_PER_CYCLE=${DREAM_CONTROL_PER_CYCLE:-1}
      - DREAM_HYPOTHESIS_TTL_HOURS=${DREAM_HYPOTHESIS_TTL_HOURS:-72}
      - CHANNEL_LLM_INTAKE=${CHANNEL_LLM_INTAKE:-orion:exec:request:LLMGatewayService}
      - DREAM_LLM_ROUTE=${DREAM_LLM_ROUTE:-metacog_background}
      - DREAM_LLM_TIMEOUT_SEC=${DREAM_LLM_TIMEOUT_SEC:-90}

      - DREAM_LOG_DIR=${DREAM_LOG_DIR}

      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC}
      - ORION_HEALTH_CHANNEL=${ORION_HEALTH_CHANNEL}
      - ERROR_CHANNEL=${ERROR_CHANNEL}
      - SHUTDOWN_GRACE_SEC=${SHUTDOWN_GRACE_SEC}

    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-dream/sql:/app/sql
      - ${ORION_DATA_ROOT:-/mnt/graphdb}/logs/dream/logs:/app/logs
    env_file:
      - .env

networks:
  app-net:
    external: true
