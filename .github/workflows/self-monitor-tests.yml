name: Self-monitor organ

# Rung 6 (docs/superpowers/specs/2026-10-20-self-monitor-organ-design.md): the pure bet adapters and
# faculty reducer. No DB: the live report (python -P -m orion.self_monitor.report) is read-only and
# run by hand; these tests use rows shaped like the live tables.

on:
  pull_request:
    paths:
      - "orion/self_monitor/**"
      - "orion/schemas/self_monitor.py"
      - "orion/prediction/**"
      - "orion/temporal_self/**"
      - "services/orion-thought/app/self_track_record_cue.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-thought/app/reverie.py"
      - "services/orion-thought/tests/test_self_track_record_cue.py"
      - "services/orion-thought/tests/conftest.py"
      - "services/orion-thought/evals/*self_track_record*"
      - "orion/cognition/prompts/stance_react.j2"
      - "orion/cognition/prompts/reverie_narrate.j2"
      - "services/orion-actions/app/main.py"
      - "services/orion-actions/app/act_emit.py"
      - "services/orion-actions/tests/test_self_monitor_journal_gate.py"
      - "services/orion-hub/scripts/self_monitor_questions.py"
      - "services/orion-hub/tests/test_self_monitor_questions.py"
      - ".github/workflows/self-monitor-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/self_monitor/**"
      - "orion/temporal_self/**"
      - "orion/schemas/self_monitor.py"
      - "orion/prediction/**"
      - "services/orion-thought/app/self_track_record_cue.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-thought/app/reverie.py"
      - "services/orion-thought/tests/test_self_track_record_cue.py"
      - "services/orion-thought/tests/conftest.py"
      - "services/orion-thought/evals/*self_track_record*"
      - "orion/cognition/prompts/stance_react.j2"
      - "orion/cognition/prompts/reverie_narrate.j2"
      - "services/orion-actions/app/main.py"
      - "services/orion-actions/app/act_emit.py"
      - "services/orion-actions/tests/test_self_monitor_journal_gate.py"
      - "services/orion-hub/scripts/self_monitor_questions.py"
      - "services/orion-hub/tests/test_self_monitor_questions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pydantic==2.10.3 numpy sqlalchemy pyyaml
      - name: Gate tests (pure adapters and reducer, no I/O)
        run: python -m pytest -q -p no:cacheprovider orion/self_monitor/tests

  # Spec step 3: the track-record cue in orion-thought (stance_react + reverie), fail-open.
  cue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r services/orion-thought/requirements.txt
          python -m pip install pytest pytest-asyncio jinja2
      - name: Cue fetch, render and prompt wiring
        run: cd services/orion-thought && python -m pytest -q -p no:cacheprovider tests/test_self_track_record_cue.py
      - name: Truth eval (every number shown resolves to its record)
        run: cd services/orion-thought && python -m pytest -q -p no:cacheprovider evals/test_self_track_record_truth_eval.py

  effects:
    # E1 at orion-actions' journal seam, E2 in Hub (the dispatch-runtime half retired with dispatch, 2026-11-07).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-actions/requirements.txt pytest pytest-asyncio sqlalchemy
      - name: E1 journal gate (orion-actions lifespan, bus faked)
        working-directory: services/orion-actions
        run: python -m pytest -q -p no:cacheprovider tests/test_self_monitor_journal_gate.py tests/test_act_emit.py
      - name: E2 self-question minter (pure + fakes)
        working-directory: services/orion-hub
        env:
          PYTHONPATH: ${{ github.workspace }}/services/orion-hub:${{ github.workspace }}
        run: |
          pip install pydantic-settings pyyaml
          python -m pytest -q -p no:cacheprovider --noconftest tests/test_self_monitor_questions.py
