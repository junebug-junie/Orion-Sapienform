name: orion-reading tests

on:
  pull_request:
    paths:
      - "orion/world_pulse_read/**"
      - "orion/schemas/**"
      - "orion/bus/channels.yaml"
      - "orion/fcc/**"
      - "orion/introspect/**"
      - "orion/physiology/heat_archaeology.py"
      - "orion/physiology/tests/heat_fixture.py"
      - "orion/core/bus/**"
      - "orion/harness/**"
      - "orion/hub/**"
      - "orion/grammar/acts.py"
      - "orion/curiosity/**"
      - "orion/personality/**"
      - "orion/cognition/prompts/stance_react.j2"
      - "orion/thought/**"
      - "orion/substrate/adapters/world_pulse_read.py"
      - "orion/substrate/assertion_projector.py"
      - "orion/substrate/graph_journal.py"
      - "orion/substrate/eligibility.py"
      - "services/orion-hub/**"
      - "services/orion-durable-runs/**"
      - "services/orion-dream/**"
      - "services/orion-harness-governor/**"
      - "services/orion-sql-db/manual_migration*reading*"
      - "services/orion-sql-db/manual_migration_world_pulse_read*"
      - "services/orion-sql-db/manual_migration_curiosity_focus_request_*"
      - "tests/test_world_pulse_read*"
      - ".github/workflows/orion-reading-tests.yml"
  push:
    branches: [main]

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal reading test dependencies and local PostgreSQL
        run: |
          python -m pip install -r services/orion-hub/tests/requirements-reading.txt
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Reading contracts, caller bindings, workers and real SQL durability
        env:
          RUN_READING_POSTGRES: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            services/orion-hub/tests/test_reading_ingress.py \
            services/orion-hub/tests/test_reading_turn_listener.py \
            services/orion-hub/tests/test_reading_postgres.py \
            services/orion-hub/tests/test_world_pulse_read_*.py \
            services/orion-hub/tests/test_curiosity_investigation.py \
            services/orion-hub/tests/test_energy_stakes_gate.py \
            services/orion-hub/tests/test_energy_routes.py \
            services/orion-hub/tests/test_energy_strip_panel.py \
            services/orion-hub/tests/test_curiosity_self_inquiry.py \
            services/orion-hub/tests/test_curiosity_introspect.py \
            services/orion-hub/tests/test_curiosity_introspect_listener.py \
            services/orion-hub/tests/test_curiosity_routes_runs.py \
            services/orion-hub/tests/test_curiosity_focus.py \
            services/orion-hub/evals/test_curiosity_focus_eval.py \
            services/orion-hub/tests/test_power_attribution_introspect_listener.py \
            services/orion-hub/evals/test_power_attribution_eval.py \
            orion/curiosity/tests/test_focus_lifecycle.py \
            orion/harness/tests/test_claim_gate.py \
            services/orion-hub/tests/test_reading_finding_outreach.py \
            services/orion-hub/tests/test_endogenous_outreach.py \
            services/orion-hub/tests/test_strain_report_outreach.py \
            services/orion-hub/evals/test_strain_report_replay_eval.py \
            services/orion-hub/tests/test_outreach_personality_cue.py \
            services/orion-hub/tests/test_curiosity_personality_cue.py \
            services/orion-hub/tests/test_personality_cue_reader.py \
            services/orion-hub/tests/test_personality_routes.py \
            services/orion-hub/tests/test_turn_orchestrator_ws_frames.py \
            services/orion-hub/tests/test_act_ledger_producers.py \
            orion/world_pulse_read/tests \
            orion/thought/tests \
            orion/fcc/tests/test_reading_mcp.py \
            orion/fcc/tests/test_mcp_config.py \
            orion/fcc/tests/test_repeat_failure_breaker.py \
            orion/harness/tests/test_fcc_motor_repeat_failure_breaker.py \
            orion/introspect/tests \
            orion/harness/tests/test_fcc_motor_mcp.py \
            orion/harness/tests/test_reading_receipts.py \
            tests/test_world_pulse_read_*.py \
            tests/test_unified_turn_schemas.py \
            tests/test_unified_turn_bus_catalog.py
      - name: orion-dream introspect responder
        run: |
          python -m pytest -q \
            services/orion-dream/tests/test_introspect_dreams.py \
            services/orion-dream/tests/test_dream_search.py \
            services/orion-dream/tests/test_introspect_listener.py
      - name: Offline source handoff behavior eval
        run: python -m pytest services/orion-hub/evals/test_reading_handoff_eval.py services/orion-hub/evals/test_reading_receipt_truth_eval.py services/orion-hub/evals/test_reading_assertion_eval.py services/orion-hub/evals/test_reading_dead_url_eval.py services/orion-hub/evals/test_reading_finding_eval.py services/orion-hub/evals/test_reading_resonance_eval.py services/orion-hub/evals/test_reading_huge_page_eval.py services/orion-hub/evals/test_reading_stance_prompt_eval.py -q
      - name: Checkpointed reading admission
        run: |
          python -m pip install langgraph==1.2.11
          python -m pytest services/orion-durable-runs/tests/test_reading_graph.py -q
