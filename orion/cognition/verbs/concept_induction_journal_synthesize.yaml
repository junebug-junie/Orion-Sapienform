name: concept_induction_journal_synthesize
label: Concept Induction Journal Synthesize
description: >
  Deterministic, payload-grounded journal synthesis for concept_induction_pass.
  Uses only reviewed concept-induction artifacts passed in metadata.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 90000

services:
  - LLMGatewayService

prompt_template: concept_induction_journal_synthesize.j2

steps:
  - name: concept_induction_journal_synthesize
    order: 0
    services: [LLMGatewayService]
    prompt_template: concept_induction_journal_synthesize.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 2
  family: concept_induction
  lanes: [agent]
  deferrable_window_s: 86400
