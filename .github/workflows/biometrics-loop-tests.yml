name: Biometrics substrate loop
# The biometrics node/pressure reducers, the pressure organ and the node catalog had no CI:
# four tests in this set sat red on main for weeks (they asserted circe was expected offline
# after the catalog flipped it). Also pins the retired-host prune (atlas, 2026-10-16):
# tests/test_retired_biometrics_node.py. Offline-node pressure clearing and standby
# (silent-node) exclusion from the biometrics prediction error, 2026-10-20.
on:
  pull_request:
    paths:
      - 'orion/biometrics/**'
      - 'orion/substrate/biometrics_loop/**'
      - 'orion/substrate/prediction_error.py'
      - 'orion/substrate/cabinet_ambient_spike_consumer.py'
      - 'services/orion-substrate-runtime/app/worker.py'
      - 'config/biometrics/node_catalog.yaml'
      - 'tests/test_retired_biometrics_node.py'
      - 'tests/test_biometrics_pipeline.py'
      - 'tests/test_biometrics_pressure_organ.py'
      - 'tests/test_capability_absence_signal.py'
      - 'tests/test_node_biometrics_reducer.py'
      - 'tests/test_node_pressure_reducer.py'
      - 'tests/test_biometrics_grammar_extract.py'
      - 'tests/test_fleet_roster_coverage.py'
      - 'tests/test_offline_node_stuck_pressure.py'
      - 'tests/test_biometrics_silent_node_exclusion.py'
      - 'orion/schemas/prediction_error_definitions.py'
      - 'orion/telemetry/biometrics_pipeline.py'
      - 'tests/test_act_energy_measurements.py'
      - 'services/orion-biometrics/app/metrics.py'
      - 'services/orion-biometrics/app/settings.py'
      - 'services/orion-biometrics/tests/test_container_cpu.py'
      - '.github/workflows/biometrics-loop-tests.yml'
  push:
    branches: [main]
    paths:
      - 'orion/biometrics/**'
      - 'orion/substrate/biometrics_loop/**'
      - 'orion/substrate/prediction_error.py'
      - 'orion/substrate/cabinet_ambient_spike_consumer.py'
      - 'services/orion-substrate-runtime/app/worker.py'
      - 'config/biometrics/node_catalog.yaml'
      - 'tests/test_retired_biometrics_node.py'
      - 'tests/test_biometrics_pipeline.py'
      - 'tests/test_biometrics_pressure_organ.py'
      - 'tests/test_capability_absence_signal.py'
      - 'tests/test_node_biometrics_reducer.py'
      - 'tests/test_node_pressure_reducer.py'
      - 'tests/test_biometrics_grammar_extract.py'
      - 'tests/test_fleet_roster_coverage.py'
      - 'tests/test_offline_node_stuck_pressure.py'
      - 'tests/test_biometrics_silent_node_exclusion.py'
      - 'orion/schemas/prediction_error_definitions.py'
      - 'orion/telemetry/biometrics_pipeline.py'
      - 'tests/test_act_energy_measurements.py'
      - 'services/orion-biometrics/app/metrics.py'
      - 'services/orion-biometrics/app/settings.py'
      - 'services/orion-biometrics/tests/test_container_cpu.py'
      - '.github/workflows/biometrics-loop-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  biometrics-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pydantic PyYAML requests
      - name: Reducers, organ, catalog, retired-host prune
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_retired_biometrics_node.py \
            tests/test_biometrics_pipeline.py \
            tests/test_biometrics_pressure_organ.py \
            tests/test_capability_absence_signal.py \
            tests/test_node_biometrics_reducer.py \
            tests/test_node_pressure_reducer.py \
            tests/test_biometrics_grammar_extract.py \
            tests/test_fleet_roster_coverage.py \
            tests/test_offline_node_stuck_pressure.py \
            tests/test_biometrics_silent_node_exclusion.py
      # Act energy cost (2026-10-29): per-card watts/VRAM, per-container CPU watt split, and the
      # collector's cgroup read.
      - name: Per-card and per-container energy measurements
        run: python -m pytest -q -p no:cacheprovider tests/test_act_energy_measurements.py
      - name: Collector per-container CPU
        working-directory: services/orion-biometrics
        env:
          PYTHONPATH: .:../..
        run: |
          pip install -r requirements.txt
          python -m pytest -q -p no:cacheprovider tests/test_container_cpu.py
