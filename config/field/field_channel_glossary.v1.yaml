  # The two cameras are node-qualified `channel: scene_change` entries since
  # 2026-11-24 (PE retire Patch 3,
  # docs/superpowers/specs/2026-11-24-pe-retire-perception-and-alarms-design.md
  # rev 4): their value is camera scene change, not a prediction error, in node
  # metadata `signal_value` (nats, unclamped) and substrate_node_signal_history
  # (kind scene_change, scale v2 / v2_partial; old clipped-z rows are scale v1
  # and never read with them). Producer: orion/substrate/scene_change.py
  # (two-stage rank of the raw 1 - cos(frame, stream EWMA) from
  # orion/substrate/prediction_error.py perception_prediction_error), written by
  # services/orion-substrate-runtime/app/worker.py _publish_perception_group
  # every 30 s. Calm by theory: p2 uniform, so the value is exactly 0 with
  # probability 1 - 1/e = 0.632 and above 2.0 with probability e^-3 = 0.050; cap
  # ln(289) - 1 = 4.67. Replay at the real ~311 s sampler (29 h of frames, stage
  # 2 over 12 h): room 0.654 exact 0, crossing 2.0 on 4.6%; walkway 0.662 /
  # 3.1%. Not in FieldStateV1 node_vectors (the cameras left the field).
  - node: "node:substrate.perception"
    producer: orion-substrate-runtime
    channel: scene_change
    level: [node]
    category: self_monitoring
    meaning: "Room camera scene change: how unusual the change in this camera's picture over the last 5 minutes is, relative to the last two hours of the same camera, ranked against its own last 24 hours. Value = max(0, -ln p - 1) nats, p the rank of the smallest per-frame rank in the last 5 minutes among this camera's own 5-minute minima of the last 24 hours. 0 = an ordinary 5 minutes; above 2.0 = rarer than 1 in 20; at most 4.67. A change that lasts (lights on, dusk) reads high while new and is absorbed within about 2 hours: it measures change, not state. Nothing here forecasts anything: it is a change score, not a forecast miss. Until 2026-11-24 this node was a clipped z-score under prediction_error (clip(z, 0, 3) / 3 with a variance floor); those rows are scale v1 and a belief built on them needs a re-test."
    trend_source: "substrate_node_signal_history WHERE node_id = 'node:substrate.perception' AND scale IN ('v2','v2_partial') (kind scene_change; calm checks use scale = 'v2' only; old clipped-z rows: substrate_node_pe_history_snapshot_20261124)"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
    semantics:
      value_kind: scene_change_excess
      rest: "0.0 = this camera's last 5 minutes changed no more than an ordinary 5 minutes of its own last 24 hours. Reachable by theory: exactly 0 on 63% (1 - 1/e) of calm intervals. A 0.0 placeholder written while the input is missing (embeddings stale, scorer warming, or no scored frame) carries prediction_error_missing_reason on the node and is NOT a reading: it is never recorded in the history."
      # rest_range by theory (p2 uniform: exact 0 with probability 0.632); replay 2026-11-22..24 at the ~311 s sampler: 0.654 exact 0, p90 1.36, p99 2.55, max 3.79 (design rev 4)
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "per-tick writer: the graph node gets a 0.0 placeholder every 30 s tick while the input is missing, marked prediction_error_missing_reason; substrate_node_signal_history gets no row then (a gap = missing, not calm). After a restart the node is warming until stage 1 holds 200 frames over 30 min (stage 2 is restored from substrate_perception_embedding_baseline); on first deploy also until stage 2 holds 48 five-minute values (4 h)."

  # 2026-10-15: the walkway (outdoor) camera's own node, fed only by the
  # streams in SUBSTRATE_PERCEPTION_WALKWAY_STREAM_IDS (default: walkway); same
  # scorer and tick as node:substrate.perception above.
  # Read by endogenous curiosity since 2026-10-15. Since 2026-10-21 a world
  # source in the world-first attention contests, eligible only at its own
  # p99+ band (orion/schemas/attention_candidate.py ATTENTION_MIN_BAND_BY_NODE_ID);
  # still fenced from the broadcast's salience signals.
  # 0 graph edges ON PURPOSE (2026-11-03, docs/superpowers/specs/2026-11-03-person-graph-sighting-refresh-design.md):
  # whole-frame change does not know who was in the frame (a car or a light change
  # raises it as much as a person). An outgoing edge would push its pressure and
  # activation into every named cluster / walkway day node on each changing frame.
  # "Who was seen" reaches the graph through vision_individual.last_seen_at on the
  # cluster nodes instead (app/person_graph_loop.py _refresh_sightings). Do not "fix" the 0.
  - node: "node:substrate.perception_walkway"
    producer: orion-substrate-runtime
    channel: scene_change
    level: [node]
    category: self_monitoring
    meaning: "Walkway (outdoor) camera scene change: how unusual the change in this camera's picture over the last 5 minutes is, relative to the last two hours of the same camera, ranked against its own last 24 hours. Value = max(0, -ln p - 1) nats, p the rank of the smallest per-frame rank in the last 5 minutes among this camera's own 5-minute minima of the last 24 hours. 0 = an ordinary 5 minutes; above 2.0 = rarer than 1 in 20; at most 4.67. A change that lasts (dusk, a parked car) reads high while new and is absorbed within about 2 hours: it measures change, not state. Kept apart from node:substrate.perception so the street does not overwrite the room cameras. Nothing here forecasts anything: it is a change score, not a forecast miss. Until 2026-11-24 this node was a clipped z-score under prediction_error (clip(z, 0, 3) / 3 with a variance floor); those rows are scale v1 and a belief built on them needs a re-test."
    trend_source: "substrate_node_signal_history WHERE node_id = 'node:substrate.perception_walkway' AND scale IN ('v2','v2_partial') (kind scene_change; calm checks use scale = 'v2' only; old clipped-z rows: substrate_node_pe_history_snapshot_20261124)"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: scene_change_excess
      rest: "0.0 = the walkway's last 5 minutes changed no more than an ordinary 5 minutes of its own last 24 hours. Reachable by theory: exactly 0 on 63% (1 - 1/e) of calm intervals. A 0.0 placeholder written while the input is missing (embeddings stale, scorer warming, or no scored frame) carries prediction_error_missing_reason on the node and is NOT a reading: it is never recorded in the history."
      # rest_range by theory (p2 uniform: exact 0 with probability 0.632); replay 2026-11-22..24 at the ~311 s sampler: 0.662 exact 0, p90 1.23, p99 3.24, max 3.93 (design rev 4)
      rest_range: [0.0, 0.0]
      sparsity: designed_sparse
      absent_means: "per-tick writer: the graph node gets a 0.0 placeholder every 30 s tick while the input is missing, marked prediction_error_missing_reason (embedding_staleness 1.0 when stale); substrate_node_signal_history gets no row then (a gap = missing, not calm). After a restart the node is warming until stage 1 holds 200 frames over 30 min; on first deploy also until stage 2 holds 48 five-minute values (4 h)."

  # node:substrate.execution was RETIRED 2026-11-24 (PE suite rebuild retire step 6,
  # #3576), the last fake prediction-error node: an EWMA z of the mean change in four
  # cortex-exec pressure hints, negatives clipped, /3; not a forecast. Exact zeros from
  # the clipping: 59% of 2,286 history rows 2026-11-17..24 (90% of field-state ticks 2026-10-13). Successors: the "more steps than usual" turn self-bet
  # inside node:prediction.chat_turn (below) and node:prediction.body_joint. The id is
  # on RETIRED_PREDICTION_ERROR_NODE_IDS and the field digester's RETIRED_PSEUDO_NODES.

  # node:substrate.chat was RETIRED 2026-11-13 (PE suite rebuild retire step 6):
  # an EWMA z of the change in two chat pressure hints, negatives clipped; not a
  # forecast. Successor below. The id is on RETIRED_PREDICTION_ERROR_NODE_IDS and
  # the field digester's RETIRED_PSEUDO_NODES.
  #
  # Chat-turn surprise (2026-11-13). orion-prediction settles stance's private bets
  # on each chat turn (services/orion-prediction/app/turn_self_bets.py) and scores
  # the two kinds that beat the chat base rate held out (asks a question, more steps
  # than usual; app/turn_surprise.py): each stated p goes through a logistic map fit
  # on earlier settled chat bets only, excess = -ln q(outcome) minus its expected
  # value, z = summed excess / sqrt(summed calm variance). Published as
  # prediction.turn_surprise.v1; services/orion-substrate-runtime/app/worker.py
  # _process_prediction_turn_surprise folds the last 30 min of turns with
  # orion/substrate/prediction_turn_surprise.py and stores clip(z / 3, 0, 1).
  # FalkorDB node only; the field digester's decay never touches it.
  - node: "node:prediction.chat_turn"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: social_conversational
    meaning: "How much Orion's recent chat turns surprised Orion's own bets about them (will the reply ask a question; will it take more steps than usual), over the last 30 minutes: summed excess surprise in nats over what the recalibrated bets expected, divided by its calm spread (a z-score), 3 sigma = 1.0. 0 = the turns went the way the bets leaned."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:prediction.chat_turn'"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: surprise_excess
      rest: "0.0 = the turns went no more surprisingly than calibrated bets expect (z <= 0). Reachable by theory (a turn that goes the likely way reads z < 0) and live: 85% of 294 settled chat turns rest at exactly 0.0, 79% of node writes (replay 2026-10-24..11-13, backlog turns skipped as live, services/orion-prediction/evals/run_turn_surprise_replay_eval.py)."
      # rest_range: calm z within +1.65 sigma -> stored value in [0, 0.55]. Live replay
      # 2026-11-13 (294 turns): per-turn z mean -0.08 sd 0.95; node p50 0.0 p90 0.53,
      # 0.55 crossed on 9.9 % of writes (a window of 2 turns crosses more often than one).
      rest_range: [0.0, 0.55]
      sparsity: event_gated
      absent_means: "written once per settled chat turn whose used bets carry information. No chat turn (or PREDICTION_TURN_SURPRISE_EVENTS_ENABLED / SUBSTRATE_PREDICTION_TURN_SURPRISE_NODE_ENABLED off, or orion-prediction down) writes nothing: the node keeps its last value, current for up to 1800 s, then every reader treats it as stale, never as calm. Live replay: fresh 27% of the time."
      prompt_sites:
        - "orion.attention.self_readings:render_self_readings"

  # node:substrate.codebase RETIRED 2026-11-13 (PE suite rebuild,
