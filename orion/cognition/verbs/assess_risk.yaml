name: assess_risk
label: Risk Assessment
description: >
  Evaluate the risks, tradeoffs, and potential failure modes of a situation.

category: ExecutiveControl
priority: high

interruptible: false
can_interrupt_others: true

requires_gpu: true
requires_memory: false

timeout_ms: 60000
max_recursion_depth: 1

services:
  - LLMGatewayService

prompt_template: assess_risk_prompt.j2

plan:
  - name: compose_risk_prompt
    description: Build analytic risk assessment prompt.
    order: 0
    prompt_template: assess_risk_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: llm_assess_risks
    description: Generate risk analysis.
    order: 1
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
