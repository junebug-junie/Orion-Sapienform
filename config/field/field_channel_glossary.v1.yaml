  # a clipped z of git/PR/graph churn per codebase delta event, not a
  # forecast. It won 2.8% of attention frames and seeded 128 curiosity
  # candidates in the 7 days before removal. No node write, no field receipt,
  # no new history rows; a lingering node or row is fenced by
  # RETIRED_PREDICTION_ERROR_NODE_IDS. The churn score stays in
  # substrate_codebase_delta_log for the Hub co-creation tab and self-study.

  # node:substrate.route's entry removed 2026-11: route_prediction_error() and
  # the node were retired (PE suite rebuild step 5); the route reducer and
  # projection stay.

  # node:substrate.biometrics RETIRED 2026-11-18 (PE suite rebuild retire step 6,
  # #3575): min(1, mean |change of the machines' pressure hints| / 0.30), not a
  # forecast -- never 0, never near 1, power pinned at 1.0 on both hosts. It was
  # the top attention target in 1,488 of 119,160 frames (11-15..11-18) and 5.9 %
  # of goals. No node write, no receipt; a lingering node or history row is fenced
