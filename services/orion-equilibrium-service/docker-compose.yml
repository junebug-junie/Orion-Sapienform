services:
  equilibrium-service:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-equilibrium-service/Dockerfile
    container_name: ${PROJECT}-equilibrium
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - SERVICE_NAME=${SERVICE_NAME}
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NODE_NAME=${NODE_NAME}
      - INSTANCE_ID=${INSTANCE_ID}

      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_HEALTH_CHANNEL=${ORION_HEALTH_CHANNEL}

      - EQUILIBRIUM_EXPECTED_SERVICES=${EQUILIBRIUM_EXPECTED_SERVICES}
      - EQUILIBRIUM_EXPECTED_SERVICES_PATH=${EQUILIBRIUM_EXPECTED_SERVICES_PATH}
      - EQUILIBRIUM_GRACE_MULTIPLIER=${EQUILIBRIUM_GRACE_MULTIPLIER}
      - EQUILIBRIUM_PUBLISH_INTERVAL_SEC=${EQUILIBRIUM_PUBLISH_INTERVAL_SEC}
      - EQUILIBRIUM_WINDOWS_SEC=${EQUILIBRIUM_WINDOWS_SEC}
      - EQUILIBRIUM_COLLAPSE_MIRROR_INTERVAL_SEC=${EQUILIBRIUM_COLLAPSE_MIRROR_INTERVAL_SEC}
      - EQUILIBRIUM_STATE_KEY=${EQUILIBRIUM_STATE_KEY}
      - EQUILIBRIUM_STATE_RETENTION_SEC=${EQUILIBRIUM_STATE_RETENTION_SEC:-3600}
      - CHANNEL_EQUILIBRIUM_SNAPSHOT=${CHANNEL_EQUILIBRIUM_SNAPSHOT}
      - CHANNEL_EQUILIBRIUM_TRANSITION=${CHANNEL_EQUILIBRIUM_TRANSITION:-orion:equilibrium:transition}
      - EQUILIBRIUM_TRANSITION_PUBLISH_ENABLE=${EQUILIBRIUM_TRANSITION_PUBLISH_ENABLE:-true}
      - CHANNEL_SPARK_SIGNAL=${CHANNEL_SPARK_SIGNAL}
      - CHANNEL_METACOGNITION_TICK=${CHANNEL_METACOGNITION_TICK}
      - METACOGNITION_TICK_KIND=${METACOGNITION_TICK_KIND:-metacognition.tick.v1}
      - CHANNEL_EQUILIBRIUM_METACOG_TRIGGER=${CHANNEL_EQUILIBRIUM_METACOG_TRIGGER}
      - CHANNEL_COGNITION_TRACE_PUB=${CHANNEL_COGNITION_TRACE_PUB}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC}

      - EQUILIBRIUM_METACOG_ENABLE=${EQUILIBRIUM_METACOG_ENABLE}
      - EQUILIBRIUM_METACOG_PUBLISH_VERB_REQUEST=${EQUILIBRIUM_METACOG_PUBLISH_VERB_REQUEST}
      - EQUILIBRIUM_METACOG_COOLDOWN_SEC=${EQUILIBRIUM_METACOG_COOLDOWN_SEC}
      - CHANNEL_COLLAPSE_MIRROR_USER_EVENT=${CHANNEL_COLLAPSE_MIRROR_USER_EVENT:-orion:collapse:intake}
      - EQUILIBRIUM_METACOG_RECALL_ENABLED=${EQUILIBRIUM_METACOG_RECALL_ENABLED:-false}
      - CHANNEL_REPAIR_PRESSURE_APPRAISAL=${CHANNEL_REPAIR_PRESSURE_APPRAISAL:-orion:repair_pressure:appraisal}
      - EQUILIBRIUM_METACOG_RELATIONAL_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_RELATIONAL_TRIGGER_ENABLE:-true}
      - EQUILIBRIUM_METACOG_RELATIONAL_CONFIDENCE_THRESHOLD=${EQUILIBRIUM_METACOG_RELATIONAL_CONFIDENCE_THRESHOLD:-0.7}
      - EQUILIBRIUM_METACOG_RELATIONAL_LEVEL_THRESHOLD=${EQUILIBRIUM_METACOG_RELATIONAL_LEVEL_THRESHOLD:-0.5}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_TRIGGER_ENABLE:-false}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_CONFIDENCE_FLOOR=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_CONFIDENCE_FLOOR:-0.3}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_MIN_SAMPLES=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_MIN_SAMPLES:-20}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_ELEVATED_ZSCORE=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_ELEVATED_ZSCORE:-1.0}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_SUSTAINED_HITS=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_SUSTAINED_HITS:-3}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_STATE_KEY=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_STATE_KEY:-equilibrium:metacog_trend_state:repair_pressure}
      - EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_COOLDOWN_SEC=${EQUILIBRIUM_METACOG_REPAIR_PRESSURE_TREND_COOLDOWN_SEC:-1800.0}
      - CHANNEL_FIELD_CHANNEL_ANOMALY_SCORE=${CHANNEL_FIELD_CHANNEL_ANOMALY_SCORE:-orion:field_channel:anomaly_score}
      - EQUILIBRIUM_METACOG_TELEMETRY_ANOMALY_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_TELEMETRY_ANOMALY_TRIGGER_ENABLE:-true}
      - EQUILIBRIUM_METACOG_TELEMETRY_ANOMALY_THRESHOLD_MULTIPLIER=${EQUILIBRIUM_METACOG_TELEMETRY_ANOMALY_THRESHOLD_MULTIPLIER:-3.0}
      - CHANNEL_THOUGHT_ARTIFACT=${CHANNEL_THOUGHT_ARTIFACT:-orion:thought:artifact}
      - CHANNEL_HARNESS_RUN_ARTIFACT=${CHANNEL_HARNESS_RUN_ARTIFACT:-orion:harness:run:artifact}
      - CHANNEL_GRAMMAR_EVENT=${CHANNEL_GRAMMAR_EVENT:-orion:grammar:event}
      - EQUILIBRIUM_METACOG_CHAT_TURN_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_CHAT_TURN_TRIGGER_ENABLE:-true}
      - EQUILIBRIUM_METACOG_CHAT_TURN_CORRELATOR_TTL_SEC=${EQUILIBRIUM_METACOG_CHAT_TURN_CORRELATOR_TTL_SEC:-600}
      - EQUILIBRIUM_METACOG_CHAT_TURN_SURPRISE_THRESHOLD=${EQUILIBRIUM_METACOG_CHAT_TURN_SURPRISE_THRESHOLD:-0.7}
      - EQUILIBRIUM_METACOG_CHAT_TURN_COOLDOWN_SEC=${EQUILIBRIUM_METACOG_CHAT_TURN_COOLDOWN_SEC:-30}
      - CHANNEL_RPC_HEALTH_SNAPSHOT=${CHANNEL_RPC_HEALTH_SNAPSHOT:-orion:rpc_health:snapshot}
      - EQUILIBRIUM_METACOG_TRANSPORT_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_TRANSPORT_TRIGGER_ENABLE:-false}
      - EQUILIBRIUM_METACOG_TRANSPORT_COOLDOWN_SEC=${EQUILIBRIUM_METACOG_TRANSPORT_COOLDOWN_SEC:-30}
      - EQUILIBRIUM_TRANSPORT_BASELINE_ENABLE=${EQUILIBRIUM_TRANSPORT_BASELINE_ENABLE:-true}
      - EQUILIBRIUM_TRANSPORT_BASELINE_EMIT=${EQUILIBRIUM_TRANSPORT_BASELINE_EMIT:-true}
      - EQUILIBRIUM_TRANSPORT_EXCLUDE_LABELS=${EQUILIBRIUM_TRANSPORT_EXCLUDE_LABELS:-log_orion_metacognition,gpu_pool_wait,current_turn_probe}
      - EQUILIBRIUM_TRANSPORT_BASELINE_STATE_KEY=${EQUILIBRIUM_TRANSPORT_BASELINE_STATE_KEY:-equilibrium:transport_baseline_state:v1}
      - EQUILIBRIUM_TRANSPORT_BASELINE_MIN_CALLS=${EQUILIBRIUM_TRANSPORT_BASELINE_MIN_CALLS:-5}
      - EQUILIBRIUM_TRANSPORT_BASELINE_N_WARM=${EQUILIBRIUM_TRANSPORT_BASELINE_N_WARM:-10}
      - EQUILIBRIUM_TRANSPORT_BASELINE_SPIKE_Z=${EQUILIBRIUM_TRANSPORT_BASELINE_SPIKE_Z:-3.0}
      - EQUILIBRIUM_TRANSPORT_BASELINE_MIN_EXCESS_MS=${EQUILIBRIUM_TRANSPORT_BASELINE_MIN_EXCESS_MS:-250}
      - EQUILIBRIUM_TRANSPORT_BASELINE_SATURATION_RATIO=${EQUILIBRIUM_TRANSPORT_BASELINE_SATURATION_RATIO:-2.0}
      - EQUILIBRIUM_TRANSPORT_BASELINE_REGIME_AFTER_SEC=${EQUILIBRIUM_TRANSPORT_BASELINE_REGIME_AFTER_SEC:-21600}
      - EQUILIBRIUM_TRANSPORT_BASELINE_MAX_TRIGGERS_PER_HOUR=${EQUILIBRIUM_TRANSPORT_BASELINE_MAX_TRIGGERS_PER_HOUR:-30}
      - EQUILIBRIUM_TRANSPORT_TIMEOUT_ATOM_GRACE_SEC=${EQUILIBRIUM_TRANSPORT_TIMEOUT_ATOM_GRACE_SEC:-75}
      - EQUILIBRIUM_TRANSPORT_BASELINE_HOURLY_PUBLISH_ENABLE=${EQUILIBRIUM_TRANSPORT_BASELINE_HOURLY_PUBLISH_ENABLE:-true}
      - CHANNEL_TRANSPORT_BASELINE_HOURLY=${CHANNEL_TRANSPORT_BASELINE_HOURLY:-orion:equilibrium:transport_baseline:hourly}
      - EQUILIBRIUM_METACOG_INSIGHT_TRIGGER_ENABLE=${EQUILIBRIUM_METACOG_INSIGHT_TRIGGER_ENABLE:-false}
      - EQUILIBRIUM_METACOG_GENERATIVE_POLL_INTERVAL_SEC=${EQUILIBRIUM_METACOG_GENERATIVE_POLL_INTERVAL_SEC:-30}
      - EQUILIBRIUM_METACOG_GENERATIVE_POSTGRES_URI=${EQUILIBRIUM_METACOG_GENERATIVE_POSTGRES_URI:-postgresql://postgres:postgres@orion-athena-sql-db:5432/conjourney}
      - EQUILIBRIUM_METACOG_GENERATIVE_WINDOW_TICKS=${EQUILIBRIUM_METACOG_GENERATIVE_WINDOW_TICKS:-20}
      - EQUILIBRIUM_METACOG_GENERATIVE_MAX_AGE_SEC=${EQUILIBRIUM_METACOG_GENERATIVE_MAX_AGE_SEC:-120}
      - EQUILIBRIUM_METACOG_GENERATIVE_EXPECTED_TICK_SEC=${EQUILIBRIUM_METACOG_GENERATIVE_EXPECTED_TICK_SEC:-30}
      - EQUILIBRIUM_METACOG_GENERATIVE_SPAN_TOLERANCE=${EQUILIBRIUM_METACOG_GENERATIVE_SPAN_TOLERANCE:-2.0}
      - EQUILIBRIUM_METACOG_INSIGHT_COOLDOWN_SEC=${EQUILIBRIUM_METACOG_INSIGHT_COOLDOWN_SEC:-300}
      - EQUILIBRIUM_METACOG_INSIGHT_LOW_THRESHOLD=${EQUILIBRIUM_METACOG_INSIGHT_LOW_THRESHOLD:-0.70}
      - EQUILIBRIUM_METACOG_INSIGHT_HIGH_THRESHOLD=${EQUILIBRIUM_METACOG_INSIGHT_HIGH_THRESHOLD:-0.90}
      - EQUILIBRIUM_METACOG_INSIGHT_MAX_TICKS_TO_CROSS=${EQUILIBRIUM_METACOG_INSIGHT_MAX_TICKS_TO_CROSS:-15}
      - EQUILIBRIUM_METACOG_INSIGHT_CONFIRM_TICKS=${EQUILIBRIUM_METACOG_INSIGHT_CONFIRM_TICKS:-2}
      - EQUILIBRIUM_SPARK_HEARTBEAT_ENABLE=${EQUILIBRIUM_SPARK_HEARTBEAT_ENABLE}
      - EQUILIBRIUM_SPARK_HEARTBEAT_INTERVAL_SEC=${EQUILIBRIUM_SPARK_HEARTBEAT_INTERVAL_SEC}

networks:
  app-net:
    name: ${NET}
    external: true
