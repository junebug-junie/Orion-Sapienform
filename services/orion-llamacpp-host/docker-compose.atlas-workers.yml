# Strata engine (Qwen3.8-Flash-Next IQ3_S, one V100; docs/bench/2026-10-30-strata-hecate). Strata answers
# llama.cpp's /props, so the GPU pool confirms it like a llama.cpp worker (gpu_pool.yaml backend: strata).
# No API key: like every other lane, it is reached only on the tailnet. Each lane sets STRATA_PRESET and
# STRATA_CONTEXT, its CPUs (the socket it runs on), its own /data (config, state, run config) and the shared
# model files at /data/Strata-data (read-only at run time, so both engines share their mapped pages).
# `strata launch --no-tui` returns once the server is up (it runs on in its own session), so the wrapper
# stays up while it is ready, leaves after 3 failed checks (restart policy acts), and stops it on
# `docker stop` -- the image entrypoint's own loop, without the API key it always sets.
x-strata-engine: &strata-engine
  logging:
    driver: journald
    options:
      tag: "{{.Name}}"
  image: ${ATLAS_CHAT_STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.7-cuda12}
  restart: unless-stopped
  entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
  command:
    - |
      S=/opt/strata/terminal/bin/strata
      trap '$$S launch --stop --preset "$$STRATA_PRESET"; exit 0' TERM INT
      $$S launch --no-tui --access lan --no-api-key --port 8080 --data-dir /data/Strata-data \
        --family qwen --model IQ3_S --context "$$STRATA_CONTEXT" --parallel 1 --kv int8 --vision on \
        --save-preset "$$STRATA_PRESET" &
      wait $$! || exit 1
      bad=0
      while :; do
        sleep 10 & wait $$!
        if $$S launch --status --output json 2>/dev/null | grep -q '"state": *"ready"'; then bad=0; else bad=$$((bad+1)); fi
        [ "$$bad" -ge 3 ] && { echo "strata server is gone"; exit 1; }
      done
  ulimits:
    memlock: -1
  shm_size: 2g
  stop_grace_period: 120s
  networks:
    - app-net

# Announces a Strata engine to the GPU pool (orion:llm:worker:announce) and heartbeats for its lane. A
# strata profile makes orion-llamacpp-host announce only (it launches no server); LLM_REQUIRE_BACKEND
# refuses any other profile. Healthy when the engine it announces answers: Strata refuses unknown Host
# names (403), so the request names itself as local.
x-strata-announce: &strata-announce
  logging:
    driver: journald
    options:
      tag: "{{.Name}}"
  build:
    context: ../..
    dockerfile: services/orion-llamacpp-host/Dockerfile
    args:
      - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
  image: orion-llamacpp-host:0.1.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS -m 5 -H 'Host: 127.0.0.1:8080' http://$$STRATA_ENGINE:8080/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30m
  networks:
    - app-net

services:
  # Chat lane (gpu0): 262,144 tokens, thinking off by default (strata/chat-defaults.json).
  atlas-chat:
    <<: *strata-engine
    container_name: ${PROJECT:-orion}-atlas-strata-chat
    environment:
      - STRATA_PRESET=chat
      - STRATA_CONTEXT=262144
    cpuset: "${ATLAS_CHAT_STRATA_CPUS:-0-17,36-53}"
    volumes:
      - "${ATLAS_CHAT_STRATA_DATA_DIR:-/mnt/telemetry/strata}:/data"
    ports:
      - "${ATLAS_CHAT_HOST_PORT:-8011}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ATLAS_CHAT_CUDA_VISIBLE_DEVICES:-0}"]
              capabilities: [gpu]

  atlas-chat-announce:
    <<: *strata-announce
    container_name: ${PROJECT:-orion}-atlas-strata-chat-announce
    environment:
      - SERVICE_NAME=${ATLAS_CHAT_SERVICE_NAME:-atlas-worker-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${ATLAS_CHAT_STRATA_PROFILE_NAME:-qwen38-flash-next-iq3s-strata-1xv100-circe-chat}
      - LLM_REQUIRE_BACKEND=strata
      - LLM_ROLE=chat
      - LLM_ANNOUNCE_PORT=${ATLAS_CHAT_HOST_PORT:-8011}
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_CHAT_CUDA_VISIBLE_DEVICES}
      - STRATA_ENGINE=atlas-chat

  # Rollback for the chat lane: the llama.cpp server it ran before Strata (2026-10-30). Stop atlas-chat and
  # atlas-chat-announce, then: --profile chat-llamacpp up -d atlas-chat-llamacpp. Same port and role.
  atlas-chat-llamacpp:
    profiles: ["chat-llamacpp"]
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    # Atlas multi-worker pattern:
    # - one compose service per physical worker lane
    # - one profile per container
    # - one published host port per container
    # - one explicit CUDA_VISIBLE_DEVICES binding per container
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-host/Dockerfile
      args:
        - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
    image: orion-llamacpp-host:0.1.0
    container_name: ${PROJECT:-orion}-atlas-llamacpp-chat
    restart: unless-stopped
    environment:
      - SERVICE_NAME=${ATLAS_CHAT_SERVICE_NAME:-atlas-worker-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      # Required: set ATLAS_CHAT_PROFILE_NAME (the llama.cpp chat profile) in your env file/shell.
      - LLM_PROFILE_NAME=${ATLAS_CHAT_PROFILE_NAME}
      # GPU pool discovery: role + the host port it is reached on (same var as ports: below)
      - LLM_ROLE=chat
      - LLM_ANNOUNCE_PORT=${ATLAS_CHAT_HOST_PORT:-8011}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_CHAT_CUDA_VISIBLE_DEVICES}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      - "${ATLAS_CHAT_HOST_PORT:-8011}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  atlas-metacog:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-host/Dockerfile
      args:
        - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
    image: orion-llamacpp-host:0.1.0
    container_name: ${PROJECT:-orion}-atlas-llamacpp-metacog
    restart: unless-stopped
    environment:
      - SERVICE_NAME=${ATLAS_METACOG_SERVICE_NAME:-atlas-worker-2}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${ATLAS_METACOG_PROFILE_NAME}
      # GPU pool discovery: role + the host port it is reached on (same var as ports: below)
      - LLM_ROLE=metacog
      - LLM_ANNOUNCE_PORT=${ATLAS_METACOG_HOST_PORT:-8012}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_METACOG_CUDA_VISIBLE_DEVICES}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      - "${ATLAS_METACOG_HOST_PORT:-8012}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  atlas-fast:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-host/Dockerfile
      args:
        - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
    image: orion-llamacpp-host:0.1.0
    container_name: ${PROJECT:-orion}-atlas-llamacpp-fast
    restart: unless-stopped
    environment:
      - SERVICE_NAME=${ATLAS_FAST_SERVICE_NAME:-atlas-worker-fast-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${ATLAS_FAST_PROFILE_NAME}
      # GPU pool discovery: role + the host port it is reached on (same var as ports: below)
      - LLM_ROLE=fast
      - LLM_ANNOUNCE_PORT=${ATLAS_FAST_HOST_PORT:-8013}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_FAST_CUDA_VISIBLE_DEVICES}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      - "${ATLAS_FAST_HOST_PORT:-8013}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # Agent lane (gpu1; agent + memory_distill): 131,072 tokens like agent-gpu2, so a recalled run can move
  # between the two; thinking on at high effort (strata/agent-defaults.json). Pinned to the other socket's
  # CPUs so it does not compete with the chat engine. Same compose profile as the llama.cpp lane was.
  atlas-agent:
    <<: *strata-engine
    profiles: ["agent-split"]
    container_name: ${PROJECT:-orion}-atlas-strata-agent
    environment:
      - STRATA_PRESET=agent
      - STRATA_CONTEXT=131072
    cpuset: "${ATLAS_AGENT_STRATA_CPUS:-18-35,54-71}"
    volumes:
      - "${ATLAS_AGENT_STRATA_DATA_DIR:-/mnt/telemetry/strata-agent}:/data"
      - "${ATLAS_CHAT_STRATA_DATA_DIR:-/mnt/telemetry/strata}/Strata-data:/data/Strata-data"
    ports:
      - "${ATLAS_AGENT_HOST_PORT:-8015}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ATLAS_AGENT_CUDA_VISIBLE_DEVICES:-1}"]
              capabilities: [gpu]

  atlas-agent-announce:
    <<: *strata-announce
    profiles: ["agent-split"]
    container_name: ${PROJECT:-orion}-atlas-strata-agent-announce
    environment:
      - SERVICE_NAME=${ATLAS_AGENT_SERVICE_NAME:-atlas-worker-agent-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${ATLAS_AGENT_STRATA_PROFILE_NAME:-qwen38-flash-next-iq3s-strata-1xv100-circe-agent}
      - LLM_REQUIRE_BACKEND=strata
      - LLM_ROLE=agent
      - LLM_ANNOUNCE_PORT=${ATLAS_AGENT_HOST_PORT:-8015}
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_AGENT_CUDA_VISIBLE_DEVICES}
      - STRATA_ENGINE=atlas-agent

  # Rollback for the agent lane: the llama.cpp 27B it ran before Strata (2026-10-31). Stop atlas-agent and
  # atlas-agent-announce, then: --profile agent-llamacpp up -d atlas-agent-llamacpp. Same port and role.
  atlas-agent-llamacpp:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    profiles: ["agent-llamacpp"]
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-host/Dockerfile
      args:
        - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
    image: orion-llamacpp-host:0.1.0
    container_name: ${PROJECT:-orion}-atlas-llamacpp-agent
    restart: unless-stopped
    environment:
      - SERVICE_NAME=${ATLAS_AGENT_SERVICE_NAME:-atlas-worker-agent-1}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      - LLM_PROFILE_NAME=${ATLAS_AGENT_PROFILE_NAME}
      - LLM_ROLE=agent
      - LLM_ANNOUNCE_PORT=${ATLAS_AGENT_HOST_PORT:-8015}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_AGENT_CUDA_VISIBLE_DEVICES}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      # Default 8015, not 8014 -- see .env_example's ATLAS_AGENT_HOST_PORT
      # comment (collides with orion-circe-diffusion-host's port mapping).
      - "${ATLAS_AGENT_HOST_PORT:-8015}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  atlas-agent-burst:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    profiles: ["agent-burst"]
    # GPU pool stage 7.2: the stock image plus PrismML's llama.cpp fork at /app/prism, so this seat
    # can serve Ternary-Bonsai-2-27B (llamacpp.server_build: prism) or the Q4 27B (stock binary),
    # chosen by the profile the pool sends. Its own tag: chat/metacog/fast/agent stay on stock.
    # The lane controller starts it with `up --no-build`: build it first with
    # services/orion-llamacpp-host/scripts/build-prism-volta.sh (README, "agent-gpu2 on Bonsai").
    build:
      context: ../..
      dockerfile: services/orion-llamacpp-host/Dockerfile.prism
      args:
        - LLAMACPP_IMAGE_TAG=${LLAMACPP_IMAGE_TAG:-server-cuda-b8740}
    image: orion-llamacpp-host-prism:0.1.0
    container_name: ${PROJECT:-orion}-atlas-llamacpp-agent-burst
    restart: unless-stopped
    environment:
      - SERVICE_NAME=circe-worker-agent-burst-1
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - LLM_PROFILES_CONFIG_PATH=${LLM_PROFILES_CONFIG_PATH:-/app/config/llm_profiles.yaml}
      # GPU pool stage 5: the actuator (orion-gpu-lane-controller) sets these two per load from
      # config/gpu_pool.yaml (agent-gpu2 launch.profile_var / launch.cuda_env). Defaults = today's
      # seat, so a plain `up` is unchanged. check_gpu_pool_config.py refuses a literal device here.
      - LLM_PROFILE_NAME=${ATLAS_AGENT_BURST_PROFILE_NAME:-${ATLAS_AGENT_PROFILE_NAME}}
      - LLM_ROLE=agent-gpu2
      - LLM_ANNOUNCE_PORT=${ATLAS_AGENT_BURST_HOST_PORT:-8016}
      - HF_TOKEN=${HF_TOKEN}
      - hf_token=${hf_token}
      - LLAMACPP_HOST_OVERRIDE=0.0.0.0
      - LLAMACPP_PORT_OVERRIDE=8080
      - CUDA_VISIBLE_DEVICES_OVERRIDE=${ATLAS_AGENT_BURST_CUDA_VISIBLE_DEVICES:-2}
    volumes:
      - "${LLM_CACHE_DIR}:/models"
    ports:
      - "${ATLAS_AGENT_BURST_HOST_PORT:-8016}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-net
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

networks:
  app-net:
    external: true
