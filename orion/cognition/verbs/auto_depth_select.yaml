name: auto_depth_select
label: Auto Depth Select
description: >
  Selects execution_depth (0-3) and optional primary_verb for Auto mode routing.
category: ExecutiveControl
version: "1.0"
timeout_ms: 5000
services:
  - LLMGatewayService
steps:
  - name: depth_select
    order: 0
    services:
      - LLMGatewayService
    prompt_template: auto_depth_select_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
