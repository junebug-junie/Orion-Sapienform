name: answer_direct
label: Direct Answer
description: >
  Produce a direct, concrete answer to the user's question. Output user-facing
  prose that addresses the request without meta-planning or executive scaffolding.

category: Generative
priority: high

requires_gpu: true
requires_memory: false
timeout_ms: 60000

services:
  - LLMGatewayService

prompt_template: answer_direct_prompt.j2

steps:
  - name: answer
    order: 0
    services: [LLMGatewayService]
    prompt_template: answer_direct_prompt.j2

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
