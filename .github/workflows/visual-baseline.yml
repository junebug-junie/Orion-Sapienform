name: Visual baseline contracts
on:
  pull_request:
    paths:
      - 'orion/reverie/**'
      - 'orion/schemas/reverie_visual.py'
      - 'orion/schemas/*frame.py'
      - 'orion/proposals/**'
      - 'orion/policy/**'
      - 'orion/execution_dispatch/**'
      - 'orion/autonomy/**'
      - 'orion/feedback/**'
      - 'config/proposals/**'
      - 'services/orion-thought/**'
      - 'services/orion-proposal-runtime/**'
      - 'services/orion-execution-dispatch-runtime/**'
      - 'services/orion-feedback-runtime/**'
      - 'services/orion-cortex-exec/app/verb_adapters.py'
      - 'services/orion-sql-db/manual_migration_reverie_visual*.sql'
      - 'tests/test_visual_baseline_pipeline.py'
      - '.github/workflows/visual-baseline.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: visual_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORION_VISUAL_TEST_DATABASE_URL: postgresql://postgres:visual_test_only@127.0.0.1:5432/postgres
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio
      - name: Admission, accounting and feedback contracts
        run: >-
          python -m pytest -q tests/test_visual_baseline_pipeline.py
          tests/test_motor_allocator.py tests/test_proposal_frame_builder.py
          tests/test_policy_decision_builder.py tests/test_execution_dispatch_builder.py
          tests/test_action_outcome_resolution.py tests/test_feedback_runtime_store.py
          tests/test_express_outward_action.py
      - name: Thought storage, source, HTTP and replica contracts
        run: >-
          python -m pytest -q services/orion-thought/tests/test_visual_activity.py
          services/orion-thought/tests/test_store.py services/orion-thought/tests/test_visual_chain.py
          services/orion-thought/tests/test_visual_chain_thermal_gate.py
          services/orion-thought/tests/test_visual_chain_run_deadline.py
      - name: Scheduling replay eval
        run: python -m pytest -q services/orion-proposal-runtime/evals/test_baseline_replay.py
      - name: Image degradation eval
        run: PYTHONPATH=services/orion-thought:. python -m pytest -q services/orion-thought/evals/test_visual_chain_honesty_eval.py
