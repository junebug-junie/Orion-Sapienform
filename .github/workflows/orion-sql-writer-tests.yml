# Workflow: sql-writer grammar persistence + consumer resilience regression tests.
#
# Unit tests run on every PR/push touching grammar or sql-writer paths.
# Integration tests run against Postgres on GitHub Actions (same gate as main deploy).

name: orion-sql-writer-tests

on:
  pull_request:
    paths:
      - "orion/bus/channels.yaml"
      - "orion/core/bus/**"
      - "orion/grammar/**"
      - "orion/schemas/**"
      - "orion/substrate/**"
      - "orion/vision/**"
      - "config/vision_zones.yaml"
      - "services/orion-sql-db/**"
      - "services/orion-sql-writer/**"
      - "services/orion-substrate-runtime/**"
      - "tests/test_sql_writer_*.py"
      - "tests/test_transport_*.py"
      - "tests/test_storage_write_*.py"
      - "tests/fixtures/transport_*"
      - ".github/workflows/orion-sql-writer-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/bus/channels.yaml"
      - "orion/core/bus/**"
      - "orion/grammar/**"
      - "orion/schemas/**"
      - "orion/substrate/**"
      - "orion/vision/**"
      - "config/vision_zones.yaml"
      - "services/orion-sql-db/**"
      - "services/orion-sql-writer/**"
      - "services/orion-substrate-runtime/**"
      - "tests/test_sql_writer_*.py"
      - "tests/test_transport_*.py"
      - "tests/test_storage_write_*.py"
      - "tests/fixtures/transport_*"
      - ".github/workflows/orion-sql-writer-tests.yml"

jobs:
  sql-writer-unit:
    name: SQL writer — unit + SQL shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio
      - name: Run transport reducer unit tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_transport_split_window_no_fake_health.py \
            tests/test_transport_substrate_reducer.py \
            tests/test_transport_substrate_pipeline.py \
            tests/test_transport_rpc_timeout_not_a_bus.py \
            tests/test_energy_bus_catalog.py \
            tests/test_storage_write_substrate_reducer.py
      - name: Run sql-writer unit tests
        run: |
          PYTHONPATH=.:services/orion-sql-writer python -m pytest -q \
            orion/grammar/tests/test_ledger.py \
            orion/core/bus/tests/test_hunter_intake_log_quiet.py \
            services/orion-sql-writer/tests/test_consumer_resilience.py \
            services/orion-sql-writer/tests/test_route_map_completeness.py \
            services/orion-sql-writer/tests/test_world_pulse_routing.py \
            services/orion-sql-writer/tests/test_grammar_event_routing.py \
            services/orion-sql-writer/tests/test_grammar_ledger_sql_shape.py \
            services/orion-sql-writer/tests/test_juniper_multimodal_affect_sql_shape.py \
            services/orion-sql-writer/tests/test_vision_walkway_persist.py \
            services/orion-sql-writer/tests/test_vision_individuals.py \
            services/orion-sql-writer/tests/test_vision_walkway_faces_stationary.py \
            orion/vision/tests \
            services/orion-sql-writer/tests/test_vision_rhythm.py \
            services/orion-sql-writer/tests/test_vision_walkway_zones_thumbs_cursor.py \
            services/orion-sql-writer/tests/test_vision_expect_refresh.py \
            services/orion-sql-writer/tests/test_vision_event_sql_shape.py \
            services/orion-sql-writer/tests/test_energy_sql_shape.py \
            services/orion-sql-writer/evals/test_walkway_reducers_eval.py \
            services/orion-sql-writer/tests/test_write_health.py \
            services/orion-sql-writer/evals/test_storage_write_replay_eval.py

  sql-writer-integration:
    name: SQL writer — Postgres grammar integration
    runs-on: ubuntu-latest
    # packages: read lets GITHUB_TOKEN pull the private GHCR postgres copy.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/junebug-junie/postgres:16  # private GHCR copy of postgres:16; Docker Hub and ECR Public both rate-limit shared runner IPs
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conjourney
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/conjourney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-sql-writer/requirements.txt
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio
      - name: Run grammar Postgres integration tests
        run: |
          PYTHONPATH=.:services/orion-sql-writer:services/orion-sql-writer/tests python -m pytest -q -m integration \
            services/orion-sql-writer/tests/test_grammar_ledger_integration.py
          PYTHONPATH=.:services/orion-substrate-runtime:services/orion-sql-writer/tests python -m pytest -q -m integration \
            services/orion-substrate-runtime/tests/test_grammar_consumer_integration.py
      # Visual confirmation asks against real Postgres: opener, answers, typed names, picture
      # verdicts, migration backfill. The tests TRUNCATE the walkway tables; this database is throwaway.
      - name: Run visual confirmation asks Postgres tests (must not skip)
        env:
          ORION_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/conjourney
        run: |
          set -o pipefail
          python - <<'PY'
          import pathlib, psycopg2
          conn = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/conjourney")
          conn.autocommit = True
          for f in ("walkway_camera_v1", "walkway_privacy_v2", "vision_confirm_asks_v1", "vision_ask_names_v1"):
              conn.cursor().execute(pathlib.Path(f"services/orion-sql-db/manual_migration_{f}.sql").read_text())
          PY
          PYTHONPATH=.:services/orion-sql-writer python -m pytest -q -rs -p no:cacheprovider \
            services/orion-sql-writer/tests/test_vision_confirm_asks.py | tee vision_pg.out
          if grep -q "SKIPPED" vision_pg.out; then
            echo "visual confirmation Postgres tests skipped -- ORION_TEST_PG_URI wiring is broken" >&2
            exit 1
          fi
