schema_version: proposal_policy.v1
policy_id: proposal_policy.v1

limits:
  # 2026-08-16: 10 -> 20. This patch takes proposal_templates from 13 to 16;
  # `suppressed_candidates` exists precisely so a quiet tick's non-dispatched
  # candidates stay inspectable ("Quiet, not lost", orion/proposals/
  # builder.py's own comment) rather than silently truncated -- 10 was
  # already tight against 13 templates + any external (reverie/cognitive-hop)
  # producer, and this patch's own test suite caught it going stale
  # (test_gate_also_suppresses_external_candidates started dropping its
  # fixture candidate off the recorded list, not because anything broke, but
  # because 3 more real templates legitimately outranked it for a fixed 10
  # slots). 20 gives headroom for all 16 templates plus several external
  # producers on one tick; revisit against real post-deploy suppressed-list
  # sizes, same discipline as every other disclosed constant in this arc.
  # 2026-08-25: 10 -> 11, for the one template this patch adds
  # (analyze_self_study_source, base_priority 0.34). Deliberately the smallest
  # raise that keeps every existing template's arena position unchanged: the
  # cut currently lands around 0.32-0.33, so a 17th candidate at 0.34 would
  # otherwise have displaced whichever template held 10th place. Candidates per
  # tick therefore go up by exactly one, which matters on a host whose Postgres
  # I/O ceiling is already a known constraint.
  max_candidates: 11
  max_suppressed: 20

thresholds:
  min_priority: 0.10
  suppress_below: 0.05
  policy_required_above_risk: 0.20

  # PROVENANCE (2026-08-12): definitional, not tuned. See
  # orion/field/action_warrant.py and orion/proposals/policy.py's own comment.
  # `action_warrant` is a combined tail probability, so 0.50 is by
  # construction "exactly a median normal day for this machine" -- the
  # threshold reads as "act when the state is busier than a median day".
  # Measured live over 10,548 real ticks: 62.9% of ticks fall below it (quiet)
  # and 1.7% exceed 0.95 (clearly elevated), so the gate can both rest and
  # fire. Re-derive with orion/field/evals/run_action_warrant_eval.py.
  action_warrant_min: 0.50

# 2026-07-30: uncertainty/field_intensity/agency_readiness/coherence weights
# removed. None of those 4 dimension_ids are ever produced by
# orion/field/pressure.py::field_pressures() (see that module's own
# docstring -- composite, hand-tuned SelfStateV1 dimensions with no
# principled non-hand-tuned replacement, not rebuilt in the 2026-07-22 burn).
# No template below references them anymore either (see the same-day removal
# of contract_pressure/field_intensity/agency_readiness/uncertainty from each
# template's own `dimensions` map) -- keeping dead weights here was a live
# trap: dimension_confidence() returns 0.0 PERMANENTLY for any dimension_id
# outside orion/proposals/scoring.py::PRESSURE_DIMENSIONS, so these weights
# multiplied a value that could only ever be 0.0.
dimension_weights:
  execution_pressure: 0.30
  resource_pressure: 0.25
  reasoning_pressure: 0.15
  reliability_pressure: 0.35
  # 2026-08-16: disclosed, uncalibrated starting value -- mid-pack against
  # the 4 above, not tuned against real post-deploy dispatch data yet (same
  # discipline as every other first-cut weight in this file). See
  # orion/proposals/scoring.py::PRESSURE_DIMENSIONS' own comment for the
  # metric-gate evidence that earned deviation_pressure a place here at all.
  deviation_pressure: 0.30

proposal_templates:
  inspect_execution_pressure:
    kind: inspect
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: execution_pressure
    expected_direction: no_change
    target_kind: capability
    target_id: capability:orchestration
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.40
    base_risk: 0.05
    reversibility: 1.0
    dimensions:
      execution_pressure: 0.60

  summarize_loaded_state:
    kind: summarize
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: resource_pressure
    expected_direction: no_change
    target_kind: self_state
    target_id: self:current
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.35
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30: never produced by field_pressures()
    # (see dimension_weights' own comment above) -- was a dead entry that
    # contributed 0.0 to match_score (harmless there, template_match_score()
    # uses max()) but PERMANENTLY halved proposal_confidence() via its
    # sum()/len() average with resource_pressure's real confidence.
    dimensions:
      resource_pressure: 0.40

  watch_reliability:
    kind: observe
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: reliability_pressure
    expected_direction: no_change
    target_kind: capability
    target_id: capability:orchestration
    proposed_effect: preserve_stability
    required_policy_gate: read_only
    base_priority: 0.30
    base_risk: 0.02
    reversibility: 1.0
    dimensions:
      reliability_pressure: 0.50

  request_policy_review_for_action:
    kind: request_policy_review
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: execution_pressure
    expected_direction: no_change
    target_kind: system
    target_id: policy:execution
    proposed_effect: prepare_for_policy_gate
    required_policy_gate: operator_review
    base_priority: 0.20
    base_risk: 0.30
    reversibility: 0.8
    # agency_readiness removed 2026-07-30: never produced by field_pressures()
    # -- see dimension_weights' own comment above.
    dimensions:
      execution_pressure: 0.40

  inspect_transport_status:
    kind: inspect
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: reliability_pressure
    expected_direction: no_change
    target_kind: capability
    target_id: capability:transport
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.42
    base_risk: 0.05
    reversibility: 1.0
    # contract_pressure removed 2026-07-30: never produced by field_pressures()
    # -- "already always 0.0 before the [2026-07-22 SelfStateV1] burn" per
    # that module's own docstring; was never real, not a regression.
    dimensions:
      reliability_pressure: 0.40

  # inspect_bus_channel_catalog, summarize_transport_contract_drift and
  # watch_transport_backpressure DELETED 2026-09-25
  # (chore/transport-lattice-semantics; audit:
  # docs/superpowers/specs/2026-09-22-substrate-lattice-audit.md, L7).
  #
  # All three had `dimensions: {}` since their only dimension
  # (contract_pressure) was found never-produced on 2026-07-30, so they were
  # scored on the best of the four core pressures plus base_priority -- a
  # timer, not a response to transport. Live, 24h to 2026-09-25: 10,779 +
  # 10,779 + 7,500 candidates (~1,210/h), i.e. on ~99% of warranted ticks, and
  # 17,250 prepared dispatches (27% of all). They were not given real
  # dimensions because no transport-specific dimension exists to give them:
  #   - capability:transport `pressure` only reaches the arena inside
  #     resource_pressure, a max over every capability's pressure;
  #   - capability:transport `catalog_drift_pressure` (named contract_pressure
  #     until 2026-10-07, decision D3) is not routed
  #     to any dimension, and read 8 distinct values, max 0.0216, over 72h;
  #   - capability:transport `reliability_pressure` read exactly 0.0 on all
  #     121,114 ticks (inspect_transport_status keeps it; the RPC-health
  #     bridge is making it real, and its semantics are left alone here);
  #   - "backpressure" (XLEN depth) is being retired upstream
  #     (fix/bus-observer-scope).
  # Kill means kill: no fallback template. A replay of 1,560 sampled
  # warranted ticks through the real builder showed the freed arena slots go
  # to templates that do declare a signal (inspect_transport_status top-5
  # 132 -> 340, watch_reliability 16 -> 240, inspect_execution_pressure
  # 121 -> 284); candidates per tick are unchanged (max_candidates cap).
  # Replay: scripts/analysis/replay_proposal_template_removal.py.
  # Caveat, disclosed: inspect_transport_status's gain is NOT transport
  # signal. Its dimension is field-level reliability_pressure, a max over
  # every node/capability reliability channel, and capability:transport's own
  # reliability read 0.0 throughout -- so it is currently driven by
  # llm_inference/orchestration reliability. Kept (not deleted) because the
  # RPC-health bridge is about to make capability:transport's reliability
  # real; re-check this template once that lands.

  defer_due_to_low_readiness:
    kind: defer
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: reliability_pressure
    expected_direction: no_change
    target_kind: self_state
    target_id: self:current
    proposed_effect: preserve_stability
    required_policy_gate: none
    base_priority: 0.25
    base_risk: 0.0
    reversibility: 1.0
    # uncertainty removed 2026-07-30: never produced by field_pressures()
    # -- see dimension_weights' own comment above.
    dimensions:
      reliability_pressure: 0.50

  inspect_node_resource_pressure:
    kind: inspect
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: resource_pressure
    expected_direction: no_change
    target_kind: node
    # atlas decommissioned 2026-08-21 (config/biometrics/node_catalog.yaml);
    # circe is now the fleet's dominant GPU node and inherits this target,
    # same reasoning as orion-biometrics' CLUSTER_ROLE_WEIGHTS fix.
    target_id: node:circe
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.34
    base_risk: 0.05
    reversibility: 1.0
    dimensions:
      resource_pressure: 0.50

  inspect_field_topology_catalog:
    kind: inspect
    target_kind: field
    target_id: config/field/orion_field_topology.v1.yaml
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.33
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30: never produced by field_pressures()
    # -- was this template's ONLY dimension (match_score/confidence
    # permanently 0.0 either way it's expressed). Unlike the contract_pressure
    # templates above, field_intensity never passed proposal_urgency()'s
    # "_pressure"-suffix filter, so that function's real all-4-core-
    # dimensions fallback was ALREADY triggering before this change --
    # urgency is unaffected, this edit only makes the empty match/confidence
    # honest in the schema instead of implying a scored (but fake) dimension.
    dimensions: {}

  # P5: attention-bound proposal target. target_id/target_kind below are the
  # fallback literal, used only if target_binding fails to resolve (empty
  # dominant_attention_target_details, or a resolved target_kind outside the
  # accepted whitelist). When it resolves, the candidate's target_id/target_kind
  # follow self_state.dominant_attention_target_details[0] instead.
  #
  # Kill criterion (falsifiable by design, not yet run -- needs live traffic):
  # over a 7-day window, distinct(target_id) across this template's candidates
  # must be >= 3, or the binding isn't doing anything Orion's attention doesn't
  # already do via the literal templates above. See
  # orion/autonomy/evals/run_attention_bound_proposal_eval.py.
  inspect_attended_target:
    kind: inspect
    target_kind: capability   # placeholder default kind; overridden per-candidate when binding resolves to a different kind
    target_id: capability:orchestration   # fallback literal, used only if the binding fails to resolve
    target_binding: "attention.dominant_targets[0]"
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.34   # shipped live per explicit user go-ahead ("turn on whatever you need"), not dark-shipped at 0.0 -- read-only inspect proposal under the existing policy gate, same risk class as every other already-live inspect template
    base_risk: 0.05
    reversibility: 1.0
    # field_intensity removed 2026-07-30 -- see inspect_field_topology_catalog's
    # comment above for the full account (same disease, same template shape).
    # This template's real live relevance signal is the attention binding
    # itself (target_binding above), not a pressure dimension -- it was never
    # this template's actual reason to exist.
    dimensions: {}

  # 2026-08-16 (docs/superpowers/specs/2026-08-16-tension-driven-mutating-
  # dispatch-design.md): tension-driven templates. deviation_pressure is the
  # first PRESSURE_DIMENSIONS entry with an admission gate designed to reach
  # a real 0.0 rest point AND fire on real recurring deviation (see that
  # dimension's own metric-gate comment in orion/proposals/scoring.py) --
  # these 3 templates were its first consumers. Since 2026-11-06 (ladder retirement PR 4) only
  # observe_tension_via_camera is left; the two prune templates went with the disk rule.
  #
  # Fixed targets, not attention-bound: `target_binding` only recognizes
  # ATTENTION_FIRST_TARGET_BINDING today (orion/proposals/builder.py), and
  # binding these to the tension Borda winner is real, separate follow-up
  # work (a second binding literal + a resolver change), not needed for
  # deviation_pressure to already be a real, scoreable dimension. Deferred
  # rather than built speculatively.
  #
  # observe_tension_via_camera is read-only (required_policy_gate: read_only,
  # allowed_scope: inspect_only in execution_dispatch_policy.v1.yaml) --
  # skills.perception.look_at_camera.v1 reads orion-vision-window's existing
  # passive projection, it does not trigger a fresh capture. Named by the
  # perception ladder's own verb, not reimplemented -- see that skill's own
  # yaml. This is the "use the video work as a consumer of tension" wiring:
  # the camera-look competes harder when the field is genuinely deviating,
  # nothing about the perception ladder itself is touched.
  # 2026-08-25: "analysis -> self-study journal entry". The 17th template.
  #
  # WHY ONE TEMPLATE FOR FOUR INPUTS. The action studies concept induction,
  # vision events, affective state, or co-creation signals -- but which one is
  # a scheduling question, not a proposal-arena question, so the verb picks the
  # most overdue lens itself. Four templates here would have been four
  # near-identical candidates competing for the same five dispatch slots, and
  # would have pushed four existing templates out of a 10-candidate arena for
  # no gain. `max_candidates` goes 10 -> 11 in this patch for the one added.
  #
  # NO `expected_signal`. Same honest position as summarize_transport_contract_
  # drift and watch_transport_backpressure above: this is periodic bounded
  # self-study surfacing on base_priority, and there is no evidence that any
  # field dimension predicts "there is something notable in that table right
  # now". Declaring one would repeat inspect_execution_pressure's defect --
  # copy that says "elevated" on a template whose real firing baseline (0.1917)
  # sits BELOW the population mean (0.2842).
  #
  # base_priority 0.34 = mid-pack, the same value inspect_node_resource_pressure
  # and inspect_attended_target carry. Disclosed and uncalibrated: high enough
  # to clear the ~0.32 candidate cut every tick, low enough not to displace the
  # 0.38-0.42 leaders. Sharing a base_priority does NOT predict sharing a
  # dispatch rate -- those two templates got 65 and 2,316 dispatches in the 24h
  # to 2026-08-25, three orders of magnitude apart on an identical base, because
  # the rest of the score is field-dependent. What this template DOES share with
  # three proven-live templates is its whole gate-relevant tuple, traced through
  # the real builders in review: conf=0.125, risk=0.150, rev=1.00,
  # gate=read_only, kind=summarize, scope=summarize_only, base_risk=0.05 --
  # identical to summarize_transport_contract_drift (2,828 dispatches/24h),
  # inspect_bus_channel_catalog (2,864) and inspect_attended_target (2,316). It
  # passes or fails the gates with them. Revisit base_priority against real
  # post-deploy dispatch counts, not against this comment.
  #
  # RISK. Read-only against all four sources. The only write is an append-only
  # journal entry on the existing journal.entry.write.v1 channel -- the same
  # sink 34k entries already use -- and the verb refuses to write at all unless
  # a rule fires AND no identical finding-set was journaled inside the cooldown.
  analyze_self_study_source:
    kind: summarize
    target_kind: self_state
    target_id: self_state:self_study
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.34
    base_risk: 0.05
    reversibility: 1.0
    dimensions: {}

  observe_tension_via_camera:
    kind: inspect
    # 2026-08-21 (action-outcome ledger): this template's falsifiable claim.
    # Read-only kinds declare no_change because their own constraint set
    # (read_only / no_file_writes / no_external_side_effects) entails it --
    # confirming it repeatedly drives Bayesian surprise to ~0, which is how
    # a tic proves itself. Magnitude is NEVER declared here; it comes from
    # the measured posterior (see orion/schemas/action_prediction.py).
    expected_signal: deviation_pressure
    expected_direction: no_change
    target_kind: system
    target_id: host:camera_perception
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.30
    base_risk: 0.05
    reversibility: 1.0
    dimensions:
      deviation_pressure: 0.55

  # 2026-11-05 (ladder retirement PR 2): render_scene, Orion's first outward action (2026-08-30),
  # left this policy. Orion starts its own waking paintings now (orion-thought
  # app/painting_self_start.py): the visual-baseline schedule plus a shadow hunger bid on
  # thought.painting, then one reverie.visual durable run. One trigger, never two.

  # 2026-10-21 (thinking rung 3 follow-up): read one more world-pulse item now. Emitted every
  # tick the action warrant allows, and the motor allocator decides on
  # the `look` act's own belief and measured cost (config/execution_dispatch route
  # read_world_pulse). No dimensions on purpose: nothing in the field measures "worth reading", so
  # a weight here would be a hand-typed float pretending to be a reason (analyze_self_study_source
  # carries {} for the same reason). No expected_signal: the act's outcome (artifact_produced) is
  # the claim, graded by the act ledger, not a field signal.
  read_world_pulse:
    kind: observe
    target_kind: system
    target_id: queue:world_pulse_read
    proposed_effect: increase_observability
    required_policy_gate: read_only
    base_priority: 0.30
    base_risk: 0.05
    reversibility: 1.0
    dimensions: {}

  # 2026-11-05 (ladder retirement PR 1): retro_leisure_session left this policy. Hub starts leisure
  # on its own timer (services/orion-hub/scripts/retro_leisure_self_start.py), under the runner's own
  # gates. One trigger, never two.

  # 2026-11-05 (ladder retirement PR 3): aitown_session left this policy. orion-embodiment starts Orion's
  # town sessions on its own timer (services/orion-embodiment/app/town_self_start.py), under the session
  # controller's caps (30 min per session, 2 h per local day, 1 h apart). One trigger, never two.

  # 2026-11-05 (ladder retirement PR 5): shed_background_gpu, Orion's first world-facing,
  # self-reverting action, left this policy. The cooling world act is decided by the want market now
  # (orion-durable-runs app/cooling_act.py, family self_regulate.shed; orion/autonomy/shed_act.py), with
  # the same eligibility, treated/control draw, episode ledger and shed RPC. One trigger, never two.

  # 2026-11-06 (ladder retirement PR 4): the three docker prune templates left this policy:
  # prune_build_cache (2026-08-12), prune_dangling_images and prune_stopped_containers (2026-08-16).
  # orion-hardware-watch's disk rule asks for skills.runtime.image_prune.v1 when the docker volume is
  # at or above the skill's own 70 % floor (services/orion-hardware-watch/app/image_prune.py); the skill
  # still runs its own gate. Build cache and stopped containers are pruned by hand only (hand-run skill
  # catalogue, Juniper's decision 4). One trigger, never two.
