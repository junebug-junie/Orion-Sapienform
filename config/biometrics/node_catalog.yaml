schema_version: biometrics_node_catalog.v1

# `hardware:` is free text for readers (the body atlas, orion/body_atlas/sources.py). NodeCatalog
# ignores it; nothing branches on it. Juniper's words, 2026-10-29. Unknown models stay unwritten.

defaults:
  expected_online: true
  role: unknown
  capabilities: {}

nodes:
  athena:
    # Physically pulled off the Panduit PDU 2026-09-02 (Juniper). Power/chassis telemetry for
    # athena comes exclusively from its iLO now -- see PDU_OUTLETS in services/orion-biometrics/
    # settings.py and .env_example for the per-node config detail; PDU_HOST/PDU_PROXY_OUTLETS
    # stay set so athena keeps proxying circe's outlets over SNMP, unrelated to athena's own
    # power source.
    aliases:
      - athena
      - athena.tail348bbe.ts.net
    role: orchestration
    # Read 2026-10-30 on the box (dmi, lscpu, free, nvidia-smi).
    hardware: HPE ProLiant DL380 Gen10, 2x Xeon Platinum 8168 (2.7 GHz), 377 GB RAM, Tesla P4 8GB + Tesla T10 16GB (orchestration + vision/audio node)
    expected_online: true
    capabilities:
      hub: true
      redis_bus: true
      graphdb: true
      postgres: true
      orchestration: true
      local_llm_heavy: false
      local_llm_quick: false
      monitoring: false

  circe:
    aliases:
      - circe
      - circe.tail348bbe.ts.net
    # Was `burst_gpu` until 2026-10-14: wrong. circe carries the bulk of Orion's
    # daily cognition -- the chat lane (Qwen3.6-35B on gpu0), the agent lanes,
    # metacog/fast, and diffusion -- across 4 GPUs (2x V100-PCIE-32GB,
    # PG500-216, V100-SXM2-32GB; `nvidia-smi -L` on circe, 2026-10-14). Role is
    # free text read into biometrics node-context summaries; nothing branches
    # on its value. Pinned by tests/test_static_body_descriptions.py.
    role: primary_cognition_gpu
    # Juniper 2026-10-29: "daily inference node, Gigabyte" -- the model name was cut off.
    # Read 2026-10-30 over ssh circe@circe (dmi, lscpu, free, nvidia-smi).
    hardware: Gigabyte G481-HA0 (board MG61-G40), 2x Xeon Gold 6150 (2.7 GHz), 251 GB RAM, 2x V100-PCIE-32GB + PG500-216 + V100-SXM2-32GB (daily inference node)
    # Was false: circe was intermittent/burst-only. A real llamacpp chat worker
    # (orion-atlas-llamacpp-chat, port 8011) has been running on circe continuously
    # for days (2026-07-18) -- expected_online=false was making pressure_organ.py
    # suppress circe's real strain pressure as "expected staleness" instead of
    # surfacing it (see orion/substrate/biometrics_loop/pressure_organ.py:125).
    expected_online: true
    capabilities:
      local_llm_heavy: true
      local_llm_quick: true
      training: true
      batch_inference: true
      dream_batch: true
      graphdb: false
      postgres: false
      hub: false

  prometheus:
    aliases:
      - prometheus
      - prometheous
      - prometheus.tail348bbe.ts.net
      - prometheous.tail348bbe.ts.net
    role: observability
    expected_online: true
    capabilities:
      monitoring: true
      logs: true
      metrics: true
      orchestration: false
      local_llm_heavy: false

  hecate:
    # Added 2026-10-03: Inspur NF5288M5 (8-GPU) server, LAN 192.168.1.62, tailscale 100.87.202.68.
    # Power comes from the Panduit PDU, outlets 19 and 25 (2 PSUs), polled ON ITS BEHALF by
    # athena's PDU_PROXY_OUTLETS -- the PDU's SNMP Manager allow-list only admits athena, so
    # hecate cannot self-poll. Outlet map is physical cabling (re-cabling needs a manual edit).
    # expected_online is false until orion-biometrics is actually running on hecate: with no
    # service there, its silence is not an outage and pressure_organ must not treat it as one.
    # Flip to true when HECATE_BIOMETRICS_BASE_URL answers.
    aliases:
      - hecate
      - hecate.tail348bbe.ts.net
    role: gpu_server
    # Offline since 2026-10-15; from its last biometrics row (1 GPU, 80 CPU threads) and
    # config/gpu_pool.yaml hecate-gpu0. CPU model and RAM not recorded.
    hardware: Inspur NF5288M5 (product NF5288M5-G3GPU01, AGX-2, 8 SXM2 slots), 2x Xeon Gold 6148 (2.4 GHz, 80 threads), 183 GB RAM, 1x V100-SXM2-32GB installed (deep inference and training node)
    expected_online: false
    capabilities:
      local_llm_heavy: false
      local_llm_quick: false
      batch_inference: false
      graphdb: false
      postgres: false
      hub: false
      monitoring: false

# Machines that are part of Orion's body but that orion-biometrics does NOT monitor. Kept out of
# `nodes:` on purpose: orion-biometrics lists every `nodes:` entry it has not heard from in each
# cluster message (`nodes_absent`), so adding these there would report them absent forever.
# NodeCatalog ignores this section; only the body atlas reads it (orion/body_atlas/sources.py).
# `runs_services`: services declared to run there (the atlas labels this declared placement).
# `cameras`: camera streams that are this machine's own camera.
unmonitored_nodes:
  carbon-x1:
    aliases:
      - carbon-x1
      - carbon-x1.tail348bbe.ts.net
    role: juniper_laptop
    # Read 2026-10-30 over ssh juniper@carbon-x1.
    hardware: Lenovo ThinkPad X1 Carbon Gen 12 (21KC0046US), Core Ultra 7 155U, 32 GB RAM, integrated camera (Juniper's laptop)
    expected_online: false
    # camera streams (config/vision_frame_router.yaml `streams:`) that are this machine's own
    # camera: `carbon` is the laptop webcam (docs/operations/carbon-webcam.md)
    cameras:
      - carbon
  janus:
    aliases:
      - janus
      - janus.tail348bbe.ts.net
    # Read 2026-10-30 over ssh janus@janus: a GNOME desktop (remote desktop on) with a local
    # PostgreSQL 16 and no containers. Several services' PROJECT defaults are still
    # "orion-janus" (services/orion-hub/app/settings.py), so Orion likely started here.
    role: desktop_workstation
    hardware: HP ProDesk 600 G2 DM mini PC, Core i7-6700T, 16 GB RAM, 1 TB NVMe
    expected_online: false
  pan-1:
    # services/orion-office-env/README.md: "It runs on pan-1 only" (Nano ESP32 + SHT40 by USB).
    aliases:
      - pan-1
      - pan-1.tail348bbe.ts.net
    role: office_sensor_host
    # Hardware not recorded: no ssh login reaches pan-1 from athena (2026-10-30). Its sensor is
    # an Arduino Nano ESP32 + SHT40 on USB (firmware/pan-1-office-nano/README.md).
    expected_online: false
    runs_services:
      - orion-office-env

# Hosts that no longer exist. Not part of the live fleet: NodeCatalog keeps them out of
# `profiles`, resolves their names (and aliases) to expected_online=false so historical
# trace ids still have a name, and the biometrics reducers DROP them from the live
# projections (substrate_node_biometrics_projection / substrate_active_node_pressure_projection)
# on the next tick (orion/substrate/biometrics_loop/pipeline.py::prune_retired_nodes).
# Without that drop a dead host's last reading stays in the projection forever: atlas's
# 8 frozen pressure_hints were still averaged into every node:substrate.biometrics
# prediction-error tick and its stale `availability` pressure was re-reinforced every
# sweep, two months after the box was gone (live check 2026-10-16).
retired_nodes:
  atlas:
    # DECOMMISSIONED 2026-08-21, removed from the live roster 2026-10-16 (Juniper: "atlas
    # is deprecated -- remove"). Its disks now boot athena, its 2x V100 16GB moved into
    # circe, its old PDU outlets (34,35) carry no known machine. Last biometrics report:
    # 2026-08-20T22:43:26Z. Do not move this back under `nodes:` without a real box
    # behind the name.
    retired_at: "2026-08-21"
    aliases:
      - atlas
      - atlas.tail348bbe.ts.net
