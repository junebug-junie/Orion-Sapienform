name: memory_graph_suggest
label: Memory graph suggest (brain draft JSON)
description: >
  Produces memory-graph suggest JSON only for operator annotation (ontology orionmem-2026-05).

category: ExecutiveControl
priority: medium

interruptible: true
can_interrupt_others: false

requires_gpu: true
requires_memory: true

recall_profile: chat.general.v1

timeout_ms: 180000
max_recursion_depth: 0

services:
  - LLMGatewayService

prompt_template: memory_graph_suggest_prompt.j2

personality_file: orion/cognition/personality/orion_identity.yaml

plan:
  - name: llm_memory_graph_suggest
    description: Single-pass JSON draft for memory-graph annotation.
    order: 0
    prompt_template: memory_graph_suggest_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: true

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 1
  family: memory.consolidation
  lanes: [fast]
  deferrable_window_s: 3600
