<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curiosity Atlas</title>
<style>
/* Palette: the validated reference instance. Categorical slots are used in
   fixed order and never cycled. The four stack slots were validated on the
   adjacent pairlist in BOTH modes (worst CVD dE 9.1 light / 8.4 dark, worst
   normal-vision 22.9 / 19.8). Light-mode aqua and yellow sit below 3:1 on the
   surface, so the relief rule applies: every stack segment carries a visible
   label and a table view exists. */
:root {
  color-scheme: light;
  --plane:          #f9f9f7;
  --surface:        #fcfcfb;
  --ink:            #0b0b0b;
  --ink-2:          #52514e;
  --ink-muted:      #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --hairline:       rgba(11,11,11,0.10);
  --series-1:       #2a78d6;
  --series-2:       #eb6834;
  --series-3:       #1baf7a;
  --series-4:       #eda100;
  --series-5:       #e87ba4;
  --series-6:       #5c940d;
  --series-7:       #a78bfa;
  --series-8:       #22b8cf;
  --series-9:       #c9a227;
  --good:           #0ca30c;
  --warning:        #fab219;
  --critical:       #d03b3b;
  --good-text:      #006300;
  /* ONE ink for every stack label, both modes. Re-measured 2026-08-29 across
     all NINE fills: near-black beats white on every one (light 5.34-9.09,
     dark 4.99-6.92), so a per-slot rule would be complexity buying nothing.
     White would have been 2.17:1 on light-mode yellow -- a label that is
     present and unreadable, which reads as handled and is not.
     --series-6 WAS #008300 AND MEASURED 3.98, below the floor this very
     comment claimed. Caught by re-running the numbers instead of trusting the
     note; now #5c940d (5.34), also further from --series-3. */
  --on-series:      #0b0b0b;
  --shadow:         0 1px 2px rgba(11,11,11,0.05), 0 4px 12px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:        #0d0d0d;
    --surface:      #1a1a19;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --ink-muted:    #898781;
    --grid:         #2c2c2a;
    --axis:         #383835;
    --hairline:     rgba(255,255,255,0.10);
    --series-1:     #3987e5;
    --series-2:     #d95926;
    --series-3:     #199e70;
    --series-4:     #c98500;
    --series-5:     #d55181;
    --series-6:     #5c940d;
    --series-7:     #9d7cf5;
    --series-8:     #1ba8bd;
    --series-9:     #b8941f;
    --good-text:    #0ca30c;
    --shadow:       0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #0d0d0d;
  --surface:      #1a1a19;
  --ink:          #ffffff;
  --ink-2:        #c3c2b7;
  --ink-muted:    #898781;
  --grid:         #2c2c2a;
  --axis:         #383835;
  --hairline:     rgba(255,255,255,0.10);
  --series-1:     #3987e5;
  --series-2:     #d95926;
  --series-3:     #199e70;
  --series-4:     #c98500;
  --series-5:     #d55181;
  --series-6:     #5c940d;
  --series-7:     #9d7cf5;
  --series-8:     #1ba8bd;
  --series-9:     #b8941f;
  --good-text:    #0ca30c;
  --shadow:       0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 72px; }

header.page { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
header.page h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
header.page .sub { color: var(--ink-2); font-size: 13px; }
.meta-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 10px 0 22px; color: var(--ink-muted); font-size: 12px;
}
button.ghost {
  font: inherit; font-size: 12px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 7px; padding: 4px 10px; cursor: pointer;
}
button.ghost:hover { color: var(--ink); }
button.ghost[aria-pressed="true"] { color: var(--ink); border-color: var(--axis); }

section { margin: 0 0 30px; }
h2 {
  font-size: 12px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0 0 3px;
}
.section-note { color: var(--ink-2); font-size: 12.5px; margin: 0 0 14px; max-width: 76ch; }

.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 11px; box-shadow: var(--shadow);
}

button.ghost.run-now { border-color: var(--axis); color: var(--ink); }
button.ghost.run-now[disabled] { opacity: 0.55; cursor: default; }
.run-msg { font-size: 12px; color: var(--ink-2); }
.run-msg.bad { color: var(--critical); }

/* --- banners ----------------------------------------------------------- */
.banner {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 13px 15px; border-radius: 10px; margin-bottom: 18px;
  border: 1px solid var(--hairline); background: var(--surface);
  border-left: 3px solid var(--ink-muted);
}
.banner .icon { font-size: 15px; line-height: 1.35; flex: none; }
.banner .t { font-weight: 620; margin-bottom: 2px; }
.banner .d { color: var(--ink-2); font-size: 13px; }
.banner.critical { border-left-color: var(--critical); }
.banner.warning  { border-left-color: var(--warning); }
.banner.info     { border-left-color: var(--series-1); }

/* --- stat tiles -------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.tile { padding: 15px 16px 14px; }
.tile .label {
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 600; margin-bottom: 7px;
}
.tile .value { font-size: 27px; font-weight: 640; line-height: 1.05; letter-spacing: -0.02em; }
.tile .value .unit { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.tile .foot { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.tile .value.is-critical { color: var(--critical); }

/* --- small multiples --------------------------------------------------- */
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 12px; }
.spark { padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 9px; }
.spark .claim {
  font-size: 13px; line-height: 1.45; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.spark .sub { font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.spark svg { display: block; width: 100%; height: 74px; overflow: visible; }
.spark .none {
  font-size: 12px; color: var(--ink-2); background: var(--plane);
  border: 1px dashed var(--axis); border-radius: 8px; padding: 9px 11px; line-height: 1.45;
}

/* --- stacked bars ------------------------------------------------------ */
.growth { padding: 16px 18px 14px; }
.legend { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 14px; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bars { display: flex; flex-direction: column; gap: 11px; }
.barrow { display: grid; grid-template-columns: 128px 1fr 56px; gap: 13px; align-items: center; }
.barrow .name {
  font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.barrow .total { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.track { display: flex; height: 22px; gap: 2px; }
.seg {
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; min-width: 3px;
  color: var(--on-series); font-variant-numeric: tabular-nums;
}
.seg:first-child { border-radius: 4px 0 0 4px; }
.seg:last-child  { border-radius: 0 4px 4px 0; }
.seg:only-child  { border-radius: 4px; }

/* --- run ledger -------------------------------------------------------- */
.runs { display: flex; flex-direction: column; gap: 12px; }
.run { padding: 15px 17px; }
.run .head { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap; margin-bottom: 9px; }
.run .rid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 620; }
.run .when { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.pill {
  font-size: 11px; font-weight: 620; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--hairline); color: var(--ink-2); white-space: nowrap;
}
.pill.good     { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.critical { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
.pill.warn     { color: var(--ink); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
.run .note {
  font-size: 13px; line-height: 1.5; color: var(--ink-2);
  border-left: 2px solid var(--grid); padding-left: 11px; margin: 9px 0 0;
}
.run .note b { color: var(--ink); font-weight: 620; }
.run .wrote { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

/* --- a run's actual working --------------------------------------------- */
.working { margin-top: 11px; }
.working-label {
  font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 600; margin-bottom: 6px;
}
ol.hops { margin: 0; padding-left: 0; list-style: none; counter-reset: hop; }
ol.hops li {
  counter-increment: hop; position: relative; padding: 0 0 9px 26px;
  font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  border-left: 1px solid var(--grid); margin-left: 7px;
}
ol.hops li:last-child { padding-bottom: 0; border-left-color: transparent; }
ol.hops li::before {
  content: counter(hop); position: absolute; left: -7px; top: 1px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--axis);
  color: var(--ink-muted); font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.evidence {
  display: block; margin-top: 5px; font-size: 11.5px; color: var(--ink-muted);
}
.evidence b { color: var(--ink-muted); font-weight: 620; }
details.journal { margin-top: 11px; }
details.journal summary {
  cursor: pointer; font-size: 12px; color: var(--ink-2);
  list-style: none; display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--hairline); border-radius: 7px; padding: 3px 10px;
}
details.journal summary::-webkit-details-marker { display: none; }
details.journal summary::before { content: "▸"; font-size: 9px; color: var(--ink-muted); }
details.journal[open] summary::before { content: "▾"; }
details.journal summary:hover { color: var(--ink); }
.journal-body {
  margin-top: 9px; font-size: 13px; line-height: 1.6; color: var(--ink-2);
  white-space: pre-wrap; border-left: 2px solid var(--grid); padding-left: 12px;
  max-height: 30rem; overflow-y: auto;
}

/* --- tables ------------------------------------------------------------ */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th {
  font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 600; border-bottom-color: var(--axis);
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.dim { color: var(--ink-muted); }
[hidden] { display: none !important; }
</style>
</head>
<body data-asset-version="{{HUB_UI_ASSET_VERSION}}">
<div class="wrap">

  <header class="page">
    <h1>Curiosity Atlas</h1>
    <span class="sub">What Orion has worked out, and what each run changed.</span>
  </header>
  <div class="meta-row">
    <span id="updated">Loading…</span>
    <button class="ghost" id="refresh" type="button">Refresh</button>
    <button class="ghost" id="toggle-tables" type="button" aria-pressed="false">Table view</button>
    <button class="ghost run-now" id="run-now" type="button">Run now</button>
    <span id="run-now-msg" class="run-msg"></span>
  </div>

  <div id="banners"></div>

  <section>
    <h2>Pool</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section>
    <h2>Confidence, before and after</h2>
    <p class="section-note" id="traj-note"></p>
    <div class="multiples" id="trajectories"></div>
  </section>

  <section>
    <h2>What each run added</h2>
    <p class="section-note">
      Nodes written per run, by kind. Every node Orion writes carries its run id,
      so this is the graph growing — not an estimate.
    </p>
    <div class="card growth" id="growth"></div>
    <div class="card table-wrap growth-table" id="growth-table" hidden></div>
  </section>

  <section>
    <h2>Runs</h2>
    <div class="runs" id="runs"></div>
  </section>

  <section>
    <h2>Every prior</h2>
    <div class="card table-wrap"><table id="priors-table"></table></div>
  </section>

</div>

<script>
"use strict";

const SERIES = ["--series-1", "--series-2", "--series-3",
                "--series-4", "--series-5", "--series-6",
                "--series-7", "--series-8", "--series-9"];
// Fixed order, never cycled. KNOWN kinds lead in this order; anything Orion
// starts writing that is not listed still gets a segment, because the growth
// query counts every labelled node and `total_added` sums all of them --
// filtering the segments to a hardcoded list made the bar disagree with its
// own total (a run writing 1 Prior + 5 PriorRevision rendered a full-width
// bar labelled "1" beside a total of "6"). Review finding. Past six the tail
// folds into one "Other" segment rather than inventing a seventh hue.
// Edge kinds are listed EXPLICITLY, and last, so they get stable dedicated
// slots. Without them the panel degraded exactly when the new edge capability
// started working: every unlisted kind maps to the final colour, so SUPPORTS,
// CONTRADICTS and ABOUT would have rendered as one hue and as each other, and
// crossing six kinds would fold real node labels into a grey "Other". A review
// finding. The `-> ` prefix comes from ATLAS_EDGE_GROWTH_CYPHER and keeps an
// edge type from colliding with a node label of the same name.
const KIND_ORDER = ["Prior", "Finding", "Hop", "TurnOutcome",
                    "PriorRevision", "Concept",
                    "-> SUPPORTS", "-> CONTRADICTS", "-> ABOUT"];
const OTHER = "Other";

function kindsPresent(runs) {
  const seen = new Set();
  runs.forEach((r) => Object.keys(r.added || {}).forEach((k) => seen.add(k)));
  const known = KIND_ORDER.filter((k) => seen.has(k));
  const extra = [...seen].filter((k) => !KIND_ORDER.includes(k)).sort();
  const kinds = known.concat(extra);
  return kinds.length <= SERIES.length
    ? { kinds, folded: [] }
    : { kinds: kinds.slice(0, SERIES.length - 1).concat(OTHER),
        folded: kinds.slice(SERIES.length - 1) };
}

function bucketed(added, kinds, folded) {
  const out = {};
  kinds.forEach((k) => {
    out[k] = k === OTHER
      ? folded.reduce((n, f) => n + (added[f] || 0), 0)
      : (added[k] || 0);
  });
  return out;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function kindColor(kind) {
  const i = KIND_ORDER.indexOf(kind);
  return `var(${SERIES[i === -1 ? SERIES.length - 1 : i]})`;
}

function fmtStamp(v) {
  if (v === null || v === undefined || v === "") return "—";
  const d = typeof v === "number" ? new Date(v) : new Date(String(v));
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
}

function isToday(v) {
  if (v === null || v === undefined || v === "") return false;
  const d = typeof v === "number" ? new Date(v) : new Date(String(v));
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
    && d.getMonth() === now.getMonth()
    && d.getDate() === now.getDate();
}

function relative(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const mins = Math.round((d.getTime() - Date.now()) / 60000);
  const ahead = mins >= 0;
  const n = Math.abs(mins);
  if (n < 60) return ahead ? `in ${n}m` : `${n}m ago`;
  const h = Math.floor(n / 60), m = n % 60;
  const t = m ? `${h}h ${m}m` : `${h}h`;
  return ahead ? `in ${t}` : `${t} ago`;
}

/* --- banners ------------------------------------------------------------ */
function renderBanners(d) {
  const out = [];
  if (d.available === false) {
    // "Never configured" and "could not be reached" are different states and
    // must never render the same -- a broken ACL would otherwise look exactly
    // like a mind that has not formed a prior yet.
    const configured = d.reason !== "graph_not_configured";
    out.push(banner(configured ? "critical" : "info", configured ? "⚠" : "○",
      configured ? "Orion's graph could not be read" : "The graph half is switched off",
      configured
        ? `${esc(d.reason || "unknown")} — this is an outage, not an empty world view.`
        : "HUB_CURIOSITY_GRAPH_ORION_USER / _PASSWORD are unset, so the loop runs without a graph."));
  } else if (d.pool_is_dead) {
    out.push(banner("critical", "⚠", "No priors are still in play",
      `All ${d.closed_total} have been refuted or retired, so the next run inherits nothing to test. ` +
      `Legal if Orion genuinely closed them all — and also the exact shape of the 2026-08-27 filter outage.`));
  } else if (d.live_total === 0 && d.closed_total === 0) {
    out.push(banner("info", "○", "Orion has not written a prior yet",
      "A normal place to start, not a gap. Distinct from a dead pool above."));
  }
  // Named because it is an ABSENCE. A zero never shows up in a per-run
  // breakdown -- nothing renders for a thing that was not written -- so the
  // page has to ask for it by name or the loop looks busier than it is.
  if (d.available !== false && (d.runs || []).length
      && d.concept_total === 0 && d.edge_total === 0) {
    out.push(banner("warning", "\u25b3", "Orion has written no concepts and no edges",
      "It is handed a sample of the concept-induction graph every run, and the " +
      "prompt offers it <span class=\"mono\">:Concept</span> nodes and " +
      "SUPPORTS / CONTRADICTS / ABOUT edges. Across every run so far it has used " +
      "neither, so its world view is disconnected nodes rather than a graph \u2014 " +
      "and every prior it holds is on one subject."));
  }
  // A run that was KILLED before writing anything carries no run_id on any
  // node, so it is invisible to every panel here -- and it is the run you most
  // want to see. Redis counted it; the graph did not. The gap between the two
  // is the only evidence left, and it is worth surfacing loudly: this happened
  // for real on 2026-08-27 when both containers were recreated mid-turn and a
  // whole slot was spent on nothing.
  const s = d.schedule || {};
  if (s.available && typeof s.runs_today === "number" && d.available !== false) {
    // Both numbers come from the SERVER, in the zone the counter is keyed in.
    // Counting "today" in the browser compared a tally from one timezone
    // against a tally from another -- right only while the viewer and
    // HUB_ENDOGENOUS_OUTREACH_TZ agree, and wrong for everyone during the
    // hours the two dates disagree. It was 20:33 MDT on the 27th when this was
    // written and the host clock already said the 28th.
    //
    // An undated run counts as having written: its only timestamp comes from a
    // :TurnOutcome, so a turn killed mid-write has none, and calling that "not
    // today" reported it as traceless when it plainly left a trace.
    const wrote = s.runs_wrote_today;
    if (typeof wrote !== "number") { $("banners").innerHTML = out.join(""); return; }
    const missing = s.runs_today - wrote;
    if (missing > 0) {
      out.push(banner("warning", "△",
        `${missing} run${missing === 1 ? "" : "s"} today wrote nothing at all`,
        `The daily counter says ${s.runs_today} ran and ${wrote} left ` +
        `a node behind. A turn killed before it writes still spends its slot, and carries ` +
        `no run id on anything — so it appears in no panel below. Check Hub logs for it.`));
    }
  }
  $("banners").innerHTML = out.join("");
}

const banner = (cls, icon, title, detail) => `
  <div class="banner ${cls}"><span class="icon">${icon}</span>
    <div><div class="t">${title}</div><div class="d">${detail}</div></div></div>`;

/* --- tiles -------------------------------------------------------------- */
function renderTiles(d) {
  const s = d.schedule || {};
  const cap = s.daily_cap;
  const today = s.runs_today;
  const tiles = [
    tile("Live priors", d.live_total ?? "—", "still open to testing", d.pool_is_dead),
    tile("Closed", d.closed_total ?? "—", "refuted or retired"),
    tile("Runs today", today === null || today === undefined ? "—" : today,
         cap ? `of ${cap} allowed` : "cap unknown",
         cap && today >= cap),
    // A past cooldown is eligibility, not history: "8h 21m ago" read as though
    // something had been missed.
    tile("Next eligible",
         !s.next_eligible_at ? "—"
           : (new Date(s.next_eligible_at) <= new Date() ? "now"
              : fmtStamp(s.next_eligible_at)),
         !s.next_eligible_at ? "no cooldown recorded"
           : (new Date(s.next_eligible_at) <= new Date()
               ? (cap && today >= cap ? "cooldown clear — daily cap reached"
                  : "cooldown clear")
               : relative(s.next_eligible_at))),
  ];
  $("tiles").innerHTML = tiles.join("");
}

const tile = (label, value, foot, critical) => `
  <div class="card tile">
    <div class="label">${label}</div>
    <div class="value${critical ? " is-critical" : ""}">${esc(value)}</div>
    <div class="foot">${esc(foot)}</div>
  </div>`;

/* --- confidence small multiples ----------------------------------------
   One panel per prior rather than one chart with every prior overlaid: a
   single series per panel needs no categorical palette and no legend, and
   stays readable past the point where overlapping lines stop being. */
function renderTrajectories(d) {
  const priors = (d.priors || []).filter((p) => !p.is_closed);
  $("traj-note").innerHTML = d.history_recorded
    ? "Each panel is one prior. The line is its recorded confidence over the runs that tested it."
    : "<b>No movement has been recorded yet.</b> Orion writes a <span class=\"mono\">:PriorRevision</span> " +
      "when it tests a prior, and that is the only record of a claim <i>moving</i> rather than of where it " +
      "landed. Until the first one lands each panel shows a single point at where the prior stands now — " +
      "which means &ldquo;not recorded&rdquo;, never &ldquo;confidence never moved&rdquo;.";

  if (!priors.length) { $("trajectories").innerHTML = ""; return; }
  $("trajectories").innerHTML = priors.map((p) => {
    const pts = (p.trajectory || []).filter((t) => t.confidence !== null && t.confidence !== undefined);
    const body = pts.length > 1 ? sparkline(pts) : `
      <div class="none">${pts.length === 1
        ? `Held at <b>${pts[0].confidence.toFixed(2)}</b> — no revision recorded yet.`
        : "No confidence recorded."}</div>`;
    const delta = pts.length > 1 ? pts[pts.length - 1].confidence - pts[0].confidence : null;
    return `<div class="card spark">
      <div class="claim">${esc(p.claim)}</div>
      ${body}
      <div class="sub">${esc(p.status)} · tested ${p.times_tested}×${
        delta === null ? "" : ` · ${delta >= 0 ? "+" : ""}${delta.toFixed(2)} overall`}</div>
    </div>`;
  }).join("");
}

function sparkline(pts) {
  const W = 260, H = 74, PAD_X = 26, PAD_Y = 12;
  const xs = (i) => PAD_X + (i / (pts.length - 1)) * (W - PAD_X * 2);
  const ys = (c) => PAD_Y + (1 - c) * (H - PAD_Y * 2);   // fixed 0..1 domain
  const path = pts.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.confidence).toFixed(1)}`).join("");
  const dots = pts.map((p, i) =>
    `<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.confidence).toFixed(1)}" r="4"
       fill="var(--series-1)" stroke="var(--surface)" stroke-width="2">
       <title>${esc(p.run_id || "before")} · ${p.confidence.toFixed(2)}</title></circle>`).join("");
  const first = pts[0].confidence, last = pts[pts.length - 1].confidence;
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Confidence from ${first.toFixed(2)} to ${last.toFixed(2)} over ${pts.length} points">
    <line x1="${PAD_X}" y1="${ys(0.5)}" x2="${W - PAD_X}" y2="${ys(0.5)}"
          stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3" />
    <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round" />
    ${dots}
    <text x="${PAD_X - 6}" y="${ys(first) + 4}" text-anchor="end"
          font-size="10" fill="var(--ink-muted)">${first.toFixed(2)}</text>
    <text x="${W - PAD_X + 6}" y="${ys(last) + 4}"
          font-size="10" fill="var(--ink-2)" font-weight="600">${last.toFixed(2)}</text>
  </svg>`;
}

/* --- growth stacks ------------------------------------------------------ */
function renderGrowth(d) {
  const runs = (d.runs || []).filter((r) => r.total_added > 0);
  if (!runs.length) {
    $("growth").innerHTML = `<div class="dim" style="font-size:13px">No runs have written to the graph yet.</div>`;
    $("growth-table").innerHTML = "";
    return;
  }
  const { kinds, folded } = kindsPresent(runs);
  const max = Math.max(...runs.map((r) => r.total_added));

  $("growth").innerHTML = `
    <div class="legend">${kinds.map((k) => `
      <span class="item"><span class="swatch" style="background:${kindColor(k)}"></span>${esc(k)}</span>`).join("")}
    </div>
    <div class="bars">${runs.map((r) => {
      const width = (r.total_added / max) * 100;
      return `<div class="barrow">
        <span class="name" title="${esc(r.run_id)}">${esc(r.run_id.slice(0, 12))}</span>
        <div class="track" style="width:${width.toFixed(1)}%">${(() => {
          const b = bucketed(r.added || {}, kinds, folded);
          return kinds.map((k) => {
          const n = b[k] || 0;
          if (!n) return "";
          // Direct label inside every segment: light-mode aqua and yellow are
          // sub-3:1 on the surface, so the relief rule requires visible labels.
          return `<div class="seg" style="background:${kindColor(k)};flex:${n}"
                       title="${esc(k === OTHER ? folded.join(", ") : k)}: ${n}">${n >= 1 ? n : ""}</div>`;
        }).join(""); })()}</div>
        <span class="total">${r.total_added}</span>
      </div>`;
    }).join("")}</div>`;

  $("growth-table").innerHTML = `<table>
    <thead><tr><th>Run</th>${kinds.map((k) => `<th class="num">${esc(k)}</th>`).join("")}<th class="num">Total</th></tr></thead>
    <tbody>${runs.map((r) => {
      const b = bucketed(r.added || {}, kinds, folded);
      return `<tr>
      <td class="mono">${esc(r.run_id)}</td>
      ${kinds.map((k) => `<td class="num">${b[k] || 0}</td>`).join("")}
      <td class="num">${r.total_added}</td></tr>`;
    }).join("")}</tbody></table>`;
}

/* --- run ledger --------------------------------------------------------- */
function renderRuns(d) {
  const runs = d.runs || [];
  if (!runs.length) { $("runs").innerHTML = `<div class="card run dim">No runs recorded.</div>`; return; }
  $("runs").innerHTML = runs.map((r) => {
    const wrote = Object.entries(r.added || {}).map(([k, n]) => `${n} ${k}`).join(", ");
    const pills = [];
    // A run with hops and no outcome was killed mid-write. Showing it as an
    // ordinary quiet run would hide exactly the runs worth looking at.
    if (!r.written_at && r.hops > 0) pills.push(`<span class="pill critical">died before writing an outcome</span>`);
    if (r.reach_out) pills.push(`<span class="pill warn">wanted to reach out</span>`);
    if (r.continue_line) pills.push(`<span class="pill good">left itself a note</span>`);
    return `<div class="card run">
      <div class="head">
        <span class="rid">${esc(r.run_id)}</span>
        <span class="when">${fmtStamp(r.written_at)}</span>
        <span class="when">${r.hops} hop${r.hops === 1 ? "" : "s"}</span>
        ${pills.join(" ")}
      </div>
      <div class="wrote">${wrote ? `wrote ${esc(wrote)}` : "wrote nothing"}${
        r.priors_touched.length ? ` · re-tested ${r.priors_touched.length} prior${r.priors_touched.length === 1 ? "" : "s"}` : ""}</div>
      ${(r.hop_notes || []).length ? `<div class="working">
        <div class="working-label">The turn, step by step</div>
        <ol class="hops">${r.hop_notes.map((h) =>
          `<li>${esc(h.note)}</li>`).join("")}</ol>
      </div>` : ""}
      ${(r.findings || []).map((f) => `<p class="note"><b>Found</b> ${esc(f.text)}
        ${f.evidence ? `<span class="evidence"><b>Looked at</b> ${esc(f.evidence)}</span>` : ""}</p>`).join("")}
      ${r.journal ? `<details class="journal"><summary>What it wrote to you (${r.journal.length} chars)</summary>
        <div class="journal-body">${esc(r.journal)}</div></details>` : ""}
      ${r.reach_out_why ? `<p class="note"><b>Wanted to say</b> ${esc(r.reach_out_why)}</p>` : ""}
      ${r.continue_note ? `<p class="note"><b>Next</b> ${esc(r.continue_note)}</p>` : ""}
    </div>`;
  }).join("");
}

/* --- priors table ------------------------------------------------------- */
function renderPriors(d) {
  const priors = d.priors || [];
  $("priors-table").innerHTML = `
    <thead><tr>
      <th>Claim</th><th>Status</th><th class="num">Confidence</th>
      <th class="num">Tested</th><th>Created by</th><th>Last tested by</th>
    </tr></thead>
    <tbody>${priors.length ? priors.map((p) => `<tr>
      <td>${esc(p.claim)}</td>
      <td>${esc(p.status)}${p.is_closed ? ` <span class="dim">(closed)</span>` : ""}</td>
      <td class="num">${p.confidence === null || p.confidence === undefined ? "—" : p.confidence.toFixed(2)}</td>
      <td class="num">${p.times_tested}</td>
      <td class="mono">${esc(p.created_by_run || "—")}</td>
      <td class="mono">${esc(p.last_run_id || "—")}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="dim">No priors.</td></tr>`}</tbody>`;
}

/* --- load --------------------------------------------------------------- */
async function load() {
  try {
    const res = await fetch("/curiosity/api/atlas", { cache: "no-store" });
    const d = await res.json();
    renderBanners(d);
    renderTiles(d);
    renderTrajectories(d);
    renderGrowth(d);
    renderRuns(d);
    renderPriors(d);
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    $("banners").innerHTML = banner("critical", "⚠", "Could not load the atlas", esc(String(err)));
    $("updated").textContent = "Load failed";
  }
}

$("refresh").addEventListener("click", load);

// Skips the cooldown and the daily cap and nothing else. Confirmed first,
// because a turn is a real ~20-minute run on the same pipeline that serves
// Juniper -- a mis-click should not spend one.
$("run-now").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const msg = $("run-now-msg");
  if (!window.confirm(
        "Take a curiosity turn now?\n\n" +
        "Skips the cooldown and the daily cap. It still counts against today, " +
        "and it runs for about 20 minutes on the same pipeline that serves you.")) {
    return;
  }
  btn.disabled = true;
  msg.className = "run-msg";
  msg.textContent = "Requesting…";
  try {
    const res = await fetch("/curiosity/api/run-now", { method: "POST" });
    const d = await res.json();
    if (d.ok) {
      msg.textContent = d.detail || "Turn requested.";
      setTimeout(load, 3000);
    } else {
      msg.className = "run-msg bad";
      msg.textContent = `Refused: ${d.reason || res.status}`;
    }
  } catch (err) {
    msg.className = "run-msg bad";
    msg.textContent = `Failed: ${String(err)}`;
  }
  // Left disabled: the turn takes ~20 minutes and a second press would be
  // rejected as already_running anyway. Reload the page to arm it again.
});
$("toggle-tables").addEventListener("click", (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  $("growth-table").hidden = !on;
  $("growth").hidden = on;
});

/* The Hub embeds this page in an iframe on the Curiosity tab, and an iframe
   keeps running when its panel is hidden. A bare setInterval would be a
   FalkorDB read every 60s for a panel nobody is looking at, so the timer is
   owned by an activate/deactivate contract -- the same one Concept Atlas
   established, rather than a second convention. Standalone at /curiosity there
   is no host to call these, so the page starts its own timer immediately. */
const POLL_MS = 60000;
let timer = null;

function activate() {
  load();
  if (timer === null) timer = setInterval(load, POLL_MS);
}

function deactivate() {
  if (timer !== null) { clearInterval(timer); timer = null; }
}

window.OrionCuriosityAtlas = { refresh: load, activate, deactivate };

// Also stop while the whole tab is backgrounded, not only while the Hub panel
// is hidden -- the two are independent and either one alone leaves the poll
// running in a window nobody is looking at.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) deactivate();
  else if (timer === null) activate();
});

activate();
</script>
</body>
</html>
