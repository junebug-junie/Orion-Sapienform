services:
  execution-dispatch-runtime:
    build:
      context: ../..
      dockerfile: services/orion-execution-dispatch-runtime/Dockerfile
    container_name: ${PROJECT}-execution-dispatch-runtime
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "${EXECUTION_DISPATCH_RUNTIME_PORT:-8121}:8121"
    environment:
      - PROJECT=${PROJECT}
      - SERVICE_NAME=${SERVICE_NAME:-orion-execution-dispatch-runtime}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - NODE_NAME=${NODE_NAME:-athena}
      - POSTGRES_URI=${POSTGRES_URI}
      - EXECUTION_DISPATCH_POLICY_PATH=${EXECUTION_DISPATCH_POLICY_PATH:-/app/config/execution_dispatch/execution_dispatch_policy.v1.yaml}
      - EXECUTION_DISPATCH_MODE=${EXECUTION_DISPATCH_MODE:-dry_run}
      - EXECUTION_DISPATCH_POLL_INTERVAL_SEC=${EXECUTION_DISPATCH_POLL_INTERVAL_SEC:-2.0}
      # ROADMAP D2: dispatch_pending reconciler cadence. 0 = every tick (do not).
      - DISPATCH_RECONCILE_INTERVAL_SEC=${DISPATCH_RECONCILE_INTERVAL_SEC:-900}
      - ENABLE_EXECUTION_DISPATCH_RUNTIME=${ENABLE_EXECUTION_DISPATCH_RUNTIME:-true}
      - CORTEX_EXEC_CHANNEL=${CORTEX_EXEC_CHANNEL:-orion:cortex:exec:request:background}
      - CORTEX_EXEC_RESULT_PREFIX=${CORTEX_EXEC_RESULT_PREFIX:-orion:exec:result}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED:-true}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}
      - EXECUTION_DISPATCH_RPC_TIMEOUT_SEC=${EXECUTION_DISPATCH_RPC_TIMEOUT_SEC:-120}
      - ORION_DISPATCH_MAX_RISK_PER_DAY=${ORION_DISPATCH_MAX_RISK_PER_DAY:-10.0}
      - ORION_DISPATCH_MOTOR_BUDGET_SEC_PER_DAY=${ORION_DISPATCH_MOTOR_BUDGET_SEC_PER_DAY:-129600.0}
      - ORION_DISPATCH_MOTOR_BUDGET_ENFORCE=${ORION_DISPATCH_MOTOR_BUDGET_ENFORCE:-false}
      - ORION_DISPATCH_MOTOR_TYPICAL_COST_SEC=${ORION_DISPATCH_MOTOR_TYPICAL_COST_SEC:-5.0}
      - ORION_DISPATCH_MIN_NATS_PER_SEC=${ORION_DISPATCH_MIN_NATS_PER_SEC:-0.02}
      - ORION_DISPATCH_HOLDBACK_FRACTION=${ORION_DISPATCH_HOLDBACK_FRACTION:-0.0}
      - ORION_DISPATCH_RISK_CAP_ADVISORY_ONLY=${ORION_DISPATCH_RISK_CAP_ADVISORY_ONLY:-false}
      # This service uses an explicit allowlist, NOT env_file -- a key present
      # in .env_example, settings.py AND the live .env still does not reach the
      # container unless it is listed here, and every env-parity gate passes
      # while it is missing. Shipped exactly that way once (2026-08-25): the
      # tripwire probe's documented kill switch was unreachable in production.
      - ORION_DISPATCH_TRIPWIRE_PROBE_ENABLED=${ORION_DISPATCH_TRIPWIRE_PROBE_ENABLED:-true}
      - ORION_DISPATCH_TRIPWIRE_PROBE_COOLDOWN_SEC=${ORION_DISPATCH_TRIPWIRE_PROBE_COOLDOWN_SEC:-300.0}
      - ORION_DISPATCH_TRIPWIRE_PROBE_MAX_COOLDOWN_SEC=${ORION_DISPATCH_TRIPWIRE_PROBE_MAX_COOLDOWN_SEC:-3600.0}
      - ORION_DISPATCH_TRIPWIRE_REARM_SUCCESSES=${ORION_DISPATCH_TRIPWIRE_REARM_SUCCESSES:-3}
      - BUS_ACTION_OUTCOME_OUT=${BUS_ACTION_OUTCOME_OUT:-orion:autonomy:action:outcome}
      # 2026-08-12: fallback was http://orion-notify:7140, which does not
      # resolve -- verified live inside this very container
      # (socket.gethostbyname('orion-notify') -> gaierror; 'notify' -> ok).
      # The container name is ${PROJECT}-notify, so the compose service key
      # is the portable hostname. settings.py and .env_example already had
      # this right; only this fallback was stale, and since the live .env
      # does not set NOTIFY_URL the stale fallback is what actually ran --
      # so the theater tripwire's operator alert has been going nowhere.
      # Found while arming mutating dispatch; fixed here because that alert
      # is one of the things that makes the arming safe.
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:7140}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

networks:
  app-net:
    external: true
