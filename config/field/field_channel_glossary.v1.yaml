  # count once), an adaptive conformal p, excess = -ln p - calm point. Published as
  # prediction.joint_surprise.v1; services/orion-substrate-runtime/app/worker.py
  # _process_prediction_joint_surprise folds the last 30 min of independent outcomes with
  # orion/substrate/prediction_joint_surprise.py: z = sum(excess) / sqrt(sum(calm var)),
  # calm var = Var(-ln p) for a uniform conformal p (~1.0, theory), stored as clip(z / 3, 0, 1).
  # FalkorDB node only; the field digester's decay never touches it. Successor of
  # node:substrate.biometrics.
  - node: "node:prediction.body_joint"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: physical_substrate
    meaning: "How much Orion's body as a whole is surprising Orion's own forecast: every raw machine, cabinet, closet and cabinet-AC reading (plus office temperature) forecast together 5 and 15 minutes ahead, the misses scored as ONE joint miss (coupled readings count once), over the last 30 minutes, as excess surprise in units of its calm spread (a z-score), 3 sigma = 1.0. 0 = the body did what the forecast expected."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:prediction.body_joint'"
