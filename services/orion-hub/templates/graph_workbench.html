<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orion Graphs</title>
  <link rel="stylesheet" href="/static/css/graph-workbench.css">
  <script src="/static/js/graph-workbench.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Graphs</h1>
      <p id="source-help">Recent memory crystallizations and the evidence connected to them.</p>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Refresh graph</button>
      <a id="download" download>Download snapshot</a>
    </div>
  </header>

  <section class="controls" aria-label="Choose graph data">
    <label>
      Graph
      <select id="source">
        <option value="crystallizations" selected>Memory crystallizations — memories + evidence</option>
        <option value="worldview">Worldview — beliefs, claims + evidence</option>
        <option value="substrate">Substrate — concepts + relationships</option>
      </select>
    </label>
    <label>
      Focus
      <select id="seed">
        <option value="">Overview — recent memories</option>
      </select>
    </label>
    <label>
      Filter the Focus dropdown
      <input id="query" type="search" maxlength="200" placeholder="Type words from a memory…">
      <span id="focus-status">Loading named choices…</span>
    </label>
    <details>
      <summary>Advanced slice size</summary>
      <div class="advanced">
        <label>Relationship hops
          <select id="depth"><option value="1" selected>1 hop</option><option value="2">2 hops</option><option value="3">3 hops</option></select>
        </label>
        <label>Maximum nodes
          <select id="limit"><option value="100" selected>100</option><option value="300">300</option><option value="600">600</option><option value="1000">1,000</option></select>
        </label>
        <label class="check"><input id="lineage" type="checkbox" checked> Include memory evidence and projection references</label>
      </div>
    </details>
  </section>

  <p id="status" role="status" aria-live="polite">Preparing memory crystallizations…</p>
  <iframe id="graph-frame" title="Interactive Gephi graph"></iframe>
</body>
</html>
