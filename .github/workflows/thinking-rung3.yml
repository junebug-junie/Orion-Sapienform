name: Thinking rung 3 (bind the winner, compete across doers)
on:
  pull_request:
    paths:
      - 'orion/autonomy/act_candidates.py'
      - 'orion/autonomy/allocator.py'
      - 'orion/autonomy/self_shed.py'
      - 'orion/autonomy/prediction.py'
      - 'orion/autonomy/evals/run_rung3_replay_eval.py'
      - 'orion/substrate/attention_broadcast.py'
      - 'orion/substrate/attention/policy.py'
      - 'orion/execution_dispatch/**'
      - 'config/execution_dispatch/**'
      - 'services/orion-execution-dispatch-runtime/**'
      - 'tests/test_rung3_*.py'
      - '.github/workflows/thinking-rung3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rung3:
    runs-on: ubuntu-latest
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-thought/requirements.txt pytest pytest-asyncio psycopg2-binary
      - name: Binding fix + act-backed allocator candidates + holdback draw
        run: python -m pytest -q tests/test_rung3_world_first_action_floor.py tests/test_rung3_act_candidates.py tests/test_motor_allocator.py
      - name: Rung 3 replay eval (fixture mode)
        run: python orion/autonomy/evals/run_rung3_replay_eval.py
