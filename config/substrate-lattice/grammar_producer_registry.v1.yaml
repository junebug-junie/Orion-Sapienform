schema_version: grammar_producer_registry.v1

producers:
  - producer_id: orion-bus
    lane_id: transport
    source_service: orion-bus
    trace_prefixes:
      - "bus.transport:"
    field_capability_id: "capability:transport"
    attention_target_id: "capability:transport"
    trusted_channels:
      - stream_backlog_health
      - stream_backlog_pressure
      - contract_pressure
      - catalog_drift_pressure
      - observer_failure_pressure
      - delivery_confidence
    action_ceiling_default: dry_run
    status: live

  - producer_id: orion-biometrics
    lane_id: biometrics
    source_service: orion-biometrics
    status: planned

  - producer_id: orion-cortex-exec
    lane_id: execution
    source_service: orion-cortex-exec
    status: live

  - producer_id: orion-cortex-orch
    lane_id: route
    source_service: orion-cortex-orch
    status: planned

  - producer_id: orion-llm-gateway
    lane_id: llm_inference
    source_service: orion-llm-gateway
    trace_prefixes:
      - "llm_gateway.inference:"
    field_capability_id: "capability:llm_inference"
    trusted_channels:
      - inference_failure_pressure
    # planned until LLM_GATEWAY_GRAMMAR_ENABLED / ENABLE_LLM_INFERENCE_REDUCER /
    # ENABLE_LLM_INFERENCE_FIELD_DIGESTION are all flipped on and verified live.
    status: planned
