      rest: "0.0 = the joint misses are no bigger than a calibrated forecaster's (z <= 0). Reachable by theory (calm z ~ N(0, 1): exact 0 half the time); live replay of 4.5 days of stored blended joint rows through this fold (2026-11-13..18, PR #3575 report): 58% exact 0.0."
      # rest_range: calm z within +1.65 sigma -> stored value in [0, 0.55]. Live replay of the
      # stored blended family_a rows (1,506 writes, 11-13 18:06..11-18 05:36): p50 0.0, p90 0.62,
      # 0.55 crossed on 11.7 % of writes (consecutive joint misses are autocorrelated, as for
      # node:prediction.body). Body-group rows start at deploy; re-measure after 7 days.
      rest_range: [0.0, 0.55]
      sparsity: per_tick
      absent_means: "written once per scored joint-group bucket (about every 5 min). Nothing is written when no row passes (prediction service down, a refused bucket, the first hour after a restart before the adaptive p exists, PREDICTION_JOINT_SURPRISE_EVENTS_ENABLED or SUBSTRATE_PREDICTION_JOINT_SURPRISE_NODES_ENABLED off): the node keeps its last value (current for up to 1800 s), then every reader treats it as stale, never as calm."
