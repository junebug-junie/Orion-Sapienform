services:
  orion-vision-retina:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    build:
      context: ../..
      dockerfile: services/orion-vision-retina/Dockerfile
    container_name: orion-vision-retina
    # The service exits on purpose when it cannot see (a dead capture task,
    # publisher watchdog, wedged RTSP readers); this brings it back.
    restart: unless-stopped
    # Same reason as the walkway instance below: let an RTSP reader release
    # (TEARDOWN) before SIGKILL. Harmless for webcam/folder sources.
    stop_grace_period: 30s
    environment:
      - ORION_BUS_URL=${ORION_BUS_URL:-redis://100.92.216.81:6379/0}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - CHANNEL_RETINA_PUB=${CHANNEL_RETINA_PUB:-orion:vision:frames}
      - CHANNEL_RETINA_ERROR=${CHANNEL_RETINA_ERROR:-orion:vision:retina:error}
      - CHANNEL_SYSTEM_HEALTH=${CHANNEL_SYSTEM_HEALTH:-orion:system:health}
      - RETINA_SOURCE_TYPE=${RETINA_SOURCE_TYPE:-folder}
      - RETINA_SOURCE=${RETINA_SOURCE:-/mnt/telemetry/vision/intake}
      - RETINA_CAMERA_ID=${RETINA_CAMERA_ID:-retina-cam-01}
      - RETINA_STREAM_ID=${RETINA_STREAM_ID:-retina-stream-01}
      - RETINA_FPS=${RETINA_FPS:-1.0}
      - RETINA_WIDTH=${RETINA_WIDTH:-}
      - RETINA_HEIGHT=${RETINA_HEIGHT:-}
      - FRAME_STORAGE_DIR=${FRAME_STORAGE_DIR:-/mnt/telemetry/vision/frames}
      - RETINA_FRAME_MODE=${RETINA_FRAME_MODE:-local}
      - RETINA_PERCEPT_STORE_URL=${RETINA_PERCEPT_STORE_URL:-}
      - RETINA_PERCEPT_STORE_TOKEN=${RETINA_PERCEPT_STORE_TOKEN:-}
      - RETINA_PERCEPT_TIMEOUT_SEC=${RETINA_PERCEPT_TIMEOUT_SEC:-10.0}
      - FRAME_RETENTION_SECONDS=${FRAME_RETENTION_SECONDS:-300}
      - JPEG_QUALITY=${JPEG_QUALITY:-90}
      - HEALTH_INTERVAL_SECONDS=${HEALTH_INTERVAL_SECONDS:-10.0}
      # Publisher watchdog: degraded health, then exit-for-restart (main.py).
      - RETINA_PUBLISH_STALL_SECONDS=${RETINA_PUBLISH_STALL_SECONDS:-120.0}
      - SOURCE_RECONNECT_SECONDS=${SOURCE_RECONNECT_SECONDS:-5.0}
      # RTSP only: TCP transport, read timeout, stall watchdog (sources.py).
      - RETINA_RTSP_TRANSPORT=${RETINA_RTSP_TRANSPORT:-tcp}
      - RETINA_RTSP_IO_TIMEOUT_SECONDS=${RETINA_RTSP_IO_TIMEOUT_SECONDS:-5.0}
      - RETINA_RTSP_STALL_SECONDS=${RETINA_RTSP_STALL_SECONDS:-30.0}
      # Quiet period before every RTSP (re)connect + persisted last-session
      # time + live corruption self-heal (sources.py RtspSessionGate).
      - RETINA_RTSP_RECONNECT_QUIET_SECONDS=${RETINA_RTSP_RECONNECT_QUIET_SECONDS:-90.0}
      - RETINA_RTSP_SESSION_STATE_DIR=${RETINA_RTSP_SESSION_STATE_DIR:-/var/lib/orion-vision-retina}
      - RETINA_RTSP_HEAL_ENABLED=${RETINA_RTSP_HEAL_ENABLED:-true}
      - RETINA_RTSP_HEAL_CHECK_EVERY=${RETINA_RTSP_HEAL_CHECK_EVERY:-10}
      - RETINA_RTSP_HEAL_WINDOW_SECONDS=${RETINA_RTSP_HEAL_WINDOW_SECONDS:-120.0}
      - RETINA_RTSP_HEAL_MIN_SHARE=${RETINA_RTSP_HEAL_MIN_SHARE:-0.8}
      # On-demand clip capture (AffectGPT) -- UNVERIFIED against real
      # hardware, see app/clip_capture.py. Off by default.
      - RETINA_CLIP_ENABLED=${RETINA_CLIP_ENABLED:-false}
      - RETINA_CLIP_TOKEN=${RETINA_CLIP_TOKEN:-}
      - RETINA_CLIP_FFMPEG_BIN=${RETINA_CLIP_FFMPEG_BIN:-ffmpeg}
      - RETINA_CLIP_VIDEO_DEVICE=${RETINA_CLIP_VIDEO_DEVICE:-/dev/video0}
      - RETINA_CLIP_AUDIO_INPUT=${RETINA_CLIP_AUDIO_INPUT:-default}
      - RETINA_CLIP_DURATION_SEC=${RETINA_CLIP_DURATION_SEC:-8.0}
      - RETINA_CLIP_FRAMERATE=${RETINA_CLIP_FRAMERATE:-15}
      - RETINA_CLIP_WIDTH=${RETINA_CLIP_WIDTH:-}
      - RETINA_CLIP_HEIGHT=${RETINA_CLIP_HEIGHT:-}
      - RETINA_CLIP_TIMEOUT_SEC=${RETINA_CLIP_TIMEOUT_SEC:-30.0}
      - RETINA_CLIP_MIN_INTERVAL_SEC=${RETINA_CLIP_MIN_INTERVAL_SEC:-30.0}
      # Bus-reachable twin of POST /capture/clip -- see .env_example comment.
      - CHANNEL_RETINA_CLIP_INTAKE=${CHANNEL_RETINA_CLIP_INTAKE:-orion:exec:request:RetinaClipCaptureService}
      - CHANNEL_RETINA_CLIP_REPLY_PREFIX=${CHANNEL_RETINA_CLIP_REPLY_PREFIX:-orion:retina:clip:reply}
      # ffmpeg's `-f pulse` input looks here by default -- best-effort
      # default for a single-user desktop Linux session, NOT verified
      # against carbon's actual audio backend/UID. Override
      # PULSE_SERVER_UID below if carbon's user is not uid 1000 (`id -u`
      # on carbon).
      - PULSE_SERVER=unix:/run/user/${PULSE_SERVER_UID:-1000}/pulse/native
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-vision-retina/app:/app/app
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/orion:/app/orion
      # Frame dirs are only used by RETINA_FRAME_MODE=local. In percept_store
      # mode nothing is written to disk, and these mounts are inert -- harmless
      # to keep so one compose file serves both deployments.
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames
      - /mnt/telemetry/vision/intake:/mnt/telemetry/vision/intake
      # RTSP last-session time, survives container recreate (deploys).
      - /mnt/telemetry/vision/retina_state:/var/lib/orion-vision-retina
      # PulseAudio/PipeWire socket passthrough for clip_capture.py's audio
      # capture. UNVERIFIED path -- if this host directory doesn't exist,
      # Docker silently creates an empty one rather than failing startup, so
      # a wrong path here fails at actual capture time (a clear ffmpeg
      # connection error), not at `docker compose up`. Adjust
      # PULSE_SERVER_UID above, or this whole mount, if carbon's real
      # socket lives elsewhere.
      - /run/user/${PULSE_SERVER_UID:-1000}/pulse:/run/user/${PULSE_SERVER_UID:-1000}/pulse

    # Webcam passthrough. Required for RETINA_SOURCE_TYPE=webcam and inert
    # otherwise -- `${RETINA_VIDEO_DEVICE:-/dev/null}` means a host with no
    # camera still starts. Set RETINA_VIDEO_DEVICE=/dev/video0 on a node that
    # has one (see docs/operations/carbon-webcam.md).
    devices:
      - ${RETINA_VIDEO_DEVICE:-/dev/null}:${RETINA_VIDEO_DEVICE:-/dev/null}
    ports:
      # Only needed for POST /capture/clip (bus-only otherwise). Added
      # 2026-08-22; not previously exposed. Bound to 127.0.0.1 explicitly --
      # docs/operations/carbon-webcam.md's whole documented security posture
      # for this service is "nothing needs to reach carbon inbound" /
      # "127.0.0.1 on purpose" (the venv/systemd deploy path already does
      # this via `uvicorn --host 127.0.0.1`); a bare `"PORT:8000"` mapping
      # here would publish to 0.0.0.0 by default and break that posture for
      # anyone using the Docker path instead (review finding, 2026-08-22).
      # Also gated by RETINA_CLIP_TOKEN (settings.py) as defense in depth --
      # a POST here triggers a live recording, unlike every other route.
      #
      # Default is 8027, NOT 8022 -- confirmed live 2026-08-22:
      # orion-athena-cortex-gateway already owns 8022 on athena, a
      # multi-service host retina can also run on (room camera / cam0
      # instance, alongside carbon's own). See .env_example for the full
      # story; carbon's separate venv/systemd deployment is unaffected.
      - "127.0.0.1:${RETINA_HTTP_PORT:-8027}:8000"
    networks:
      - app-net


  # The walkway camera (docs/superpowers/specs/2026-09-22-walkway-camera-busy-
  # world-design.md): an outdoor Reolink facing the community walkway, with a
  # partial patio view. Its own retina instance, reading the camera's
  # full-resolution main stream (2560x1920) so people across the street are
  # big enough to tell apart, sampled at WALKWAY_RETINA_FPS (default 2) --
  # the RTSP reader keeps only the newest frame, so a low sample rate never
  # lags the live picture. stream_id/camera_id are fixed to `walkway`, which
  # matches config/vision_frame_router.yaml `streams.walkway` and
  # config/vision_zones.yaml. Behind the `walkway` profile so a plain `up`
  # never starts it with an empty WALKWAY_RTSP_URL:
  #   scripts/safe_docker_build.sh orion-vision-retina --profile walkway up -d --build orion-vision-retina-walkway
  orion-vision-retina-walkway:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    profiles: ["walkway"]
    build:
      context: ../..
      dockerfile: services/orion-vision-retina/Dockerfile
    container_name: orion-vision-retina-walkway
    restart: unless-stopped
    # On SIGTERM the RTSP reader's stop waits up to 12s (FFmpeg open timeout
    # + 2s) for a blocked open/read so the reader itself releases the capture
    # -- that release sends RTSP TEARDOWN. SIGKILL before it leaves the
    # camera holding a stale session. Room for that plus the bus close.
    stop_grace_period: 30s
    environment:
      - ORION_BUS_URL=${ORION_BUS_URL:-redis://100.92.216.81:6379/0}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - CHANNEL_RETINA_PUB=${CHANNEL_RETINA_PUB:-orion:vision:frames}
      - CHANNEL_RETINA_ERROR=${CHANNEL_RETINA_ERROR:-orion:vision:retina:error}
      - CHANNEL_SYSTEM_HEALTH=${CHANNEL_SYSTEM_HEALTH:-orion:system:health}
      - SERVICE_NAME=vision-retina-walkway
      - RETINA_SOURCE_TYPE=rtsp
      # Empty is refused at boot (RtspFrameSource raises).
      - RETINA_SOURCE=${WALKWAY_RTSP_URL:-}
      - RETINA_CAMERA_ID=walkway
      - RETINA_STREAM_ID=walkway
      - RETINA_FPS=${WALKWAY_RETINA_FPS:-2.0}
      - RETINA_WIDTH=
      - RETINA_HEIGHT=
      - FRAME_STORAGE_DIR=${FRAME_STORAGE_DIR:-/mnt/telemetry/vision/frames}
      - RETINA_FRAME_MODE=local
      # Each writer prunes only its own files (frame_store.owned_frame_pattern;
      # the edge prunes only frame_/still_), so walkway frames live this long.
      # Ample for router -> host (seconds) and story-strip capture.
      - FRAME_RETENTION_SECONDS=${FRAME_RETENTION_SECONDS:-300}
      - JPEG_QUALITY=${WALKWAY_RETINA_JPEG_QUALITY:-88}
      - HEALTH_INTERVAL_SECONDS=${HEALTH_INTERVAL_SECONDS:-10.0}
      # Publisher watchdog: degraded health, then exit-for-restart (main.py).
      - RETINA_PUBLISH_STALL_SECONDS=${RETINA_PUBLISH_STALL_SECONDS:-120.0}
      - SOURCE_RECONNECT_SECONDS=${SOURCE_RECONNECT_SECONDS:-5.0}
      # RTSP only: TCP transport, read timeout, stall watchdog (sources.py).
      - RETINA_RTSP_TRANSPORT=${RETINA_RTSP_TRANSPORT:-tcp}
      - RETINA_RTSP_IO_TIMEOUT_SECONDS=${RETINA_RTSP_IO_TIMEOUT_SECONDS:-5.0}
      - RETINA_RTSP_STALL_SECONDS=${RETINA_RTSP_STALL_SECONDS:-30.0}
      # Quiet period before every RTSP (re)connect + persisted last-session
      # time + live corruption self-heal (sources.py RtspSessionGate).
      - RETINA_RTSP_RECONNECT_QUIET_SECONDS=${RETINA_RTSP_RECONNECT_QUIET_SECONDS:-90.0}
      - RETINA_RTSP_SESSION_STATE_DIR=${RETINA_RTSP_SESSION_STATE_DIR:-/var/lib/orion-vision-retina}
      - RETINA_RTSP_HEAL_ENABLED=${RETINA_RTSP_HEAL_ENABLED:-true}
      - RETINA_RTSP_HEAL_CHECK_EVERY=${RETINA_RTSP_HEAL_CHECK_EVERY:-10}
      - RETINA_RTSP_HEAL_WINDOW_SECONDS=${RETINA_RTSP_HEAL_WINDOW_SECONDS:-120.0}
      - RETINA_RTSP_HEAL_MIN_SHARE=${RETINA_RTSP_HEAL_MIN_SHARE:-0.8}
      # No clip capture on this instance: clip requests target carbon.
      - RETINA_CLIP_ENABLED=false
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-vision-retina/app:/app/app
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/orion:/app/orion
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames
      # RTSP last-session time, survives container recreate (deploys), so a
      # deploy restart waits the quiet period instead of corrupting the
      # stream (2026-10-16). Per-stream file name; shared dir is fine.
      - /mnt/telemetry/vision/retina_state:/var/lib/orion-vision-retina
    ports:
      - "127.0.0.1:${WALKWAY_RETINA_HTTP_PORT:-8028}:8000"
    networks:
      - app-net

  # The Ring doorbell (battery, no Ring Protect plan): no RTSP and no saved
  # recordings, and it cannot take a snapshot while it records. On each Ring
  # motion/ding push event this instance opens a short live view
  # (DOORBELL_RING_BURST_SECONDS) and samples it at DOORBELL_RETINA_FPS --
  # never continuous video. stream_id/camera_id `doorbell` match
  # config/vision_frame_router.yaml `streams.doorbell` and
  # config/vision_zones.yaml. Ring login, once, after the first `up`:
  #   docker exec -it orion-vision-retina-doorbell python -m app.ring_login
  # The token lands in /mnt/telemetry/vision/ring_state (owner-only, mounted
  # into this container only -- the other retinas share retina_state and must
  # not read Ring credentials); the source picks it up within a minute, no
  # restart. Behind the
  # `doorbell` profile, like the walkway:
  #   scripts/safe_docker_build.sh orion-vision-retina --profile doorbell up -d --build orion-vision-retina-doorbell
  orion-vision-retina-doorbell:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    profiles: ["doorbell"]
    build:
      context: ../..
      dockerfile: services/orion-vision-retina/Dockerfile
    container_name: orion-vision-retina-doorbell
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - ORION_BUS_URL=${ORION_BUS_URL:-redis://100.92.216.81:6379/0}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG:-false}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED:-false}
      - CHANNEL_RETINA_PUB=${CHANNEL_RETINA_PUB:-orion:vision:frames}
      - CHANNEL_RETINA_ERROR=${CHANNEL_RETINA_ERROR:-orion:vision:retina:error}
      - CHANNEL_SYSTEM_HEALTH=${CHANNEL_SYSTEM_HEALTH:-orion:system:health}
      - SERVICE_NAME=vision-retina-doorbell
      - RETINA_SOURCE_TYPE=ring
      # The doorbell's name in the Ring app, or its device id. Empty = the
      # first camera on the account.
      - RETINA_SOURCE=${DOORBELL_RING_DEVICE:-}
      - RETINA_CAMERA_ID=doorbell
      - RETINA_STREAM_ID=doorbell
      - RETINA_FPS=${DOORBELL_RETINA_FPS:-2.0}
      - RETINA_WIDTH=
      - RETINA_HEIGHT=
      - FRAME_STORAGE_DIR=${FRAME_STORAGE_DIR:-/mnt/telemetry/vision/frames}
      - RETINA_FRAME_MODE=local
      - FRAME_RETENTION_SECONDS=${FRAME_RETENTION_SECONDS:-300}
      - JPEG_QUALITY=${DOORBELL_RETINA_JPEG_QUALITY:-88}
      - HEALTH_INTERVAL_SECONDS=${HEALTH_INTERVAL_SECONDS:-10.0}
      # Publisher watchdog: degraded health, then exit-for-restart (main.py).
      - RETINA_PUBLISH_STALL_SECONDS=${RETINA_PUBLISH_STALL_SECONDS:-120.0}
      - RETINA_RING_STATE_DIR=/var/lib/orion-vision-ring
      - RETINA_RING_EVENT_KINDS=${DOORBELL_RING_EVENT_KINDS:-motion,ding}
      - RETINA_RING_BURST_SECONDS=${DOORBELL_RING_BURST_SECONDS:-15.0}
      - RETINA_RING_COOLDOWN_SECONDS=${DOORBELL_RING_COOLDOWN_SECONDS:-30.0}
      - RETINA_CLIP_ENABLED=false
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-vision-retina/app:/app/app
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/orion:/app/orion
      - /mnt/telemetry/vision/frames:/mnt/telemetry/vision/frames
      - /mnt/telemetry/vision/ring_state:/var/lib/orion-vision-ring
    ports:
      - "127.0.0.1:${DOORBELL_RETINA_HTTP_PORT:-8029}:8000"
    networks:
      - app-net

networks:
  app-net:
    external: true
