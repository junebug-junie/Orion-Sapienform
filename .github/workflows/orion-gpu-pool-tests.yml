name: orion-gpu-pool tests

on:
  pull_request:
    paths:
      - "services/orion-gpu-pool/**"
      - "orion/gpu_pool/**"
      - "orion/schemas/gpu_pool.py"
      - "config/gpu_pool.yaml"
      - "config/llm_profiles.yaml"
      - "services/orion-llamacpp-host/**"
      - "services/orion-sql-db/manual_migration_gpu_pool_v1.sql"
      - "services/orion-sql-db/manual_migration_gpu_pool_v2_holds.sql"
      # the visual_baseline swap guard reads this policy (stage 4.3)
      - "config/proposals/visual_baseline.v1.yaml"
      - "services/orion-equilibrium-service/app/settings.py"
      - "services/orion-equilibrium-service/.env_example"
      - "services/orion-equilibrium-service/docker-compose.yml"
      - "scripts/check_gpu_pool_config.py"
      # check_gpu_pool_config.py's launch-block check reads these (stage 4.1)
      - "services/orion-diffusion-host/docker-compose.yml"
      - "services/orion-diffusion-host/.env_example"
      - "orion/llm/resource_lease.py"
      - "services/orion-hub/scripts/gpu_pool_routes.py"
      - "services/orion-hub/templates/gpu_pool.html"
      - "services/orion-hub/static/js/gpu_pool*.js"
      - "services/orion-hub/tests/test_gpu_pool_*.py"
      - ".github/workflows/orion-gpu-pool-tests.yml"
      # stage 4.4: consumers of the GPU lease ref (the "consumers" job below)
      - "orion/harness/fcc_motor.py"
      - "orion/harness/finalize.py"
      - "orion/harness/runner.py"
      - "orion/harness/tests/test_gpu_lease_transport.py"
      - "orion/hub/turn_orchestrator.py"
      - "orion/schemas/harness_finalize.py"
      - "orion/schemas/thought.py"
      - "orion/schemas/durable_run.py"
      - "orion/field/queue_contention.py"
      - "services/orion-field-digester/app/store.py"
      - "services/orion-field-digester/tests/test_queue_contention_digestion.py"
      - "services/orion-field-digester/tests/test_durable_waiting_sql_postgres.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "services/orion-harness-governor/app/bus_listener.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "services/orion-hub/scripts/thought_client.py"
      - "services/orion-hub/tests/test_curiosity_gpu_lease.py"
  push:
    branches: [main]
    paths:
      - "services/orion-gpu-pool/**"
      - "orion/gpu_pool/**"
      - "orion/schemas/gpu_pool.py"
      - "config/gpu_pool.yaml"
      - "config/llm_profiles.yaml"
      - "services/orion-llamacpp-host/**"
      - "services/orion-hub/scripts/gpu_pool_routes.py"
      - "services/orion-hub/static/js/gpu_pool*.js"
      - "scripts/check_gpu_pool_config.py"
      - "services/orion-sql-db/manual_migration_gpu_pool_v*.sql"
      - "config/proposals/visual_baseline.v1.yaml"
      - "services/orion-diffusion-host/docker-compose.yml"
      - "services/orion-diffusion-host/.env_example"
      - "orion/llm/resource_lease.py"
      # stage 4.4: consumers of the GPU lease ref (the "consumers" job below)
      - "orion/harness/fcc_motor.py"
      - "orion/harness/finalize.py"
      - "orion/harness/runner.py"
      - "orion/harness/tests/test_gpu_lease_transport.py"
      - "orion/hub/turn_orchestrator.py"
      - "orion/schemas/harness_finalize.py"
      - "orion/schemas/thought.py"
      - "orion/schemas/durable_run.py"
      - "orion/field/queue_contention.py"
      - "services/orion-field-digester/app/store.py"
      - "services/orion-field-digester/tests/test_queue_contention_digestion.py"
      - "services/orion-field-digester/tests/test_durable_waiting_sql_postgres.py"
      - "services/orion-thought/app/bus_listener.py"
      - "services/orion-cortex-exec/app/executor.py"
      - "services/orion-harness-governor/app/bus_listener.py"
      - "services/orion-hub/scripts/curiosity_investigation.py"
      - "services/orion-hub/scripts/thought_client.py"
      - "services/orion-hub/tests/test_curiosity_gpu_lease.py"

jobs:
  pool:
    name: gpu-pool — config gate, scheduler, lease graph, runtime, Postgres, eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gpu-pool-test
          POSTGRES_DB: gpu_pool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-gpu-pool/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Config gate (config/gpu_pool.yaml vs llama.cpp compose roles/ports)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_gpu_pool_config.py
      - name: Pure core (config, scheduler, discovery, lease graph, transport contract)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest orion/gpu_pool/tests -q -p no:cacheprovider
      - name: Service (runtime, client round trip, Postgres store + restart)
        env:
          GPU_POOL_TEST_POSTGRES_URI: postgresql://postgres:gpu-pool-test@127.0.0.1:5432/gpu_pool_test
        run: cd services/orion-gpu-pool && python -m pytest tests -q -p no:cacheprovider
      - name: Worker announce (llamacpp-host side of the discovery bridge)
        env:
          LLM_PROFILE_NAME: ci
        run: |
          python -m pip install -r services/orion-llamacpp-host/requirements.txt
          cd services/orion-llamacpp-host && python -m pytest tests/test_worker_announce.py -q -p no:cacheprovider
      - name: Hub operator panel routes (bus RPC shape, operator guard, SSE feed, history SQL on Postgres)
        env:
          GPU_POOL_TEST_POSTGRES_URI: postgresql://postgres:gpu-pool-test@127.0.0.1:5432/gpu_pool_test
        run: |
          python -m pip install fastapi==0.111.0 httpx==0.27.2 pydantic==2.11.5 pydantic-settings==2.5.2 \
            SQLAlchemy==2.0.43 psycopg2-binary aiohttp==3.12.15 python-multipart
          cd services/orion-hub && python -m pytest tests/test_gpu_pool_routes.py -q -p no:cacheprovider
      - name: Policy eval (owner starvation, lost leases, spill-down violations)
        run: python services/orion-gpu-pool/evals/run_pool_day_eval.py

  consumers:
    name: gpu-pool stage 4.4 — callers carry the lease ref (gateway attach is in durable-runs' gateway job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gpu-pool-test
          POSTGRES_DB: gpu_pool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      GPU_POOL_TEST_POSTGRES_URI: postgresql://postgres:gpu-pool-test@127.0.0.1:5432/gpu_pool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install fastapi==0.111.0 httpx==0.27.2 pydantic==2.11.5 pydantic-settings==2.5.2 \
            SQLAlchemy==2.0.43 aiohttp==3.12.15 python-multipart requests python-dotenv loguru numpy==1.26.4
      - name: Pool client attach/status + harness/FCC ref transport
        run: python -m pytest orion/gpu_pool/tests/test_client_attach.py orion/harness/tests/test_gpu_lease_transport.py -q -p no:cacheprovider
      - name: field-digester durable_demand_pending across the hold cutover (real Postgres)
        run: cd services/orion-field-digester && python -m pytest tests/test_queue_contention_digestion.py tests/test_durable_waiting_sql_postgres.py -q -p no:cacheprovider
      - name: orion-thought stance carries the ref
        run: cd services/orion-thought && python -m pytest tests/test_stance_context_llm_route.py -q -p no:cacheprovider
      - name: cortex-exec forwards options.gpu_lease
        run: cd services/orion-cortex-exec && python -m pytest tests/test_resource_lease_forwarding.py -q -p no:cacheprovider
      - name: harness-governor admits hold-carrying turns
        run: cd services/orion-harness-governor && python -m pytest tests/test_lane_dispatch_channels.py -q -p no:cacheprovider
      - name: Hub fences the ref with pool status and runs the turn under it
        run: |
          cd services/orion-hub && python -m pytest tests/test_curiosity_gpu_lease.py tests/test_thought_client.py \
            tests/test_turn_orchestrator_ws_frames.py -q -p no:cacheprovider
