name: evaluate
label: Evaluate
description: >
  Evaluate the correctness, coherence, or completeness of a given output.

category: MetaCognition
priority: medium

interruptible: true
can_interrupt_others: false

requires_gpu: true
requires_memory: false

timeout_ms: 60000
max_recursion_depth: 1

services:
  - LLMGatewayService

prompt_template: evaluate_prompt.j2

plan:
  - name: compose_evaluation_prompt
    description: Build evaluation prompt.
    order: 0
    prompt_template: evaluate_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: llm_evaluate_output
    description: Evaluate the input.
    order: 1
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
