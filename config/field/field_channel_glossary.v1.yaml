  # value, z = summed excess / sqrt(summed calm variance). Published as
  # prediction.turn_surprise.v1; services/orion-substrate-runtime/app/worker.py
  # _process_prediction_turn_surprise folds the last 30 min of turns with
  # orion/substrate/prediction_turn_surprise.py and stores clip(z / 3, 0, 1).
  # FalkorDB node only; the field digester's decay never touches it.
  - node: "node:prediction.chat_turn"
    producer: orion-substrate-runtime
    channel: prediction_error
    level: [node]
    category: social_conversational
    meaning: "How much Orion's recent chat turns surprised Orion's own bets about them (will the reply ask a question; will it take more steps than usual), over the last 30 minutes: summed excess surprise in nats over what the recalibrated bets expected, divided by its calm spread (a z-score), 3 sigma = 1.0. 0 = the turns went the way the bets leaned."
    trend_source: "substrate_node_prediction_error_history WHERE node_id = 'node:prediction.chat_turn'"
    consumers:
      - "orion.substrate.endogenous_curiosity:_prediction_error_candidates"
      - "orion.attention.world_first:judge_candidate"
    semantics:
      value_kind: surprise_excess
      rest: "0.0 = the turns went no more surprisingly than calibrated bets expect (z <= 0). Reachable by theory (a turn that goes the likely way reads z < 0) and live: 85% of 294 settled chat turns rest at exactly 0.0, 79% of node writes (replay 2026-10-24..11-13, backlog turns skipped as live, services/orion-prediction/evals/run_turn_surprise_replay_eval.py)."
      # rest_range: calm z within +1.65 sigma -> stored value in [0, 0.55]. Live replay
      # 2026-11-13 (294 turns): per-turn z mean -0.08 sd 0.95; node p50 0.0 p90 0.53,
      # 0.55 crossed on 9.9 % of writes (a window of 2 turns crosses more often than one).
      rest_range: [0.0, 0.55]
      sparsity: event_gated
      absent_means: "written once per settled chat turn whose used bets carry information. No chat turn (or PREDICTION_TURN_SURPRISE_EVENTS_ENABLED / SUBSTRATE_PREDICTION_TURN_SURPRISE_NODE_ENABLED off, or orion-prediction down) writes nothing: the node keeps its last value, current for up to 1800 s, then every reader treats it as stale, never as calm. Live replay: fresh 27% of the time."
      prompt_sites:
        - "orion.attention.self_readings:render_self_readings"

