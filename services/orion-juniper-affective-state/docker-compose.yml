services:
  juniper-affective-state:
    build:
      context: ../..
      dockerfile: services/orion-juniper-affective-state/Dockerfile
    container_name: ${PROJECT}-juniper-affective-state
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      # Deliberately circe, not athena -- see app/settings.py NODE_NAME comment.
      - NODE_NAME=${NODE_NAME:-circe}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}

      - CHANNEL_AFFECTGPT_INTAKE=${CHANNEL_AFFECTGPT_INTAKE}
      - CHANNEL_AFFECTGPT_REPLY_PREFIX=${CHANNEL_AFFECTGPT_REPLY_PREFIX}
      - CHANNEL_AFFECTGPT_ASSESSMENT=${CHANNEL_AFFECTGPT_ASSESSMENT}
      - AFFECTGPT_RPC_TIMEOUT_S=${AFFECTGPT_RPC_TIMEOUT_S}

      # Live capture bridge (2026-08-22) -- see .env_example comments.
      - CHANNEL_RETINA_CLIP_INTAKE=${CHANNEL_RETINA_CLIP_INTAKE:-orion:exec:request:RetinaClipCaptureService}
      - CHANNEL_RETINA_CLIP_REPLY_PREFIX=${CHANNEL_RETINA_CLIP_REPLY_PREFIX:-orion:retina:clip:reply}
      - RETINA_CLIP_RPC_TIMEOUT_S=${RETINA_CLIP_RPC_TIMEOUT_S:-60}
      - PERCEPT_STORE_BASE_URL=${PERCEPT_STORE_BASE_URL:-}
      - PERCEPT_STORE_TIMEOUT_SEC=${PERCEPT_STORE_TIMEOUT_SEC:-15}
      - PERCEPT_STORE_TOKEN=${PERCEPT_STORE_TOKEN:-}
      - AFFECTGPT_SCRATCH_DIR=${AFFECTGPT_SCRATCH_DIR:-/mnt/scripts/orion-affectgpt-scratch}

    volumes:
      # Shared scratch: this service fetches percept-store blobs and writes
      # them here (capture_and_assess()'s tempfile, dir=AFFECTGPT_SCRATCH_DIR)
      # so the worker (on circe) can ALSO read them -- see orion-affectgpt-
      # worker's docker-compose.yml, same host path convention. Read-write
      # here (it's the writer); read-only on the worker side.
      - /mnt/scripts/orion-affectgpt-scratch:/mnt/scripts/orion-affectgpt-scratch

    ports:
      - "${HOST_PORT}:6611"

    networks:
      - app-net

networks:
  app-net:
    external: true
