name: world-chat-evidence-tests

# world:chat attention candidate: a stable label (one open-loop id per
# conversation) and Juniper's latest message carried as evidence to reverie.
# Spec: docs/superpowers/specs/2026-10-16-attention-world-candidates-design.md
# ("Recommended next patch" 3). Report: docs/superpowers/pr-reports/2026-11-12-world-chat-loop-id-pr.md.
on:
  pull_request:
    paths:
      - "orion/attention/world_first.py"
      - "orion/schemas/attention_candidate.py"
      - "orion/substrate/attention_broadcast.py"
      - "orion/substrate/attention/scoring.py"
      - "orion/cognition/prompts/reverie_narrate.j2"
      - "services/orion-substrate-runtime/app/store.py"
      - "services/orion-substrate-runtime/app/worker.py"
      - "services/orion-substrate-runtime/evals/run_world_chat_loop_id_replay.py"
      - "services/orion-thought/app/reverie.py"
      - "tests/test_attention_world_chat_evidence.py"
      - "services/orion-thought/tests/test_reverie_world_chat_evidence.py"
      - "orion/autonomy/agency_episode_reader.py"
      - ".github/workflows/world-chat-evidence-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/attention/world_first.py"
      - "orion/schemas/attention_candidate.py"
      - "orion/substrate/attention_broadcast.py"
      - "orion/substrate/attention/scoring.py"
      - "orion/cognition/prompts/reverie_narrate.j2"
      - "services/orion-substrate-runtime/app/store.py"
      - "services/orion-substrate-runtime/app/worker.py"
      - "services/orion-substrate-runtime/evals/run_world_chat_loop_id_replay.py"
      - "services/orion-thought/app/reverie.py"
      - "orion/autonomy/agency_episode_reader.py"
      - "tests/test_attention_world_chat_evidence.py"
      - "services/orion-thought/tests/test_reverie_world_chat_evidence.py"
      - ".github/workflows/world-chat-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio httpx
      - name: Candidate label, evidence, broadcast pass-through, replay eval logic
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_attention_world_chat_evidence.py \
            tests/test_attention_world_first.py \
            orion/substrate/tests/test_attention_broadcast_world_first.py \
            orion/autonomy/tests/test_agency_episode_reader.py
      - name: Substrate-runtime wiring (latest-turn read, fail-open)
        env:
          POSTGRES_URI: postgresql://unused/unused
        run: |
          PYTHONPATH=.:services/orion-substrate-runtime python -m pytest -q -p no:cacheprovider \
            services/orion-substrate-runtime/tests/test_worker_world_first_broadcast.py

  reverie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r services/orion-thought/requirements.txt
          python -m pip install pytest pytest-asyncio jinja2
      - name: Reverie renders Juniper's latest message
        run: cd services/orion-thought && python -m pytest -q -p no:cacheprovider tests/test_reverie_world_chat_evidence.py
