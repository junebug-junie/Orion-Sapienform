# orion-prediction series registry. Loaded and validated by services/orion-prediction/app/series.py.
# Spec: docs/superpowers/specs/2026-10-15-orion-prediction-service-design.md
#
# role: target    -> forecast every grain bucket, backtest-gated, scored live, published.
# role: covariate -> loaded only for /scenario and causal analysis; never forecast on its own.
# Every entry names its consumers; an entry nobody reads does not belong here.
#
# Durations: "<n>min", "<n>h", "<n>d". A seasonality is used only when the training window holds
# at least 2 full cycles of it (the fit records the rest under refused_seasonalities).
version: 1
series:
  - series_id: athena.cabinet_temp_c
    role: target
    source: {kind: biometrics, node: athena, key: cabinet_temp_c}
    unit: C
    grain: 5min
    agg: mean
    max_fill: 15min
    transform: none
    # The portable AC was installed 2026-09-26 (home_cooling_sample starts that day): a structural break.
    train_from: "2026-09-26T00:00:00Z"
    train_window: 21d
    seasonalities:
      - {name: daily, period: 1d, fourier_order: 6}
      - {name: weekly, period: 7d, fourier_order: 3}
      - {name: monthly, period: 30d, fourier_order: 2}   # refused until 60 days of post-break data exist
    exclude: []
    horizons: [5min, 15min, 1h, 6h, 24h]
    thresholds:
      # Cabinet lines are owned by orion/autonomy/thermal_gate.py (body economy Patch B); a literal
      # value here is refused by app/series.py. shed = hardware-watch's reflex line (critical, 34 C).
      - {name: shed, value_from: thermal_gate.critical, window: 30min}
      # Switchback experiments may start only while this probability is under max_probability (hot, 32 C).
      - {name: experiment_guard, value_from: thermal_gate.hot, window: 30min, max_probability: 0.05}
    # The three machines in the cabinet, the portable AC, and the central-AC proxy (metric gate in the spec).
    covariates: [athena.chassis_watts, circe.chassis_watts, hecate.chassis_watts, athena.cabinet_cooling_watts,
                 athena.central_ac_proxy]
    # hardware-watch shows the "shed" exceedance beside each reflex decision (observe-only). Exceedance
    # is on the 5-min MEAN, so it understates a single raw reading crossing 34 C.
    consumers: [hardware-watch, prediction-scoreboard, causal-effects]

  - series_id: athena.chassis_watts
    role: covariate
    source: {kind: biometrics, node: athena, key: chassis_watts}
    unit: W
    grain: 5min
    agg: mean
    max_fill: 15min
    consumers: [scenario, causal-effects]

  - series_id: athena.cabinet_cooling_watts
    role: covariate
    source: {kind: cooling, role: cabinet_cooling}
    unit: W
    grain: 5min
    agg: mean
    max_fill: 15min
    consumers: [scenario, causal-effects]

  - series_id: circe.chassis_watts
    role: covariate
    source: {kind: cluster, node: circe, key: chassis_watts}   # circe has no BMC: PDU proxy via athena
    unit: W
    grain: 5min
    agg: mean
    max_fill: 15min
    consumers: [scenario, causal-effects]

  - series_id: hecate.chassis_watts
    role: covariate
    source: {kind: cluster, node: hecate, key: chassis_watts}  # hecate's BMC, read remotely from athena
    unit: W
    grain: 5min
    agg: mean
    max_fill: 15min
    zero_before_first: true   # first reading 2026-10-04: before that hecate was not running
    consumers: [scenario, causal-effects]

  # The central AC runs when it is warm outside (house meter, 2026-10-20: household + central load
  # +0.33 kWh/h per F above 75 F, 3 h earlier; p ~1e-18), and while it runs the cabinet is ~1.3 C cooler.
  # Hourly from the shared Open-Meteo client, spread over 5-min buckets.
  - series_id: athena.central_ac_proxy
    role: covariate
    source: {kind: weather, key: temp_f}
    unit: F above 75
    grain: 5min
    agg: mean
    max_fill: 60min
    lag: 3h
    above: 75
    consumers: [scenario, causal-effects]
