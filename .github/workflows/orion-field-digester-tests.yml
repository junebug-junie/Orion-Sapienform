name: orion-field-digester tests

# 2026-11-07 (ladder retirement PR 6): the digester now computes action_warrant in-process and owns the
# pressure-dimension constants' only writer (app/digestion/precision.py), which moved out of the retired
# orion.proposals.scoring into orion/field/pressure_dimensions.py. Until now no workflow ran this service's
# tests. Run from the repo root: some tests read config/field/*.yaml by relative path.

on:
  pull_request:
    paths:
      - "services/orion-field-digester/**"
      - "orion/field/**"
      - "orion/mood_arc/corpus_enrichment.py"
      - "orion/mood_arc/tests/test_corpus_enrichment.py"
      - "orion/schemas/field_state.py"
      - "tests/test_action_warrant.py"
      - "tests/test_field_pressure_dimensions.py"
      - ".github/workflows/orion-field-digester-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r services/orion-field-digester/requirements.txt pytest pytest-asyncio
      - name: Field digester tests
        run: PYTHONPATH=services/orion-field-digester:. python -m pytest -q -p no:cacheprovider services/orion-field-digester/tests
      - name: action_warrant, the moved pressure dimensions, live corpus enrichment
        run: >-
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_action_warrant.py
          tests/test_field_pressure_dimensions.py orion/mood_arc/tests/test_corpus_enrichment.py
