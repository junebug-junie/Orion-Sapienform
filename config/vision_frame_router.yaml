version: 1

defaults:
  enabled: true
  baseline:
    task_type: retina_fast
    every_n_frames: 10
    min_seconds_between_tasks_per_camera: 5
    max_inflight_per_camera: 1
    request:
      want_caption: false
      # 2026-08-19 (P2, docs/superpowers/specs/2026-08-12-perception-frontier-
      # design.md): flipped from false. This was P2's one named blocker --
      # without embeddings on the baseline (every-frame-ish) tier, there is no
      # frame_embedding input for a perceptual prediction-error signal at all.
      #
      # Checked before flipping, not assumed cheap: config/vision_profiles.yaml's
      # `embed_image` profile (SigLIP2, kind=embedding) has `warm_on_start: true`
      # and is already resident in VRAM at all times regardless of this flag --
      # the `triggered` tier below already exercises it live on every detected
      # person. So this does not add a new model load or new steady-state VRAM
      # footprint (`cost.vram_estimate_mb: 1600`, already paid); it only adds one
      # extra forward pass on an already-warm model per baseline task
      # (`cost.latency_class: low`). `pipeline_retina_fast`'s `embed_image` step
      # (`config/vision_profiles.yaml`) is gated purely on
      # `request.want_embeddings == true`, so this is the only line needed to
      # enable it for baseline; no other vision-host config depends on the old
      # value.
      want_embeddings: true
  triggered:
    task_type: retina_fast
    trigger_labels: [person]
    trigger_ttl_seconds: 8
    min_seconds_between_tasks_per_camera: 2
    max_inflight_per_camera: 1
    request:
      want_caption: true
      want_embeddings: true

global:
  max_inflight_total: 2
  # When true, frames at global inflight cap skip with reason global_inflight_limit.
  # When false, same drop behavior but reason global_inflight_backpressure (no queue in MVP).
  drop_when_busy: true
  require_image_path_exists: true

streams:
  cam0:
    enabled: true
    # Opt-in identity_face secondary dispatch (2026-08-26, docs/superpowers/
    # specs/2026-08-21-...-design.md section 4/6.1) -- deliberately NOT in
    # defaults.triggered above. This fully overrides defaults.triggered
    # (resolve_stream_policy's shallow merge replaces the whole `triggered`
    # key, not a per-field merge), so it repeats defaults.triggered's other
    # fields rather than silently losing them. cam0 is the interior room
    # camera; carbon (Juniper's laptop webcam) and every other camera stay
    # opted out by default -- see policy.py's decide_identity docstring for
    # why a global default would be wrong here.
    triggered:
      task_type: retina_fast
      trigger_labels: [person]
      trigger_ttl_seconds: 8
      min_seconds_between_tasks_per_camera: 2
      max_inflight_per_camera: 1
      request:
        want_caption: true
        want_embeddings: true
      identity_dispatch:
        enabled: true
        min_seconds_between_dispatch: 30

  carbon:
    enabled: true
    # Opted IN 2026-08-29 (Juniper: "orion never bites when they can't
    # recognize me"). This was deliberately opted OUT when identity_face
    # shipped 2026-08-26 -- policy.py's decide_identity docstring cites
    # docs/superpowers/specs/2026-08-21-...-design.md section 9B, "carbon
    # must not inherit cam0's policy". That reasoning was about not letting
    # a permissive GLOBAL default silently reach every stream, and it still
    # holds: this is an explicit per-stream opt-in, not a defaults change.
    #
    # The effect of leaving it out was that the face-match check never once
    # ran on the camera actually pointed at Juniper's face. Measured
    # 2026-08-29 before this line: 2 identity_face dispatches in 24h, both
    # stream_id=cam0, while `substrate_embodied_presence` showed carbon
    # present (last_seen 0.0s) and cam0 absent for 70 minutes. carbon does
    # reach the `triggered` tier that decide_identity requires (6 hits in
    # 6h, same window), so this is not inert.
    #
    # Fully overrides defaults.triggered (resolve_stream_policy's shallow
    # merge replaces the whole `triggered` key rather than merging per
    # field), so every sibling field is repeated here on purpose -- same
    # reason cam0's block below repeats them.
    #
    # min_seconds_between_dispatch is 60 here, not cam0's 30: carbon is a
    # webcam pointed at one seated person for hours, so a face that matched
    # once is overwhelmingly likely to still match; cam0 is a room camera
    # where a genuinely new person can walk in.
    triggered:
      task_type: retina_fast
      trigger_labels: [person]
      trigger_ttl_seconds: 8
      min_seconds_between_tasks_per_camera: 2
      max_inflight_per_camera: 1
      request:
        want_caption: true
        want_embeddings: true
      identity_dispatch:
        enabled: true
        min_seconds_between_dispatch: 60

cameras:
  mock-cam-01:
    enabled: true
    task_type: retina_fast
    every_n_frames: 3
    min_seconds_between_tasks_per_camera: 2
    triggered:
      trigger_labels: []

  porch_eye:
    enabled: true
    task_type: detect_open_vocab
    every_n_frames: 5
    min_seconds_between_tasks_per_camera: 3
    triggered:
      trigger_labels: []
    request:
      prompts:
        - person
        - package
        - vehicle
        - animal

  kitchen_eye:
    enabled: false
