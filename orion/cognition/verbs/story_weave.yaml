name: story_weave
label: Story Weave
description: >
  Integrate memory fragments, tags, and context into a narrative.

category: Generative
priority: low

interruptible: true
can_interrupt_others: false

requires_gpu: true
requires_memory: true

recall_profile: story_weave

timeout_ms: 4500
max_recursion_depth: 1

services:
  - RecallService
  - LLMGatewayService

prompt_template: story_weave_prompt.j2

plan:
  - name: gather_memory_fragments
    description: Pull memory components for narrative fusion.
    order: 0
    services:
      - RecallService
    recall_profile: story_weave
    requires_gpu: false
    requires_memory: true

  - name: compose_narrative_prompt
    description: Build narrative weaving prompt.
    order: 1
    prompt_template: story_weave_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: llm_generate_story
    description: Generate story-like narrative.
    order: 2
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
