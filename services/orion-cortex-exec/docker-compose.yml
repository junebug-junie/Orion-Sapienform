      CORTEX_METACOG_LOGPROB_PROBE_MODE: ${CORTEX_METACOG_LOGPROB_PROBE_MODE:-}
      CORTEX_METACOG_UNCERTAINTY_PROBE_ENABLED: ${CORTEX_METACOG_UNCERTAINTY_PROBE_ENABLED:-true}
      CORTEX_METACOG_DRAFT_WORKER_CTX_CHAR_BUDGET: ${CORTEX_METACOG_DRAFT_WORKER_CTX_CHAR_BUDGET:-8000}

      PYTHONUNBUFFERED: 1

    networks:
      - app-net

  cortex-exec-chat:
    extends:
      service: cortex-exec
    container_name: ${PROJECT}-cortex-exec-chat
    ports: !override []
    environment:
      EXEC_LANE: chat
      EXEC_AUTONOMOUS_BACKGROUND_ROUTING: ${EXEC_AUTONOMOUS_BACKGROUND_ROUTING:-true}
      CHANNEL_EXEC_REQUEST: orion:cortex:exec:request:chat
      ENABLE_PRE_TURN_APPRAISAL_HANDLER: "false"

  cortex-exec-spark:
    extends:
      service: cortex-exec
    container_name: ${PROJECT}-cortex-exec-spark
    ports: !override []
    environment:
      EXEC_LANE: spark
      EXEC_AUTONOMOUS_BACKGROUND_ROUTING: ${EXEC_AUTONOMOUS_BACKGROUND_ROUTING:-true}
      CHANNEL_EXEC_REQUEST: orion:cortex:exec:request:spark
      ENABLE_PRE_TURN_APPRAISAL_HANDLER: "false"

  cortex-exec-background:
    extends:
      service: cortex-exec
    container_name: ${PROJECT}-cortex-exec-background
    ports: !override []
    environment:
      EXEC_LANE: background
      EXEC_AUTONOMOUS_BACKGROUND_ROUTING: ${EXEC_AUTONOMOUS_BACKGROUND_ROUTING:-true}
      CHANNEL_EXEC_REQUEST: orion:cortex:exec:request:background
      ENABLE_PRE_TURN_APPRAISAL_HANDLER: "false"

networks:
  app-net:
    external: true

volumes:
  # External: owned/created by orion-self-study-enrichment's compose file,
  # not this one. cortex-exec only reads from it (see the :ro mount above).
  self_study_enrichment_data:
    name: ${PROJECT}-self-study-enrichment-data
    external: true
  # Owned by THIS service (not external) -- nothing else reads or writes it.
  # `docker compose up` creates it automatically on first bring-up; no
  # separate provisioning step needed.
  self_study_structural_mass_data:
    name: ${PROJECT}-self-study-structural-mass-data
