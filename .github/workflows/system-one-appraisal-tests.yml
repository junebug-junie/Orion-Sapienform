name: system-one-appraisal-tests

on:
  pull_request:
    paths:
      - "orion/schemas/system_one_appraisal.py"
      - "orion/schemas/registry.py"
      - "orion/substrate/system_one_appraisal.py"
      - "services/orion-substrate-runtime/**"
      - "services/orion-sql-db/manual_migration_system_one_appraisal_v1.sql"
      - "tests/test_system_one_appraisal.py"
      - "scripts/analysis/eval_system_one_appraisal.py"
      - "scripts/smoke_system_one_appraisal.py"
      - ".github/workflows/system-one-appraisal-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/schemas/system_one_appraisal.py"
      - "orion/schemas/registry.py"
      - "orion/substrate/system_one_appraisal.py"
      - "services/orion-substrate-runtime/**"
      - "services/orion-sql-db/manual_migration_system_one_appraisal_v1.sql"
      - "tests/test_system_one_appraisal.py"
      - "scripts/analysis/eval_system_one_appraisal.py"
      - "scripts/smoke_system_one_appraisal.py"
      - ".github/workflows/system-one-appraisal-tests.yml"

jobs:
  unit:
    name: System One shadow reducer — focused unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-substrate-runtime/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-asyncio httpx
      - name: Compile changed Python surfaces
        run: |
          python -m compileall -q             orion/schemas/system_one_appraisal.py             orion/substrate/system_one_appraisal.py             services/orion-substrate-runtime/app
      - name: Run focused System One tests
        env:
          POSTGRES_URI: postgresql://unused/unused
        run: |
          PYTHONPATH=.:services/orion-substrate-runtime python -m pytest -q             tests/test_system_one_appraisal.py             services/orion-substrate-runtime/tests/test_worker_system_one_appraisal.py             services/orion-substrate-runtime/tests/test_store_system_one_appraisal.py             services/orion-substrate-runtime/tests/test_system_one_appraisal_endpoint.py             services/orion-substrate-runtime/tests/test_worker_attention_broadcast_tick.py
