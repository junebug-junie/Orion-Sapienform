schema_version: execution_dispatch_policy.v1
policy_id: execution_dispatch_policy.v1

mode:
  default_dispatch_mode: dry_run
  # Real sends require BOTH this true AND the runtime's own
  # EXECUTION_DISPATCH_MODE=dispatch_read_only (services/orion-execution-
  # dispatch-runtime/.env, which is the live value on this host and is what
  # .env_example now ships) -- default_dispatch_mode above stays dry_run, so
  # a deployment that does NOT set the env key gets dry_run regardless of
  # this flag.
  allow_dispatch_read_only: true
  # 2026-08-12: flipped false -> true. Juniper's explicit decision, made after
  # the skill was live-previewed on this host (decision "would_act", disk
  # 77.594% of 468 GiB, 142.5 GB reclaimable across 15,506 build-cache
  # entries) -- not a default that drifted open.
  #
  # This opens ONE gate of three. Still in front of any real mutation:
  #   1. orion/execution_dispatch/builder.py only lets a route through when
  #      route.allowed_scope == "maintenance_bounded", and `maintain` is the
  #      only route with that scope (asserted by
  #      tests/test_maintenance_dispatch_gating.py).
  #   2. The runtime's own EXECUTION_DISPATCH_MODE must be dispatch_read_only,
  #      or dry_run stays true and the skill receives mode=preview.
  #   3. The skill's own measured gate: it prunes only when the host really
  #      reads disk >= 75% AND >= 40 GB genuinely reclaimable, and declines
  #      (escalating) when it cannot measure either one.
  # Risk accepted: the blast radius is Docker build cache, which rebuilds.
  allow_mutating_dispatch: true
  # 2026-08-30: opens EXPRESS_SCOPE -- Orion's first outward action
  # (skills.imagination.render_scene.v1). Turned on by explicit decision, the
  # same posture allow_mutating_dispatch was given on 2026-08-12. Separate from
  # that flag on purpose: this can be closed without stopping docker pruning,
  # and pruning can be closed without stopping this.
  allow_express_dispatch: true

allowed_policy_decisions:
  - approved_read_only
  # 2026-08-12: a bounded mutating action, approved. Listing it here widens
  # this allowlist by one value; it does NOT widen what can actually fire.
  # The real gate is orion/execution_dispatch/builder.py's
  # `route.allowed_scope == "maintenance_bounded"` check plus
  # mode.allow_mutating_dispatch below. This literal exists so the decision
  # record stops calling a 142 GB deletion read-only, not to authorize it.
  - approved_maintenance
  # 2026-08-30: Orion's first outward action. Separate from
  # approved_maintenance so image generation and docker pruning can be allowed
  # or refused independently.
  - approved_express

blocked_policy_decisions:
  - requires_operator_review
  - deferred
  - rejected

proposal_kind_to_cortex:
  inspect:
    dispatch_kind: inspect
    cortex_verb: substrate.inspect
    cortex_mode: brain
    allowed_scope: inspect_only

  summarize:
    dispatch_kind: summarize
    cortex_verb: substrate.summarize
    cortex_mode: brain
    allowed_scope: summarize_only

  observe:
    dispatch_kind: observe
    cortex_verb: substrate.observe
    cortex_mode: brain
    allowed_scope: inspect_only

  # 2026-08-12: the first MUTATING route. `maintenance_bounded` is the only
  # non-read-only scope, and it is inert unless mode.allow_mutating_dispatch is
  # true -- ON since 2026-08-12, see mode above. cortex_verb names a skills.* verb
  # directly, which works because CortexRouteTemplateV1.cortex_verb is an
  # unconstrained str and executor.py's local-adapter branch resolves on that
  # prefix; the skill then runs in orion-cortex-exec, which already holds the
  # docker socket.
  #
  # Three independent gates stand between a proposal and a real prune:
  #   1. mode.allow_mutating_dispatch (above; ON since 2026-08-12)
  #   2. this scope passing builder.py's allowlist
  #   3. the skill's OWN measured gate: disk >= 75% AND reclaimable >= 40GB
  # Any one of them says no and nothing happens.
  #
  # Timeouts, 2026-08-12. A real prune is minutes of work, and THREE nested
  # budgets have to clear it or the action gets killed partway through a
  # delete. They are deliberately staggered so a timeout is attributable to
  # the layer that caused it -- innermost fires first:
  #
  #   docker subprocess   BUILDER_PRUNE_TIMEOUT_SEC   600s  (10 min)
  #   cortex-exec step    verb yaml timeout_ms        660s
  #   dispatch RPC        rpc_timeout_sec below       720s
  #
  # The binding constraint was NOT the RPC timeout: the prune's subprocess was
  # inheriting SKILLS_MESH_OPS_TIMEOUT_SEC, which is 12 SECONDS live. A
  # 142 GB prune would have been SIGKILLed ~12s in, mid-delete, every time.
  # 2026-08-30: the `express` kind's default route. Points at the same verb as
  # the render_scene template route below -- there is exactly one express action
  # today, so a kind-level fallback that resolved anywhere else would be
  # inventing a capability. Gated by mode.allow_express_dispatch either way.
  express:
    dispatch_kind: express
    cortex_verb: skills.imagination.render_scene.v1
    cortex_mode: brain
    allowed_scope: express_bounded
    rpc_timeout_sec: 170

  maintain:
    dispatch_kind: maintain
    cortex_verb: skills.runtime.builder_prune.v1
    cortex_mode: brain
    allowed_scope: maintenance_bounded
    rpc_timeout_sec: 720

# 2026-08-16 (docs/superpowers/specs/2026-08-16-tension-driven-mutating-
# dispatch-design.md): per-TEMPLATE overrides (orion/execution_dispatch/
# policy.py::template_to_cortex, live since 2026-08-13, checked before the
# proposal_kind_to_cortex map above). Without these, every `maintain`
# proposal -- including prune_dangling_images and prune_stopped_containers
# below -- would still resolve to skills.runtime.builder_prune.v1, the same
# one-repertoire cap that field already fixed for future templates but that
# nothing had yet used a second time.
template_to_cortex:
  # Read-only: no new gate needed. allowed_scope=inspect_only is already
  # unconditionally allowed (orion/execution_dispatch/builder.py's
  # scope_allowed check), independent of mode.allow_mutating_dispatch.
  # skills.perception.look_at_camera.v1 reads orion-vision-window's existing
  # passive projection -- verb yaml timeout_ms=20000, so 40s gives the same
  # 2x margin discipline as the two mutating routes below without needing
  # three staggered budgets (there is no long-running subprocess here).
  observe_tension_via_camera:
    dispatch_kind: inspect
    cortex_verb: skills.perception.look_at_camera.v1
    cortex_mode: brain
    allowed_scope: inspect_only
    rpc_timeout_sec: 40

  # 2026-08-30: ORION'S FIRST OUTWARD ROUTE.
  #
  # express_bounded, not maintenance_bounded. It is not maintenance, and it must
  # be switchable on its own -- stopping image generation should not also stop
  # docker pruning. Gated by mode.allow_express_dispatch, which defaults OFF for
  # the same reason allow_mutating_dispatch does: an action whose product exists
  # outside Orion does not become dispatchable because a config file appeared.
  #
  # rpc_timeout_sec 170 sits under the verb yaml's timeout_ms=180000 and over
  # cortex-exec's own thought_http_timeout_sec=150, the same staggered-budget
  # discipline the two prune routes use: the innermost hop times out first, so a
  # slow generation is reported rather than severed at an outer layer.
  render_scene:
    dispatch_kind: express
    cortex_verb: skills.imagination.render_scene.v1
    cortex_mode: brain
    allowed_scope: express_bounded
    rpc_timeout_sec: 170

  # 2026-08-25: analysis -> self-study journal entry.
  #
  # `summarize_only`, not a new scope. builder.py::scope_allowed permits
  # inspect_only / summarize_only unconditionally and maintenance_bounded only
  # behind mode.allow_mutating_dispatch; adding a fifth scope would mean
  # editing that check, which is a safety gate, to buy nothing this route needs.
  # summarize_only is also the honest label: the action summarises a window.
  #
  # NO `skill_args.source`. The route mechanism exists (CortexRouteTemplateV1.
  # skill_args, added in this patch) and is deliberately left unset -- the verb
  # then studies whichever of its four inputs has gone longest without being
  # studied. Pin one here only to deliberately narrow the action to a single
  # lens; the enum is in orion/cognition/verbs/skills.self_study.analyze.v1.yaml.
  #
  # NO reserved slot, and that was checked rather than assumed. The starvation
  # fix this file already carries (starvation_aging_bonus_per_tick 0.002, cap
  # 0.25) is explicitly general -- "anything else quietly losing this race gets
  # the same relief without being named" -- and 0.34 + a full aging bonus (0.59)
  # clears every fresh competitor here. Revisit if real post-deploy dispatch
  # counts show it starving anyway; do not pre-emptively reserve capacity.
  #
  # Verb timeout_ms is 30000; 60s gives the same ~2x margin the other
  # short routes use. The work is four windowed SELECTs plus one dedup lookup,
  # each already capped by a 4s per-connection statement_timeout.
  analyze_self_study_source:
    dispatch_kind: summarize
    cortex_verb: skills.self_study.analyze.v1
    cortex_mode: brain
    allowed_scope: summarize_only
    rpc_timeout_sec: 60

  # Same first two gates as `maintain` above (mode.allow_mutating_dispatch,
  # maintenance_bounded scope) -- this and prune_stopped_containers now share
  # that one MAINTENANCE_SCOPE reserved slot (limits.reserved_slots_by_scope
  # below) with prune_build_cache, competing among themselves for it same as
  # any other candidates do.
  #
  # The THIRD gate is NOT symmetric between the two routes below (2026-08-16,
  # code review -- see config/proposals/proposal_policy.v1.yaml's
  # prune_dangling_images comment for the full disclosure). image_prune has
  # a real measured decline threshold (disk>=75% AND genuinely dangling
  # images). docker_prune_stopped_containers does not -- it prunes every
  # matching exited container it finds in execute mode, gated only by its own
  # env flag and label/age filters, not by a resource-pressure floor.
  #
  # Timeout staggering matches skills.runtime.image_prune.v1.yaml's own
  # comment: subprocess IMAGE_PRUNE_TIMEOUT_SEC=600s < verb timeout_ms=660s <
  # this rpc budget. Same 720s as builder_prune -- same subprocess ceiling,
  # same margin reasoning.
  prune_dangling_images:
    dispatch_kind: maintain
    cortex_verb: skills.runtime.image_prune.v1
    cortex_mode: brain
    allowed_scope: maintenance_bounded
    rpc_timeout_sec: 720

  # skills.runtime.docker_prune_stopped_containers.v1.yaml's own verb
  # timeout_ms is 30000 (30s) -- far smaller than the image/build-cache
  # prunes, so this gets its own smaller budget rather than inheriting 720s,
  # same "only routes that actually need a longer budget get one" principle
  # CortexRouteTemplateV1.rpc_timeout_sec's own docstring states.
  prune_stopped_containers:
    dispatch_kind: maintain
    cortex_verb: skills.runtime.docker_prune_stopped_containers.v1
    cortex_mode: brain
    allowed_scope: maintenance_bounded
    rpc_timeout_sec: 60

hard_blocks:
  - approved_for_execution
  - prepare_action
  - external_side_effect
  - settings_mutation
  - service_restart
  - operator_notification
  - file_write
  - network_call
  - destructive_action

limits:
  # 2026-08-30: raised 5 -> 50 so it STOPS BEING A PRE-FILTER.
  #
  # This is a priority cut that runs BEFORE the allocator, so a hand-typed float
  # decided which candidates the value-of-information scorer was allowed to see.
  # Measured live: a cold action worth 0.198 nats/sec -- 100x anything else in
  # the arena -- was cut 36 times in 6 minutes at base_priority 0.30, and never
  # lost on value because it never reached the thing that judges value. A cheap
  # heuristic gating the correct one is backwards.
  #
  # Not deleted, because the admission machinery underneath it is good (reserved
  # slots, then a general pass that hands unclaimed reservations back). 50 sits
  # well above the 11 candidates/frame observed live, so it no longer binds
  # while staying a real backstop if a producer ever runs away.
  #
  # THE REAL SEND CAP IS UNCHANGED: max_dispatches_per_tick below is a separate,
  # independent limit on what actually goes out, and the motor budget and the
  # allocator both still apply. This widens what gets CONSIDERED, not what runs.
  max_dispatch_candidates: 50
  # 2026-07-31 (docs/superpowers/specs/2026-07-30-execution-dispatch-
  # staleness-discard-design.md's Part 2): raised from 1 -- sends are now
  # concurrent (asyncio.gather(..., return_exceptions=True) in
  # _send_prepared_candidates), so this is a real per-tick fan-out width,
  # not just a formerly-inert loop bound. 5 is a disclosed, uncalibrated
  # starting value (meaningfully closes the measured ~12-17/min production
  # vs ~4-5/min sequential-dispatch gap without a large first-patch blast
  # radius) -- revisit against real post-deploy dispatch-rate data, same
  # discipline as every other constant shipped in this arc.
  max_dispatches_per_tick: 5

  # 2026-08-12: measured starvation fix. Over 3 live hours the same five
  # read-only templates took all five slots on essentially every tick
  # (inspect_bus_channel_catalog / inspect_attended_target /
  # summarize_transport_contract_drift 267 dispatches each,
  # inspect_field_topology_catalog 243, watch_transport_backpressure 209)
  # while prune_build_cache was dispatched 0 times and blocked 4 times on
  # exactly this cap. See orion/execution_dispatch/policy.py::DispatchLimitsV1
  # for why one scalar ranking cannot arbitrate urgency against level.
  #
  # 1 of 5. Deliberately the smallest reservation that can work, and it is
  # free on ticks nothing claims it -- an unclaimed reserved slot is
  # reclaimed by the general fill in the same tick
  # (builder._admit_candidates pass 2), so read-only throughput is unchanged
  # except on the ticks a maintenance action actually exists.
  #
  # This does NOT widen what may fire. maintenance_bounded still has to clear
  # mode.allow_mutating_dispatch, the runtime's EXECUTION_DISPATCH_MODE, and
  # the skill's own measured disk >= 75% AND >= 40 GB gate. It removes a
  # capacity race, not a safety gate.
  #
  # 2026-08-16: prune_dangling_images and prune_stopped_containers now also
  # route through this scope (template_to_cortex above) -- 3 templates share
  # this 1 reserved slot and compete on effective_priority for it same as any
  # other candidates. Still 1: revisit against real post-deploy contention
  # data if 3 mutating templates start starving each other for it, same
  # discipline as every other number in this file.
  reserved_slots_by_scope:
    maintenance_bounded: 1

  # The general fix, applying to every kind rather than the one that prompted
  # it: a candidate that keeps losing accrues a bounded bonus, so starvation
  # becomes finite instead of permanent. Uncalibrated starting values,
  # disclosed as such -- same discipline as max_dispatches_per_tick above.
  #
  # 0.002/tick with a 0.25 cap: at the live ~90 active frames/hour measured
  # 2026-08-12, a candidate 0.20 below the cut line reaches parity in ~100
  # ticks (~1.1 hours of continuous losing) and can never gain more than
  # 0.25, so aging cannot invert a genuinely large priority gap -- a 0.6818
  # candidate can reach the 0.84-0.90 leaders, it cannot outrank a 0.99.
  # Revisit against real post-deploy starvation_counts, which this patch
  # persists on every frame precisely so that data exists.
  starvation_aging_bonus_per_tick: 0.002
  starvation_aging_bonus_cap: 0.25
