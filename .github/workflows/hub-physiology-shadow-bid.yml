name: Hub physiology shadow bids
# Hub's shadow bids into the body economy (Patch C3b): the outreach, retro leisure and co-play bid
# sites, and the 2026-10-30 rule that an outreach strain hold bids once per window, not per tick.
on:
  pull_request:
    paths:
      - 'services/orion-hub/scripts/physiology_shadow.py'
      - 'services/orion-hub/scripts/endogenous_outreach.py'
      - 'services/orion-hub/tests/test_physiology_shadow_bid.py'
      - 'orion/physiology/client.py'
      - 'orion/schemas/physiology_want.py'
      - '.github/workflows/hub-physiology-shadow-bid.yml'
permissions:
  contents: read
jobs:
  shadow-bid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORION_BUS_URL: redis://100.92.216.81:6379/0
      ORION_BUS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-hub/requirements.txt pytest pytest-asyncio
      - name: Shadow bid sites
        working-directory: services/orion-hub
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/orion-hub
        run: python -m pytest tests/test_physiology_shadow_bid.py -q -p no:cacheprovider
