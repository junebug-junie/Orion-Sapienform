services:
  whisper-tts:
    build:
      context: ../..
      dockerfile: services/orion-whisper-tts/Dockerfile
    container_name: ${PROJECT}-whisper-tts
    restart: unless-stopped
    # Review finding, 2026-08-26: cuda_watchdog's restart_process() sends
    # SIGTERM specifically so this service's own shutdown() handler can run
    # cleanly (cancel background tasks, close the bus) before the process
    # exits -- that claim was undefended without this. Docker's own default
    # stop_grace_period is 10s; a synth request in flight
    # (WHISPER_TTS_SYNTH_TIMEOUT_SEC default 120s) or an STT request
    # (WHISPER_TTS_STT_TIMEOUT_SEC default 90s) would still be running well
    # past that, so Docker would SIGKILL before shutdown() ever got to run --
    # silently defeating the whole reason SIGTERM was chosen over
    # os._exit(). Sized comfortably above the longer of the two timeouts.
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7800/health"]
      start_period: 15s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-net

    env_file:
      - .env

    environment:
      # Project-wide basics
      - PROJECT=${PROJECT}

      # Bus wiring (usually from root .env)
      - ORION_BUS_URL=${ORION_BUS_URL}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_VELOCITY_TRACKING_ENABLED=${ORION_BUS_VELOCITY_TRACKING_ENABLED}
      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}

      # Identity
      - SERVICE_NAME=whisper-tts
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}

      # Bus Channels
      - CHANNEL_TTS_INTAKE=${CHANNEL_TTS_INTAKE}

      # Timeouts
      - CONNECT_TIMEOUT_SEC=${CONNECT_TIMEOUT_SEC}
      - READ_TIMEOUT_SEC=${READ_TIMEOUT_SEC}

      # TTS config (optional override; or just keep in .env)
      - TTS_BACKEND=${TTS_BACKEND:-coqui}
      - TTS_MODEL_NAME=${TTS_MODEL_NAME:-tts_models/multilingual/multi-dataset/xtts_v2}
      - TTS_USE_GPU=${TTS_USE_GPU:-true}
      - TTS_DEFAULT_LANGUAGE=${TTS_DEFAULT_LANGUAGE:-en}
      - TTS_DEFAULT_SPEAKER=${TTS_DEFAULT_SPEAKER:-Ana Florence}
      - TTS_DEFAULT_SPEAKER_WAV=${TTS_DEFAULT_SPEAKER_WAV:-}
      - TTS_SPLIT_SENTENCES=${TTS_SPLIT_SENTENCES:-true}
      - TTS_VOICE_PROFILE_DIR=${TTS_VOICE_PROFILE_DIR:-/models/voices}
      - COQUI_TOS_AGREED=${COQUI_TOS_AGREED:-1}
      - WHISPER_TTS_STT_TIMEOUT_SEC=${WHISPER_TTS_STT_TIMEOUT_SEC:-90}
      - WHISPER_TTS_SYNTH_TIMEOUT_SEC=${WHISPER_TTS_SYNTH_TIMEOUT_SEC:-120}
      - STT_NEAR_SILENT_PEAK_INT16=${STT_NEAR_SILENT_PEAK_INT16:-50}

      # CUDA_WATCHDOG_* (app/cuda_watchdog.py) intentionally NOT listed here.
      # `env_file: .env` above already delivers every .env_example key
      # regardless of this allowlist -- adding an explicit
      # `${VAR:-default}` entry here would interpolate its default from
      # THIS COMPOSE INVOCATION's env-file context (typically the repo-root
      # .env), not from this service's own .env, so an operator override in
      # the service .env could be silently reverted to the default the
      # moment compose is invoked with a narrower --env-file set. Confirmed
      # this exact failure mode on a different service's kill switch during
      # review of PR #1881 (2026-08-26) -- same trap, left out here on
      # purpose rather than repeated.

      # GPU visibility
      #- CUDA_VISIBLE_DEVICES=${GPU_INDEX}
      #- NVIDIA_VISIBLE_DEVICES=${GPU_INDEX}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      - /mnt/telemetry/models/coqui/tts:/root/.local/share/tts
      - ${TTS_VOICE_PROFILE_HOST_DIR:-/mnt/telemetry/models/coqui/voices}:/models/voices:ro

    # GPU pin. Deliberately NOT `gpus: all` / `count: all` (the previous form,
    # replaced 2026-08-29): those hand the container every visible card and
    # leave torch to pick cuda:0. athena is no longer single-card either
    # (T10 added at index 1, 2026-09-21) -- `gpus: all` there would now grab
    # both the P4 (already vision-host's) and the T10, and leave torch to
    # pick whichever cuda:0 resolves to. Always use device_ids.
    #
    # `device_ids` is the only form here that actually pins a specific card
    # (`docker run --gpus '"device=N"'` is a different, CLI-only schema, and
    # `count:` and `device_ids:` are mutually exclusive). Same pattern as
    # services/orion-affectgpt-worker/docker-compose.yml.
    #
    # The value is the HOST's nvidia-smi index. Docker always remaps the
    # pinned physical device to container-local index 0, so TTS_USE_GPU and
    # every torch call inside still see cuda:0 regardless -- do not "fix"
    # anything to a bare index number here in the code path. Verify a pin
    # with `docker inspect` DeviceIDs plus nvidia-smi on the host, never
    # from a log line inside the container.
    #
    # No fallback default: WHISPER_TTS_GPU_DEVICE_ID must come from .env.
    # A silent `:-0` default previously meant an unset var (missing .env,
    # narrow --env-file, fresh checkout) pinned GPU0 -- vision-host's P4 on
    # athena -- instead of failing the bring-up loudly.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WHISPER_TTS_GPU_DEVICE_ID:?WHISPER_TTS_GPU_DEVICE_ID must be set in services/orion-whisper-tts/.env}"]
              capabilities: [gpu]

    ports:
      - "7800:7800"

    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-net:
    external: true
