name: Self-monitor organ

# Rung 6 (docs/superpowers/specs/2026-10-20-self-monitor-organ-design.md): the pure bet adapters and
# faculty reducer. No DB: the live report (python -P -m orion.self_monitor.report) is read-only and
# run by hand; these tests use rows shaped like the live tables.

on:
  pull_request:
    paths:
      - "orion/self_monitor/**"
      - "orion/schemas/self_monitor.py"
      - "orion/prediction/**"
      - ".github/workflows/self-monitor-tests.yml"
  push:
    branches: [main]
    paths:
      - "orion/self_monitor/**"
      - "orion/schemas/self_monitor.py"
      - "orion/prediction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pydantic==2.10.3 numpy sqlalchemy
      - name: Gate tests (pure adapters and reducer, no I/O)
        run: python -m pytest -q -p no:cacheprovider orion/self_monitor/tests
