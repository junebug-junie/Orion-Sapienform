# Install: /etc/systemd/journald.conf.d/orion-container-logs.conf
# Every Orion compose service logs to journald (docs/operations/container-logs.md).
# The default cap is min(10% of /, 4G); at the 2026-10-10 fleet rate (~3.4 GB/day
# of json-file output) that holds about one day. 24G holds roughly a week and is
# still a hard ceiling -- journald deletes the oldest files past it.
[Journal]
Storage=persistent
SystemMaxUse=24G
SystemKeepFree=20G
