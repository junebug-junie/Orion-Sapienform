# The GPU pool's circe actuator (launch_exec, fence) and diffusion-host safety. Was
# gpu2-elastic-tests.yml ("GPU2 fixed-slot"); renamed in GPU pool stage 5.6 when the gpu2 bridge and
# orion/schemas/gpu_slot.py were deleted -- the suites it runs are still the only CI for both services.
name: GPU lane controller (pool actuator) and diffusion safety
on:
  pull_request:
    paths:
      - 'services/orion-gpu-lane-controller/**'
      - 'services/orion-diffusion-host/**'
      - 'orion/schemas/gpu_pool.py'
      - 'orion/gpu_pool/config.py'
      - 'config/gpu_pool.yaml'
      - '.github/workflows/gpu-lane-controller-tests.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/orion-gpu-lane-controller/requirements.txt -r requirements-dev.txt httpx pillow
      - run: python -m pytest services/orion-gpu-lane-controller/tests -q
      - run: python -m pytest services/orion-diffusion-host/tests -q
