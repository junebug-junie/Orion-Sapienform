  # ─────────────────────────────────────────────
  # Muse Glimmer 30B — HF: https://huggingface.co/unsloth/Muse-Glimmer-30B-GGUF
  # Dense causal transformer (~29.6B, all active — not MoE), 52 layers, 6656 hidden,
  # 32/2 attention heads (GQA 16:1), SwiGLU FFN, 202048 vocab, native 131072+ ctx.
  # Distilled from Muse Spark for autonomous agentic tasks. Apache 2.0.
  # Integrated frozen ViT-G/14 (~1.8B) perception encoder; text+image in, text out.
  # Reliable tool/function calling per model card.
  # Google-style sampling per model card: temperature=1.0, top_p=0.95, top_k=64.
  #
  # REQUIRED llama-server build: ggml-org/llama.cpp PR #26841 "model: Muse Glimmer
  # Support" (new LLM_ARCH + vision-encoder graph code + DFlash drafter support),
  # merged 2026-08-10 -- llama-server cannot recognize this architecture AT ALL
  # (text, vision, or draft) on any older build, including this stack's current
  # LLAMACPP_IMAGE_TAG=server-cuda-b8740 default (~April 2026). This profile needs
  # LLAMACPP_IMAGE_TAG=server-cuda-b10398 (or later).
  # DO NOT just bump the repo-wide default fallback for this: config/biometrics/
  # node_catalog.yaml confirms Circe already runs orion-atlas-llamacpp-chat (the
  # "chat" lane, port 8011) continuously, and LLAMACPP_IMAGE_TAG is one shared build
  # arg per docker-compose.atlas-workers.yml invocation -- if Circe's chat and agent
  # workers share one .env/compose invocation on that host (has not been confirmed
  # from here; verify before deploying), bumping the tag for this profile also
  # rebuilds the already-stable chat worker onto a 3-day-old master build with no
  # bench pass. If they do share an env file, either split Circe onto two compose
  # invocations with separate LLAMACPP_IMAGE_TAG values, or accept and bench the
  # chat-lane rebuild too -- don't bump silently either way.
  # RESOLVED 2026-08-14 by live probe of both Circe workers' /props:
  #   chat  :8011 -> build_info b10398-8e7f22b67, modalities.vision False
  #   agent :8014 -> build_info b10398-8e7f22b67, modalities.vision True
  # They DO share one build (same build_info), the tag is ALREADY b10398, and the
  # chat lane has been running stably on it -- so the "bumping the tag silently
  # rebuilds the stable chat worker" risk above is moot: that rebuild already
  # happened and held. No LLAMACPP_IMAGE_TAG change is needed for either lane.
  # The agent lane serving images on this exact binary is also the live proof that
  # mtmd/--mmproj works on b10398 here, not just in theory.
  muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision:
    display_name: "Muse Glimmer 30B – UD-Q4_K_XL + mmproj (llama.cpp, 1x V100 32GB, Circe Agent lane, text+image)"
    task_type: multimodal
    backend: llamacpp
    model_id: "muse-glimmer-30b-ud-q4_k_xl"

    supports_tools: true
    supports_embeddings: false
    supports_vision: true

    gpu:
      num_gpus: 1
      tensor_parallel_size: 1
      device_ids: [0]
      max_model_len: 32768
      max_batch_tokens: 1024
      max_concurrent_requests: 1
      gpu_memory_fraction: 0.90

    llamacpp:
      model_root: "/models/gguf"
      hf_repo_id: "unsloth/Muse-Glimmer-30B-GGUF"
      hf_filename: "Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
      # Q8_0 mmproj paired with the Q4 text weights (repo also ships a BF16 mmproj,
      # ~same size class since the vision tower is only ~1.8B — bump to BF16 if VRAM allows).
      mmproj_filename: "mmproj-Muse-Glimmer-30B-Q8_0.gguf"
      host: "0.0.0.0"
      port: 8080

      ctx_size: 32768
      n_gpu_layers: 99
      threads: 16
      n_parallel: 1
      batch_size: 1024
      ubatch_size: 1024

      # Card ceiling is 4096 visual tokens/image; kept well under that for VRAM/throughput
      # headroom on a single 32GB card. batch_size/ubatch_size must stay >= image_max_tokens
      # (mtmd vision encoder is non-causal) — raised both to 1024 to match.
      image_min_tokens: 256
      image_max_tokens: 1024

      # V100 is Volta. Left off: qwen3-coder-next-q5km-2xv100-32gb-agent-depth's llama-optimus
      # bench found flash_attn on collapses TG ~20x on Volta. The 1x-V100 qwen36-35b-a3b
      # "balanced" profile sets it on anyway — untested here, treat that as an open
      # inconsistency, not a precedent to copy without its own bench.
      no_context_shift: true
      flash_attn: "off"

      # Google-style sampling per Muse Glimmer model card (matches gemma4-*-it profiles).
      temperature: 1.0
      top_k: 64
      top_p: 0.95
      min_p: 0.0
      presence_penalty: 0.0

      n_predict: 16384

      # --- Speculative decoding (DFlash, native to this model — see model card) ---
      # HF README, verbatim: "Muse Glimmer ships with a lightweight 'drafter' model based
      # on DFlash, a small companion network that proposes entire blocks of tokens at
      # once." This is the model's own shipped drafter, not a hand-picked small LLM.
      # DFlash is architecturally different from classic small-LM speculative decoding
      # (block-diffusion drafting w/ target-hidden-state injection) and llama-server
      # requires --spec-type draft-dflash + --spec-draft-n-max for it (docs/speculative.md,
      # ggml-org/llama.cpp PR #22105, merged 2026-06-28) -- app/main.py now emits both when
      # spec_type is set, gated behind --spec-type appearing in --help (see main.py: if the
      # pinned build doesn't advertise it, the draft is skipped entirely rather than loaded
      # under the classic path, since a dflash-arch draft GGUF is not safely interpretable
      # there). spec_draft_n_max: 16 matches this drafter's trained block size (model card:
      # "Draft layers: 5, Block size: 16 tokens per forward pass") -- llama-server clamps to
      # the GGUF's own metadata regardless, but set explicitly rather than relying on that.
      # Needs the same LLAMACPP_IMAGE_TAG=server-cuda-b10398+ pin as the base model (see the
      # profile header above) -- the underlying arch-loading gap covers this too, it isn't a
      # separate requirement. Also worth knowing before trusting this in production: upstream
      # issue ggml-org/llama.cpp#25116 (status: bug-unconfirmed, open as of 2026-08-13)
      # reports a GGUF architecture-name/nested-key mismatch ("dflash" vs "dflash-draft";
      # flat vs nested target_layer_ids keys) breaking DFlash draft loading for a different
      # model (Qwen3.6-27B) on the same DFlash mechanism -- not confirmed to affect Muse
      # Glimmer's own dflash-kquant.gguf, but the failure mode is a hard load error
      # ("DFlash model requires 'target_layers' in GGUF metadata"), not silent degradation,
      # so a first-boot smoke check will surface it immediately if it does apply here.
      hf_draft_repo_id: "unsloth/Muse-Glimmer-30B-GGUF"
      hf_draft_filename: "dflash-kquant.gguf"
      spec_type: "draft-dflash"
      spec_draft_n_max: 16

    notes: |
      Agent-lane Muse Glimmer 30B (dense, text+image, tool-calling, DFlash speculative
      decoding) for 1x V100 32GB — Circe node, Agent compute GPU lane (wire via
      ATLAS_AGENT_PROFILE_NAME).
      - REQUIRES LLAMACPP_IMAGE_TAG=server-cuda-b10398 (or later) — do not rely on the
        repo-wide default fallback (server-cuda-b8740, ~April 2026). llama.cpp did not
        recognize this model's architecture at all before ggml-org/llama.cpp PR #26841
        merged 2026-08-10; this gates text+vision, not just DFlash. Circe already runs
        orion-atlas-llamacpp-chat continuously (config/biometrics/node_catalog.yaml) — if
        that worker shares a compose invocation/.env with this one, the tag bump lands on
        both; confirm Circe's actual layout before deploying, see the profile header above.
        UNVERIFIED beyond schema/CLI-builder tests: no live boot has run against b10398
        from this dev environment (no Docker/GPU here) — smoke-test before trusting.
      - VRAM budget: UD-Q4_K_XL weights ~15.9GB + Q8_0 mmproj ~1.9GB ≈ 17.8GB, leaving
        ~14GB of the 90%-of-32GB budget for 32k KV + batch/ubatch overhead. GQA 16:1
        (32 query / 2 KV heads) keeps KV cache lean at this context, same order as
        qwen36-35b-a3b-udq4km-v100-32gb-balanced already proven to fit this card. Speculative
        decoding adds a small draft-model + extra-KV overhead on top of this budget that
        hasn't been separately benched — watch VRAM headroom on first boot.
      - Thinking: this model does NOT use chat_template_kwargs.enable_thinking or
        --reasoning-budget like Qwen3/Gemma — the card's mechanism is literal
        "Reasoning strength: <low|medium|high|xhigh>" text placed in the system prompt.
        Left llamacpp.reasoning/reasoning_format/chat_template_kwargs unset here on purpose;
        wiring any of them would silently do nothing for this model. Set reasoning strength
        from the caller/orchestrator side (system prompt), not from this profile.
      - Single parallel slot (agent lane): matches qwen3-coder-next-*-agent-* precedent —
        keeps smolagents/tool-loop steps stable rather than splitting context across slots.
      - Speculative decoding (DFlash) is wired: see the llamacpp.spec_type/hf_draft_*
        comments above for the exact mechanism, the required build tag, and a known
        upstream open bug (ggml-org/llama.cpp#25116) that may or may not apply here.
        If the draft model fails to load, the whole container fails to boot — check logs
        for "DFlash model requires" errors first; that matches #25116's signature.
      - If OOM: lower ctx_size to 24576 then 16384, then image_max_tokens to 560,
        before falling back to a lower quant (e.g. UD-Q3_K_XL) from the same repo. If VRAM
        is still tight with the draft model loaded, dropping spec_type/hf_draft_* entirely
        falls back to plain (non-speculative) decoding without changing anything else.
      - Wire: ATLAS_AGENT_PROFILE_NAME=muse-glimmer-30b-udq4kxl-v100-32gb-agent-vision,
        LLAMACPP_IMAGE_TAG=server-cuda-b10398 (Circe worker .env only)
