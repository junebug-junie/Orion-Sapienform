services:
  diffusion-host:
    build:
      context: ../..
      dockerfile: services/orion-diffusion-host/Dockerfile
    container_name: ${PROJECT}-diffusion-host
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - NODE_NAME=${NODE_NAME:-circe}

      - ORION_BUS_ENABLED=${ORION_BUS_ENABLED}
      - ORION_BUS_ENFORCE_CATALOG=${ORION_BUS_ENFORCE_CATALOG}
      - ORION_BUS_URL=${ORION_BUS_URL}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-10}

      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR}
      - HF_HOME=${HF_HOME}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE}

      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}

      - DIFFUSION_MODEL_ID=${DIFFUSION_MODEL_ID}
      - DIFFUSION_DEVICE=${DIFFUSION_DEVICE}
      - DIFFUSION_DTYPE=${DIFFUSION_DTYPE}
      - DIFFUSION_NUM_INFERENCE_STEPS=${DIFFUSION_NUM_INFERENCE_STEPS}
      - DIFFUSION_GUIDANCE_SCALE=${DIFFUSION_GUIDANCE_SCALE}
      - DIFFUSION_DEFAULT_WIDTH=${DIFFUSION_DEFAULT_WIDTH}
      - DIFFUSION_DEFAULT_HEIGHT=${DIFFUSION_DEFAULT_HEIGHT}
      - DIFFUSION_MAX_PROMPT_CHARS=${DIFFUSION_MAX_PROMPT_CHARS}

    volumes:
      # Real weight download now lands here (sdxl-turbo, several GB) --
      # this mount stopped being a bare path convention once this patch
      # wired a real model load.
      - /mnt/storage-warm/models/diffusion:/mnt/storage-warm/models/diffusion

    # GPU reservation, Circe agent-lane assignment (2026-08-20).
    # CUDA_VISIBLE_DEVICES above scopes the container to one physical
    # device; this patch is the first one that actually loads a model onto
    # it. See README.md "Node/port/GPU assignment".
    gpus: all

    ports:
      - "${HOST_PORT}:6700"

    networks:
      - app-net

networks:
  app-net:
    external: true
