name: orion-state-journaler-tests

on:
  pull_request:
    paths:
      - "services/orion-state-journaler/**"
      - "orion/core/bus/bus_service_chassis.py"
      - ".github/workflows/orion-state-journaler-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/orion-state-journaler/**"
      - "orion/core/bus/bus_service_chassis.py"
      - ".github/workflows/orion-state-journaler-tests.yml"

jobs:
  state-journaler-unit:
    name: State journaler — spark rollup stays retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/orion-state-journaler/requirements.txt pytest httpx PyYAML
      - name: Service tests
        run: PYTHONPATH=.:services/orion-state-journaler python -m pytest -q -p no:cacheprovider services/orion-state-journaler/tests
