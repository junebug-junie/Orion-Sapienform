name: Personality
on:
  pull_request:
    paths:
      - 'orion/personality/**'
      - 'scripts/analysis/measure_tone_dial_baseline.py'
      - 'scripts/analysis/tests/test_measure_tone_dial_baseline.py'
      - '.github/workflows/personality-tests.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest orion/personality/tests scripts/analysis/tests/test_measure_tone_dial_baseline.py -q
