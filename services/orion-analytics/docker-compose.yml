services:
  analytics-dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    profiles: ["tools"]
    working_dir: /usr/app/dbt
    entrypoint: ["dbt"]
    command: ["--version"]
    environment:
      ORION_ANALYTICS_HOST: ${ORION_ANALYTICS_HOST:-orion-sql-db}
      ORION_ANALYTICS_PORT: ${ORION_ANALYTICS_PORT:-5432}
      ORION_ANALYTICS_DATABASE: ${ORION_ANALYTICS_DATABASE:-conjourney}
      ORION_ANALYTICS_DBT_PASSWORD: ${ORION_ANALYTICS_DBT_PASSWORD:?set ORION_ANALYTICS_DBT_PASSWORD in services/orion-analytics/.env}
      ORION_ANALYTICS_DBT_THREADS: ${ORION_ANALYTICS_DBT_THREADS:-2}
      DBT_PROFILES_DIR: /usr/app/dbt
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-analytics:/usr/app/dbt
      - dbt-target:/tmp/dbt-target
      - dbt-logs:/tmp/dbt-logs
    networks:
      - app-net

  lightdash-db:
    image: postgres:15.14-alpine
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIGHTDASH_METADATA_USER:-lightdash}
      POSTGRES_PASSWORD: ${LIGHTDASH_METADATA_PASSWORD:?set LIGHTDASH_METADATA_PASSWORD in services/orion-analytics/.env}
      POSTGRES_DB: ${LIGHTDASH_METADATA_DATABASE:-lightdash}
    volumes:
      - lightdash-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - analytics-internal

  lightdash-object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["analytics"]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${LIGHTDASH_S3_ACCESS_KEY:-lightdash}
      MINIO_ROOT_PASSWORD: ${LIGHTDASH_S3_SECRET_KEY:?set LIGHTDASH_S3_SECRET_KEY in services/orion-analytics/.env}
    volumes:
      - lightdash-object-storage:/data
    ports:
      - "127.0.0.1:${LIGHTDASH_S3_PORT:-8266}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - analytics-storage

  lightdash-object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["analytics"]
    depends_on:
      lightdash-object-storage:
        condition: service_healthy
    environment:
      LIGHTDASH_S3_ACCESS_KEY: ${LIGHTDASH_S3_ACCESS_KEY:-lightdash}
      LIGHTDASH_S3_SECRET_KEY: ${LIGHTDASH_S3_SECRET_KEY:?set LIGHTDASH_S3_SECRET_KEY in services/orion-analytics/.env}
      LIGHTDASH_S3_BUCKET: ${LIGHTDASH_S3_BUCKET:-lightdash}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://lightdash-object-storage:9000 "$${LIGHTDASH_S3_ACCESS_KEY}" "$${LIGHTDASH_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${LIGHTDASH_S3_BUCKET}"
    restart: "no"
    networks:
      - analytics-storage

  lightdash:
    image: lightdash/lightdash:2.184.6
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      lightdash-object-storage-init:
        condition: service_completed_successfully
    environment:
      PGHOST: lightdash-db
      PGPORT: 5432
      PGUSER: ${LIGHTDASH_METADATA_USER:-lightdash}
      PGPASSWORD: ${LIGHTDASH_METADATA_PASSWORD:?set LIGHTDASH_METADATA_PASSWORD in services/orion-analytics/.env}
      PGDATABASE: ${LIGHTDASH_METADATA_DATABASE:-lightdash}
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET:?set LIGHTDASH_SECRET in services/orion-analytics/.env}
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      LIGHTDASH_QUERY_MAX_LIMIT: ${LIGHTDASH_QUERY_MAX_LIMIT:-5000}
      LIGHTDASH_LOG_LEVEL: info
      RUDDERSTACK_ANALYTICS_DISABLED: "true"
      HEADWAY_ENABLED: "false"
      PORT: 8080
      SITE_URL: ${LIGHTDASH_SITE_URL:-http://localhost:8265}
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      ALLOW_MULTIPLE_ORGS: "false"
      S3_ENDPOINT: http://lightdash-object-storage:9000
      S3_PUBLIC_ENDPOINT: ${LIGHTDASH_S3_PUBLIC_ENDPOINT:-http://localhost:8266}
      S3_REGION: ${LIGHTDASH_S3_REGION:-us-east-1}
      S3_BUCKET: ${LIGHTDASH_S3_BUCKET:-lightdash}
      S3_ACCESS_KEY: ${LIGHTDASH_S3_ACCESS_KEY:-lightdash}
      S3_SECRET_KEY: ${LIGHTDASH_S3_SECRET_KEY:?set LIGHTDASH_S3_SECRET_KEY in services/orion-analytics/.env}
      S3_FORCE_PATH_STYLE: "true"
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
    volumes:
      - ${ORION_HOST_REPO_ROOT:-/mnt/scripts/Orion-Sapienform}/services/orion-analytics:/usr/app/dbt:ro
      - dbt-target:/tmp/dbt-target
      - dbt-logs:/tmp/dbt-logs
    ports:
      - "${LIGHTDASH_BIND_ADDRESS:-127.0.0.1}:${LIGHTDASH_PORT:-8265}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - analytics-internal
      - analytics-storage
      - app-net

volumes:
  dbt-target:
  dbt-logs:
  lightdash-metadata:
  lightdash-object-storage:

networks:
  analytics-internal:
    internal: true
  analytics-storage:
  app-net:
    name: ${NET:-app-net}
    external: true
