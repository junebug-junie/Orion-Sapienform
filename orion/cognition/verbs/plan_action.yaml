name: plan_action
label: Action Planning
description: >
  Given a goal or scenario, generate a sequence of actionable steps.

category: ExecutiveControl
priority: high

interruptible: false
can_interrupt_others: true

requires_gpu: true
requires_memory: false

timeout_ms: 60000
max_recursion_depth: 1

services:
  - LLMGatewayService

prompt_template: plan_action_prompt.j2

plan:
  - name: compose_action_plan_prompt
    description: Build prompt for planning next steps.
    order: 0
    prompt_template: plan_action_prompt.j2
    services:
      - LLMGatewayService
    requires_gpu: false
    requires_memory: false

  - name: llm_generate_action_plan
    description: Use LLM to generate step-by-step plan.
    order: 1
    services:
      - LLMGatewayService
    requires_gpu: true
    requires_memory: false

safety_rules: []

# Body economy (Patch C2): who pays for this verb. Parsed by plan_loader.load_verb_physiology;
# checked by scripts/check_verb_physiology.py. Tier 0 never bids (turn/autonomic).
physiology:
  tier: 0
  family: turn
  lanes: [chat, fast]
  deferrable_window_s: 0
